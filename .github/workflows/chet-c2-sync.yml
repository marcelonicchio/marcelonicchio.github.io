name: Chet C2 one-shot sync

on:
  push:
    branches: [work/chet-c2-melissa-chapter-page]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chet-c2-melissa-chapter-page
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Migrate and synchronize Melissa
        run: |
          python tools/chet_c2_migrate_melissa.py
          python tools/sync_entries.py
          python tools/editorial_parity.py --accept hai-melissa
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
      - name: Verify
        run: |
          python tools/sync_entries.py --check
          python tools/editorial_parity.py --check
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
          python tools/audit_site.py
          test -f pt/ia-hai/melissa-1-0/index.html
          test -f en/ai-hai/melissa-1-0/index.html
          grep -q 'name="robots" content="noindex,follow"' pt/ia-hai/melissa-1-0/index.html
          grep -q 'name="robots" content="noindex,follow"' en/ai-hai/melissa-1-0/index.html
      - name: Commit synchronized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'C2: publish Melissa Chapter Page pilot'
          git push origin HEAD:work/chet-c2-melissa-chapter-page
