name: Krist music hierarchy patch

on:
  push:
    branches: [feat/music-cdp-hierarchy-limonada]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/music-cdp-hierarchy-limonada
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install patch dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply editorial and visual patch
        run: python tools/_krist_music_patch.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html styles.css data/full_biography.json data/editorial_parity.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: strengthen CDP hierarchy and add Limonada 1992"
          git push origin HEAD:feat/music-cdp-hierarchy-limonada
