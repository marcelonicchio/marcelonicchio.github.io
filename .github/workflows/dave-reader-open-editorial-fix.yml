name: Dave Reader Open Editorial Fix

on:
  push:
    branches:
      - dave/internet-music-structure-2026-09-17

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dave/internet-music-structure-2026-09-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Make open Internet headers non-collapsing
        run: |
          python - <<'PY'
          from pathlib import Path
          js_path = Path('assets/js/reader-disclosure.js')
          js = js_path.read_text(encoding='utf-8')
          old = "      details.append(summary, body);\n      if (internetOpenByDefault) details.open = true;"
          new = "      details.append(summary, body);\n      if (internetOpenByDefault) {\n        summary.addEventListener('click', (event) => {\n          if (details.open && !event.target.closest('a')) event.preventDefault();\n        });\n        details.open = true;\n      }"
          if old not in js:
              raise RuntimeError('Reader details/open anchor missing')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')
          smoke_path = Path('tools/smoke_reader_ux.js')
          smoke = smoke_path.read_text(encoding='utf-8')
          old = "  if (await mirantteDetails.getAttribute('open') !== null) await mirantte.locator('summary').click();\n  const mirantteClosedBorder = await mirantteDetails.evaluate((el) => getComputedStyle(el).borderTopWidth);"
          new = "  if (await mirantteDetails.getAttribute('open') !== null) {\n    await mirantte.locator('summary').evaluate((el) => el.click());\n    assert(await mirantteDetails.getAttribute('open') !== null, 'Open Internet summary unexpectedly collapsed the editorial entry');\n    await mirantte.locator('.reader-disclosure__collapse-button').click();\n  }\n  const mirantteClosedBorder = await mirantteDetails.evaluate((el) => getComputedStyle(el).borderTopWidth);"
          if old not in smoke:
              raise RuntimeError('Mirantte collapse smoke anchor missing')
          smoke_path.write_text(smoke.replace(old, new, 1), encoding='utf-8')
          loader_path = Path('assets/js/reader-disclosure-loader.js')
          loader = loader_path.read_text(encoding='utf-8')
          if 'reader-disclosure.js?v=20260917-reader14' not in loader:
              raise RuntimeError('Reader child-JS cache anchor missing')
          loader_path.write_text(loader.replace('reader-disclosure.js?v=20260917-reader14', 'reader-disclosure.js?v=20260917-reader15', 1), encoding='utf-8')
          sync_path = Path('tools/sync_reader_disclosure_loader.py')
          sync = sync_path.read_text(encoding='utf-8')
          if 'reader-disclosure-loader.js?v=20260917-reader14' not in sync:
              raise RuntimeError('Reader loader cache anchor missing')
          sync_path.write_text(sync.replace('reader-disclosure-loader.js?v=20260917-reader14', 'reader-disclosure-loader.js?v=20260917-reader15', 1), encoding='utf-8')
          PY
      - name: Sync loaders and validate syntax
        run: |
          python tools/sync_reader_disclosure_loader.py
          node --check assets/js/reader-disclosure.js
          node --check assets/js/reader-disclosure-loader.js
          node --check tools/smoke_reader_ux.js
          git diff --check
      - name: Commit fix and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dave-reader-open-editorial-fix.yml
          git add -A
          git commit -m "fix: keep open Internet headers editorial"
          git push origin HEAD:dave/internet-music-structure-2026-09-17
