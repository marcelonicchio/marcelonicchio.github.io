name: Dave Thread Image First

on:
  push:
    branches:
      - dave/eu-nao-to-nem-ai-thread-first-2026-09-17

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dave/eu-nao-to-nem-ai-thread-first-2026-09-17
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4

      - name: Synchronize entry targets
        run: python tools/sync_entries.py

      - name: Accept editorial parity checkpoint
        run: python tools/editorial_parity.py --accept music-album-1999-2000

      - name: Synchronize Full Biography
        run: python tools/sync_full_biography.py

      - name: Rebuild Chapter Pages
        run: python tools/build_chapter_pages.py

      - name: Refresh sitemap
        run: python tools/build_sitemap.py

      - name: Verify thread image is first
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [
              "content/entries/pt/music-album-1999-2000.inc",
              "content/entries/en/music-album-1999-2000.inc",
          ]
          for rel in targets:
              text = Path(rel).read_text(encoding="utf-8")
              if not text.startswith('<figure class="thread-media thread-media--linked">'):
                  raise SystemExit(f"{rel}: thread image is not first")
              if text.find("<figure") > text.find("<p>"):
                  raise SystemExit(f"{rel}: text appears before thread image")
          print("Thread image opens both canonical fragments.")
          PY

      - name: Targeted validation
        run: |
          python tools/sync_entries.py --check
          python tools/editorial_parity.py --check
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
          python tools/build_sitemap.py --check
          python tools/audit_site.py

      - name: Commit generated synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dave-thread-image-first.yml
          git add -A
          git commit -m "refactor: open album entry with thread image"
          git push origin HEAD:dave/eu-nao-to-nem-ai-thread-first-2026-09-17
