name: Krist refresh sitemap for global video standard
on:
  push:
    branches: [feat/global-video-media-standard]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regenerate sitemap
        run: python tools/build_sitemap.py
      - name: Commit refreshed sitemap and clean workflow
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          rm -f .github/workflows/krist-refresh-sitemap-global-video.yml
          git add sitemap.xml .github/workflows/krist-refresh-sitemap-global-video.yml
          if git diff --cached --quiet; then
            echo "No sitemap change to commit"
          else
            git commit -m "chore: refresh sitemap after video standard rollout"
            git push origin HEAD:feat/global-video-media-standard
          fi
