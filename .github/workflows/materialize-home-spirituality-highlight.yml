name: Materialize home spirituality highlight

on:
  push:
    branches: [work/home-spirituality-highlight]
    paths:
      - '.github/workflows/materialize-home-spirituality-highlight.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add Spirituality highlight to PT/EN Home
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('pt/index.html'): (
                  '<div class="authority-item"><a href="https://www.youtube.com/watch?v=tIGlLDpzQ7E" target="_blank" rel="noopener noreferrer"><span class="year">2006</span><strong>Meia-Noite e Uns</strong><span>Direção Artística e co-Produção Executiva do programa exibido pela RedeTV!.</span><span class="source-action">Assistir ↗</span></a></div>\n        <div class="authority-item"><a href="/pt/publicacoes/"><span class="year">2026</span><strong>Punk Rock Orchestra</strong>',
                  '<div class="authority-item"><a href="https://www.youtube.com/watch?v=tIGlLDpzQ7E" target="_blank" rel="noopener noreferrer"><span class="year">2006</span><strong>Meia-Noite e Uns</strong><span>Direção Artística e co-Produção Executiva do programa exibido pela RedeTV!.</span><span class="source-action">Assistir ↗</span></a></div>\n        <div class="authority-item"><a href="/pt/biografia/espiritualidade-o-buscador/"><span class="year">2006–2007</span><strong>Espiritualidade — “O Buscador”</strong><span>Uma busca espiritual que atravessou Osho, Buddhismo Theravada, tomada de refúgio e um retiro Vipassana de doze dias no Dhamma Santi.</span><span class="source-action">Ler capítulo →</span></a></div>\n        <div class="authority-item"><a href="/pt/publicacoes/"><span class="year">2026</span><strong>Punk Rock Orchestra</strong>'
              ),
              Path('en/index.html'): (
                  '<div class="authority-item"><a href="https://www.youtube.com/watch?v=tIGlLDpzQ7E" target="_blank" rel="noopener noreferrer"><span class="year">2006</span><strong>Meia-Noite e Uns</strong><span>Artistic Direction and co-Executive Production of the RedeTV! program.</span><span class="source-action">Watch ↗</span></a></div>\n        <div class="authority-item"><a href="/en/publications/"><span class="year">2026</span><strong>Punk Rock Orchestra</strong>',
                  '<div class="authority-item"><a href="https://www.youtube.com/watch?v=tIGlLDpzQ7E" target="_blank" rel="noopener noreferrer"><span class="year">2006</span><strong>Meia-Noite e Uns</strong><span>Artistic Direction and co-Executive Production of the RedeTV! program.</span><span class="source-action">Watch ↗</span></a></div>\n        <div class="authority-item"><a href="/en/biography/spirituality-the-seeker/"><span class="year">2006–2007</span><strong>Spirituality — “The Seeker”</strong><span>A spiritual search spanning Osho, Theravada Buddhism, taking refuge and a twelve-day Vipassana retreat at Dhamma Santi.</span><span class="source-action">Read chapter →</span></a></div>\n        <div class="authority-item"><a href="/en/publications/"><span class="year">2026</span><strong>Punk Rock Orchestra</strong>'
              ),
          }

          for path, (old, new) in changes.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one insertion point, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Refresh sitemap
        run: python tools/build_sitemap.py
      - name: Commit Home highlight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/index.html en/index.html sitemap.xml
          git commit -m "Feature Spirituality chapter on Home"
          git push
