name: Billy BEST parity accept

on:
  push:
    branches: [billy/best-kenshoo-workshops-2026-09-06]

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Accept reviewed BEST PT EN checkpoint
        run: python tools/editorial_parity.py --accept internet-best
      - name: Verify parity
        run: python tools/editorial_parity.py --check
      - name: Remove one-shot workflow and commit checkpoint
        run: |
          rm .github/workflows/billy-best-parity-accept.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: accept BEST PT EN editorial checkpoint"
          git push origin HEAD:${GITHUB_REF_NAME}
