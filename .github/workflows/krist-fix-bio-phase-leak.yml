name: Krist fix Full Biography phase-class leak
on:
  push:
    branches: [fix/bio-promoted-entry-layout]
    paths: ['.github/workflows/krist-fix-bio-phase-leak.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bio-promoted-entry-layout
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install beautifulsoup4
      - name: Patch generator and audit, regenerate Full Biography
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/sync_full_biography.py')
          s = p.read_text()
          old = '    classes = list(section.get("class", []))\n    if "chapter" not in classes:\n'
          new = '    # Vertical-only layout classes must never leak into the Full Biography.\n    classes = [cls for cls in section.get("class", []) if cls not in {"phase", "music-entry"}]\n    if "chapter" not in classes:\n'
          if old not in s:
              raise SystemExit('sync_full_biography.py patch anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tools/audit_full_biography.py')
          s = p.read_text()
          old = '        target_soup = BeautifulSoup(target_text, "html.parser")\n        rendered = [node.get("data-bio-entry") for node in target_soup.select("[data-bio-entry]")]\n'
          new = '        target_soup = BeautifulSoup(target_text, "html.parser")\n        leaked_layout = [node.get("data-bio-entry") for node in target_soup.select(".bio-entry.phase, .bio-entry.music-entry")]\n        if leaked_layout:\n            fail(errors, f"{lang}: vertical-only layout classes leaked into Full Biography: {sorted(set(leaked_layout))}")\n        rendered = [node.get("data-bio-entry") for node in target_soup.select("[data-bio-entry]")]\n'
          if old not in s:
              raise SystemExit('audit_full_biography.py patch anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python tools/sync_full_biography.py
          python tools/audit_full_biography.py
          python tools/sync_full_biography.py --check
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/krist-fix-bio-phase-leak.yml
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add tools/sync_full_biography.py tools/audit_full_biography.py pt/biografia/index.html en/biography/index.html .github/workflows/krist-fix-bio-phase-leak.yml
          git commit -m "fix: prevent music phase layout from leaking into Full Biography"
          git push origin HEAD:fix/bio-promoted-entry-layout
