name: Benny fix Programa do Jo date

on:
  push:
    branches:
      - benny/fix-programa-jo-date

permissions:
  contents: write

jobs:
  fix-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Correct Programa do Jo date at canonical sources
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('data/galleries.json'): [
                  ('21 jun. 2001', '27 jun. 2001'),
                  ('21 Jun. 2001', '27 Jun. 2001'),
              ],
              Path('data/full_biography.json'): [
                  ('"date": "21 jun. 2001"', '"date": "27 jun. 2001"'),
                  ('"date_en": "Jun. 21, 2001"', '"date_en": "Jun. 27, 2001"'),
              ],
              Path('pt/musica/index.html'): [
                  ('21 jun. 2001', '27 jun. 2001'),
                  ('21 de junho de 2001', '27 de junho de 2001'),
              ],
              Path('en/music/index.html'): [
                  ('Jun. 21, 2001', 'Jun. 27, 2001'),
                  ('June 21, 2001', 'June 27, 2001'),
                  ('21 Jun. 2001', '27 Jun. 2001'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No date change made in {path}')
              path.write_text(text, encoding='utf-8')
              print(f'corrected {path}')
          PY
      - name: Regenerate gallery and Full Biography
        run: |
          python tools/sync_galleries.py
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept music-programa-jo
          python tools/build_sitemap.py
      - name: Verify corrected date everywhere active
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('data/galleries.json'),
              Path('data/full_biography.json'),
              Path('pt/musica/index.html'),
              Path('en/music/index.html'),
              Path('pt/biografia/index.html'),
              Path('en/biography/index.html'),
          ]
          wrong = ['21 jun. 2001', '21 de junho de 2001', '21 Jun. 2001', 'Jun. 21, 2001', 'June 21, 2001']
          for path in files:
              text = path.read_text(encoding='utf-8')
              hits = [x for x in wrong if x in text]
              if hits:
                  raise SystemExit(f'Old Programa do Jo date remains in {path}: {hits}')
          checks = {
              'data/galleries.json': ['27 jun. 2001', '27 Jun. 2001'],
              'data/full_biography.json': ['"date": "27 jun. 2001"', '"date_en": "Jun. 27, 2001"'],
              'pt/musica/index.html': ['27 jun. 2001', '27 de junho de 2001'],
              'en/music/index.html': ['Jun. 27, 2001', 'June 27, 2001', '27 Jun. 2001'],
              'pt/biografia/index.html': ['27 jun. 2001', '27 de junho de 2001'],
              'en/biography/index.html': ['Jun. 27, 2001', 'June 27, 2001', '27 Jun. 2001'],
          }
          for name, needles in checks.items():
              text = Path(name).read_text(encoding='utf-8')
              missing = [x for x in needles if x not in text]
              if missing:
                  raise SystemExit(f'Missing corrected dates in {name}: {missing}')
          print('Programa do Jo date verified as 27 June 2001 in all active sources and renderings.')
          PY
      - name: Commit corrected date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/galleries.json data/full_biography.json data/editorial_parity.json pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: correct Programa do Jo date to June 27 2001"
          git push origin HEAD:benny/fix-programa-jo-date
