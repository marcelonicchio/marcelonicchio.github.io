name: Dave accept MP3 editorial parity
on:
  push:
    branches:
      - dave/music-mp3-image-2026-09-17
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dave/music-mp3-image-2026-09-17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install beautifulsoup4
      - name: Accept reviewed PT/EN checkpoint
        run: python tools/editorial_parity.py --accept music-mp3-era-2000
      - name: Verify parity
        run: python tools/editorial_parity.py --check
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/dave-mp3-parity-accept.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: accept MP3 entry PT EN checkpoint"
          git push origin HEAD:dave/music-mp3-image-2026-09-17
