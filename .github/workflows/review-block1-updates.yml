name: Apply reviewed Full Biography block 1 updates

on:
  push:
    branches: [full-biography-parity-stop]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: full-biography-parity-stop
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Apply reviewed PT and EN edits
        run: |
          python - <<'PY'
          from pathlib import Path

          reps = {
            'pt/musica/index.html': [
              (
                '<section id="origens" class="chapter"><h2>Origens e formação</h2><p>Nicchio começou a tocar percussão ainda adolescente, passando pela bateria de escola de samba e por formação musical no Conservatório Antonino Simalha. Em 1991 já atuava como baterista cover. O repertório autoral começou a ganhar forma logo depois, alimentado por influências do punk rock de São Paulo e do exterior.</p><p>Entre as referências declaradas dessa fase aparecem Ramones, Misfits, The Clash, Bad Brains e Sex Pistols, além de Magazine/Verminose, Garotos Podres, Inocentes, Ira! e 365 no Brasil.</p></section>',
                '<section id="origens" class="chapter"><h2>Origens e formação</h2><p>Nicchio começou a tocar percussão aos <strong>12 anos de idade</strong>, em 1989, na escola de samba <strong>Mocidade Alegre</strong>. Seu primeiro desfile aconteceu em <strong>4 de fevereiro de 1989</strong>, na Avenida Tiradentes, em São Paulo, ao raiar da manhã.</p><div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=ZOukRoPC87I" target="_blank" rel="noopener noreferrer">Mocidade Alegre · desfile de 4 fev. 1989 ↗</a></div><p>A partir de então, dedicou-se ao aprendizado de diferentes instrumentos de percussão, entre eles surdo, tamborim, cuíca e caixa. A experiência na Mocidade Alegre foi transformadora a ponto de, em 1991, matricular-se no <strong>Conservatório Musical Antonino Simalha</strong> para estudar teoria musical e a prática de bateria com o professor <strong>João Conde</strong>.</p><p>Ainda em 1991, começou a praticar com amigos em uma banda cover. Em 1992, aprendeu a tocar violão como autodidata e, após muita prática, começou a compor suas primeiras músicas, que seriam incorporadas à fundação do <strong>Coitado do Próximo</strong>, com a participação do vocalista <strong>Mario Joe</strong>. As influências do punk rock de São Paulo e do exterior eram viscerais.</p><p>Entre as referências declaradas dessa fase aparecem Ramones, Misfits, The Clash, Bad Brains e Sex Pistols, além de Magazine/Verminose, Garotos Podres, Inocentes, Ira! e 365 no Brasil.</p></section>'
              ),
              (
                '<div data-bio-key="music-coitado-1994"><p>Em 1994 foi gravada a primeira demo-tape, com <em>Pegue o seu Celular</em> e <em>Mulher SP</em>. O áudio final e vídeos das sessões de gravação sobreviveram e aguardam publicação.</p>',
                '<div data-bio-key="music-coitado-1994"><p>Em 1994, foi gravada a primeira demo-tape, no <strong>Estúdio Anonimato</strong>, em São Paulo, com duas músicas de autoria de Marcelo Nicchio: <em>Pegue o seu Celular</em> e <em>Mulher SP</em>. O áudio final e vídeos das sessões de gravação sobreviveram e aguardam publicação.</p>'
              )
            ],
            'en/music/index.html': [
              (
                '<section id="origins" class="chapter"><h2>Origins and training</h2><p>Nicchio began playing percussion while still a teenager, moving through samba-school percussion and, according to his biographical account, formal musical study at Conservatório Antonino Simalha. By 1991 he was already playing drums in cover projects. Original songwriting followed soon after, strongly influenced by both São Paulo punk rock and international punk.</p><p>Declared influences from that period include Ramones, Misfits, The Clash, Bad Brains and Sex Pistols, as well as Magazine/Verminose, Garotos Podres, Inocentes, Ira! and 365 in Brazil.</p></section>',
                '<section id="origins" class="chapter"><h2>Origins and training</h2><p>Nicchio began playing percussion at <strong>age 12</strong>, in 1989, with the samba school <strong>Mocidade Alegre</strong>. His first parade took place on <strong>February 4, 1989</strong>, on Avenida Tiradentes in São Paulo, at daybreak.</p><div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=ZOukRoPC87I" target="_blank" rel="noopener noreferrer">Mocidade Alegre · Feb. 4, 1989 parade ↗</a></div><p>From then on, he dedicated himself to learning different percussion instruments, including surdo, tamborim, cuíca and caixa. The experience at Mocidade Alegre was transformative enough that, in 1991, he enrolled at <strong>Conservatório Musical Antonino Simalha</strong> to study music theory and drum performance with teacher <strong>João Conde</strong>.</p><p>Still in 1991, he began rehearsing with friends in a cover band. In 1992, he taught himself guitar and, after intensive practice, began writing his first songs, which would become part of the foundation of <strong>Coitado do Próximo</strong>, with vocalist <strong>Mario Joe</strong>. The influence of São Paulo and international punk rock was visceral.</p><p>Declared influences from that period include Ramones, Misfits, The Clash, Bad Brains and Sex Pistols, as well as Magazine/Verminose, Garotos Podres, Inocentes, Ira! and 365 in Brazil.</p></section>'
              ),
              (
                '<div data-bio-key="music-coitado-1994"><p>In 1994 it recorded its first demo tape with <em>Pegue o seu Celular</em> and <em>Mulher SP</em>. The final audio and footage from the recording sessions survive and await publication.</p>',
                '<div data-bio-key="music-coitado-1994"><p>In 1994, the band recorded its first demo tape at <strong>Estúdio Anonimato</strong> in São Paulo, featuring two songs written by Marcelo Nicchio: <em>Pegue o seu Celular</em> and <em>Mulher SP</em>. The final audio and footage from the recording sessions survive and await publication.</p>'
              )
            ],
            'pt/biografia/index.html': [
              (
                'Marcelo Nicchio é um profissional e criador brasileiro cuja trajetória atravessa música autoral, comunicação, Internet & Performance, audiovisual e, mais recentemente, pesquisa independente em Human–AI Interaction.',
                'Marcelo Nicchio é um criador brasileiro cuja trajetória atravessa música autoral, comunicação, Internet & Performance, audiovisual e, mais recentemente, pesquisa independente em Human–AI Interaction.'
              ),
              (
                'É a recorrência de criação, tecnologia, mediação, circulação de informação, audiência e comportamento humano. Em décadas diferentes, esse território assumiu a forma de uma banda, um programa de rádio, uma BBS, um portal, uma operação de performance, um programa de televisão ou uma metodologia de pesquisa com sistemas generativos.',
                'É a recorrência de criação, orquestração, tecnologia, mediação, circulação de informação, audiência e comportamento humano. Em décadas diferentes, esse território assumiu a forma de uma banda, um repertório musical, uma coluna cultural, um programa de rádio, uma BBS, um portal, uma operação de performance, um programa de televisão ou uma metodologia de pesquisa com sistemas generativos.'
              )
            ],
            'en/biography/index.html': [
              (
                'Marcelo Nicchio is a Brazilian professional and creator whose trajectory spans original music, communication, Internet & Performance, audiovisual work and, more recently, independent Human–AI Interaction research.',
                'Marcelo Nicchio is a Brazilian creator whose trajectory spans original music, communication, Internet & Performance, audiovisual work and, more recently, independent Human–AI Interaction research.'
              ),
              (
                'It is the recurrence of creation, technology, mediation, information circulation, audiences and human behavior. In different decades, that territory took the form of a band, a radio program, a BBS, a portal, a performance operation, a television program or a research methodology involving generative systems.',
                'It is the recurrence of creation, orchestration, technology, mediation, information circulation, audiences and human behavior. In different decades, that territory took the form of a band, a musical repertoire, a cultural column, a radio program, a BBS, a portal, a performance operation, a television program or a research methodology involving generative systems.'
              )
            ]
          }

          for filename, pairs in reps.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected source text not found: {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Prove parity detects edits
        run: |
          if python tools/editorial_parity.py --check; then
            echo "Parity unexpectedly passed after reviewed source edits"
            exit 1
          else
            echo "Parity correctly detected updated source units"
          fi
      - name: Accept reviewed source revisions
        run: |
          python tools/editorial_parity.py --accept music-origins
          python tools/editorial_parity.py --accept music-coitado-1994
      - name: Regenerate Full Biography
        run: python tools/sync_full_biography.py
      - name: Run complete audits
        run: |
          python tools/editorial_parity.py --check
          python tools/audit_full_biography.py
          python tools/sync_navigation.py --check
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/audit_galleries.py
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py
      - name: Commit reviewed block 1 and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html data/editorial_parity.json
          git rm .github/workflows/review-block1-updates.yml
          git commit -m "Apply reviewed biography block 1 details"
          git push origin HEAD:full-biography-parity-stop
