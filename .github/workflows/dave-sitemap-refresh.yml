name: Dave Sitemap Refresh

on:
  push:
    branches:
      - dave/hci-navigation-title-2026-09-17

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dave/hci-navigation-title-2026-09-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regenerate sitemap
        run: python tools/build_sitemap.py
      - name: Verify sitemap
        run: python tools/build_sitemap.py --check
      - name: Commit sitemap and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dave-sitemap-refresh.yml
          git add sitemap.xml
          git commit -m "chore: refresh sitemap lastmod after HCI update"
          git push origin HEAD:dave/hci-navigation-title-2026-09-17
