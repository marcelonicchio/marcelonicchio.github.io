name: Bootstrap gallery media

# Temporary branch-only bootstrap. Revision 2 validates the no-upscale derivative policy.
on:
  push:
    branches: [media-infra-v1]
    paths:
      - '.github/workflows/media-bootstrap.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: media-infra-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Build responsive derivatives
        run: python tools/build_gallery_media.py
      - name: Synchronize gallery markup
        run: python tools/sync_galleries.py
      - name: Audit generated media
        run: |
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/audit_galleries.py
      - name: Commit generated assets and markup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/galleries.json assets/media/galleries pt/audiovisual/index.html en/audiovisual/index.html
          git commit -m "Regenerate gallery media without upscaling"
          git push
