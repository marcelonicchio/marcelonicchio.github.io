name: Benny accept Eu Nao editorial parity

on:
  push:
    branches:
      - benny/fix-eu-nao-thread-gallery

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Accept reviewed PT EN checkpoint
        run: python tools/editorial_parity.py --accept music-album-1999-2000
      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial_parity.json
          git commit -m "chore: accept corrected Eu Nao To Nem Ai parity checkpoint"
          git push origin HEAD:benny/fix-eu-nao-thread-gallery
