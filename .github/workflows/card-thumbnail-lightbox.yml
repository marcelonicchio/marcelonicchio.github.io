name: Card thumbnail lightbox migration

on:
  push:
    branches:
      - card-thumbnail-lightbox

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: card-thumbnail-lightbox
          fetch-depth: 0

      - name: Convert documentary cards to compact thumbnails with lightbox
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Documentary material in narrative flow */'
          start = css.index(marker)
          media_line = '@media(max-width:580px){.inline-records--two{grid-template-columns:1fr}.inline-record span{align-items:flex-start;flex-direction:column;gap:3px}}'
          old_end = css.index(media_line, start) + len(media_line)

          new_block = r'''/* Documentary material in narrative flow */
          .inline-records{display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px;margin:20px 0 8px}
          .inline-records--two{display:flex;flex-wrap:wrap;gap:20px}
          .inline-record{display:inline-flex;flex-direction:column;align-items:flex-start;width:min(290px,100%);max-width:100%;overflow:visible;border:0;border-radius:0;background:transparent;text-decoration:none;color:var(--text)}
          .inline-record:hover{opacity:1}
          .inline-record img{display:block;width:auto;max-width:100%;height:auto;max-height:185px;object-fit:contain;background:transparent;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(0,0,0,.22);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
          .inline-record:hover img{transform:translateY(-2px);border-color:#56565b;box-shadow:0 14px 30px rgba(0,0,0,.3)}
          .inline-record span{display:block;padding:8px 2px 0;line-height:1.35}
          .inline-record strong{display:block;font-size:.84rem;color:var(--soft)}
          .inline-record small{display:block;margin-top:3px;font-size:.7rem;color:var(--accent-soft);white-space:normal}
          .inline-record:focus-visible{outline:0}
          .inline-record:focus-visible img{outline:2px solid var(--accent-soft);outline-offset:4px}
          .inline-links{margin:14px 0 5px}

          .archive-lightbox[hidden]{display:none}
          .archive-lightbox{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.86);backdrop-filter:blur(8px)}
          .archive-lightbox__panel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(1120px,94vw);max-height:94vh;padding:42px 20px 18px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:#09090a;box-shadow:0 24px 80px rgba(0,0,0,.58)}
          .archive-lightbox__image{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;object-fit:contain}
          .archive-lightbox__caption{width:100%;margin-top:12px;color:var(--muted);font-size:.82rem;text-align:center}
          .archive-lightbox__close{position:absolute;top:10px;right:12px;width:34px;height:34px;border:1px solid var(--line);border-radius:999px;background:#111214;color:var(--text);font:inherit;font-size:1.25rem;line-height:1;cursor:pointer}
          .archive-lightbox__close:hover{border-color:#5a5a60}
          .archive-lightbox__close:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px}
          html.archive-lightbox-open,html.archive-lightbox-open body{overflow:hidden}
          @media(max-width:580px){.inline-record{width:min(260px,88vw)}.inline-record img{max-height:170px}.archive-lightbox{padding:10px}.archive-lightbox__panel{width:96vw;max-height:96vh;padding:42px 10px 12px;border-radius:14px}.archive-lightbox__image{max-height:80vh}}
          '''
          css = css[:start] + new_block + css[old_end:]
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('assets/js/archive-lightbox.js')
          js_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.write_text(r'''(() => {
            const links = [...document.querySelectorAll('a.inline-record')];
            if (!links.length) return;

            const isImage = (href) => {
              try {
                const url = new URL(href, window.location.href);
                return /\.(?:avif|webp|png|jpe?g|gif)$/i.test(url.pathname);
              } catch (_) {
                return false;
              }
            };

            const lightbox = document.createElement('div');
            lightbox.className = 'archive-lightbox';
            lightbox.hidden = true;
            lightbox.setAttribute('aria-hidden', 'true');
            lightbox.innerHTML = `
              <div class="archive-lightbox__panel" role="dialog" aria-modal="true" aria-label="Visualização ampliada / Enlarged view">
                <button class="archive-lightbox__close" type="button" aria-label="Fechar / Close">×</button>
                <img class="archive-lightbox__image" alt="">
                <div class="archive-lightbox__caption"></div>
              </div>`;
            document.body.appendChild(lightbox);

            const image = lightbox.querySelector('.archive-lightbox__image');
            const caption = lightbox.querySelector('.archive-lightbox__caption');
            const closeButton = lightbox.querySelector('.archive-lightbox__close');
            let returnFocus = null;

            const close = () => {
              if (lightbox.hidden) return;
              lightbox.hidden = true;
              lightbox.setAttribute('aria-hidden', 'true');
              document.documentElement.classList.remove('archive-lightbox-open');
              image.removeAttribute('src');
              if (returnFocus) returnFocus.focus({preventScroll: true});
            };

            const open = (link) => {
              returnFocus = link;
              image.src = link.href;
              const thumb = link.querySelector('img');
              image.alt = thumb?.alt || '';
              caption.textContent = link.querySelector('strong')?.textContent?.trim() || thumb?.alt || '';
              lightbox.hidden = false;
              lightbox.setAttribute('aria-hidden', 'false');
              document.documentElement.classList.add('archive-lightbox-open');
              closeButton.focus({preventScroll: true});
            };

            links.forEach((link) => {
              if (!isImage(link.href)) return;
              const helper = link.querySelector('small');
              if (helper) helper.textContent = document.documentElement.lang?.startsWith('pt') ? 'Clique para ampliar' : 'Click to enlarge';
              link.addEventListener('click', (event) => {
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                event.preventDefault();
                open(link);
              });
            });

            closeButton.addEventListener('click', close);
            lightbox.addEventListener('click', (event) => {
              if (event.target === lightbox) close();
            });
            document.addEventListener('keydown', (event) => {
              if (event.key === 'Escape') close();
            });
          })();
          ''', encoding='utf-8')

          changed = []
          for root in (Path('pt'), Path('en')):
              for page in root.rglob('index.html'):
                  text = page.read_text(encoding='utf-8')
                  if 'class="inline-record"' not in text:
                      continue
                  script = '<script src="/assets/js/archive-lightbox.js" defer></script>'
                  if script not in text:
                      text = text.replace('</body>', f'{script}\n</body>')
                      page.write_text(text, encoding='utf-8')
                      changed.append(str(page))

          print('Lightbox script added to:')
          print('\n'.join(changed))
          if not changed:
              raise SystemExit('No inline-record pages were updated')
          PY

          git diff --check
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py

          rm .github/workflows/card-thumbnail-lightbox.yml

          git config user.name "Marcelo Nicchio Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css assets/js/archive-lightbox.js pt en .github/workflows/card-thumbnail-lightbox.yml
          git commit -m "Add compact documentary thumbnails and lightbox [skip ci]"
          git push origin HEAD:card-thumbnail-lightbox
