name: Card thumbnail lightbox migration

on:
  push:
    branches:
      - card-thumbnail-lightbox

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: card-thumbnail-lightbox
          fetch-depth: 0

      - name: Build compact thumbnails and lightbox
        shell: bash
        run: |
          python tools/migrate_card_lightbox.py
          git diff --check
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py

          rm .github/workflows/card-thumbnail-lightbox.yml
          rm tools/migrate_card_lightbox.py

          git config user.name "Marcelo Nicchio Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css assets/js/archive-lightbox.js pt en .github/workflows/card-thumbnail-lightbox.yml tools/migrate_card_lightbox.py
          git commit -m "Add compact documentary thumbnails and lightbox [skip ci]"
          git push origin HEAD:card-thumbnail-lightbox
