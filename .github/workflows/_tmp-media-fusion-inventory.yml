name: Temporary media fusion inventory

on:
  push:
    branches: [work/media-culture-fusion]
    paths:
      - '.github/workflows/_tmp-media-fusion-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/media-culture-fusion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Build inventory
        run: |
          python <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json, re

          out=[]
          out.append('# Temporary media fusion inventory')
          for lang,path in [('PT','pt/comunicacao/index.html'),('EN','en/communication/index.html'),('PT audiovisual','pt/audiovisual/index.html'),('EN audiovisual','en/audiovisual/index.html')]:
              soup=BeautifulSoup(Path(path).read_text(encoding='utf-8'),'html.parser')
              out.append(f'\n## {lang}: `{path}`')
              for sec in soup.select('article.article-body > section.chapter'):
                  h=sec.find(['h2','h3'])
                  out.append(f'- `{sec.get("id")}` — {h.get_text(" ",strip=True) if h else "(no heading)"}')

          reg=json.loads(Path('data/entries.json').read_text(encoding='utf-8'))
          out.append('\n## Registry communication/audiovisual')
          for e in reg.get('entries',[]):
              if e.get('domain') in {'communication','audiovisual'} or 'audiovisual' in json.dumps(e,ensure_ascii=False):
                  out.append(f'- `{e.get("id")}` domain=`{e.get("domain")}`')
                  for l in ('pt','en'):
                      t=e.get('reader_targets',{}).get(l,[])
                      if t: out.append(f'  - {l}: '+', '.join(f"{x.get('path')} {x.get('selector')}" for x in t))
                  cp=e.get('chapter_page',{})
                  if cp.get('status') not in (None,'none'):
                      out.append(f'  - chapter: {cp}')

          for fname in ['data/galleries.json','data/video-embeds.json','data/media-registry.json']:
              text=Path(fname).read_text(encoding='utf-8') if Path(fname).exists() else ''
              out.append(f'\n## `{fname}` audiovisual/communication references')
              for i,line in enumerate(text.splitlines(),1):
                  if 'audiovisual' in line.lower() or 'comunicacao' in line.lower() or 'communication' in line.lower():
                      out.append(f'- L{i}: `{line.strip()[:260]}`')

          for fname in ['assets/js/reader-disclosure-loader.js','assets/js/reader-disclosure.js','tools/sync_navigation.py','tools/sync_galleries.py','tools/build_full_biography.py','tools/build_chapter_pages.py','sitemap.xml']:
              text=Path(fname).read_text(encoding='utf-8') if Path(fname).exists() else ''
              out.append(f'\n## `{fname}` relevant references')
              for i,line in enumerate(text.splitlines(),1):
                  low=line.lower()
                  if any(k in low for k in ['audiovisual','comunicacao','communication','folhateen','media & culture','mídia & cultura']):
                      out.append(f'- L{i}: `{line.strip()[:280]}`')
          Path('docs/_tmp-media-fusion-inventory.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_tmp-media-fusion-inventory.md
          git commit -m 'Inventory media culture fusion surfaces'
          git push origin HEAD:work/media-culture-fusion
