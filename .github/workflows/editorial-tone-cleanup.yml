name: Autobiographical tone cleanup

on:
  push:
    branches: [editorial-inline-archive]
    paths:
      - '.editorial-tone-cleanup'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-inline-archive
      - name: Remove forensic public-facing tone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rd(p): return Path(p).read_text(encoding='utf-8')
          def wr(p,s): Path(p).write_text(s,encoding='utf-8')

          def bounds(s, sid):
              start=s.find(f'<section id="{sid}" class="chapter">')
              if start<0: raise RuntimeError(f'{sid} missing')
              end=s.find('</section>',start)
              if end<0: raise RuntimeError(f'{sid} unclosed')
              return start,end+10

          def set_section(path,sid,html):
              s=rd(path); a,b=bounds(s,sid); wr(path,s[:a]+html+s[b:])

          def repl(path, old, new):
              s=rd(path)
              if old in s: wr(path,s.replace(old,new,1))

          def card(src,alt,title,label):
              return f'<div class="inline-records"><a class="inline-record" href="{src}" target="_blank" rel="noopener noreferrer"><img src="{src}" loading="lazy" decoding="async" alt="{alt}"><span><strong>{title}</strong><small>{label} ↗</small></span></a></div>'

          def cards(items):
              inner=''.join(f'<a class="inline-record" href="{src}" target="_blank" rel="noopener noreferrer"><img src="{src}" loading="lazy" decoding="async" alt="{alt}"><span><strong>{title}</strong><small>{label} ↗</small></span></a>' for src,alt,title,label in items)
              return '<div class="inline-records inline-records--two">'+inner+'</div>'

          def links(items):
              return '<div class="evidence-links inline-links">'+''.join(f'<a href="{u}" target="_blank" rel="noopener noreferrer">{t}</a>' for u,t in items)+'</div>'

          # Editorial framing: these are trajectory pages, not forensic dossiers.
          for p in ['pt/musica/index.html','pt/comunicacao/index.html','pt/internet/index.html','pt/audiovisual/index.html','pt/search-performance/index.html']:
              s=rd(p).replace('Arquivo temático ·','Trajetória ·').replace('Arquivo & fontes','Arquivo')
              wr(p,s)
          for p in ['en/music/index.html','en/communication/index.html','en/internet/index.html','en/audiovisual/index.html','en/search-performance/index.html']:
              s=rd(p).replace('Thematic archive ·','Trajectory ·').replace('Archive & sources','Archive')
              wr(p,s)

          # Internet PT/EN — direct autobiographical narrative.
          set_section('pt/internet/index.html','internet','''<section id="internet" class="chapter"><h2>1996 — transição para a internet comercial</h2><p>A partir de 1996, Nicchio passou a usar acesso comercial à internet por meio da STI. Esta fase se sobrepõe à produção musical e cultural dos anos 1990 e ajuda a mostrar que criação artística e tecnologia de rede coexistiam na mesma trajetória.</p></section>''')
          set_section('en/internet/index.html','internet','''<section id="internet" class="chapter"><h2>1996 — transition to the commercial internet</h2><p>From 1996 onward, Nicchio began using commercial internet access through STI. This phase overlapped with his musical and cultural work in the 1990s, with artistic creation and network technology developing side by side.</p></section>''')

          set_section('pt/internet/index.html','mirantte','''<section id="mirantte" class="chapter"><h2>2004–2008 — Mirantte News</h2><p>O <strong>Mirantte News</strong> foi criado e operado por Marcelo Nicchio, com Luiz Kechichian como sócio investidor. O portal reunia cerca de vinte categorias de serviços e combinava conteúdo editorial, páginas comerciais e recursos de localização.</p><p>Uma matéria da época identifica <strong>Marcelo Nicchio como diretor do site</strong> e descreve os hot-sites comerciais, as categorias e a integração com <strong>MapLink</strong> para mapas e rotas. Também sobreviveram uma captura da home e o cartão profissional do portal.</p>''' + card('/assets/archive/mirantte-news-card.webp','Cartão profissional do Mirantte News com marca, slogan e nome Marcelo Nicchio.','Mirantte News · cartão profissional','Abrir registro') + '''</section>''')
          set_section('en/internet/index.html','mirantte','''<section id="mirantte" class="chapter"><h2>2004–2008 — Mirantte News</h2><p><strong>Mirantte News</strong> was created and operated by Marcelo Nicchio, with Luiz Kechichian as investor-partner. The portal brought together roughly twenty service categories, combining editorial content, commercial pages and location tools.</p><p>A contemporary article identifies <strong>Marcelo Nicchio as site director</strong> and describes its commercial hot-sites, categories and <strong>MapLink</strong> map/routing integration. A homepage capture and the portal's professional card also survive.</p>''' + card('/assets/archive/mirantte-news-card.webp','Mirantte News professional card with brand, tagline and the name Marcelo Nicchio.','Mirantte News · professional card','Open record') + '''</section>''')

          # Search PT/EN — claims are presented as the authored professional biography; records accompany them inline.
          repl('pt/search-performance/index.html','Segundo sua biografia profissional, liderou uma equipe de seis analistas e administrou simultaneamente cerca de 22 contas de e-commerce de pequeno e médio porte, entre elas Beleza na Web.','Liderou uma equipe de seis analistas e administrou simultaneamente cerca de 22 contas de e-commerce de pequeno e médio porte, entre elas Beleza na Web.')
          repl('pt/search-performance/index.html','Há fotografias de equipe e possivelmente cartões e materiais profissionais ainda em arquivo pessoal. Esses materiais servirão como contexto histórico, não como pretexto para transformar o hub em um currículo de comprovantes.','Há fotografias de equipe e outros materiais profissionais ainda no arquivo pessoal, que serão incorporados progressivamente.')
          repl('pt/search-performance/index.html','Segundo seu relato profissional, montou estrutura, equipe e processos e ampliou a escala operacional de aproximadamente 150 mil para 3 milhões de palavras-chave distribuídas em três contas.','Montou estrutura, equipe e processos e ampliou a escala operacional de aproximadamente 150 mil para 3 milhões de palavras-chave distribuídas em três contas.')
          repl('pt/search-performance/index.html','Esses números permanecem identificados como relato profissional enquanto não houver fonte pública independente adequada. A existência do vínculo pode ser sustentada por documentação privada e histórico de carreira, mas scans de documentos pessoais não serão expostos no site.','Foi uma passagem centrada na construção interna da operação e na expansão de escala de mídia.')
          repl('pt/search-performance/index.html','Segundo sua lembrança, o treinamento ocorreu em dois dias, das 9h às 12h; esse horário ainda não foi recuperado em fonte pública, mas o conteúdo e sua atuação como instrutor estão registrados em vídeo.','O workshop foi realizado em dois dias, das 9h às 12h, e a série de quatro vídeos preserva o conteúdo e sua atuação como instrutor.')

          set_section('pt/search-performance/index.html','dialetto','''<section id="dialetto" class="chapter"><h2>2015 — Ad.Dialetto / Máquina de Vendas</h2><p>Na Ad.Dialetto, Nicchio assumiu a operação da conta da <strong>Máquina de Vendas / Ricardo Eletro</strong>. A missão envolveu reconstruir uma equipe e trabalhar com orçamento mensal da ordem de <strong>R$ 1 milhão</strong>, orientado por ROI por categoria.</p>''' + card('/assets/archive/ad-dialetto-card-2015.webp','Cartão profissional da Ad.Dialetto com o nome Marcelo Nicchio.','Ad.Dialetto · cartão profissional','Abrir registro') + '''</section>''')
          set_section('pt/search-performance/index.html','clickland','''<section id="clickland" class="chapter"><h2>2012–presente — Clickland Digital</h2><p>Paralelamente às passagens por outras empresas, Nicchio fundou a <strong>Clickland Digital Ltda.</strong> em sociedade com <strong>Carlos Portela</strong>, voltada a Search e mídia para pequenas e médias empresas.</p><p>A comunicação da agência a apresentava como <strong>“Premium Search Agency”</strong> e destacava Search, ROI, métricas, multicanal e Web Analytics, além dos selos dos programas Google AdWords Certified Partner e Google Analytics Certified Partner.</p>''' + cards([
              ('/assets/archive/clickland-card.webp','Cartão profissional Clickland com Marcelo Nicchio e selos Google.','Clickland · cartão profissional','Abrir cartão'),
              ('/assets/archive/clickland-home-historical.webp','Captura histórica da home da Clickland com a assinatura Premium Search Agency.','Clickland · home histórica','Abrir página')]) + '''</section>''')

          repl('en/search-performance/index.html','According to his professional biography, he led a team of six analysts and simultaneously managed roughly 22 small and mid-sized e-commerce accounts, including Beleza na Web.','He led a team of six analysts and simultaneously managed roughly 22 small and mid-sized e-commerce accounts, including Beleza na Web.')
          repl('en/search-performance/index.html','Team photographs and possibly cards and other professional material remain in the personal archive. They may provide historical context without turning the hub into a résumé made of receipts.','Team photographs and other professional material remain in the personal archive and will be incorporated progressively.')
          repl('en/search-performance/index.html','According to his professional account, he built the structure, team and processes and expanded operational scale from roughly 150,000 to 3 million keywords across three accounts.','He built the structure, team and processes and expanded operational scale from roughly 150,000 to 3 million keywords across three accounts.')
          repl('en/search-performance/index.html','Those figures remain clearly attributed to his professional account until suitable independent public documentation is available. The employment relationship can be supported privately and through career history, but scans of personal records will not be exposed on the site.','The role centered on building the internal operation and expanding media scale.')
          repl('en/search-performance/index.html','According to his memory, the training took place over two days, from 9 a.m. to noon; that schedule has not yet been recovered in a public source, but the content and his role as instructor are publicly documented on video.','The workshop ran over two days, from 9 a.m. to noon, and the four-part video series preserves both the material and his role as instructor.')

          set_section('en/search-performance/index.html','dialetto','''<section id="dialetto" class="chapter"><h2>2015 — Ad.Dialetto / Máquina de Vendas</h2><p>At Ad.Dialetto, Nicchio took responsibility for the <strong>Máquina de Vendas / Ricardo Eletro</strong> account. The assignment involved rebuilding a team and working with a monthly media budget of roughly <strong>R$1 million</strong>, managed through ROI by product category.</p>''' + card('/assets/archive/ad-dialetto-card-2015.webp','Ad.Dialetto professional card with the name Marcelo Nicchio.','Ad.Dialetto · professional card','Open record') + '''</section>''')
          set_section('en/search-performance/index.html','clickland','''<section id="clickland" class="chapter"><h2>2012–present — Clickland Digital</h2><p>Alongside other company roles, Nicchio founded <strong>Clickland Digital Ltda.</strong> with <strong>Carlos Portela</strong>, focused on Search and media for small and medium-sized businesses.</p><p>The agency presented itself as a <strong>“Premium Search Agency”</strong> and emphasized Search, ROI, metrics, multichannel work and Web Analytics, alongside Google AdWords Certified Partner and Google Analytics Certified Partner badges.</p>''' + cards([
              ('/assets/archive/clickland-card.webp','Clickland professional card with Marcelo Nicchio and Google badges.','Clickland · professional card','Open card'),
              ('/assets/archive/clickland-home-historical.webp','Historical Clickland homepage showing the Premium Search Agency positioning.','Clickland · historical homepage','Open page')]) + '''</section>''')

          # Audiovisual PT/EN — factual work history first, records directly underneath.
          set_section('pt/audiovisual/index.html','homens','''<section id="homens" class="chapter"><h2>1998 — Homens na Cozinha</h2><p>Em 1998, Nicchio atuou na produção executiva do programa de televisão <strong>Homens na Cozinha</strong>, criado e apresentado por Fábio Ávila e exibido pela Band. Seu trabalho esteve concentrado em captação de recursos.</p><p>Há programas do projeto preservados no YouTube; eles serão incorporados aqui conforme a catalogação audiovisual avançar.</p></section>''')
          set_section('pt/audiovisual/index.html','cinema','''<section id="cinema" class="chapter"><h2>1998–2000 — captação para cinema</h2><p>Por meio da <strong>Nicchio &amp; Associados S/C Ltda.</strong>, empresa familiar que operava projetos ligados a incentivos fiscais, Nicchio trabalhou como <strong>Produtor Cultural</strong> e colaborou com captação de recursos para projetos culturais e cinematográficos, incluindo <em>Carandiru</em> e <em>Domésticas</em>.</p>''' + card('/assets/archive/nicchio-associados-card.webp','Cartão da Nicchio & Associados identificando Marcelo Henrique Nicchio como Produtor Cultural.','Nicchio & Associados · Produtor Cultural','Abrir registro') + '''</section>''')

          meia_videos_pt='''<div class="evidence-list"><div class="evidence"><div class="evidence-top"><strong>Meia-Noite e Uns — Bloco 1</strong><span class="status">vídeo</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=kLQAlzgwmy0" target="_blank" rel="noopener noreferrer">YouTube</a></div></div><div class="evidence"><div class="evidence-top"><strong>Bloco 2</strong><span class="status">vídeo</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=f-JZfMoHh1I" target="_blank" rel="noopener noreferrer">YouTube</a></div></div><div class="evidence"><div class="evidence-top"><strong>Bloco 3</strong><span class="status">vídeo</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=6s6843Mq5MA" target="_blank" rel="noopener noreferrer">YouTube</a></div></div><div class="evidence"><div class="evidence-top"><strong>Vinheta completa / créditos</strong><span class="status">créditos</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=tIGlLDpzQ7E" target="_blank" rel="noopener noreferrer">YouTube</a></div></div></div>'''
          set_section('pt/audiovisual/index.html','meia-noite','''<section id="meia-noite" class="chapter"><h2>2006 — Meia-Noite e Uns</h2><p><strong>Meia-Noite e Uns</strong> foi um programa de televisão sobre literatura com linguagem pop, exibido pela RedeTV! e apresentado por Soninha Francine. Marcelo Nicchio assinou a <strong>Direção Artística</strong> e a <strong>Produção Executiva</strong> ao lado de <strong>Cristiano Gonçalves</strong>, pela <strong>Dreamsnetwork.tv</strong>.</p><p>Nicchio criou o conceito artístico e visual e a estrutura narrativa do programa. Paulão de Carvalho participou da redação e coapresentou o projeto a convite de Nicchio; a trilha foi escrita e produzida em parceria com Fábio “Badi” Crepaldi.</p><p>O título originalmente desejado era <strong>Meia-Noite e Um</strong>, ligado a um blog de mesmo nome e à ideia de iniciar o programa às 00:01. Como não era possível garantir o minuto exato na grade, o título passou a ser <strong>Meia-Noite e Uns</strong>.</p>''' + meia_videos_pt + card('/assets/archive/dreamsnetwork-card-2006.webp','Cartão DreamsNetwork identificando Marcelo Nicchio como Produtor Executivo.','DreamsNetwork · Produtor Executivo','Abrir registro') + '''</section>''')

          set_section('en/audiovisual/index.html','homens','''<section id="homens" class="chapter"><h2>1998 — Homens na Cozinha</h2><p>In 1998, Nicchio worked in executive production for <strong>Homens na Cozinha</strong>, a television program created and hosted by Fábio Ávila and broadcast by Band. His work focused on fundraising.</p><p>Episodes survive on YouTube and will be incorporated here as the audiovisual catalogue develops.</p></section>''')
          set_section('en/audiovisual/index.html','film','''<section id="film" class="chapter"><h2>1998–2000 — film fundraising</h2><p>Through <strong>Nicchio &amp; Associados S/C Ltda.</strong>, a family company working with tax-incentive projects, Nicchio worked as a <strong>Cultural Producer</strong> and contributed to fundraising for cultural and film projects including <em>Carandiru</em> and <em>Domésticas</em>.</p>''' + card('/assets/archive/nicchio-associados-card.webp','Nicchio & Associados card identifying Marcelo Henrique Nicchio as Cultural Producer.','Nicchio & Associados · Cultural Producer','Open record') + '''</section>''')
          meia_videos_en='''<div class="evidence-list"><div class="evidence"><div class="evidence-top"><strong>Meia-Noite e Uns — Block 1</strong><span class="status">video</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=kLQAlzgwmy0" target="_blank" rel="noopener noreferrer">YouTube</a></div></div><div class="evidence"><div class="evidence-top"><strong>Block 2</strong><span class="status">video</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=f-JZfMoHh1I" target="_blank" rel="noopener noreferrer">YouTube</a></div></div><div class="evidence"><div class="evidence-top"><strong>Block 3</strong><span class="status">video</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=6s6843Mq5MA" target="_blank" rel="noopener noreferrer">YouTube</a></div></div><div class="evidence"><div class="evidence-top"><strong>Full title sequence / credits</strong><span class="status">credits</span></div><div class="evidence-links"><a href="https://www.youtube.com/watch?v=tIGlLDpzQ7E" target="_blank" rel="noopener noreferrer">YouTube</a></div></div></div>'''
          set_section('en/audiovisual/index.html','meia-noite','''<section id="meia-noite" class="chapter"><h2>2006 — Meia-Noite e Uns</h2><p><strong>Meia-Noite e Uns</strong> was a pop-literature television program broadcast by RedeTV! and hosted by Soninha Francine. Marcelo Nicchio served as <strong>Artistic Director</strong> and <strong>Executive Producer</strong> alongside <strong>Cristiano Gonçalves</strong>, through <strong>Dreamsnetwork.tv</strong>.</p><p>Nicchio created the artistic and visual concept and the narrative structure. Paulão de Carvalho took part in the writing and co-presented the program at Nicchio's invitation; the theme music was written and produced with Fábio “Badi” Crepaldi.</p><p>The intended title was originally <strong>Meia-Noite e Um</strong> (“12:01 a.m.”), linked to a blog of the same name and the idea of starting one minute after midnight. Because the exact minute could not be guaranteed in the schedule, the title became <strong>Meia-Noite e Uns</strong>.</p>''' + meia_videos_en + card('/assets/archive/dreamsnetwork-card-2006.webp','DreamsNetwork card identifying Marcelo Nicchio as Executive Producer.','DreamsNetwork · Executive Producer','Open record') + '''</section>''')

          # Communication PT/EN — direct authored history.
          set_section('pt/comunicacao/index.html','bbs','''<section id="bbs" class="chapter"><h2>Primeiros textos em ambiente digital</h2><p>Em 1993, Nicchio manteve uma coluna cultural na <strong>Tremonte BBS</strong>. O episódio pertence a uma fase em que escrita, curadoria cultural e ambientes digitais já se misturavam.</p></section>''')
          repl('pt/comunicacao/index.html','Segundo sua biografia, o programa era exibido de segunda a sexta, das 20h às 22h, e permaneceu no ar por aproximadamente 18 a 19 meses.','O programa era exibido de segunda a sexta, das 20h às 22h, e permaneceu no ar por aproximadamente 18 a 19 meses.')
          repl('pt/comunicacao/index.html','<div class="callout"><strong>Fonte externa + arquivo físico</strong><p>O site oficial da Folha preserva o texto e a identificação; os scans pessoais preservam capa, diagramação e contexto visual da edição impressa.</p></div>','')
          repl('pt/comunicacao/index.html','Esse corpus é um dos melhores elos documentais entre crítica cultural e cultura digital: ele mostra, em material contemporâneo, que tecnologia já era assunto editorial antes da especialização profissional em Search.','Esse corpus conecta crítica cultural e cultura digital e mostra como tecnologia já era assunto editorial antes da especialização profissional em Search.')

          set_section('en/communication/index.html','bbs','''<section id="bbs" class="chapter"><h2>Early writing in digital environments</h2><p>In 1993, Nicchio maintained a cultural column on <strong>Tremonte BBS</strong>, during a phase in which writing, cultural curation and digital environments were already beginning to overlap.</p></section>''')
          repl('en/communication/index.html','According to his biography, the program ran Monday through Friday from 8 p.m. to 10 p.m. and remained on air for approximately 18 to 19 months.','The program ran Monday through Friday from 8 p.m. to 10 p.m. and remained on air for approximately 18 to 19 months.')
          repl('en/communication/index.html','<div class="callout"><strong>External source + physical archive</strong><p>Folha’s official site preserves the text and identification; personal scans preserve the cover, layout and visual context of the printed edition.</p></div>','')
          repl('en/communication/index.html','This corpus is one of the clearest documentary links between cultural criticism and digital culture: it shows, in contemporary material, that technology was already an editorial subject before Search became a professional specialization.','This corpus directly connects cultural criticism and digital culture, showing how technology was already an editorial subject before Search became a professional specialization.')

          # Music — keep authorship/legal precision, drop defensive autobiographical phrasing.
          repl('pt/musica/index.html','passando pela bateria de escola de samba e, segundo seu relato biográfico, por formação musical no Conservatório Antonino Simalha.','passando pela bateria de escola de samba e por formação musical no Conservatório Antonino Simalha.')
          repl('pt/musica/index.html','Segundo Nicchio, parte relevante do repertório possui cadastros de obras no ecossistema <strong>ABRAMUS/ECAD</strong>. O acesso à conta ABRAMUS está atualmente em processo de regularização, portanto o hub ainda não usa esse catálogo como fonte pública consolidada obra a obra.','Parte relevante do repertório possui cadastros de obras no ecossistema <strong>ABRAMUS/ECAD</strong>. A consulta obra a obra será incorporada quando o acesso à conta ABRAMUS estiver regularizado.')
          repl('en/music/index.html','passing through samba-school percussion and, according to his biographical account, formal music study at Conservatório Antonino Simalha.','passing through samba-school percussion and formal music study at Conservatório Antonino Simalha.')
          repl('en/music/index.html','According to Nicchio, a significant part of the repertoire has work registrations in the <strong>ABRAMUS/ECAD</strong> ecosystem. Access to the ABRAMUS account is currently being regularized, so the hub does not yet use that catalogue as a consolidated public source work by work.','A significant part of the repertoire has work registrations in the <strong>ABRAMUS/ECAD</strong> ecosystem. Work-by-work catalogue links will be incorporated once access to the ABRAMUS account is regularized.')

          Path('.editorial-tone-cleanup').unlink(missing_ok=True)
          PY

          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adopt autobiographical editorial tone"
          git push origin editorial-inline-archive
