name: Temporary Full Biography rich summaries

on:
  push:
    branches: [work/fullbio-rich-summaries-1]
    paths:
      - '.tmp-fullbio-rich-summaries.py'
      - '.github/workflows/_tmp-fullbio-rich-summaries.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/fullbio-rich-summaries-1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow beautifulsoup4
          mkdir -p /tmp/reader-ux-smoke
          npm install --prefix /tmp/reader-ux-smoke --no-save playwright-core
      - name: Apply rollout
        run: python .tmp-fullbio-rich-summaries.py
      - name: Audit Reader loader sync
        run: python tools/sync_reader_disclosure_loader.py --check
      - name: Audit Full Biography sync and coverage
        run: |
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
      - name: Audit entry registry
        run: python tools/audit_entries.py
      - name: Audit Media and Culture open-state fusion
        run: python tools/audit_media_culture_fusion.py
      - name: Audit PT EN editorial parity
        run: python tools/editorial_parity.py --check
      - name: Check Reader JavaScript syntax
        run: |
          node --check assets/js/reader-disclosure-loader.js
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_reader_ux.js
      - name: Smoke-test Reader UX in Chrome
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/reader-ux-smoke/node_modules/playwright-core
        run: node tools/smoke_reader_ux.js
      - name: Audit HTML and sitemap
        run: python tools/audit_site.py
      - name: Commit rollout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Add Full Biography rich summaries for dense entries'
          git push origin HEAD:work/fullbio-rich-summaries-1
