name: Dave refresh MP3 sitemap
on:
  push:
    branches:
      - dave/music-mp3-image-2026-09-17
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dave/music-mp3-image-2026-09-17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate canonical sitemap
        run: python tools/build_sitemap.py
      - name: Verify sitemap freshness
        run: python tools/build_sitemap.py --check
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/dave-mp3-sitemap-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh sitemap after MP3 media update"
          git push origin HEAD:dave/music-mp3-image-2026-09-17
