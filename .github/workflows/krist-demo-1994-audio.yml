name: Krist demo audio patch

on:
  push:
    branches:
      - feat/music-demo-1994-audio

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/music-demo-1994-audio
          fetch-depth: 0
      - run: python -m pip install beautifulsoup4
      - run: python tools/krist_demo_audio_patch.py
      - run: python tools/sync_full_biography.py
      - run: python tools/krist_demo_audio_patch.py --guard
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html styles.css
          if git diff --cached --quiet; then
            echo "No integration diff produced"
            exit 0
          fi
          git commit -m "feat: add preserved 1994 demo audio players"
          git push origin HEAD:feat/music-demo-1994-audio
