name: Temporary Full Biography sync

on:
  push:
    branches:
      - work/melissa-entry

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/melissa-entry
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Generate Full Biography
        run: python tools/sync_full_biography.py
      - name: Commit generated pages
        shell: bash
        run: |
          if git diff --quiet -- pt/biografia/index.html en/biography/index.html; then
            echo "Full Biography already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/biografia/index.html en/biography/index.html
          git commit -m "Sync Full Biography after Melissa update"
          git push origin HEAD:work/melissa-entry
