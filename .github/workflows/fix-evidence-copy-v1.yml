name: Fix evidence copy v1

on:
  push:
    branches: [archive-evidence-v1]
    paths:
      - '.fix-evidence-copy-v1'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-evidence-v1
      - name: Fix copy and audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pt/audiovisual/index.html')
          s = p.read_text(encoding='utf-8')
          if 'corroboracão' not in s:
              raise RuntimeError('Expected typo not found')
          p.write_text(s.replace('corroboracão', 'corroboração', 1), encoding='utf-8')
          PY
          rm -f .fix-evidence-copy-v1
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix historical evidence copy"
          git push origin archive-evidence-v1
