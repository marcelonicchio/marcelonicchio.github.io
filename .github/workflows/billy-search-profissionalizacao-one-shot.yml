name: Billy Search profissionalizacao one-shot

on:
  push:
    branches:
      - billy/search-profissionalizacao-louise-2026-09-07
    paths:
      - .github/workflows/billy-search-profissionalizacao-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install sync dependency
        run: python -m pip install beautifulsoup4
      - name: Apply chapter surgery
        run: |
          git mv assets/archive/internet/search_louisemartins_01.JPG assets/archive/internet/search_louisemartins_01.jpg
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          configs = {
              Path('pt/internet/index.html'): {
                  'title': '2008–2009 — Profissionalização em Search',
                  'louise_alt': 'Página da revista INFO nº 269, de julho de 2008, com Louise Martins na reportagem “Com a grife do Google”.',
                  'louise_caption': '<strong>INFO nº 269 · jul. 2008 — “Com a grife do Google”.</strong><span class="thread-media-note">Página da reportagem com Louise Martins, registro contemporâneo da comunidade de profissionais Google Advertising Professional — GAP.</span><a class="thread-media-open" href="/assets/archive/internet/search_louisemartins_01.jpg" target="_blank" rel="noopener noreferrer">Abrir imagem em tamanho maior ↗</a>',
                  'louise_aria': 'Abrir a página da INFO com Louise Martins em tamanho maior',
              },
              Path('en/internet/index.html'): {
                  'title': '2008–2009 — Professionalization in Search',
                  'louise_alt': 'Page from INFO magazine no. 269, July 2008, featuring Louise Martins in the article “Com a grife do Google”.',
                  'louise_caption': '<strong>INFO no. 269 · Jul. 2008 — “Com a grife do Google”.</strong><span class="thread-media-note">Page from the article featuring Louise Martins, a contemporary record of the Google Advertising Professional — GAP community.</span><a class="thread-media-open" href="/assets/archive/internet/search_louisemartins_01.jpg" target="_blank" rel="noopener noreferrer">Open full-size image ↗</a>',
                  'louise_aria': 'Open the INFO page featuring Louise Martins at full size',
              },
          }

          for path, cfg in configs.items():
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              section = soup.select_one('section#sem')
              if section is None:
                  raise SystemExit(f'#sem not found in {path}')
              h2 = section.find('h2', recursive=False)
              if h2 is None:
                  raise SystemExit(f'h2 not found in #sem for {path}')
              h2.clear()
              h2.append(cfg['title'])

              goobec_img = section.find('img', src='/assets/media/thread/goobec-class-2009.webp')
              if goobec_img is None:
                  raise SystemExit(f'Goobec image not found in {path}')
              goobec_figure = goobec_img.find_parent('figure')
              goobec_figure.extract()
              h2.insert_after(goobec_figure)

              info_link = section.find('a', href='https://datassette.org/revistas/info-informatica-revistas/info-exame-no-269')
              if info_link is None:
                  raise SystemExit(f'INFO link not found in {path}')
              info_p = info_link.find_parent('p')
              if info_p is None:
                  raise SystemExit(f'INFO paragraph not found in {path}')

              existing = section.find('img', src='/assets/archive/internet/search_louisemartins_01.jpg')
              if existing is not None:
                  existing.find_parent('figure').decompose()

              frag = BeautifulSoup(
                  f'<figure class="thread-media thread-media--linked">'
                  f'<a href="/assets/archive/internet/search_louisemartins_01.jpg" target="_blank" rel="noopener noreferrer" aria-label="{cfg["louise_aria"]}">'
                  f'<img src="/assets/archive/internet/search_louisemartins_01.jpg" width="608" height="800" loading="lazy" decoding="async" alt="{cfg["louise_alt"]}">'
                  f'</a><figcaption>{cfg["louise_caption"]}</figcaption></figure>',
                  'html.parser'
              )
              info_p.insert_after(frag.figure)

              path.write_text(str(soup), encoding='utf-8')
          PY
      - name: Synchronize Full Biography and sitemap
        run: |
          python tools/sync_full_biography.py
          python tools/build_sitemap.py
      - name: Validate requested state
        run: |
          python tools/sync_full_biography.py --check
          python tools/build_sitemap.py --check
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          checks = {
              Path('pt/internet/index.html'): ('2008–2009 — Profissionalização em Search', 'INFO nº 269'),
              Path('en/internet/index.html'): ('2008–2009 — Professionalization in Search', 'INFO no. 269'),
          }
          for path, (title, cap) in checks.items():
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              section = soup.select_one('section#sem')
              assert section.find('h2').get_text(' ', strip=True) == title
              figures = section.find_all('figure', recursive=False)
              assert figures, path
              assert figures[0].find('img', src='/assets/media/thread/goobec-class-2009.webp') is not None
              info = section.find('img', src='/assets/archive/internet/search_louisemartins_01.jpg')
              assert info is not None
              assert cap in info.find_parent('figure').get_text(' ', strip=True)
          assert Path('assets/archive/internet/search_louisemartins_01.jpg').exists()
          assert not Path('assets/archive/internet/search_louisemartins_01.JPG').exists()
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/billy-search-profissionalizacao-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: refine Search professionalization chapter and Louise Martins record'
          git push
