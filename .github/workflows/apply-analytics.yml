name: Apply Google Analytics

on:
  push:
    branches:
      - analytics-ga4-v1
    paths:
      - .github/workflows/apply-analytics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: analytics-ga4-v1
          fetch-depth: 0
      - name: Synchronize Google Analytics
        run: python tools/sync_analytics.py
      - name: Audit Google Analytics
        run: python tools/audit_analytics.py
      - name: Audit site
        run: python tools/audit_site.py
      - name: Audit presence
        run: python tools/audit_presence.py
      - name: Commit synchronized pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'pt/**/*.html' 'en/**/*.html'
          git commit -m "Install GA4 across the hub"
          git push origin HEAD:analytics-ga4-v1
