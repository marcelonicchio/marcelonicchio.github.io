name: Normalize brand home link

on:
  push:
    branches:
      - ux-logo-home
    paths:
      - tools/normalize_brand_home.py
      - .github/workflows/normalize-brand-home.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-logo-home
          fetch-depth: 0

      - name: Normalize brand links
        run: python tools/normalize_brand_home.py

      - name: Commit normalized HTML
        shell: bash
        run: |
          if git diff --quiet -- 'pt/**/*.html' 'en/**/*.html' 'pt/index.html' 'en/index.html'; then
            echo "No HTML changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'pt/**/*.html' 'en/**/*.html' 'pt/index.html' 'en/index.html'
          git commit -m "Make header brand return to root home"
          git push origin HEAD:ux-logo-home
