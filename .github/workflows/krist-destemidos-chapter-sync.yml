name: Krist Destemidos chapter sync
on:
  push:
    branches: [fix/destemidos-thread-layout]
    paths: ['.github/workflows/krist-destemidos-chapter-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/destemidos-thread-layout
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Regenerate Chapter Pages
        run: python tools/build_chapter_pages.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/krist-destemidos-chapter-sync.yml
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add -A
          git commit -m "chore: sync Destemidos standalone pages"
          git push origin HEAD:fix/destemidos-thread-layout
