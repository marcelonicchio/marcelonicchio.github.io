name: Temporary media gallery batch

on:
  push:
    branches:
      - work/media-gallery-batch-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tooling
        run: python -m pip install pillow beautifulsoup4
      - name: Prepare gallery registry, placeholders and Thread media
        run: python tools/temp_media_gallery_batch.py
      - name: Build responsive gallery derivatives
        run: python tools/build_gallery_media.py
      - name: Synchronize galleries into sources
        run: python tools/sync_galleries.py
      - name: Synchronize fragment-backed entries
        run: python tools/sync_entries.py
      - name: Generate Chapter Pages
        run: python tools/build_chapter_pages.py
      - name: Synchronize Full Biography
        run: python tools/sync_full_biography.py
      - name: Validate generated media and content
        run: |
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/sync_entries.py --check
          python tools/build_chapter_pages.py --check
          python tools/sync_full_biography.py --check
          python tools/audit_galleries.py
          python tools/audit_entries.py
      - name: Remove temporary helpers
        run: rm -f tools/temp_media_gallery_batch.py .github/workflows/temp-media-gallery-batch.yml
      - name: Commit final batch
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add -A
          git commit -m "Add entry media galleries and Thread images"
          git push
