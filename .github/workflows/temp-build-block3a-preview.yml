name: Temporary Block 3A visual preview

on:
  push:
    branches: [preview-block3a]

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-block3a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build browser-renderable preview pages
        run: |
          python - <<'PY'
          from pathlib import Path

          prefix = 'https://raw.githack.com/marcelonicchio/marcelonicchio.github.io/preview-block3a'
          pairs = [
              ('pt/internet/index.html', 'preview/internet.html'),
              ('pt/biografia/index.html', 'preview/biografia.html'),
          ]

          def rewrite(text):
              for attr in ('href', 'src', 'poster'):
                  text = text.replace(f'{attr}="/', f'{attr}="{prefix}/')
                  text = text.replace(f"{attr}='/", f"{attr}='{prefix}/")
              text = text.replace('srcset="/', f'srcset="{prefix}/')
              text = text.replace("srcset='/", f"srcset='{prefix}/")
              text = text.replace(', /assets/', f', {prefix}/assets/')
              text = text.replace(', /styles.css', f', {prefix}/styles.css')
              text = text.replace('<head>', '<head>\n  <meta name="robots" content="noindex,nofollow">', 1)
              return text

          for src, dst in pairs:
              out = Path(dst)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(rewrite(Path(src).read_text(encoding='utf-8')), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-build-block3a-preview.yml
          git add preview/internet.html preview/biografia.html
          git commit -m 'Build Block 3A visual preview'
          git push
