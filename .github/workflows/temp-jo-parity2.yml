name: Finalize Jô parity checkpoint
on:
  push:
    branches: [fix/jo-8-videos]
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Accept checkpoint
        run: |
          python tools/editorial_parity.py --accept music-programa-jo
          echo '--- git status ---'
          git status --short
          echo '--- registry entry ---'
          grep -A8 '"music-programa-jo"' data/editorial_parity.json || true
      - name: Commit registry and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/temp-jo-8-videos.yml .github/workflows/temp-jo-finalize.yml .github/workflows/temp-jo-repair.yml .github/workflows/temp-jo-fix4.yml .github/workflows/temp-jo-parity.yml .github/workflows/temp-jo-parity2.yml 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git commit -m "chore: accept Programa do Jô editorial parity checkpoint"
          git push
