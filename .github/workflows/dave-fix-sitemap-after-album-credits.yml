name: Dave Fix Sitemap After Album Credits

on:
  push:
    branches:
      - dave/fix-sitemap-after-album-credits-2026-09-17

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dave/fix-sitemap-after-album-credits-2026-09-17
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild sitemap
        run: |
          python tools/build_sitemap.py
          python tools/build_sitemap.py --check

      - name: Commit sitemap refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dave-fix-sitemap-after-album-credits.yml
          git add sitemap.xml
          git commit -m "chore: refresh sitemap after album credits"
          git push origin HEAD:dave/fix-sitemap-after-album-credits-2026-09-17
