name: Site audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, site-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: work/vipassana03-replace-crop
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow beautifulsoup4
          mkdir -p /tmp/reader-ux-smoke
          npm install --prefix /tmp/reader-ux-smoke --no-save playwright-core
      - name: Materialize Vipassana cropped reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/media/thread/vipassana02.png')
          dst = Path('assets/media/thread/vipassana03.jpg')
          img = Image.open(src).convert('RGB')
          if img.size != (1122, 1402):
              raise SystemExit(f'Unexpected vipassana02 dimensions: {img.size}')
          img = img.crop((0, 0, 1122, 817))

          target = 299000
          for quality in (94, 92, 90, 88, 86, 84, 82, 80):
              img.save(dst, 'JPEG', quality=quality, optimize=True, progressive=True)
              if dst.stat().st_size <= target:
                  break
          else:
              raise SystemExit('Could not compress vipassana03.jpg under 299 KB')

          print(f'vipassana03.jpg: {img.width}x{img.height}, {dst.stat().st_size} bytes')

          for path in [
              Path('content/full-biography/pt/spirituality-seeker.inc'),
              Path('content/full-biography/en/spirituality-seeker.inc'),
          ]:
              text = path.read_text(encoding='utf-8')
              if '/assets/media/thread/vipassana02.webp' not in text:
                  raise SystemExit(f'vipassana02 reference not found in {path}')
              text = text.replace('/assets/media/thread/vipassana02.webp', '/assets/media/thread/vipassana03.jpg')
              text = text.replace('height="1402" loading="lazy" src="/assets/media/thread/vipassana03.jpg" width="1122"', 'height="817" loading="lazy" src="/assets/media/thread/vipassana03.jpg" width="1122"')
              path.write_text(text, encoding='utf-8')
          PY
          python tools/editorial_parity.py --accept spirituality-seeker
          python tools/sync_full_biography.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/thread/vipassana03.jpg content/full-biography/pt/spirituality-seeker.inc content/full-biography/en/spirituality-seeker.inc data/editorial_parity.json pt/biografia/index.html en/biography/index.html
          if git diff --cached --quiet; then
            echo "Vipassana cropped reconstruction already materialized."
          else
            git commit -m "Use cropped Vipassana reconstruction"
            git push origin HEAD:work/vipassana03-replace-crop
          fi
      - name: Audit synchronized navigation
        run: python tools/sync_navigation.py --check
      - name: Audit gallery derivatives
        run: python tools/build_gallery_media.py --check
      - name: Audit synchronized galleries
        run: python tools/sync_galleries.py --check
      - name: Audit gallery registry and rendering
        run: python tools/audit_galleries.py
      - name: Audit intrinsic image dimensions
        run: python tools/audit_image_dimensions.py
      - name: Audit PT EN editorial parity
        run: python tools/editorial_parity.py --check
      - name: Audit neutral entry sources
        run: python tools/sync_entries.py --check
      - name: Audit synchronized Full Biography
        run: python tools/sync_full_biography.py --check
      - name: Audit Full Biography coverage
        run: python tools/audit_full_biography.py
      - name: Audit Reader rich-preview visual policy
        run: python tools/audit_reader_visual_policy.py
      - name: Audit Reader disclosure loader
        run: python tools/sync_reader_disclosure_loader.py --check
      - name: Audit generated Chapter Pages
        run: python tools/build_chapter_pages.py --check
      - name: Audit entry registry and rendering
        run: python tools/audit_entries.py
      - name: Audit Media and Culture fusion
        run: python tools/audit_media_culture_fusion.py
      - name: Check navigation/Reader/runtime JavaScript syntax
        run: |
          node --check assets/js/mobile-nav.js
          node --check assets/js/archive-lightbox.js
          node --check assets/js/reader-disclosure-loader.js
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_mobile_nav.js
          node --check tools/smoke_reader_ux.js
          node --check tools/smoke_reader_en_rich.js
          node --check tools/smoke_runtime_performance.js
      - name: Smoke-test mobile navigation in Chrome
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/reader-ux-smoke/node_modules/playwright-core
        run: node tools/smoke_mobile_nav.js
      - name: Smoke-test Reader UX in Chrome
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/reader-ux-smoke/node_modules/playwright-core
        run: |
          node tools/smoke_reader_ux.js
          node tools/smoke_reader_en_rich.js
      - name: Probe runtime performance and media in Chrome
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/reader-ux-smoke/node_modules/playwright-core
        run: node tools/smoke_runtime_performance.js
      - name: Report page image weight
        run: python tools/audit_page_weight.py
      - name: Audit generated sitemap freshness
        run: python tools/build_sitemap.py --check
      - name: Audit HTML, JSON and sitemap
        run: python tools/audit_site.py
      - name: Audit site-wide external presence
        run: python tools/audit_presence.py
      - name: Audit Google Analytics installation
        run: python tools/audit_analytics.py
