name: Site audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, site-v1]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media audit dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Audit synchronized navigation
        run: python tools/sync_navigation.py --check
      - name: Audit gallery derivatives
        run: python tools/build_gallery_media.py --check
      - name: Audit synchronized galleries
        run: python tools/sync_galleries.py --check
      - name: Audit gallery registry and rendering
        run: python tools/audit_galleries.py
      - name: Audit HTML, JSON and sitemap
        run: python tools/audit_site.py
      - name: Audit site-wide external presence
        run: python tools/audit_presence.py
      - name: Audit Google Analytics installation
        run: python tools/audit_analytics.py
