name: Site audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, site-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow beautifulsoup4
          mkdir -p /tmp/reader-ux-smoke
          npm install --prefix /tmp/reader-ux-smoke --no-save playwright-core
      - name: Materialize biography-only spirituality architecture
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'{path_str}: expected patch anchor not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Controlled vocabulary: preserve both common Portuguese spelling and the
          # traditional "Buddhismo" spelling as separate semantic chips.
          tags_path = Path('data/tags.json')
          tags = json.loads(tags_path.read_text(encoding='utf-8'))
          additions = [
              {"id": "meditation", "label": {"pt": "Meditação", "en": "Meditation"}},
              {"id": "vipassana", "label": {"pt": "Vipassana", "en": "Vipassana"}},
              {"id": "buddhism", "label": {"pt": "Budismo", "en": "Buddhism"}},
              {"id": "buddhismo", "label": {"pt": "Buddhismo", "en": "Buddhismo"}},
              {"id": "osho", "label": {"pt": "Osho", "en": "Osho"}},
              {"id": "mindfulness", "label": {"pt": "Mindfulness", "en": "Mindfulness"}},
          ]
          existing_tags = {item['id'] for item in tags['tags']}
          for item in additions:
              if item['id'] not in existing_tags:
                  tags['tags'].append(item)
          tags_path.write_text(json.dumps(tags, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Register a reusable biography-only entry: it has Full Biography as its
          # Reader surface, can own a Chapter Page, but has no thematic vertical.
          entries_path = Path('data/entries.json')
          registry = json.loads(entries_path.read_text(encoding='utf-8'))
          spirituality = {
              "id": "spirituality-seeker",
              "kind": "chapter",
              "domain": "context",
              "reader_scope": "biography-only",
              "date": {"pt": "2006–jan. 2007", "en": "2006–Jan. 2007"},
              "title": {"pt": "Espiritualidade — “O Buscador”", "en": "Spirituality — “The Seeker”"},
              "summary": {
                  "pt": "Entre 2004 e janeiro de 2007, Marcelo Nicchio atravessou uma fase intensa de busca espiritual: Osho, estudo do Buddhismo Theravada e da tradição tibetana, tomada de refúgio como Dhanadhammo e um retiro Vipassana de dez dias no Dhamma Santi, em Miguel Pereira (RJ).",
                  "en": "Between 2004 and January 2007, Marcelo Nicchio went through an intense period of spiritual searching: Osho, study of Theravada Buddhism and the Tibetan tradition, taking refuge as Dhanadhammo, and a ten-day Vipassana retreat at Dhamma Santi in Miguel Pereira, Rio de Janeiro."
              },
              "topic_ids": ["meditation", "vipassana", "buddhism", "buddhismo", "osho", "mindfulness"],
              "reader_presentation": {"state": "always-open"},
              "source": {
                  "kind": "fragment",
                  "pt_path": "content/full-biography/pt/spirituality-seeker.inc",
                  "en_path": "content/full-biography/en/spirituality-seeker.inc"
              },
              "reader_targets": {
                  "pt": [{"path": "pt/biografia/index.html", "selector": "#bio-spirituality-seeker"}],
                  "en": [{"path": "en/biography/index.html", "selector": "#bio-spirituality-seeker"}]
              },
              "chapter_page": {
                  "status": "pilot",
                  "indexing": "noindex,follow",
                  "pt_path": "pt/biografia/espiritualidade-o-buscador/index.html",
                  "en_path": "en/biography/spirituality-the-seeker/index.html",
                  "description": {
                      "pt": "Espiritualidade — “O Buscador”: Osho, Buddhismo Theravada, Dhanadhammo e o retiro Vipassana de Marcelo Nicchio no Dhamma Santi em 2007.",
                      "en": "Spirituality — “The Seeker”: Osho, Theravada Buddhism, Dhanadhammo and Marcelo Nicchio’s 2007 Vipassana retreat at Dhamma Santi."
                  }
              }
          }
          found = False
          for index, item in enumerate(registry['entries']):
              if item.get('id') == spirituality['id']:
                  registry['entries'][index] = spirituality
                  found = True
                  break
          if not found:
              insert_at = next(i for i, item in enumerate(registry['entries']) if item.get('id') == 'audiovisual-meia-noite') + 1
              registry['entries'].insert(insert_at, spirituality)
          entries_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # The Full Biography heading itself is the static permalink to the new page.
          replace_once(
              'content/full-biography/pt/spirituality-seeker.inc',
              '<section class="chapter"><h2>Espiritualidade — “O Buscador”</h2>',
              '<section class="chapter"><h2><a class="entry-title-permalink" href="/pt/biografia/espiritualidade-o-buscador/">Espiritualidade — “O Buscador”</a></h2>'
          )
          replace_once(
              'content/full-biography/en/spirituality-seeker.inc',
              '<section class="chapter"><h2>Spirituality — “The Seeker”</h2>',
              '<section class="chapter"><h2><a class="entry-title-permalink" href="/en/biography/spirituality-the-seeker/">Spirituality — “The Seeker”</a></h2>'
          )

          # Chapter Pages can now be parented directly by Full Biography, without a
          # synthetic thematic vertical. Biography-only full-section fragments are
          # unwrapped so the standalone H1 is not duplicated by the source H2.
          replace_once(
              'tools/build_chapter_pages.py',
              'from typing import Any\n\nfrom sync_analytics',
              'from typing import Any\n\nfrom bs4 import BeautifulSoup\n\nfrom sync_analytics'
          )
          replace_once(
              'tools/build_chapter_pages.py',
              '    "hai": {\n        "pt": ("IA/HAI", "/pt/ia-hai/"),\n        "en": ("AI/HAI", "/en/ai-hai/"),\n    },\n}',
              '    "hai": {\n        "pt": ("IA/HAI", "/pt/ia-hai/"),\n        "en": ("AI/HAI", "/en/ai-hai/"),\n    },\n    "context": {\n        "pt": ("Biografia Completa", "/pt/biografia/"),\n        "en": ("Full Biography", "/en/biography/"),\n    },\n}'
          )
          replace_once(
              'tools/build_chapter_pages.py',
              'def tag_labels(taxonomy: dict[str, Any]) -> dict[str, dict[str, str]]:\n    return {tag["id"]: tag["label"] for tag in taxonomy["tags"]}\n\n\ndef breadcrumbs',
              'def tag_labels(taxonomy: dict[str, Any]) -> dict[str, dict[str, str]]:\n    return {tag["id"]: tag["label"] for tag in taxonomy["tags"]}\n\n\ndef chapter_body(entry: dict[str, Any], lang: str) -> str:\n    source_rel = entry["source"][f"{lang}_path"]\n    raw = (ROOT / source_rel).read_text(encoding="utf-8").strip()\n    if entry.get("reader_scope") != "biography-only":\n        return raw\n    soup = BeautifulSoup(raw, "html.parser")\n    section = soup.find("section")\n    if section is None:\n        raise RuntimeError(f"{entry[\'id\']}:{lang}: biography-only source has no section")\n    heading = section.find("h2", recursive=False)\n    if heading is not None:\n        heading.decompose()\n    return section.decode_contents().strip()\n\n\ndef breadcrumbs'
          )
          replace_once(
              'tools/build_chapter_pages.py',
              '    source_rel = entry["source"][f"{lang}_path"]\n    body = (ROOT / source_rel).read_text(encoding="utf-8").strip()',
              '    body = chapter_body(entry, lang)'
          )
          replace_once(
              'tools/build_chapter_pages.py',
              '    topics_label = "Temas" if lang == "pt" else "Topics"\n    og = ""',
              '    topics_label = "Temas" if lang == "pt" else "Topics"\n    if entry.get("reader_scope") == "biography-only":\n        return_label = "Voltar à Biografia Completa" if lang == "pt" else "Back to Full Biography"\n        page_tools = f\'<div class="page-tools"><a href="{back_bio}{bio_anchor}">{html.escape(return_label)}</a></div>\'\n    else:\n        page_tools = (\n            f\'<div class="page-tools"><a href="{domain_path}">{html.escape(vertical_label)}</a>\'\n            f\'<a href="{back_bio}{bio_anchor}">{html.escape(full_bio_label)}</a></div>\'\n        )\n    og = ""'
          )
          replace_once(
              'tools/build_chapter_pages.py',
              '<div class="page-tools"><a href="{domain_path}">{html.escape(vertical_label)}</a><a href="{back_bio}{bio_anchor}">{html.escape(full_bio_label)}</a></div>',
              '{page_tools}'
          )

          # Neutral-fragment synchronization skips biography-only entries because they
          # intentionally have no thematic vertical authoring surface.
          replace_once(
              'tools/sync_entries.py',
              '        if entry.get("source", {}).get("kind") != "fragment":\n            continue\n        for lang in ("pt", "en"):',
              '        if entry.get("source", {}).get("kind") != "fragment":\n            continue\n        if entry.get("reader_scope") == "biography-only":\n            continue\n        for lang in ("pt", "en"):'
          )

          # Entry audit now knows the biography-only contract rather than weakening
          # vertical requirements globally.
          replace_once(
              'tools/audit_entries.py',
              'ALLOWED_READER_PRESENTATION = {"normal", "always-open", "featured"}\nMAX_READER_PREVIEW_CHARS',
              'ALLOWED_READER_PRESENTATION = {"normal", "always-open", "featured"}\nALLOWED_READER_SCOPES = {"vertical", "biography-only"}\nMAX_READER_PREVIEW_CHARS'
          )
          replace_once(
              'tools/audit_entries.py',
              '        if presentation_state not in ALLOWED_READER_PRESENTATION:\n            errors.append(f"{entry_id}: unsupported Reader presentation state {presentation_state!r}")\n\n        for lang in ("pt", "en"):',
              '        if presentation_state not in ALLOWED_READER_PRESENTATION:\n            errors.append(f"{entry_id}: unsupported Reader presentation state {presentation_state!r}")\n        reader_scope = entry.get("reader_scope", "vertical")\n        if reader_scope not in ALLOWED_READER_SCOPES:\n            errors.append(f"{entry_id}: unsupported Reader scope {reader_scope!r}")\n\n        for lang in ("pt", "en"):'
          )
          replace_once(
              'tools/audit_entries.py',
              '''        else:\n            targets = entry.get("reader_targets", {})\n            for lang in ("pt", "en"):\n                lang_targets = targets.get(lang, [])\n                if len(lang_targets) < 2:\n                    errors.append(f"{entry_id}:{lang}: expected vertical + Full Biography reader targets")\n                for target in lang_targets:\n                    try:\n                        select_one(target["path"], target["selector"], cache)\n                    except (FileNotFoundError, RuntimeError) as exc:\n                        errors.append(f"{entry_id}:{lang}: {exc}")\n''',
              '''        else:\n            targets = entry.get("reader_targets", {})\n            for lang in ("pt", "en"):\n                lang_targets = targets.get(lang, [])\n                biography_token = "/biografia/" if lang == "pt" else "/biography/"\n                if reader_scope == "biography-only":\n                    if len(lang_targets) != 1:\n                        errors.append(f"{entry_id}:{lang}: biography-only entries require exactly one Full Biography reader target")\n                    elif biography_token not in ("/" + lang_targets[0]["path"].strip("/") + "/"):\n                        errors.append(f"{entry_id}:{lang}: biography-only target must be Full Biography")\n                elif len(lang_targets) < 2:\n                    errors.append(f"{entry_id}:{lang}: expected vertical + Full Biography reader targets")\n                for target in lang_targets:\n                    try:\n                        select_one(target["path"], target["selector"], cache)\n                    except (FileNotFoundError, RuntimeError) as exc:\n                        errors.append(f"{entry_id}:{lang}: {exc}")\n'''
          )
          replace_once(
              'tools/audit_entries.py',
              '''        if source_kind == "fragment":\n            for lang in ("pt", "en"):\n                src_rel = source.get(f"{lang}_path")\n                src = ROOT / (src_rel or "")\n                if not src_rel or not src.exists():\n                    errors.append(f"{entry_id}:{lang}: missing fragment source {src_rel!r}")\n                    continue\n                verticals = [\n                    t for t in entry.get("reader_targets", {}).get(lang, [])\n                    if "/biografia/" not in f"/{t['path']}/" and "/biography/" not in f"/{t['path']}/"\n                ]\n                if len(verticals) != 1:\n                    errors.append(f"{entry_id}:{lang}: expected exactly one thematic vertical target")\n                    continue\n                vertical_path = ROOT / verticals[0]["path"]\n                if not vertical_path.exists():\n                    errors.append(f"{entry_id}:{lang}: missing thematic vertical {verticals[0]['path']}")\n                    continue\n                text = vertical_path.read_text(encoding="utf-8")\n                start = f"<!-- entry-source:{entry_id}:start -->"\n                end = f"<!-- entry-source:{entry_id}:end -->"\n                pattern = re.compile(re.escape(start) + r"\\s*(.*?)\\s*" + re.escape(end), re.S)\n                match = pattern.search(text)\n                if match is None:\n                    errors.append(f"{entry_id}:{lang}: thematic vertical is not managed by entry-source markers")\n                elif match.group(1).strip() != src.read_text(encoding="utf-8").strip():\n                    errors.append(f"{entry_id}:{lang}: thematic vertical body differs from neutral fragment")\n''',
              '''        if source_kind == "fragment":\n            for lang in ("pt", "en"):\n                src_rel = source.get(f"{lang}_path")\n                src = ROOT / (src_rel or "")\n                if not src_rel or not src.exists():\n                    errors.append(f"{entry_id}:{lang}: missing fragment source {src_rel!r}")\n                    continue\n                if reader_scope == "biography-only":\n                    source_doc = BeautifulSoup(src.read_text(encoding="utf-8"), "html.parser")\n                    if source_doc.find("section") is None:\n                        errors.append(f"{entry_id}:{lang}: biography-only fragment must contain a section")\n                    continue\n                verticals = [\n                    t for t in entry.get("reader_targets", {}).get(lang, [])\n                    if "/biografia/" not in f"/{t['path']}/" and "/biography/" not in f"/{t['path']}/"\n                ]\n                if len(verticals) != 1:\n                    errors.append(f"{entry_id}:{lang}: expected exactly one thematic vertical target")\n                    continue\n                vertical_path = ROOT / verticals[0]["path"]\n                if not vertical_path.exists():\n                    errors.append(f"{entry_id}:{lang}: missing thematic vertical {verticals[0]['path']}")\n                    continue\n                text = vertical_path.read_text(encoding="utf-8")\n                start = f"<!-- entry-source:{entry_id}:start -->"\n                end = f"<!-- entry-source:{entry_id}:end -->"\n                pattern = re.compile(re.escape(start) + r"\\s*(.*?)\\s*" + re.escape(end), re.S)\n                match = pattern.search(text)\n                if match is None:\n                    errors.append(f"{entry_id}:{lang}: thematic vertical is not managed by entry-source markers")\n                elif match.group(1).strip() != src.read_text(encoding="utf-8").strip():\n                    errors.append(f"{entry_id}:{lang}: thematic vertical body differs from neutral fragment")\n'''
          )

          # Tags are metadata, not disclosure controls. Biography-only always-open
          # chapters keep their chips visible while bypassing details/toggle markup.
          replace_once(
              'assets/js/reader-disclosure.js',
              '''    document.documentElement.classList.add('reader-disclosure-active');\n    const detailsForSection = new Map();\n\n    chapters.forEach((section) => {''',
              '''    document.documentElement.classList.add('reader-disclosure-active');\n    const detailsForSection = new Map();\n    const topicRowFor = (topicIds) => {\n      if (!topicIds.length) return null;\n      const row = document.createElement('div');\n      row.className = 'reader-disclosure__topics';\n      topicIds.forEach((id) => {\n        const label = tags.get(id)?.[language];\n        if (!label) return;\n        const chip = document.createElement('span');\n        chip.className = 'reader-disclosure__topic';\n        chip.textContent = label;\n        row.appendChild(chip);\n      });\n      return row.children.length ? row : null;\n    };\n\n    chapters.forEach((section) => {'''
          )
          replace_once(
              'assets/js/reader-disclosure.js',
              '''      const topicIds = entry?.topic_ids || [];\n      const alwaysOpenPaths = entry?.reader_presentation?.always_open_paths || [];''',
              '''      const topicIds = entry?.topic_ids || [];\n      const topicRow = topicRowFor(topicIds);\n      const alwaysOpenPaths = entry?.reader_presentation?.always_open_paths || [];'''
          )
          replace_once(
              'assets/js/reader-disclosure.js',
              '''      if (presentationState === 'always-open') {\n        section.classList.add('reader-always-open');\n        return;\n      }''',
              '''      if (presentationState === 'always-open') {\n        section.classList.add('reader-always-open');\n        if (entry?.reader_scope === 'biography-only' && topicRow) {\n          heading.insertAdjacentElement('afterend', topicRow);\n        }\n        return;\n      }'''
          )
          replace_once(
              'assets/js/reader-disclosure.js',
              '''      if (topicIds.length) {\n        const row = document.createElement('div');\n        row.className = 'reader-disclosure__topics';\n        topicIds.forEach((id) => {\n          const label = tags.get(id)?.[language];\n          if (!label) return;\n          const chip = document.createElement('span');\n          chip.className = 'reader-disclosure__topic';\n          chip.textContent = label;\n          row.appendChild(chip);\n        });\n        if (row.children.length) summary.appendChild(row);\n      }''',
              '''      if (topicRow) summary.appendChild(topicRow);'''
          )

          # Browser regression: the spirituality chapter must remain visibly open,
          # tagged, linked and free of expand/collapse controls.
          replace_once(
              'tools/smoke_reader_ux.js',
              '''  assert(await folhaBioOpen.locator('.reader-disclosure__collapse-button').count() === 0, 'Folhateen must not expose a bottom collapse action');\n  assert((await page.locator('#bio-internet-mirantte details.reader-disclosure').getAttribute('class')).includes('reader-disclosure--featured'), 'Mirantte is not featured in Full Bio');''',
              '''  assert(await folhaBioOpen.locator('.reader-disclosure__collapse-button').count() === 0, 'Folhateen must not expose a bottom collapse action');\n  const spiritualityBio = page.locator('#bio-spirituality-seeker');\n  assert(await spiritualityBio.getAttribute('data-reader-presentation') === 'always-open', 'Spirituality biography-only always-open state missing');\n  assert(await spiritualityBio.locator('details.reader-disclosure').count() === 0, 'Spirituality must not be wrapped in disclosure');\n  assert(await spiritualityBio.locator('.reader-disclosure__toggle').count() === 0, 'Spirituality must not expose a top toggle');\n  assert(await spiritualityBio.locator('.reader-disclosure__collapse-button').count() === 0, 'Spirituality must not expose a bottom collapse action');\n  assert(await spiritualityBio.locator('h2 > a.entry-title-permalink').getAttribute('href') === '/pt/biografia/espiritualidade-o-buscador/', 'Spirituality standalone permalink missing from Full Bio heading');\n  const spiritualityTopics = await spiritualityBio.locator('.reader-disclosure__topic').allInnerTexts();\n  ['Meditação', 'Vipassana', 'Budismo', 'Buddhismo', 'Osho', 'Mindfulness'].forEach((label) => assert(spiritualityTopics.includes(label), `Spirituality topic missing: ${label}`));\n  assert(await spiritualityBio.locator('img[src="/assets/media/thread/vipassana03.jpg"]').count() === 1, 'Spirituality cropped Vipassana reconstruction missing from always-open body');\n  assert((await page.locator('#bio-internet-mirantte details.reader-disclosure').getAttribute('class')).includes('reader-disclosure--featured'), 'Mirantte is not featured in Full Bio');'''
          )
          replace_once(
              'tools/smoke_reader_ux.js',
              '''  // IA/HAI preserves continuous reading: Melissa is the oldest/final chapter and stays fully open.\n  await page.goto(`${BASE}/pt/ia-hai/`, {waitUntil: 'networkidle'});''',
              '''  // Biography-only Chapter Page stays fully readable and carries the same controlled topics.\n  await page.goto(`${BASE}/pt/biografia/espiritualidade-o-buscador/`, {waitUntil: 'networkidle'});\n  assert(await page.locator('h1').innerText() === 'Espiritualidade — “O Buscador”', 'Spirituality standalone H1 incorrect');\n  assert(await page.locator('meta[name="robots"]').getAttribute('content') === 'noindex,follow', 'Spirituality standalone indexing changed without review');\n  const standaloneSpiritualityTopics = await page.locator('.entry-topic').allInnerTexts();\n  ['Meditação', 'Vipassana', 'Budismo', 'Buddhismo', 'Osho', 'Mindfulness'].forEach((label) => assert(standaloneSpiritualityTopics.includes(label), `Standalone spirituality topic missing: ${label}`));\n  assert((await page.locator('article.entry-page-body').innerText()).includes('Dhanadhammo'), 'Spirituality standalone page lost Dhanadhammo');\n  assert(await page.locator('img[src="/assets/media/thread/vipassana03.jpg"]').count() === 1, 'Spirituality standalone page lost cropped reconstruction');\n  assert(await page.locator('details.reader-disclosure').count() === 0, 'Standalone spirituality page must not initialize Reader disclosure');\n\n  // IA/HAI preserves continuous reading: Melissa is the oldest/final chapter and stays fully open.\n  await page.goto(`${BASE}/pt/ia-hai/`, {waitUntil: 'networkidle'});'''
          )

          # Document the reusable pattern for future autobiography-only chapters.
          replace_once(
              'docs/reader-presentation-policy.md',
              '## 4. Scroll principle\n',
              '''## 4. Biography-only chapters\n\nA Full Biography entry may become a registered `biography-only` chapter when it is editorially substantial enough to deserve controlled tags and/or a standalone Chapter Page but does not belong to a thematic vertical.\n\nFor these entries:\n\n- Full Biography remains the canonical Reader surface;\n- no synthetic thematic vertical is created merely to host the chapter;\n- `reader_scope: biography-only` explicitly relaxes the normal vertical + Full Biography target requirement;\n- an `always-open` biography-only chapter remains plain open HTML, with no expand/collapse controls;\n- controlled topic chips remain visible even when the chapter is always open;\n- standalone-page indexation remains an independent decision. Creating a URL does not automatically promote it to `index,follow`.\n\n**Espiritualidade — “O Buscador”** is the reference implementation of this pattern.\n\n## 5. Scroll principle\n'''
          )
          replace_once(
              'docs/reader-presentation-policy.md',
              '## 5. Regression gate\n',
              '## 6. Regression gate\n'
          )
          PY
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/editorial_parity.py --accept spirituality-seeker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json data/tags.json data/editorial_parity.json \
            content/full-biography/pt/spirituality-seeker.inc content/full-biography/en/spirituality-seeker.inc \
            tools/build_chapter_pages.py tools/sync_entries.py tools/audit_entries.py tools/smoke_reader_ux.js \
            assets/js/reader-disclosure.js docs/reader-presentation-policy.md \
            pt/biografia/index.html en/biography/index.html \
            pt/biografia/espiritualidade-o-buscador/index.html en/biography/spirituality-the-seeker/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Promote spirituality to biography-only chapter"
            git push origin HEAD:"$BRANCH"
          fi
      - name: Audit synchronized navigation
        run: python tools/sync_navigation.py --check
      - name: Audit gallery derivatives
        run: python tools/build_gallery_media.py --check
      - name: Audit synchronized galleries
        run: python tools/sync_galleries.py --check
      - name: Audit gallery registry and rendering
        run: python tools/audit_galleries.py
      - name: Audit intrinsic image dimensions
        run: python tools/audit_image_dimensions.py
      - name: Audit PT EN editorial parity
        run: python tools/editorial_parity.py --check
      - name: Audit neutral entry sources
        run: python tools/sync_entries.py --check
      - name: Audit synchronized Full Biography
        run: python tools/sync_full_biography.py --check
      - name: Audit Full Biography coverage
        run: python tools/audit_full_biography.py
      - name: Audit Reader rich-preview visual policy
        run: python tools/audit_reader_visual_policy.py
      - name: Audit Reader disclosure loader
        run: python tools/sync_reader_disclosure_loader.py --check
      - name: Audit generated Chapter Pages
        run: python tools/build_chapter_pages.py --check
      - name: Audit entry registry and rendering
        run: python tools/audit_entries.py
      - name: Audit Media and Culture fusion
        run: python tools/audit_media_culture_fusion.py
      - name: Check navigation/Reader/runtime JavaScript syntax
        run: |
          node --check assets/js/mobile-nav.js
          node --check assets/js/archive-lightbox.js
          node --check assets/js/reader-disclosure-loader.js
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_mobile_nav.js
