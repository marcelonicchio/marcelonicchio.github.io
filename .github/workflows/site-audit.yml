name: Site audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [site-v1]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit HTML, JSON and sitemap
        run: python tools/audit_site.py
