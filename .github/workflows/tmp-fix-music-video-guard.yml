name: TEMP Fix Music video guard

on:
  push:
    branches:
      - feat/video-media-wave1-music-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make standalone video count ignore navigation presence links
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-apply-music-video-standard.yml')
          text = path.read_text(encoding='utf-8')
          old = "              vids = [a for a in soup.find_all('a', href=True) if re.search(r'(youtube\\.com|youtu\\.be)', a.get('href',''), re.I)]\n"
          new = "              vids = [a for a in soup.find_all('a', href=True) if re.search(r'(youtube\\.com|youtu\\.be)', a.get('href',''), re.I) and not a.find_parent(class_='presence-panel') and not a.find_parent('header') and not a.find_parent('footer')]\n"
          if old not in text:
              raise RuntimeError('standalone video guard line not found exactly once')
          if text.count(old) != 1:
              raise RuntimeError(f'expected one standalone guard line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Standalone guard now excludes presence/header/footer links.')
          PY
      - name: Commit only the guard correction
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git rm -f .github/workflows/tmp-fix-music-video-guard.yml
          git add .github/workflows/tmp-apply-music-video-standard.yml
          git diff --cached --check
          git commit -m "chore: make Music media guard ignore presence links"
          git push origin HEAD:feat/video-media-wave1-music-20260914
