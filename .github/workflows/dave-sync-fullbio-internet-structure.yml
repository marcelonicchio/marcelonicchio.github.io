name: Dave Sync Full Bio Internet Structure

on:
  push:
    branches:
      - dave/internet-music-structure-2026-09-17

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dave/internet-music-structure-2026-09-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Harden Full Biography class isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/sync_full_biography.py')
          text = path.read_text(encoding='utf-8')
          old = 'classes = [cls for cls in section.get("class", []) if cls not in {"phase", "music-entry"}]'
          new = 'classes = [cls for cls in section.get("class", []) if cls not in {"phase", "music-entry", "internet-entry"}]'
          if old not in text:
              raise RuntimeError('Full Biography class-isolation anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate Full Biography and sitemap
        run: |
          python tools/sync_full_biography.py
          python tools/build_sitemap.py
      - name: Validate generated state
        run: |
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
          python tools/audit_internet_editorial_structure.py
          python tools/editorial_parity.py --check
          python tools/build_sitemap.py --check
          python - <<'PY'
          from pathlib import Path
          for rel in ('pt/biografia/index.html', 'en/biography/index.html'):
              text = Path(rel).read_text(encoding='utf-8')
              if 'internet-entry' in text:
                  raise SystemExit(f'{rel}: Internet-only layout class leaked into Full Biography')
          print('Full Biography does not contain Internet-only layout classes.')
          PY
          git diff --check
      - name: Commit generated state and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dave-sync-fullbio-internet-structure.yml
          git add -A
          git commit -m "fix: isolate Internet layout from Full Biography"
          git push origin HEAD:dave/internet-music-structure-2026-09-17
