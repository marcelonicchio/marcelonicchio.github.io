name: Dave BEST gallery title sync one-shot

on:
  push:
    branches:
      - dave/best-two-workshops-2026-09-16
    paths:
      - .github/workflows/dave-best-gallery-title-sync-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install sync dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4 Pillow
      - name: Align BEST gallery caption with official workshop title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/galleries.json')
          text = p.read_text(encoding='utf-8')
          old = "BEST Blog — November 14, 2014 post about the ‘Facebook Ads: Best Practices, Better Conversion’ workshop held on November 12, 2014 at E-Commerce Brasil."
          new = "BEST Blog — November 14, 2014 post about the ‘Facebook Ads: Melhores Práticas, Melhor Conversão’ workshop held on November 12, 2014 at E-Commerce Brasil."
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old BEST gallery caption, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Synchronize gallery and derived surfaces
        run: |
          python tools/sync_galleries.py
          python tools/sync_entries.py
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/editorial_parity.py --accept internet-best
          python tools/build_sitemap.py
      - name: Validate synchronized state
        run: |
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/audit_galleries.py
          python tools/audit_image_dimensions.py
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/editorial_parity.py --check
          python tools/build_sitemap.py --check
      - name: Remove one-shot machinery and commit result
        run: |
          rm .github/workflows/dave-best-gallery-title-sync-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align BEST gallery caption with official workshop title'
          git push
