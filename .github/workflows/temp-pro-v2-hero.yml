name: Temporary PRO v2 hero

on:
  push:
    branches:
      - work/pro-v2-hero

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/pro-v2-hero
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editorial dependencies
        run: python -m pip install beautifulsoup4
      - name: Add PRO v2 conceptual image
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "pt/ia-hai/index.html": (
                  '<section id="pro2" class="chapter"><h2>Punk Rock Orchestra v2 — fechamento do ciclo</h2><p>O <strong>PRO v2</strong> está em desenvolvimento e é tratado por Nicchio como a versão definitiva dessa pesquisa específica e o fechamento do ciclo iniciado com Melissa 1.0.</p></section>',
                  '<section id="pro2" class="chapter"><h2>Punk Rock Orchestra v2 — fechamento do ciclo</h2><p>O <strong>PRO v2</strong> está em desenvolvimento e é tratado por Nicchio como a versão definitiva dessa pesquisa específica e o fechamento do ciclo iniciado com Melissa 1.0.</p>\n<figure class="thread-media"><a href="/assets/media/thread/thepunkrockorchestra_V2_1000x500_300kb.jpg" target="_blank" rel="noopener noreferrer"><img src="/assets/media/thread/thepunkrockorchestra_V2_1000x500_300kb.jpg" loading="lazy" decoding="async" alt="Ilustração conceitual do Punk Rock Orchestra v2: um guitarrista punk no centro de uma grande orquestra clássica"></a><figcaption><strong>Punk Rock Orchestra v2</strong><span class="thread-media-note">Ilustração conceitual da versão em desenvolvimento. Imagem gerada por IA; não constitui registro ou evidência da pesquisa.</span></figcaption></figure></section>'
              ),
              "en/ai-hai/index.html": (
                  '<section id="pro2" class="chapter"><h2>Punk Rock Orchestra v2 — closing the cycle</h2><p><strong>PRO v2</strong> is currently in development and is treated by Nicchio as the definitive version of this specific research and the closing work of the cycle begun with Melissa 1.0.</p></section>',
                  '<section id="pro2" class="chapter"><h2>Punk Rock Orchestra v2 — closing the cycle</h2><p><strong>PRO v2</strong> is currently in development and is treated by Nicchio as the definitive version of this specific research and the closing work of the cycle begun with Melissa 1.0.</p>\n<figure class="thread-media"><a href="/assets/media/thread/thepunkrockorchestra_V2_1000x500_300kb.jpg" target="_blank" rel="noopener noreferrer"><img src="/assets/media/thread/thepunkrockorchestra_V2_1000x500_300kb.jpg" loading="lazy" decoding="async" alt="Conceptual illustration of Punk Rock Orchestra v2: a punk guitarist at the center of a large classical orchestra"></a><figcaption><strong>Punk Rock Orchestra v2</strong><span class="thread-media-note">Conceptual illustration of the version currently in development. AI-generated image; it is not a record or evidence of the research.</span></figcaption></figure></section>'
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one PRO v2 block in {filename}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Accept reviewed PT EN checkpoint
        run: python tools/editorial_parity.py --accept hai-pro2
      - name: Generate Full Biography
        run: python tools/sync_full_biography.py
      - name: Commit synchronized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "PRO v2 image already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/ia-hai/index.html en/ai-hai/index.html data/editorial_parity.json pt/biografia/index.html en/biography/index.html
          git commit -m "Add PRO v2 conceptual image"
          git push origin HEAD:work/pro-v2-hero
