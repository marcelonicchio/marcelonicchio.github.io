name: Benny clean Meu Querido Diario thread diff

on:
  push:
    branches:
      - benny/music-meu-querido-diario-thread

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Rebuild Music sources from main with minimal Thread insertion
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess

          image = '/assets/archive/music/coitado-do-proximo/1997-1998-meu-querido-diario/coitadodoproximo_00_estudioasas1997_300kb.jpg'
          specs = {
            'pt/musica/index.html': (
              '<figure class="thread-media thread-media--linked"><a aria-label="Abrir registro das gravações de Meu Querido Diário no Estúdio Asas em tamanho maior" href="'+image+'" rel="noopener noreferrer" target="_blank"><img alt="Registro das gravações de Meu Querido Diário no Estúdio Asas, em 1997." decoding="async" loading="lazy" src="'+image+'" width="1448" height="1086"/></a><figcaption><strong>Meu Querido Diário · Estúdio Asas · 1997.</strong><span class="thread-media-note">Registro das sessões de gravação do primeiro álbum do Coitado do Próximo no Estúdio Asas, em São Paulo.</span><a class="thread-media-open" href="'+image+'" rel="noopener noreferrer" target="_blank">Abrir imagem em tamanho maior ↗</a></figcaption></figure>'
            ),
            'en/music/index.html': (
              '<figure class="thread-media thread-media--linked"><a aria-label="Open the Meu Querido Diário recording-session image from Estúdio Asas at full size" href="'+image+'" rel="noopener noreferrer" target="_blank"><img alt="Record of the Meu Querido Diário recording sessions at Estúdio Asas in 1997." decoding="async" loading="lazy" src="'+image+'" width="1448" height="1086"/></a><figcaption><strong>Meu Querido Diário · Estúdio Asas · 1997.</strong><span class="thread-media-note">Record of the recording sessions for Coitado do Próximo’s first album at Estúdio Asas in São Paulo.</span><a class="thread-media-open" href="'+image+'" rel="noopener noreferrer" target="_blank">Open image at full size ↗</a></figcaption></figure>'
            )
          }
          start_marker = '<div class="phase" data-bio-key="music-album-1997">'
          next_marker = '<div class="phase" data-bio-key="music-festival-1998-1999">'
          for rel, figure in specs.items():
              text = subprocess.check_output(['git','show',f'origin/main:{rel}'], text=True)
              start = text.index(start_marker)
              end = text.index(next_marker, start)
              segment = text[start:end]
              if image in segment:
                  raise SystemExit(f'{rel}: image unexpectedly already in main')
              pos = segment.rfind('</div></div>')
              if pos < 0:
                  raise SystemExit(f'{rel}: phase closing not found')
              segment = segment[:pos] + figure + segment[pos:]
              Path(rel).write_text(text[:start] + segment + text[end:], encoding='utf-8')
          PY
      - name: Regenerate dependent surfaces
        run: |
          python tools/sync_navigation.py --check
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept music-album-1997
          python tools/build_sitemap.py
      - name: Commit clean diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html data/editorial_parity.json sitemap.xml
          git commit -m "fix: keep Meu Querido Diario Thread diff minimal"
          git push origin HEAD:benny/music-meu-querido-diario-thread
