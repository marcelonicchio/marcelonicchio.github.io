name: Benny fix Meu Querido Diario thread placement

on:
  push:
    branches:
      - benny/music-meu-querido-diario-thread

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Move thread figure into content column
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          root = Path('.')
          src = '/assets/archive/music/coitado-do-proximo/1997-1998-meu-querido-diario/coitadodoproximo_00_estudioasas1997_300kb.jpg'
          for rel in ('pt/musica/index.html', 'en/music/index.html'):
              path = root / rel
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              phase = soup.select_one("[data-bio-key='music-album-1997']")
              if phase is None:
                  raise SystemExit(f'{rel}: phase missing')
              figure = phase.find('figure', class_='thread-media')
              if figure is None or figure.find('img', src=src) is None:
                  raise SystemExit(f'{rel}: expected thread figure missing')
              divs = phase.find_all('div', recursive=False)
              if len(divs) < 2:
                  raise SystemExit(f'{rel}: expected phase-year and content div')
              content_div = divs[1]
              figure.extract()
              content_div.append(figure)
              path.write_text(str(soup), encoding='utf-8')
          PY
      - name: Synchronize Full Biography and parity
        run: |
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept music-album-1997
          python tools/build_sitemap.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html data/editorial_parity.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: place Meu Querido Diario thread image in content column"
          git push origin HEAD:benny/music-meu-querido-diario-thread
