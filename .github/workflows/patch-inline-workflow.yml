name: Patch inline editorial workflow

on:
  push:
    branches: [editorial-inline-archive]
    paths:
      - '.patch-inline-workflow'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-inline-archive
      - name: Patch retry and trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/editorial-inline-archive.yml')
          s = p.read_text(encoding='utf-8')
          old = "replace_once('en/internet/index.html', '<p>Several photographs with the PSINet team survive in the personal archive. They can provide visual context, but will not be presented as proof of role, scope or results beyond what the images themselves show.</p>', '')"
          new = "replace_once('en/internet/index.html', '<p>A small number of photographs with the PSINet team survive in the personal archive. They may serve as contextual visual documentation but will not be presented as proof of job title, scope or results beyond what the images themselves support.</p>', '')"
          if old not in s:
              raise RuntimeError('Patch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.editorial-inline-archive').write_text('run2\n', encoding='utf-8')
          Path('.patch-inline-workflow').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch inline editorial migration"
          git push origin editorial-inline-archive
