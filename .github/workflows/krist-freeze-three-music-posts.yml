name: Krist freeze three music posts

on:
  push:
    branches: [feat/music-cdp-hierarchy-limonada]
    paths:
      - 'tools/_krist_freeze_three_music_posts.py'
      - '.github/workflows/krist-freeze-three-music-posts.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/music-cdp-hierarchy-limonada
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Lock three posts open
        run: python tools/_krist_freeze_three_music_posts.py
      - name: Verify Full Biography remains synchronized
        run: |
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
          python tools/audit_entries.py
      - name: Remove temporary files
        run: |
          rm tools/_krist_freeze_three_music_posts.py
          rm .github/workflows/krist-freeze-three-music-posts.yml
      - name: Commit permanent state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: keep three music chronology posts always open"
          git push
