name: Dave Phase 2 Chapter Pages

on:
  push:
    branches:
      - dave/phase2-chapter-pages-2026-09-17

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dave/phase2-chapter-pages-2026-09-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 Pillow
      - name: Promote selected entries
        run: python tools/_phase2_promote_pages.py
      - name: Synchronize canonical sources and Full Biography
        run: |
          python tools/sync_entries.py
          python tools/sync_full_biography.py
      - name: Accept jointly reviewed PT EN structural checkpoints
        run: |
          for id in \
            music-demo-tape-1994 \
            music-album-1997 \
            audiovisual-homens \
            music-festival-1998-1999 \
            music-album-1999-2000 \
            internet-psinet \
            music-programa-jo \
            communication-sinal-verde \
            internet-sem \
            internet-clickland \
            internet-petlove \
            hai-pro1 \
            hai-pro2; do
            python tools/editorial_parity.py --accept "$id"
          done
      - name: Generate Chapter Pages and sitemap
        run: |
          python tools/build_chapter_pages.py
          python tools/build_sitemap.py
      - name: Validate Phase 2 architecture
        run: |
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/editorial_parity.py --check
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
          python tools/audit_full_biography.py
          python tools/build_sitemap.py --check
          python tools/audit_site.py
      - name: Commit migration and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/_phase2_promote_pages.py .github/workflows/dave-phase2-promote-pages.yml
          git add -A
          git commit -m "feat: promote phase 2 entries to chapter pages"
          git push origin HEAD:dave/phase2-chapter-pages-2026-09-17
