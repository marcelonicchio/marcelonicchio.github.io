name: Review context entries with PT EN parity

on:
  push:
    branches: [full-biography-parity-stop]

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: full-biography-parity-stop
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Humanize authorship and research identity in PT and EN
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'pt/musica/index.html': [
              (
                '<p>Parte relevante do repertório possui cadastros de obras no ecossistema <strong>ABRAMUS/ECAD</strong>. A consulta obra a obra será incorporada quando o acesso à conta ABRAMUS estiver regularizado.</p><p>Cadastro de repertório e crédito autoral não serão descritos como “registro de copyright” em sentido jurídico. Enquanto a conferência na ABRAMUS não estiver concluída, créditos públicos em plataformas de música e materiais de encarte poderão servir como fontes complementares.</p>',
                '<p>Parte relevante do repertório do <strong>Coitado do Próximo</strong> possui cadastros de obras no ecossistema <strong>ABRAMUS/ECAD</strong>. A consulta obra a obra será incorporada ao arquivo conforme essa catalogação avançar.</p>'
              )
            ],
            'en/music/index.html': [
              (
                '<p>According to Nicchio, a significant part of the repertoire has work entries in the <strong>ABRAMUS/ECAD</strong> ecosystem. Access to the ABRAMUS account is currently being restored, so the hub does not yet use that catalogue as a fully consolidated public source on a work-by-work basis.</p><p>Repertoire listings and authorship credits will not be described as formal copyright registration in the legal sense. Until the ABRAMUS catalogue is checked, public music-platform credits and surviving liner material may serve as complementary sources.</p>',
                '<p>A significant part of <strong>Coitado do Próximo</strong>’s repertoire has work entries in the <strong>ABRAMUS/ECAD</strong> ecosystem. Work-by-work references will be incorporated into the archive as that cataloguing advances.</p>'
              )
            ],
            'pt/ia-hai/index.html': [
              (
                '<p>O identificador ORCID de Marcelo Nicchio é <strong>0009-0002-5626-8973</strong>. O objetivo do hub é manter consistência entre nome, títulos, versões e links em ORCID, HAL, Zenodo, OSF, SSRN, PubPub e GitHub.</p>',
                '<p>O identificador ORCID de Marcelo Nicchio é <strong>0009-0002-5626-8973</strong>. Seus trabalhos e perfis de pesquisa mantêm presença pública em ORCID, HAL, Zenodo, OSF, SSRN, PubPub e GitHub.</p>'
              )
            ],
            'en/ai-hai/index.html': [
              (
                '<p>Marcelo Nicchio\'s ORCID is <strong>0009-0002-5626-8973</strong>. The hub aims to keep name, titles, versions and links consistent across ORCID, HAL, Zenodo, OSF, SSRN, PubPub and GitHub.</p>',
                '<p>Marcelo Nicchio\'s ORCID is <strong>0009-0002-5626-8973</strong>. His research works and profiles have a public presence across ORCID, HAL, Zenodo, OSF, SSRN, PubPub and GitHub.</p>'
              )
            ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Prove parity gate detects source drift
        run: |
          if python tools/editorial_parity.py --check; then
            echo "Parity audit unexpectedly passed after source edits"
            exit 1
          else
            echo "Parity gate correctly detected unaccepted PT/EN editorial drift"
          fi
      - name: Accept jointly reviewed revisions
        run: |
          python tools/editorial_parity.py --accept music-authorship
          python tools/editorial_parity.py --accept hai-identity
      - name: Regenerate Full Biography
        run: python tools/sync_full_biography.py
      - name: Audit editorial parity
        run: python tools/editorial_parity.py --check
      - name: Audit Full Biography coverage
        run: python tools/audit_full_biography.py
      - name: Audit navigation
        run: python tools/sync_navigation.py --check
      - name: Audit gallery derivatives
        run: python tools/build_gallery_media.py --check
      - name: Audit gallery sync
        run: python tools/sync_galleries.py --check
      - name: Audit galleries
        run: python tools/audit_galleries.py
      - name: Audit site
        run: python tools/audit_site.py
      - name: Audit presence
        run: python tools/audit_presence.py
      - name: Audit analytics
        run: python tools/audit_analytics.py
      - name: Commit reviewed context revisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/ia-hai/index.html en/ai-hai/index.html data/editorial_parity.json pt/biografia/index.html en/biography/index.html
          git commit -m "Humanize authorship and research identity context"
          git push origin HEAD:full-biography-parity-stop
