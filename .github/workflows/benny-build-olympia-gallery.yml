name: Benny build Olympia 2000 gallery

on:
  push:
    branches:
      - benny/music-olympia-2000-gallery

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Register Olympia gallery and insert placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          gallery_id = 'olympia-2000'
          source_root = 'assets/archive/music/coitado-do-proximo/2000-olympia'
          sources = [
              'coitadodoproximo_00_olympia00.jpg',
              'coitadodoproximo_00_olympia01.jpg',
              'coitadodoproximo_00_olympia02.jpg',
              'coitadodoproximo_00_olympia03.jpg',
              'coitadodoproximo_00_olympia04.jpg',
              'coitadodoproximo_00_olympia05.jpg',
          ]

          missing = [name for name in sources if not (ROOT / source_root / name).exists()]
          if missing:
              raise SystemExit(f'Missing Olympia source files: {missing}')

          reg_path = ROOT / 'data/galleries.json'
          data = json.loads(reg_path.read_text(encoding='utf-8'))
          if any(g.get('id') == gallery_id for g in data.get('galleries', [])):
              raise SystemExit(f'Gallery {gallery_id} already exists')

          items = []
          for index, source in enumerate(sources, 1):
              items.append({
                  'id': f'{index:02d}',
                  'source': source,
                  'caption': {
                      'pt': f'Coitado do Próximo no Olympia, São Paulo, 25 jun. 2000 — foto {index}.',
                      'en': f'Coitado do Próximo at Olympia, São Paulo, 25 Jun. 2000 — photo {index}.'
                  }
              })

          data['galleries'].append({
              'id': gallery_id,
              'sourceRoot': source_root,
              'targets': {
                  'pt': ['pt/musica/index.html'],
                  'en': ['en/music/index.html']
              },
              'title': {
                  'pt': 'Fotos',
                  'en': 'Photos'
              },
              'items': items
          })
          data['updated'] = '2026-09-10'
          reg_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          placeholder = '<!-- gallery:olympia-2000 -->'
          phase_key = '<div class="phase" data-bio-key="music-olympia-2000">'
          next_phase_key = '<div class="phase" data-bio-key="music-jo-2001">'
          evidence = '<div class="evidence-links inline-links">'

          for rel in ('pt/musica/index.html', 'en/music/index.html'):
              path = ROOT / rel
              text = path.read_text(encoding='utf-8')
              if placeholder in text:
                  raise SystemExit(f'{rel}: Olympia gallery placeholder already exists')
              start = text.index(phase_key)
              end = text.index(next_phase_key, start)
              segment = text[start:end]

              # PT has preserved-video links inside the Olympia block; EN currently does not.
              insert_at = segment.find(evidence)
              if insert_at < 0:
                  insert_at = segment.rfind('</div></div>')
              if insert_at < 0:
                  raise SystemExit(f'{rel}: could not locate Olympia gallery insertion point')

              segment = segment[:insert_at] + placeholder + '\n' + segment[insert_at:]
              path.write_text(text[:start] + segment + text[end:], encoding='utf-8')
          PY
      - name: Build and synchronize gallery
        run: |
          python tools/build_gallery_media.py
          python tools/sync_galleries.py
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept music-olympia-2000
          python tools/build_sitemap.py
      - name: Commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/galleries.json data/editorial_parity.json assets/media/galleries/olympia-2000 pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No gallery changes to commit"
            exit 0
          fi
          git commit -m "feat: add Olympia 2000 photo gallery"
          git push origin HEAD:benny/music-olympia-2000-gallery
