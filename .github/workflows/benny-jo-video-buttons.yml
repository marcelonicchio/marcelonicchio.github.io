name: Benny Programa do Jo video buttons

on:
  push:
    branches:
      - benny/jo-backstage-video-buttons

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Add Programa do Jo backstage videos and high-contrast video buttons
        run: |
          python - <<'PY'
          from pathlib import Path

          pt_path = Path('pt/musica/index.html')
          en_path = Path('en/music/index.html')
          css_path = Path('styles.css')

          pt = pt_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          pt_old = '<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=4NKHy_C8wsI&t=8s" target="_blank" rel="noopener noreferrer">Programa do Jô — Estava Comigo ↗</a></div>'
          pt_new = '<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=4NKHy_C8wsI&t=8s" target="_blank" rel="noopener noreferrer">Programa do Jô — Estava Comigo ↗</a><a href="https://www.youtube.com/watch?v=cJT24XEmxxE" target="_blank" rel="noopener noreferrer">Bastidores — Vídeo 1 ↗</a><a href="https://www.youtube.com/watch?v=SIuiOgpGq8g" target="_blank" rel="noopener noreferrer">Bastidores — Vídeo 2 ↗</a><a href="https://youtu.be/MCjI0bA7CCc?si=k2paUz0x3WFi4rwm" target="_blank" rel="noopener noreferrer">Bastidores — Vídeo 3 · Passagem de som — A Enchente ↗</a><a href="https://youtu.be/zrXzdmsIMjg?si=si9xEgOO_oQGIT-B" target="_blank" rel="noopener noreferrer">Bastidores — Vídeo 4 · Passagem de som — Um Anjo do Céu ↗</a></div>'
          if pt.count(pt_old) != 1:
              raise SystemExit(f'PT Programa do Jô evidence block count: {pt.count(pt_old)}')
          pt = pt.replace(pt_old, pt_new, 1)

          en_marker = '<!-- gallery:programa-do-jo-2001:end -->\n</div></div>'
          en_repl = '<!-- gallery:programa-do-jo-2001:end -->\n<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=4NKHy_C8wsI&t=8s" target="_blank" rel="noopener noreferrer">Programa do Jô — Estava Comigo ↗</a><a href="https://www.youtube.com/watch?v=cJT24XEmxxE" target="_blank" rel="noopener noreferrer">Behind the scenes — Video 1 ↗</a><a href="https://www.youtube.com/watch?v=SIuiOgpGq8g" target="_blank" rel="noopener noreferrer">Behind the scenes — Video 2 ↗</a><a href="https://youtu.be/MCjI0bA7CCc?si=k2paUz0x3WFi4rwm" target="_blank" rel="noopener noreferrer">Behind the scenes — Video 3 · Soundcheck — A Enchente ↗</a><a href="https://youtu.be/zrXzdmsIMjg?si=si9xEgOO_oQGIT-B" target="_blank" rel="noopener noreferrer">Behind the scenes — Video 4 · Soundcheck — Um Anjo do Céu ↗</a></div>\n</div></div>'
          if en.count(en_marker) != 1:
              raise SystemExit(f'EN Programa do Jô gallery-end marker count: {en.count(en_marker)}')
          en = en.replace(en_marker, en_repl, 1)

          css_marker = '/* High-contrast video action buttons */'
          if css_marker in css:
              raise SystemExit('Video button CSS already exists')
          css_block = '''\n\n/* High-contrast video action buttons */\n.evidence-links a[href*="youtube.com"],\n.evidence-links a[href*="youtu.be"],\n.page-tools a[href*="youtube.com"],\n.page-tools a[href*="youtu.be"],\na.button[href*="youtube.com"],\na.button[href*="youtu.be"]{\n  background:var(--text);\n  color:var(--bg);\n  border-color:var(--text);\n  font-weight:800;\n  box-shadow:0 0 0 1px rgba(255,255,255,.08);\n  transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease;\n}\n.evidence-links a[href*="youtube.com"]::before,\n.evidence-links a[href*="youtu.be"]::before,\n.page-tools a[href*="youtube.com"]::before,\n.page-tools a[href*="youtu.be"]::before,\na.button[href*="youtube.com"]::before,\na.button[href*="youtu.be"]::before{\n  content:"▶";\n  color:var(--accent);\n  font-size:.76em;\n  line-height:1;\n}\n.evidence-links a[href*="youtube.com"]:hover,\n.evidence-links a[href*="youtu.be"]:hover,\n.page-tools a[href*="youtube.com"]:hover,\n.page-tools a[href*="youtu.be"]:hover,\na.button[href*="youtube.com"]:hover,\na.button[href*="youtu.be"]:hover{\n  opacity:1;\n  background:#fff;\n  color:#0a0a0b;\n  border-color:#fff;\n  transform:translateY(-1px);\n  box-shadow:0 4px 14px rgba(255,255,255,.12);\n}\n'''
          css += css_block

          pt_path.write_text(pt, encoding='utf-8')
          en_path.write_text(en, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Accept editorial parity and synchronize Full Biography
        run: |
          python tools/editorial_parity.py --accept music-programa-jo
          python tools/sync_full_biography.py
      - name: Verify
        run: |
          python tools/editorial_parity.py --check
          python tools/audit_full_biography.py
          python tools/sync_navigation.py --check
          grep -q 'Bastidores — Vídeo 4' pt/musica/index.html
          grep -q 'Behind the scenes — Video 4' en/music/index.html
          grep -q 'Bastidores — Vídeo 4' pt/biografia/index.html
          grep -q 'Behind the scenes — Video 4' en/biography/index.html
          grep -q 'High-contrast video action buttons' styles.css
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html data/editorial_parity.json
          git commit -m "feat: add Programa do Jo backstage videos and improve video buttons"
          git push origin HEAD:benny/jo-backstage-video-buttons
