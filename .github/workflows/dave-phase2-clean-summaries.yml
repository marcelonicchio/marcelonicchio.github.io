name: Dave Phase 2 Summary Cleanup

on:
  push:
    branches:
      - dave/phase2-chapter-pages-2026-09-17

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dave/phase2-chapter-pages-2026-09-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Normalize summaries and regenerate pages
        run: |
          python tools/_phase2_clean_summaries.py
          python tools/build_chapter_pages.py
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
          python tools/build_sitemap.py --check
      - name: Commit cleanup and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/_phase2_clean_summaries.py .github/workflows/dave-phase2-clean-summaries.yml
          git add -A
          git commit -m "fix: normalize Phase 2 chapter metadata"
          git push origin HEAD:dave/phase2-chapter-pages-2026-09-17
