name: Krist demo audio preload none

on:
  push:
    branches:
      - feat/music-demo-1994-audio

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/music-demo-1994-audio
          fetch-depth: 0
      - run: python -m pip install beautifulsoup4
      - name: Disable eager audio preload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('pt/musica/index.html'), Path('en/music/index.html')]:
              text = path.read_text(encoding='utf-8')
              count = text.count('class="audio-library__player" controls preload="metadata"')
              if count != 2:
                  raise SystemExit(f'{path}: expected 2 metadata players, found {count}')
              text = text.replace('class="audio-library__player" controls preload="metadata"', 'class="audio-library__player" controls preload="none"')
              path.write_text(text, encoding='utf-8')
          PY
      - run: python tools/sync_full_biography.py
      - run: python tools/editorial_parity.py --accept music-demo-tape-1994
      - name: Commit preload fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html data/editorial_parity.json
          git commit -m "fix: avoid eager demo audio preload"
          git push origin HEAD:feat/music-demo-1994-audio
