name: Benny add Barao 1992 media

on:
  push:
    branches:
      - benny/music-barao-1992-media

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Prepare Thread image and gallery registry
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json

          root = Path('assets/archive/music/coitado-do-proximo/1992-primeiro-show-barao-homem-de-mello')
          src = root / '1992_showbarao_thread_IA.jpg'
          dst = root / '1992_showbarao_thread_IA_300kb.jpg'
          if not src.exists():
              raise SystemExit(f'Missing Thread source: {src}')

          img = ImageOps.exif_transpose(Image.open(src)).convert('RGB')
          work = img
          limit = 300_000
          while True:
              saved = False
              for quality in range(92, 34, -3):
                  work.save(dst, 'JPEG', quality=quality, optimize=True, progressive=True)
                  if dst.stat().st_size <= limit:
                      saved = True
                      break
              if saved:
                  break
              nw = max(640, int(work.width * 0.88))
              nh = max(480, int(work.height * 0.88))
              if (nw, nh) == work.size:
                  raise SystemExit('Could not compress Thread image under 300 KB')
              work = work.resize((nw, nh), Image.Resampling.LANCZOS)
          tw, th = work.size
          print(f'Thread derivative: {tw}x{th}, {dst.stat().st_size} bytes')

          gallery_dir = root / 'galeria'
          expected = [gallery_dir / f'1992_showbarao_original_{i:02d}.jpg' for i in range(1, 6)]
          missing = [str(p) for p in expected if not p.exists()]
          if missing:
              raise SystemExit('Missing gallery files: ' + ', '.join(missing))

          registry_path = Path('data/galleries.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          gid = 'primeiro-show-barao-1992'
          if any(g.get('id') == gid for g in data['galleries']):
              raise SystemExit(f'Gallery already exists: {gid}')
          gallery = {
              'id': gid,
              'sourceRoot': str(gallery_dir).replace('\\', '/'),
              'targets': {
                  'pt': ['pt/musica/index.html'],
                  'en': ['en/music/index.html']
              },
              'title': {
                  'pt': 'Prints originais do vídeo',
                  'en': 'Original video frame captures'
              },
              'items': []
          }
          for i, path in enumerate(expected, 1):
              with Image.open(path) as im:
                  w, h = im.size
              gallery['items'].append({
                  'id': f'{i:02d}',
                  'source': path.name,
                  'caption': {
                      'pt': f'Primeiro show do Coitado do Próximo · 5 jul. 1992 — print original {i}.',
                      'en': f'Coitado do Próximo’s first show · Jul. 5, 1992 — original frame capture {i}.'
                  },
                  'width': w,
                  'height': h
              })
          data['galleries'].append(gallery)
          data['updated'] = '2026-09-10'
          registry_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pt_path = Path('pt/musica/index.html')
          en_path = Path('en/music/index.html')
          pt = pt_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')

          pt_anchor = '<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=7yjYTV1L0b0" target="_blank" rel="noopener noreferrer">1º show — abertura · 5 jul. 1992 ↗</a></div>'
          en_anchor = '<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=7yjYTV1L0b0" target="_blank" rel="noopener noreferrer">First show — opening · Jul. 5, 1992 ↗</a></div>'
          if pt.count(pt_anchor) != 1:
              raise SystemExit(f'PT evidence anchor count != 1: {pt.count(pt_anchor)}')
          if en.count(en_anchor) != 1:
              raise SystemExit(f'EN evidence anchor count != 1: {en.count(en_anchor)}')

          img_href = '/assets/archive/music/coitado-do-proximo/1992-primeiro-show-barao-homem-de-mello/1992_showbarao_thread_IA_300kb.jpg'
          pt_thread = (
              f'<figure class="thread-media thread-media--linked"><a aria-label="Abrir reconstrução ilustrativa por IA do primeiro show do Coitado do Próximo em tamanho maior" href="{img_href}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Reconstrução ilustrativa por IA do primeiro show do Coitado do Próximo, em 5 de julho de 1992." decoding="async" loading="lazy" src="{img_href}" width="{tw}" height="{th}"/></a>'
              '<figcaption><strong>Primeiro show do Coitado do Próximo · 5 jul. 1992.</strong>'
              '<span class="thread-media-note">Reconstrução ilustrativa feita por IA devido à baixa qualidade do vídeo original. Abaixo, estão disponíveis 5 prints originais do vídeo e o link para o registro original.</span>'
              f'<a class="thread-media-open" href="{img_href}" rel="noopener noreferrer" target="_blank">Abrir imagem em tamanho maior ↗</a></figcaption></figure>'
              '<!-- gallery:primeiro-show-barao-1992:start -->\n<!-- gallery:primeiro-show-barao-1992:end -->\n'
              '<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=7yjYTV1L0b0" target="_blank" rel="noopener noreferrer">Vídeo original do primeiro show · 5 jul. 1992 ↗</a></div>'
          )
          en_thread = (
              f'<figure class="thread-media thread-media--linked"><a aria-label="Open the illustrative AI reconstruction of Coitado do Próximo’s first show at full size" href="{img_href}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Illustrative AI reconstruction of Coitado do Próximo’s first show on July 5, 1992." decoding="async" loading="lazy" src="{img_href}" width="{tw}" height="{th}"/></a>'
              '<figcaption><strong>Coitado do Próximo’s first show · Jul. 5, 1992.</strong>'
              '<span class="thread-media-note">Illustrative AI reconstruction made because of the low quality of the original video. Below are 5 original frame captures from the video and a link to the original recording.</span>'
              f'<a class="thread-media-open" href="{img_href}" rel="noopener noreferrer" target="_blank">Open image at full size ↗</a></figcaption></figure>'
              '<!-- gallery:primeiro-show-barao-1992:start -->\n<!-- gallery:primeiro-show-barao-1992:end -->\n'
              '<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=7yjYTV1L0b0" target="_blank" rel="noopener noreferrer">Original first-show video · Jul. 5, 1992 ↗</a></div>'
          )
          pt = pt.replace(pt_anchor, pt_thread, 1)
          en = en.replace(en_anchor, en_thread, 1)
          pt_path.write_text(pt, encoding='utf-8')
          en_path.write_text(en, encoding='utf-8')
          PY
      - name: Build and synchronize gallery and biography
        run: |
          python tools/build_gallery_media.py
          python tools/sync_galleries.py
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept music-coitado-1992
          python tools/build_sitemap.py
      - name: Verify Barão media integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          paths = [Path('pt/musica/index.html'), Path('en/music/index.html'), Path('pt/biografia/index.html'), Path('en/biography/index.html')]
          for p in paths:
              t = p.read_text(encoding='utf-8')
              if '1992_showbarao_thread_IA_300kb.jpg' not in t:
                  raise SystemExit(f'Thread image missing in {p}')
              if 'data-gallery="primeiro-show-barao-1992"' not in t:
                  raise SystemExit(f'Gallery missing in {p}')
              for i in range(1, 6):
                  if f'1992_showbarao_original_{i:02d}.jpg' not in t:
                      raise SystemExit(f'Gallery image {i} missing in {p}')
          pt = Path('pt/musica/index.html').read_text(encoding='utf-8')
          en = Path('en/music/index.html').read_text(encoding='utf-8')
          for needle in ['Reconstrução ilustrativa feita por IA devido à baixa qualidade do vídeo original.', '5 prints originais', 'Vídeo original do primeiro show']:
              if needle not in pt:
                  raise SystemExit(f'PT copy missing: {needle}')
          for needle in ['Illustrative AI reconstruction made because of the low quality of the original video.', '5 original frame captures', 'Original first-show video']:
              if needle not in en:
                  raise SystemExit(f'EN copy missing: {needle}')
          dst = Path('assets/archive/music/coitado-do-proximo/1992-primeiro-show-barao-homem-de-mello/1992_showbarao_thread_IA_300kb.jpg')
          if dst.stat().st_size > 300_000:
              raise SystemExit(f'Thread derivative exceeds 300 KB: {dst.stat().st_size}')
          reg = json.loads(Path('data/galleries.json').read_text(encoding='utf-8'))
          g = next((x for x in reg['galleries'] if x['id'] == 'primeiro-show-barao-1992'), None)
          if not g or len(g['items']) != 5:
              raise SystemExit('Gallery registry not correct')
          print('Barão 1992 Thread + 5-original gallery + original video link verified.')
          print(f'Thread file size: {dst.stat().st_size} bytes')
          PY
      - name: Commit generated media integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/archive/music/coitado-do-proximo/1992-primeiro-show-barao-homem-de-mello/1992_showbarao_thread_IA_300kb.jpg assets/media/galleries/primeiro-show-barao-1992 data/galleries.json data/editorial_parity.json pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html sitemap.xml
          git commit -m "feat: add Barão 1992 Thread and original-frame gallery"
          git push origin HEAD:benny/music-barao-1992-media
