name: Dave Eu Nao To Nem Ai Credits

on:
  push:
    branches:
      - dave/eu-nao-to-nem-ai-credits-2026-09-17

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dave/eu-nao-to-nem-ai-credits-2026-09-17
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4

      - name: Update canonical album credits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path(".")

          pt_path = root / "content/entries/pt/music-album-1999-2000.inc"
          en_path = root / "content/entries/en/music-album-1999-2000.inc"

          pt = pt_path.read_text(encoding="utf-8")
          en = en_path.read_text(encoding="utf-8")

          pt_prefix = """<p>Segundo álbum do ciclo autoral, com produção de <strong>Fábio Badi</strong>. Marcelo Minduim gravou bateria.</p><p>Gravado entre <strong>dezembro de 1999 e fevereiro de 2000</strong> nos estúdios <strong>Master Music</strong> e <strong>BHS</strong>, o trabalho reuniu cinco composições autorais e uma versão creditada a <strong>Fat Mike (NOFX)</strong>, com versão de Marcelo Minduim.</p><p>Lançado em CD em <strong>2000</strong>, o álbum abriu novas oportunidades de mídia e apresentações para a banda.</p><div class="album-credits"><h3>Ficha técnica completa</h3><h4>Faixas</h4><ol><li><strong>A Enchente</strong> — Marcelo Minduim / Ricardo Bicária.</li><li><strong>Filhinho Coronel</strong> — Marcelo Minduim / Ricardo Bicária.</li><li><strong>Estava Comigo</strong> — Marcelo Minduim.</li><li><strong>Mulher SP</strong> — Marcelo Minduim.</li><li><strong>Eu Não Tô Nem Aí</strong> — Fat Mike (NOFX); versão: Marcelo Minduim.</li><li><strong>Você Merece</strong> — Marcelo Minduim.</li></ol><h4>Formação</h4><ul><li><strong>Vocal:</strong> Mario Joe.</li><li><strong>Guitarras:</strong> Ricardo Bicária e Fábio Badi.</li><li><strong>Baixo:</strong> Bel.</li><li><strong>Bateria:</strong> Marcelo Minduim.</li><li><strong>Teclado:</strong> Alexandre Totti.</li></ul><h4>Participações especiais</h4><p><strong>“Você Merece”:</strong> trompete — Lucas Cavalcanti; saxofone — Alexandre Borges; trombone — Ricardo Guedes.</p><h4>Gravação e produção</h4><ul><li><strong>Gravação:</strong> Estúdio Master Music e Estúdio BHS — dezembro de 1999 a fevereiro de 2000.</li><li><strong>Mixagem de bateria:</strong> Paulo Anhaia — Estúdio Midas.</li><li><strong>Mixagem:</strong> Fábio Badi.</li><li><strong>Produção:</strong> Fábio Badi.</li><li><strong>Masterização:</strong> Rodrigo Castanho — Estúdio Midas.</li></ul><h4>Estúdios por etapa</h4><ul><li><strong>Estúdio Master Music:</strong> bateria, voz, backing vocals, coros, metais e teclado.</li><li><strong>Estúdio Midas:</strong> mixagem de bateria — Paulo Anhaia.</li><li><strong>Estúdio BHS:</strong> guitarras, baixo e teclado.</li></ul></div>"""

          en_prefix = """<p>Second album in the original cycle, produced by <strong>Fábio Badi</strong>. Marcelo Minduim recorded drums.</p><p>Recorded between <strong>December 1999 and February 2000</strong> at <strong>Master Music</strong> and <strong>BHS</strong> studios, the album brought together five original compositions and one version credited to <strong>Fat Mike (NOFX)</strong>, with a version by Marcelo Minduim.</p><p>Released on CD in <strong>2000</strong>, the album opened new opportunities for media appearances and live performances.</p><div class="album-credits"><h3>Full technical credits</h3><h4>Track listing</h4><ol><li><strong>A Enchente</strong> — Marcelo Minduim / Ricardo Bicária.</li><li><strong>Filhinho Coronel</strong> — Marcelo Minduim / Ricardo Bicária.</li><li><strong>Estava Comigo</strong> — Marcelo Minduim.</li><li><strong>Mulher SP</strong> — Marcelo Minduim.</li><li><strong>Eu Não Tô Nem Aí</strong> — Fat Mike (NOFX); version: Marcelo Minduim.</li><li><strong>Você Merece</strong> — Marcelo Minduim.</li></ol><h4>Personnel</h4><ul><li><strong>Vocals:</strong> Mario Joe.</li><li><strong>Guitars:</strong> Ricardo Bicária and Fábio Badi.</li><li><strong>Bass:</strong> Bel.</li><li><strong>Drums:</strong> Marcelo Minduim.</li><li><strong>Keyboards:</strong> Alexandre Totti.</li></ul><h4>Special guests</h4><p><strong>“Você Merece”:</strong> trumpet — Lucas Cavalcanti; saxophone — Alexandre Borges; trombone — Ricardo Guedes.</p><h4>Recording and production</h4><ul><li><strong>Recording:</strong> Estúdio Master Music and Estúdio BHS — December 1999 to February 2000.</li><li><strong>Drum mixing:</strong> Paulo Anhaia — Estúdio Midas.</li><li><strong>Mixing:</strong> Fábio Badi.</li><li><strong>Production:</strong> Fábio Badi.</li><li><strong>Mastering:</strong> Rodrigo Castanho — Estúdio Midas.</li></ul><h4>Studios by session</h4><ul><li><strong>Estúdio Master Music:</strong> drums, vocals, backing vocals, choirs, brass and keyboards.</li><li><strong>Estúdio Midas:</strong> drum mixing — Paulo Anhaia.</li><li><strong>Estúdio BHS:</strong> guitars, bass and keyboards.</li></ul></div>"""

          pattern = re.compile(r"^(?:<p>.*?</p>){3}", re.S)
          if not pattern.search(pt):
              raise SystemExit("PT opening paragraphs not found")
          if not pattern.search(en):
              raise SystemExit("EN opening paragraphs not found")

          pt = pattern.sub(pt_prefix, pt, count=1)
          en = pattern.sub(en_prefix, en, count=1)

          pt_path.write_text(pt, encoding="utf-8")
          en_path.write_text(en, encoding="utf-8")

          entries_path = root / "data/entries.json"
          data = json.loads(entries_path.read_text(encoding="utf-8"))
          entries = data.get("entries", data if isinstance(data, list) else [])
          entry = next((item for item in entries if item.get("id") == "music-album-1999-2000"), None)
          if entry is None:
              raise SystemExit("music-album-1999-2000 missing from entries registry")
          entry["summary"]["pt"] = "Segundo álbum do ciclo autoral, produzido por Fábio Badi; Marcelo Minduim gravou bateria."
          entry["summary"]["en"] = "Second album in the original cycle, produced by Fábio Badi; Marcelo Minduim recorded drums."
          entries_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # User-requested naming normalization across textual repository surfaces.
          old_forms = [
              "Fábio “Badi” Crepaldi",
              'Fábio "Badi" Crepaldi',
              "Fábio ‘Badi’ Crepaldi",
          ]
          suffixes = {".html", ".inc", ".json", ".md", ".txt", ".xml", ".yml", ".yaml"}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old in old_forms:
                  updated = updated.replace(old, "Fábio Badi")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          print("Canonical album credits updated.")
          PY

      - name: Synchronize entry targets
        run: python tools/sync_entries.py

      - name: Accept PT EN editorial checkpoints
        run: |
          python tools/editorial_parity.py --accept music-album-1999-2000
          python tools/editorial_parity.py --accept audiovisual-meia-noite

      - name: Synchronize Full Biography
        run: python tools/sync_full_biography.py

      - name: Rebuild Chapter Pages
        run: python tools/build_chapter_pages.py

      - name: Refresh sitemap
        run: python tools/build_sitemap.py

      - name: Verify requested credit corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bad = []
          old_forms = [
              "Fábio “Badi” Crepaldi",
              'Fábio "Badi" Crepaldi',
              "Fábio ‘Badi’ Crepaldi",
          ]
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".html", ".inc", ".json", ".md", ".txt", ".xml", ".yml", ".yaml"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if any(old in text for old in old_forms):
                  bad.append(str(path))
          if bad:
              raise SystemExit("Old Fábio credit remains in: " + ", ".join(bad))

          pt = Path("content/entries/pt/music-album-1999-2000.inc").read_text(encoding="utf-8")
          en = Path("content/entries/en/music-album-1999-2000.inc").read_text(encoding="utf-8")
          required_pt = [
              "<strong>Produção:</strong> Fábio Badi.",
              "<strong>Bateria:</strong> Marcelo Minduim.",
              "<strong>Masterização:</strong> Rodrigo Castanho — Estúdio Midas.",
              "Fat Mike (NOFX); versão: Marcelo Minduim.",
              "Paulo Anhaia — Estúdio Midas.",
          ]
          required_en = [
              "<strong>Production:</strong> Fábio Badi.",
              "<strong>Drums:</strong> Marcelo Minduim.",
              "<strong>Mastering:</strong> Rodrigo Castanho — Estúdio Midas.",
              "Fat Mike (NOFX); version: Marcelo Minduim.",
              "Paulo Anhaia — Estúdio Midas.",
          ]
          for token in required_pt:
              if token not in pt:
                  raise SystemExit("Missing PT token: " + token)
          for token in required_en:
              if token not in en:
                  raise SystemExit("Missing EN token: " + token)

          forbidden = [
              "produção de <strong>Fábio Badi</strong> e Marcelo",
              "produced by <strong>Fábio Badi</strong> and Marcelo",
              "<em>Ciúmes</em>",
          ]
          for token in forbidden:
              if token in pt or token in en:
                  raise SystemExit("Forbidden legacy credit/content remains: " + token)
          print("Requested credit corrections verified.")
          PY

      - name: Targeted validation
        run: |
          python tools/sync_entries.py --check
          python tools/editorial_parity.py --check
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
          python tools/build_sitemap.py --check
          python tools/audit_site.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dave-eu-nao-to-nem-ai-credits.yml
          git add -A
          git commit -m "feat: add full Eu Nao To Nem Ai technical credits"
          git push origin HEAD:dave/eu-nao-to-nem-ai-credits-2026-09-17
