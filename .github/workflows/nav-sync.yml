name: Navigation sync

on:
  push:
    branches: [internet-performance-unification]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: internet-performance-unification
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize navigation
        run: python tools/sync_navigation.py
      - name: Commit synchronized navigation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt en
          git commit -m "Normalize navigation for Internet & Performance"
          git push origin HEAD:internet-performance-unification
