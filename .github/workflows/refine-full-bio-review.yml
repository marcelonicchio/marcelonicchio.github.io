name: Refine Full Biography review candidate

on:
  push:
    branches: [full-biography-parity-stop]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: full-biography-parity-stop
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Refine generated heading normalization and PT hero
        run: |
          python - <<'PY'
          from pathlib import Path
          sync = Path('tools/sync_full_biography.py')
          text = sync.read_text(encoding='utf-8')
          old = '''        clean = re.sub(r"^\\s*\\d{4}(?:[–-](?:\\d{2,4}|presente|present))?\\s+—\\s+", "", heading.get_text(" ", strip=True), flags=re.I)\n        if clean != heading.get_text(" ", strip=True):\n            heading.clear()\n            heading.append(clean)'''
          new = '''        clean = re.sub(r"^\\s*\\d{4}(?:[–-](?:\\d{2,4}|presente|present))?\\s+—\\s+", "", heading.get_text(" ", strip=True), flags=re.I)\n        if clean and clean[0].islower():\n            clean = clean[0].upper() + clean[1:]\n        if clean != heading.get_text(" ", strip=True):\n            heading.clear()\n            heading.append(clean)'''
          if old not in text:
              raise SystemExit('Expected heading-normalization block not found')
          sync.write_text(text.replace(old, new, 1), encoding='utf-8')

          bio = Path('pt/biografia/index.html')
          text = bio.read_text(encoding='utf-8')
          old_phrase = 'partes de uma mesma lifetime — não como carreiras desconectadas.'
          new_phrase = 'partes de uma mesma trajetória — não como carreiras desconectadas.'
          if old_phrase not in text:
              raise SystemExit('Expected PT hero phrase not found')
          bio.write_text(text.replace(old_phrase, new_phrase, 1), encoding='utf-8')
          PY
      - name: Regenerate Full Biography
        run: python tools/sync_full_biography.py
      - name: Audit editorial parity
        run: python tools/editorial_parity.py --check
      - name: Audit Full Biography coverage
        run: python tools/audit_full_biography.py
      - name: Audit site
        run: python tools/audit_site.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sync_full_biography.py pt/biografia/index.html en/biography/index.html
          git commit -m "Refine Full Biography review candidate"
          git push origin HEAD:full-biography-parity-stop
