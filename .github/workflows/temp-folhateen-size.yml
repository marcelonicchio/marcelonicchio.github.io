name: Temporary Folhateen size adjustment

on:
  push:
    branches: [work/folhateen-cover-size]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/folhateen-cover-size
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply Folhateen-only responsive sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* Folhateen cover responsive thread sizing */'
          if marker in text:
              raise SystemExit('Folhateen sizing rule already present')
          anchor = '/* Record-associated gallery system */'
          rule = '''/* Folhateen cover responsive thread sizing */
.thread-media:has(img[src$="/folhateen-cover-2001.webp"]){width:50%;margin-left:auto;margin-right:auto}
@media(max-width:900px){.thread-media:has(img[src$="/folhateen-cover-2001.webp"]){width:72%}}
@media(max-width:640px){.thread-media:has(img[src$="/folhateen-cover-2001.webp"]){width:100%}}


'''
          if text.count(anchor) != 1:
              raise SystemExit('CSS anchor not unique')
          p.write_text(text.replace(anchor, rule + anchor, 1), encoding='utf-8')
          PY
      - name: Run complete audits
        run: |
          python tools/editorial_parity.py --check
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
          python tools/audit_site.py
      - name: Commit adjustment and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git rm .github/workflows/temp-folhateen-size.yml
          git commit -m 'Reduce Folhateen thread cover size responsively'
          git push origin HEAD:work/folhateen-cover-size
