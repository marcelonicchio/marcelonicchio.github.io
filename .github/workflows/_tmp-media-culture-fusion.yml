name: Temporary media culture fusion

on:
  push:
    branches: [work/media-culture-fusion]
    paths:
      - '.github/workflows/_tmp-media-culture-fusion.yml'
      - '.tmp-media-culture-fusion.py'

permissions:
  contents: write

jobs:
  fuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/media-culture-fusion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit dependencies
        run: pip install beautifulsoup4
      - name: Apply structural fusion
        run: python .tmp-media-culture-fusion.py
      - name: Regenerate canonical derived surfaces
        run: |
          python tools/sync_galleries.py
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/sync_navigation.py
          python tools/sync_reader_disclosure_loader.py
      - name: Focused structural checks
        run: |
          python tools/audit_media_culture_fusion.py
          python tools/sync_navigation.py --check
          python tools/sync_galleries.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/sync_reader_disclosure_loader.py --check
          python tools/editorial_parity.py --check
          python tools/audit_full_biography.py
          python tools/audit_galleries.py
          python tools/audit_entries.py
          python tools/audit_site.py
          node --check assets/js/reader-disclosure.js
          node --check assets/js/reader-disclosure-loader.js
      - name: Show intentional legacy URL residue
        run: |
          grep -RIn --exclude-dir=.git -E '/pt/audiovisual/|/en/audiovisual/' . | head -80 || true
      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/_tmp-media-fusion-inventory.yml
          rm -f .github/workflows/_tmp-media-culture-fusion.yml
          rm -f docs/_tmp-media-fusion-inventory.md
          rm -f .tmp-media-culture-fusion.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Merge Communication and Audiovisual verticals'
          git push origin HEAD:work/media-culture-fusion
