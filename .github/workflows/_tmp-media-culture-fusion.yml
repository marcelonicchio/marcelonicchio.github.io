name: Temporary media culture fusion

on:
  push:
    branches: [work/media-culture-fusion]
    paths:
      - '.github/workflows/_tmp-media-culture-fusion.yml'
      - '.tmp-media-culture-fusion.py'

permissions:
  contents: write

jobs:
  fuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/media-culture-fusion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit dependencies
        run: pip install beautifulsoup4
      - name: Apply structural fusion
        run: python .tmp-media-culture-fusion.py
      - name: Register legacy audiovisual canonicals in site audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/audit_site.py')
          t = p.read_text(encoding='utf-8')
          old = '''LEGACY_CANONICAL = {
              "pt/search-performance/index.html": SITE + "/pt/internet/",
              "en/search-performance/index.html": SITE + "/en/internet/",
          }'''
          new = '''LEGACY_CANONICAL = {
              "pt/search-performance/index.html": SITE + "/pt/internet/",
              "en/search-performance/index.html": SITE + "/en/internet/",
              "pt/audiovisual/index.html": SITE + "/pt/comunicacao/",
              "en/audiovisual/index.html": SITE + "/en/communication/",
          }'''
          if old not in t:
              raise SystemExit('LEGACY_CANONICAL block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate canonical derived surfaces
        run: |
          python tools/sync_galleries.py
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/sync_navigation.py
          python tools/sync_reader_disclosure_loader.py
      - name: Check media fusion invariant
        run: python tools/audit_media_culture_fusion.py
      - name: Check navigation
        run: python tools/sync_navigation.py --check
      - name: Check galleries sync
        run: python tools/sync_galleries.py --check
      - name: Check Full Biography sync
        run: python tools/sync_full_biography.py --check
      - name: Check Chapter Pages
        run: python tools/build_chapter_pages.py --check
      - name: Check Reader loader sync
        run: python tools/sync_reader_disclosure_loader.py --check
      - name: Check editorial parity
        run: python tools/editorial_parity.py --check
      - name: Audit Full Biography
        run: python tools/audit_full_biography.py
      - name: Audit galleries
        run: python tools/audit_galleries.py
      - name: Audit entries
        run: python tools/audit_entries.py
      - name: Capture site audit diagnostic
        run: |
          python tools/audit_site.py > docs/_tmp-media-fusion-site-audit.txt 2>&1 || true
          cat docs/_tmp-media-fusion-site-audit.txt
      - name: Check Reader JavaScript
        run: |
          node --check assets/js/reader-disclosure.js
          node --check assets/js/reader-disclosure-loader.js
      - name: Commit diagnostic branch state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/site-audit.yml
          git add -A
          git status --short
          git commit -m 'Apply Media and Culture fusion draft'
          git push origin HEAD:work/media-culture-fusion
