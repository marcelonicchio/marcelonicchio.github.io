name: Billy Buscador standalone smoke one-shot

on:
  push:
    branches:
      - billy/buscador-budismo-2026-09-06
    paths:
      - .github/workflows/billy-buscador-standalone-smoke-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update standalone spirituality topic invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/smoke_reader_ux.js')
          text = path.read_text(encoding='utf-8')
          old = "['Meditação', 'Vipassana', 'Budismo', 'Buddhismo', 'Osho', 'Mindfulness'].forEach((label) => assert(standaloneSpiritualityTopics.includes(label), `Standalone spirituality topic missing: ${label}`));"
          new = "['Meditação', 'Vipassana', 'Budismo', 'Osho', 'Mindfulness'].forEach((label) => assert(standaloneSpiritualityTopics.includes(label), `Standalone spirituality topic missing: ${label}`));\n  assert(!standaloneSpiritualityTopics.includes('Buddhismo'), 'Legacy standalone Buddhismo topic must not reappear');"
          if old not in text:
              raise SystemExit('Expected standalone spirituality assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/billy-buscador-standalone-smoke-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align standalone Buscador smoke with Budismo spelling'
          git push
