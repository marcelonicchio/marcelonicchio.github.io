name: Temporary index foundations and Lighthouse remeasurement

on:
  push:
    branches: [work/index-foundations-and-measurement]
    paths:
      - '.github/workflows/_tmp-index-foundations.yml'

permissions:
  contents: write

jobs:
  apply-and-measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/index-foundations-and-measurement
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply metadata and documentation foundations
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path('.')

          # Chapter Page-specific descriptions: concise search/social metadata without
          # shortening the richer registry summary used by the page hero and Reader.
          entries_path = root / 'data/entries.json'
          data = json.loads(entries_path.read_text(encoding='utf-8'))
          descriptions = {
              'internet-best': {
                  'pt': 'Marcelo Nicchio na BEST/Kenshoo em 2014: gestão de performance, Search + Social, tecnologia e workshop do E-Commerce Brasil em quatro partes.',
                  'en': 'Marcelo Nicchio at BEST/Kenshoo in 2014: performance management, Search + Social, technology and a four-part E-Commerce Brasil workshop.',
              },
              'communication-folha': {
                  'pt': 'Marcelo Nicchio na capa do Folhateen de 23/04/2001, discutindo Joey Ramone, cultura punk, faça-você-mesmo e o underground brasileiro.',
                  'en': 'Marcelo Nicchio in Folhateen’s Apr. 23, 2001 cover story on Joey Ramone, punk culture, DIY ethics and Brazil’s underground rock scene.',
              },
          }
          found = set()
          for entry in data.get('entries', []):
              if entry.get('id') in descriptions:
                  found.add(entry['id'])
                  entry.setdefault('chapter_page', {})['description'] = descriptions[entry['id']]
          if found != set(descriptions):
              raise SystemExit(f'Missing expected entries: {set(descriptions) - found}')
          for eid, langs in descriptions.items():
              for lang, text in langs.items():
                  if len(text) > 160:
                      raise SystemExit(f'{eid}/{lang} description is {len(text)} chars')
          entries_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Teach the Chapter Page generator to use page-specific metadata copy.
          gen_path = root / 'tools/build_chapter_pages.py'
          gen = gen_path.read_text(encoding='utf-8')
          needle = '    summary = entry["summary"][lang]\n    date = entry["date"][lang]'
          replacement = '    summary = entry["summary"][lang]\n    description = page.get("description", {}).get(lang, summary)\n    date = entry["date"][lang]'
          if needle not in gen and 'description = page.get("description", {}).get(lang, summary)' not in gen:
              raise SystemExit('Chapter Page generator insertion point not found')
          gen = gen.replace(needle, replacement, 1)
          gen = gen.replace('<meta name="description" content="{html.escape(summary, quote=True)}">', '<meta name="description" content="{html.escape(description, quote=True)}">', 1)
          gen = gen.replace('<meta property="og:description" content="{html.escape(summary, quote=True)}">', '<meta property="og:description" content="{html.escape(description, quote=True)}">', 1)
          if gen.count('html.escape(description, quote=True)') < 2:
              raise SystemExit('Chapter Page description migration incomplete')
          gen_path.write_text(gen, encoding='utf-8')

          # Permanent URL policy before the first post-fusion compatibility stub.
          url_policy = '''# Permanent URL policy\n\n**Status:** current operational policy · 1 Sep 2026\n\nThe HUB treats a published URL as a durable public contract. Display names, menu labels and editorial titles may change without forcing the URL to change. Prefer preserving an established path when the path remains semantically serviceable.\n\n## When a published path must change\n\nBecause GitHub Pages does not provide repository-level HTTP redirects, the old path remains in the repository permanently as a compatibility stub.\n\nEvery compatibility stub must:\n\n- use `noindex,follow`;\n- contain `<link rel="canonical">` pointing to the definitive new URL;\n- redirect immediately with `<meta http-equiv="refresh" content="0; url=…">`;\n- provide a normal visible link to the destination as a fallback;\n- preserve the correct language counterpart/hreflang when applicable;\n- stay out of `sitemap.xml`;\n- never compete as a second content surface.\n\nStubs are not temporary cleanup files. Once an old public URL has been replaced, its compatibility stub is retained indefinitely unless the hosting platform later gains a verified server-side redirect mechanism and migration is deliberately reviewed.\n\n## Name and URL are independent decisions\n\nA navigation label, page H1 and URL slug do not need to be identical. Prefer the shortest useful navigation label, the most precise editorial H1, and the most stable existing URL.\n\nCurrent application approved for the Communication + Audiovisual consolidation:\n\n- menu PT: **Mídia & Cultura**;\n- menu EN: **Media & Culture**;\n- H1/title PT: **Cultura & Audiovisual**;\n- H1/title EN: **Culture & Audiovisual**;\n- canonical vertical paths remain **`/pt/comunicacao/`** and **`/en/communication/`**.\n\nTherefore the Folhateen Chapter Page keeps its existing path. Only the former standalone Audiovisual vertical paths will require compatibility stubs when the fusion is implemented.\n'''
          (root / 'docs/url-policy.md').write_text(url_policy, encoding='utf-8')

          # Update authoritative current state with the approved naming/URL decision.
          state_path = root / 'docs/CURRENT-HUB-STATE.md'
          state = state_path.read_text(encoding='utf-8')
          old = '''### Next vertical consolidation — Communication + Audiovisual\n\nCommunication & Culture and Audiovisual are now slated for a structural fusion because each vertical carries relatively few top-level threads on its own. The final public name is still open; current working directions include **Culture & Audiovisual** and **Audiovisual & Culture**.\n\nTreat this as the same class of change as the Internet + Search/Performance fusion: one menu item, one coherent thematic chronology, PT/EN parity, internal links adjusted, old URLs retained only for compatibility/redirect behavior, and no competing duplicate verticals. The Full Biography remains the integral chronology and is not merged or shortened by this change.\n\nDo **not** implement the fusion until the public name and ordering are explicitly approved.\n'''
          new = '''### Next vertical consolidation — Communication + Audiovisual\n\nCommunication & Culture and Audiovisual are approved for structural fusion because the two axes overlap editorially and each carries relatively few top-level threads in isolation.\n\nApproved public naming separates navigation economy from editorial precision:\n\n- menu PT: **Mídia & Cultura**;\n- menu EN: **Media & Culture**;\n- page H1/title PT: **Cultura & Audiovisual**;\n- page H1/title EN: **Culture & Audiovisual**.\n\nThe established canonical vertical paths are deliberately preserved as **`/pt/comunicacao/`** and **`/en/communication/`**. The Folhateen Chapter Page therefore remains at its current Communication path. The old standalone `/pt/audiovisual/` and `/en/audiovisual/` paths become permanent compatibility stubs when the fusion ships.\n\nTreat the fusion as the same class of change as Internet + Search/Performance: one menu item, one coherent thematic chronology, PT/EN parity, internal links adjusted, and no competing duplicate verticals. The Full Biography remains the integral chronology and is not merged or shortened by this change. See `docs/url-policy.md`.\n'''
          if old not in state:
              raise SystemExit('Current-state fusion block not found')
          state_path.write_text(state.replace(old, new, 1), encoding='utf-8')

          # Update indexation plan: BEST chosen for isolated Chapter Page experiment;
          # vertical indexation remains gated by the operator-authored entity root.
          idx_path = root / 'docs/indexation-plan.md'
          idx = idx_path.read_text(encoding='utf-8')
          idx = idx.replace(
              'The exact page must be chosen deliberately at experiment time. Older documents suggested Meia-Noite e Uns before the final pilot set changed; that suggestion is historical, not an automatic current choice.',
              '**BEST/Kenshoo PT/EN is now the approved first Chapter Page pair for this isolated experiment.** It is mature, already generated from a neutral fragment and unaffected by the Communication + Audiovisual fusion. Execute its robots/sitemap change in a dedicated PR so Search Console effects remain attributable.'
          )
          gate = '''\n### Entity-page gate before vertical promotion\n\nBefore historical/thematic verticals are changed from `noindex,follow` to `index,follow`, the root `/` must first be expanded into a useful human-readable entity page while preserving its canonical `Person` node. The operator will supply that prose separately.\n\nDo not remove the Full Biography from the index in the same step. Any future Full Biography `noindex,follow` decision remains explicitly operator-gated and should occur only after the root and selected verticals have been published and observed.\n'''
          marker = '## 3. Chapter Page pilots\n'
          if '### Entity-page gate before vertical promotion' not in idx:
              if marker not in idx:
                  raise SystemExit('Indexation plan insertion marker not found')
              idx = idx.replace(marker, gate + '\n' + marker, 1)
          idx_path.write_text(idx, encoding='utf-8')

          # Documentation map.
          readme_path = root / 'docs/README.md'
          readme = readme_path.read_text(encoding='utf-8')
          if '`url-policy.md`' not in readme:
              readme = readme.replace(
                  '- `lighthouse-baseline-2026-08-29.md` — reproducible pre-Reader Lighthouse lab baseline; still useful as a comparison point, not field data.\n',
                  '- `url-policy.md` — permanent URL/stub policy and approved name/URL separation for the Culture + Audiovisual fusion.\n- `lighthouse-baseline-2026-08-29.md` — reproducible pre-Reader Lighthouse lab baseline; still useful as a comparison point, not field data.\n',
                  1,
              )
          readme_path.write_text(readme, encoding='utf-8')

      - name: Regenerate Chapter Pages and run focused checks
        run: |
          python tools/build_chapter_pages.py
          python tools/build_chapter_pages.py --check
          python tools/audit_site.py

      - name: Install pinned Lighthouse
        run: npm install --global lighthouse@13.4.1

      - name: Record measurement environment
        run: |
          node --version
          lighthouse --version
          google-chrome --version

      - name: Run repeated same-protocol audits
        run: |
          mkdir -p .tmp-lighthouse
          for run in 1 2 3; do
            lighthouse 'https://marcelonicchio.github.io/pt/biografia/' \
              --only-categories=performance --output=json \
              --output-path=.tmp-lighthouse/fullbio-mobile-${run}.json \
              --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet
            lighthouse 'https://marcelonicchio.github.io/pt/biografia/' \
              --preset=desktop --only-categories=performance --output=json \
              --output-path=.tmp-lighthouse/fullbio-desktop-${run}.json \
              --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet
            lighthouse 'https://marcelonicchio.github.io/pt/internet/' \
              --only-categories=performance --output=json \
              --output-path=.tmp-lighthouse/internet-mobile-${run}.json \
              --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet
            lighthouse 'https://marcelonicchio.github.io/pt/internet/' \
              --preset=desktop --only-categories=performance --output=json \
              --output-path=.tmp-lighthouse/internet-desktop-${run}.json \
              --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet
          done

      - name: Build post-Reader Lighthouse report
        run: |
          node <<'NODE'
          const fs = require('fs');
          const specs = [
            ['Full Biography PT', 'mobile', 'fullbio-mobile'],
            ['Full Biography PT', 'desktop', 'fullbio-desktop'],
            ['Internet & Performance PT', 'mobile', 'internet-mobile'],
            ['Internet & Performance PT', 'desktop', 'internet-desktop'],
          ];
          const baseline = {
            'Full Biography PT|mobile': {score:68,fcp:1092,lcp:4130,cls:0,tbt:619,si:4327,tti:4130,transfer:0.20,requests:7},
            'Full Biography PT|desktop': {score:100,fcp:283,lcp:688,cls:0,tbt:0,si:283,tti:688,transfer:0.27,requests:8},
            'Internet & Performance PT|mobile': {score:98,fcp:905,lcp:905,cls:0,tbt:150,si:905,tti:2718,transfer:0.27,requests:8},
            'Internet & Performance PT|desktop': {score:100,fcp:319,lcp:784,cls:0,tbt:1,si:319,tti:790,transfer:1.20,requests:25},
          };
          const median = arr => {
            const a = [...arr].sort((x,y)=>x-y);
            return a[Math.floor(a.length/2)];
          };
          const collect = file => {
            const lhr = JSON.parse(fs.readFileSync(file, 'utf8'));
            const a = lhr.audits;
            const req = a['network-requests']?.details?.items || [];
            return {
              lhr,
              score: Math.round((lhr.categories.performance.score || 0)*100),
              fcp: a['first-contentful-paint']?.numericValue,
              lcp: a['largest-contentful-paint']?.numericValue,
              cls: a['cumulative-layout-shift']?.numericValue,
              tbt: a['total-blocking-time']?.numericValue,
              si: a['speed-index']?.numericValue,
              tti: a['interactive']?.numericValue,
              transfer: req.reduce((s,i)=>s+(i.transferSize||0),0)/1048576,
              requests: req.length,
              dom: a['dom-size']?.numericValue,
            };
          };
          const rows=[];
          let env=null;
          for (const [surface,mode,key] of specs) {
            const runs=[1,2,3].map(i=>collect(`.tmp-lighthouse/${key}-${i}.json`));
            env ||= {version:runs[0].lhr.lighthouseVersion, ua:runs[0].lhr.userAgent, fetch:runs[0].lhr.fetchTime};
            const fields=['score','fcp','lcp','cls','tbt','si','tti','transfer','requests','dom'];
            const med={};
            for (const f of fields) med[f]=median(runs.map(r=>r[f]).filter(v=>v!=null));
            rows.push({surface,mode,key,runs,med,base:baseline[`${surface}|${mode}`]});
          }
          const ms=v=>v==null?'n/a':`${Math.round(v)} ms`;
          const dec=(v,d=3)=>v==null?'n/a':Number(v).toFixed(d);
          const mib=v=>v==null?'n/a':`${Number(v).toFixed(2)} MiB`;
          const delta=(now,old,unit='ms')=> old==null||now==null?'n/a':`${now-old>=0?'+':''}${Math.round(now-old)} ${unit}`;
          let out='# Lighthouse remeasurement — post-Reader / post-media batch\n\n';
          out+='Reference: 2026-09-01 BRT  \n';
          out+='Production commit measured: `07dd061774bf0ea7990cb7ce81948b9465d91773`  \n';
          out+='Comparison baseline: `docs/lighthouse-baseline-2026-08-29.md` (`4647e3e910d7f690950537807866438c4ad1d4f5`)  \n';
          out+='Measurement source: Lighthouse CLI in GitHub Actions against the public GitHub Pages deployment.\n\n';
          out+='The four original cases and flags were preserved. Each case was repeated three times; the table below reports the median of each metric to reduce lab-run noise. This remains lab data, not CrUX field data.\n\n';
          out+=`## Environment\n\n- Lighthouse: ${env.version} (pinned to the baseline version)\n- First fetch time: ${env.fetch}\n- User agent: ${env.ua}\n\n`;
          out+='## Median results (3 runs per case)\n\n| Surface | Mode | Score | FCP | LCP | CLS | TBT | Speed Index | TTI | Transfer observed | Requests | DOM elements |\n|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n';
          for (const r of rows) {
            const m=r.med;
            out+=`| ${r.surface} | ${r.mode} | ${Math.round(m.score)} | ${ms(m.fcp)} | ${ms(m.lcp)} | ${dec(m.cls)} | ${ms(m.tbt)} | ${ms(m.si)} | ${ms(m.tti)} | ${mib(m.transfer)} | ${Math.round(m.requests)} | ${m.dom==null?'n/a':Math.round(m.dom)} |\n`;
          }
          out+='\n## LCP comparison with 29 Aug baseline\n\n| Surface | Mode | Baseline LCP | Current median LCP | Delta |\n|---|---|---:|---:|---:|\n';
          for (const r of rows) out+=`| ${r.surface} | ${r.mode} | ${ms(r.base.lcp)} | ${ms(r.med.lcp)} | ${delta(r.med.lcp,r.base.lcp)} |\n`;
          out+='\n## Individual runs\n\n';
          for (const r of rows) {
            out+=`### ${r.surface} — ${r.mode}\n\n| Run | Score | FCP | LCP | TBT | Transfer | Requests |\n|---|---:|---:|---:|---:|---:|---:|\n`;
            r.runs.forEach((x,i)=>{ out+=`| ${i+1} | ${x.score} | ${ms(x.fcp)} | ${ms(x.lcp)} | ${ms(x.tbt)} | ${mib(x.transfer)} | ${x.requests} |\n`; });
            out+='\n';
          }
          const fullMobile=rows.find(r=>r.surface==='Full Biography PT'&&r.mode==='mobile');
          const pct=((fullMobile.med.lcp-fullMobile.base.lcp)/fullMobile.base.lcp)*100;
          out+='## Interpretation guardrails\n\n';
          out+=`- Full Biography mobile LCP changed from ${ms(fullMobile.base.lcp)} to a three-run median of ${ms(fullMobile.med.lcp)} (${pct>=0?'+':''}${pct.toFixed(1)}%).\n`;
          out+='- Repository-side `full-scroll-max` image inventory is not equivalent to initial transfer.\n';
          out+='- Lazy-loaded gallery growth should not be treated as a performance defect unless lab/field loading behavior also degrades materially.\n';
          out+='- Do not remove autobiographical content to chase a repository-side byte total.\n';
          out+='- If a later architecture change is proposed (for example on-demand thumbnail materialization), compare it against this measured post-Reader state rather than against intuition.\n\n';
          out+='## URLs measured\n\n- https://marcelonicchio.github.io/pt/biografia/\n- https://marcelonicchio.github.io/pt/internet/\n';
          fs.writeFileSync('docs/lighthouse-remeasurement-2026-09-01.md',out);
          console.log(out);
          NODE

      - name: Add report to documentation map
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/README.md')
          text = path.read_text(encoding='utf-8')
          needle = '- `lighthouse-baseline-2026-08-29.md` — reproducible pre-Reader Lighthouse lab baseline; still useful as a comparison point, not field data.\n'
          addition = needle + '- `lighthouse-remeasurement-2026-09-01.md` — same-protocol post-Reader/post-media Lighthouse comparison, three runs per case with medians.\n'
          if 'lighthouse-remeasurement-2026-09-01.md' not in text:
              if needle not in text:
                  raise SystemExit('README Lighthouse insertion point not found')
              text = text.replace(needle, addition, 1)
          path.write_text(text, encoding='utf-8')

      - name: Final focused checks
        run: |
          python tools/build_chapter_pages.py --check
          python tools/audit_site.py

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/_tmp-index-foundations.yml
          git config user.name 'Marcelo Nicchio'
          git config user.email 'marcelonicchio@gmail.com'
          git add -A
          git commit -m 'Add index foundations and remeasure Lighthouse'
          git push origin HEAD:work/index-foundations-and-measurement
