name: Chet C3 one-shot apply

on:
  push:
    branches: [work/chet-c3-best-kenshoo-index]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chet-c3-best-kenshoo-index
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Apply C3 and synchronize
        run: |
          python tools/chet_c3_best_index.py
          python tools/sync_entries.py
          python tools/editorial_parity.py --accept internet-best
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
      - name: Verify focused invariants
        run: |
          python tools/sync_entries.py --check
          python tools/editorial_parity.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
          python tools/audit_site.py
          grep -q 'name="robots" content="index,follow"' pt/internet/best-kenshoo/index.html
          grep -q 'name="robots" content="index,follow"' en/internet/best-kenshoo/index.html
          grep -q 'https://marcelonicchio.github.io/pt/internet/best-kenshoo/' sitemap.xml
          grep -q 'https://marcelonicchio.github.io/en/internet/best-kenshoo/' sitemap.xml
      - name: Commit synchronized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'C3: index BEST Kenshoo Chapter Page pilot'
          git push origin HEAD:work/chet-c3-best-kenshoo-index
