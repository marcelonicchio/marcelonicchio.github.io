name: Krist close Limonada Kid texts

on:
  push:
    branches: [feat/music-cdp-hierarchy-limonada]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/music-cdp-hierarchy-limonada
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Prepare bilingual patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/_krist_close_limonada_kid_texts.py')
          s = p.read_text(encoding='utf-8')
          old = '(?=<div class="phase" id="estudios-shows-1993">)'
          new = '(?=<div class="phase" id="(?:estudios|studios)-shows-1993">)'
          if old in s:
              s = s.replace(old, new, 1)
          marker = "subprocess.run(['python', 'tools/sync_full_biography.py'], cwd=ROOT, check=True)\nfor entry_id in ['music-limonada-1992', 'music-kid-vinil-1993', 'music-coitado-1994']:"
          replacement = "subprocess.run(['python', 'tools/sync_full_biography.py'], cwd=ROOT, check=True)\nregistry_path = ROOT / 'data/editorial_parity.json'\nregistry = json.loads(registry_path.read_text(encoding='utf-8'))\nregistry.setdefault('entries', {}).setdefault('music-kid-vinil-1993', {'revision': 0, 'pt_hash': '', 'en_hash': '', 'accepted_on': '1970-01-01'})\nregistry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')\nfor entry_id in ['music-limonada-1992', 'music-kid-vinil-1993', 'music-coitado-1994']:"
          if marker not in s:
              raise SystemExit('parity insertion marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply final narrative patch
        run: python tools/_krist_close_limonada_kid_texts.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html data/full_biography.json pt/biografia/index.html en/biography/index.html data/editorial_parity.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: close Limonada Kid and 97FM narrative arc"
          git push origin HEAD:feat/music-cdp-hierarchy-limonada
