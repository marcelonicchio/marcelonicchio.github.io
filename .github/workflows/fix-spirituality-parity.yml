name: Repair Spirituality parity checkpoint

on:
  push:
    branches: [work/spirituality-triangulation-1]
    paths:
      - '.github/workflows/fix-spirituality-parity.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parity dependency
        run: python -m pip install beautifulsoup4
      - name: Restore prior checkpoint then accept through canonical tool
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('data/editorial_parity.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          state = data['entries']['spirituality-seeker']
          state['revision'] = 6
          state['pt_hash'] = 'be9e4fdf3bf6911c2e6d78576de4214587ed082a6a3c1502c4a5e9ea0b4c09aa'
          state['en_hash'] = '7420f692661c794e70fbbb67d1881c6e474057f415f160ba0a43358f025496e2'
          state['accepted_on'] = '2026-09-03'
          state['changed_languages'] = ['pt', 'en']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/editorial_parity.py --accept spirituality-seeker
          python tools/editorial_parity.py --check
      - name: Commit canonical parity checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial_parity.json
          git commit -m "Accept Spirituality editorial parity checkpoint"
          git push
