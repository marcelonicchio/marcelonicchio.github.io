name: Temporary Melissa collapsed preview

on:
  push:
    branches:
      - work/melissa-collapsed-preview

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/melissa-collapsed-preview
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit dependencies
        run: python -m pip install beautifulsoup4
      - name: Build Melissa collapsed preview pilot
        run: python tools/temp_melissa_preview.py
      - name: Validate pilot
        run: |
          python tools/audit_entries.py
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_reader_ux.js
      - name: Commit pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json assets/js/reader-disclosure.js assets/reader-disclosure.css tools/smoke_reader_ux.js
          git commit -m "Pilot richer collapsed summary for Melissa"
          git push origin HEAD:work/melissa-collapsed-preview
