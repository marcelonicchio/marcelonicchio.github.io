name: Dave Internet Music Structure

on:
  push:
    branches:
      - dave/internet-music-structure-2026-09-17

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dave/internet-music-structure-2026-09-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize localized section ids
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/_dave_refactor_internet_music_style.py')
          text = path.read_text(encoding='utf-8')
          old = "    if found != EXPECTED_IDS:\n        raise RuntimeError(f'{rel}: expected {sorted(EXPECTED_IDS)}, got {sorted(found)}')"
          new = "    expected_ids = EXPECTED_IDS if rel.startswith('pt/') else ((EXPECTED_IDS - {'independente'}) | {'independent'})\n    if found != expected_ids:\n        raise RuntimeError(f'{rel}: expected {sorted(expected_ids)}, got {sorted(found)}')"
          if old not in text:
              raise RuntimeError('Localized-id migration anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run structural migration
        run: python tools/_dave_refactor_internet_music_style.py
      - name: Refresh Reader loader references and sitemap
        run: |
          python tools/sync_reader_disclosure_loader.py
          python tools/build_sitemap.py
      - name: Validate structural refactor
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          python tools/audit_internet_editorial_structure.py
          node --check assets/js/reader-disclosure.js
          node --check assets/js/reader-disclosure-loader.js
          node --check tools/smoke_reader_ux.js
          git diff --check
      - name: Commit refactor and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dave-internet-music-structure.yml tools/_dave_refactor_internet_music_style.py
          git add -A
          git commit -m "refactor: align Internet editorial structure with Music"
          git push origin HEAD:dave/internet-music-structure-2026-09-17
