name: Temporary PRO v1 figure fix

on:
  push:
    branches:
      - work/pro-v1-figure-fix

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/pro-v1-figure-fix
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editorial dependencies
        run: python -m pip install beautifulsoup4
      - name: Replace PRO v1 figure path
        shell: python
        run: |
          from pathlib import Path
          old = "/assets/media/thread/pro-v1-architecture-figure1.jpg"
          new = "/assets/media/thread/pro_v1_diagrama01.jpg"
          for filename in ("pt/ia-hai/index.html", "en/ai-hai/index.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f"Expected 2 references in {filename}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Accept reviewed PT EN checkpoint
        run: python tools/editorial_parity.py --accept hai-pro1
      - name: Generate Full Biography
        run: python tools/sync_full_biography.py
      - name: Commit synchronized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "PRO v1 figure already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/ia-hai/index.html en/ai-hai/index.html data/editorial_parity.json pt/biografia/index.html en/biography/index.html
          git commit -m "Fix PRO v1 architecture figure"
          git push origin HEAD:work/pro-v1-figure-fix
