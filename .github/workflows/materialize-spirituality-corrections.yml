name: Materialize spirituality corrections

on:
  push:
    branches: [work/spirituality-seeker-text-corrections]
    paths:
      - '.github/workflows/materialize-spirituality-corrections.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Materialize editorial sources
        run: |
          python tools/editorial_parity.py --accept spirituality-seeker
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
      - name: Commit generated editorial files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial_parity.json pt/biografia/index.html en/biography/index.html pt/biografia/espiritualidade-o-buscador/index.html en/biography/spirituality-the-seeker/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Materialize spirituality text corrections"
            git push
          fi
      - name: Refresh sitemap after generated commit
        run: |
          git pull --ff-only
          python tools/build_sitemap.py
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sitemap after spirituality corrections"
            git push
          fi
