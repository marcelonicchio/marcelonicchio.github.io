name: Billy BEST PDF text-card one-shot

on:
  push:
    branches:
      - billy/best-pdf-text-card-2026-09-06
    paths:
      - .github/workflows/billy-best-pdf-text-card-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove visual thumbnail from BEST PDF card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pdf = '/assets/archive/internet/best-kenshoo/best08_workshop-facebook-ads-2014.pdf'
          paths = [
              Path('content/entries/pt/internet-best.inc'),
              Path('content/entries/en/internet-best.inc'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              anchor_pattern = re.compile(
                  r'(<a class="inline-record" href="' + re.escape(pdf) + r'"[^>]*>)(.*?)(<span>.*?</span></a>)',
                  re.S,
              )
              match = anchor_pattern.search(text)
              if not match:
                  raise SystemExit(f'PDF inline-record not found in {path}')
              middle = re.sub(r'<img\b[^>]*?/?>', '', match.group(2), count=1, flags=re.S)
              updated = text[:match.start()] + match.group(1) + middle + match.group(3) + text[match.end():]
              if '<img' in anchor_pattern.search(updated).group(2):
                  raise SystemExit(f'image still present in PDF card in {path}')
              path.write_text(updated, encoding='utf-8')
          PY
          rm -f assets/archive/internet/best-kenshoo/best08_workshop-facebook-ads-2014-cover.webp
      - name: Synchronize derived surfaces
        run: |
          python tools/sync_entries.py
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/editorial_parity.py --accept internet-best
          python tools/build_sitemap.py
      - name: Validate generated state
        run: |
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/editorial_parity.py --check
      - name: Remove one-shot machinery and commit result
        run: |
          rm .github/workflows/billy-best-pdf-text-card-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render BEST workshop PDF as text-only document card'
          git push
