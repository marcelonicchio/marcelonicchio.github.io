name: Billy Seeker promotion

on:
  push:
    branches:
      - billy/chapter-promotion-seeker-2026-09-06

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: billy/chapter-promotion-seeker-2026-09-06
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Promote Seeker and align smoke contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          entries_path = Path('data/entries.json')
          data = json.loads(entries_path.read_text(encoding='utf-8'))
          entry = next((e for e in data['entries'] if e.get('id') == 'spirituality-seeker'), None)
          if entry is None:
              raise SystemExit('spirituality-seeker missing from registry')
          page = entry.get('chapter_page', {})
          if page.get('status') != 'pilot':
              raise SystemExit('spirituality-seeker is not a pilot Chapter Page')
          page['indexing'] = 'index,follow'
          entries_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = Path('tools/audit_site.py')
          text = audit_path.read_text(encoding='utf-8')
          marker = '}\n\nLEGACY_CANONICAL = {'
          paths = [
              'pt/biografia/espiritualidade-o-buscador/index.html',
              'en/biography/spirituality-the-seeker/index.html',
          ]
          additions = ''.join(f'    "{rel}",\n' for rel in paths if f'    "{rel}",' not in text)
          if additions:
              if marker not in text:
                  raise SystemExit('LAUNCH_INDEXABLE closing marker not found')
              text = text.replace(marker, additions + marker, 1)
              audit_path.write_text(text, encoding='utf-8')

          smoke_path = Path('tools/smoke_reader_ux.js')
          smoke = smoke_path.read_text(encoding='utf-8')
          old = "assert(await page.locator('meta[name=\"robots\"]').getAttribute('content') === 'noindex,follow', 'Spirituality standalone indexing changed without review');"
          new = "assert(await page.locator('meta[name=\"robots\"]').getAttribute('content') === 'index,follow', 'Spirituality standalone robots incorrect');"
          if old not in smoke:
              raise SystemExit('historical spirituality robots assertion not found')
          smoke_path.write_text(smoke.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate Chapter Pages and sitemap
        run: |
          python tools/build_chapter_pages.py
          python tools/build_sitemap.py
      - name: Commit generated promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json tools/audit_site.py tools/smoke_reader_ux.js pt/biografia/espiritualidade-o-buscador/index.html en/biography/spirituality-the-seeker/index.html sitemap.xml
          git commit -m "feat: promote Seeker biography authority pages"
          git push origin HEAD:billy/chapter-promotion-seeker-2026-09-06
