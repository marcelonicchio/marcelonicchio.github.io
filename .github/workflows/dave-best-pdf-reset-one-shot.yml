name: Dave BEST PDF card reset one-shot

on:
  push:
    branches:
      - dave/best-pdf-reset-2026-09-16
    paths:
      - .github/workflows/dave-best-pdf-reset-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install sync dependency
        run: python -m pip install beautifulsoup4
      - name: Remove current BEST workshop PDF card from canonical fragments
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pdf = '/assets/archive/internet/best-kenshoo/best08_workshop-facebook-ads-2014.pdf'
          paths = [
              Path('content/entries/pt/internet-best.inc'),
              Path('content/entries/en/internet-best.inc'),
          ]
          pattern = re.compile(
              r'\n?<div class="inline-records"><a class="inline-record" href="' + re.escape(pdf) + r'".*?</a></div>\n?',
              re.S,
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'expected exactly one BEST PDF card in {path}, found {count}')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Synchronize derived surfaces
        run: |
          python tools/sync_entries.py
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/editorial_parity.py --accept internet-best
          python tools/build_sitemap.py
      - name: Validate reset
        run: |
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/editorial_parity.py --check
          python tools/build_sitemap.py --check
          python - <<'PY'
          from pathlib import Path
          pdf = '/assets/archive/internet/best-kenshoo/best08_workshop-facebook-ads-2014.pdf'
          surfaces = [
              Path('content/entries/pt/internet-best.inc'),
              Path('content/entries/en/internet-best.inc'),
              Path('pt/internet/index.html'),
              Path('en/internet/index.html'),
              Path('pt/internet/best-kenshoo/index.html'),
              Path('en/internet/best-kenshoo/index.html'),
              Path('pt/biografia/index.html'),
              Path('en/biography/index.html'),
          ]
          for path in surfaces:
              if pdf in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'BEST PDF card/link still present in {path}')
          archive = Path('assets/archive/internet/best-kenshoo/best08_workshop-facebook-ads-2014.pdf')
          if not archive.exists():
              raise SystemExit('archival Day 2 PDF was unexpectedly removed')
          print('BEST PDF card removed from public narrative surfaces; archival PDF preserved.')
          PY
      - name: Remove one-shot machinery and commit result
        run: |
          rm .github/workflows/dave-best-pdf-reset-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove current BEST workshop PDF card pending two-day rebuild'
          git push
