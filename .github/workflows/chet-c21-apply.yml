name: Chet C2.1 one-shot apply

on:
  push:
    branches: [work/chet-c2-melissa-chapter-page]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chet-c2-melissa-chapter-page
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply C2.1 and synchronize
        run: |
          python tools/chet_c21_melissa_open.py
          python tools/sync_entries.py
          python tools/sync_full_biography.py
          python tools/sync_reader_disclosure_loader.py
          python tools/build_chapter_pages.py
      - name: Verify focused invariants
        run: |
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/sync_reader_disclosure_loader.py --check
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
          python tools/editorial_parity.py --check
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_reader_ux.js
          grep -q '"always_open_paths"' data/entries.json
          grep -q 'pt/ia-hai/index.html' data/entries.json
          grep -q 'en/ai-hai/index.html' data/entries.json
      - name: Commit synchronized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'C2.1: keep Melissa open on AI HAI verticals'
          git push origin HEAD:work/chet-c2-melissa-chapter-page
