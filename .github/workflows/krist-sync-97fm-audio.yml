name: Krist sync 97FM audio

on:
  push:
    branches:
      - feat/music-kid-vinil-97fm-audio

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/music-kid-vinil-97fm-audio
          fetch-depth: 0
      - run: python -m pip install beautifulsoup4
      - run: python tools/sync_entries.py
      - run: python tools/sync_full_biography.py
      - run: python tools/build_chapter_pages.py
      - run: python tools/editorial_parity.py --accept music-coitado-1994
      - name: Commit synchronized surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/entries/pt/music-coitado-1994.inc content/entries/en/music-coitado-1994.inc pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html pt/musica/kid-vinil-97fm-rock/index.html en/music/kid-vinil-97fm-rock/index.html data/editorial_parity.json
          if git diff --cached --quiet; then
            echo "No generated changes produced"
            exit 1
          fi
          git commit -m "chore: sync 97FM interview audio surfaces"
          git push origin HEAD:feat/music-kid-vinil-97fm-audio
