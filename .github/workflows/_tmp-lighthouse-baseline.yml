name: Temporary Lighthouse baseline

on:
  push:
    branches: [work/lighthouse-baseline-2026-08-29]
    paths:
      - '.github/workflows/_tmp-lighthouse-baseline.yml'

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/lighthouse-baseline-2026-08-29
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse
        run: npm install --global lighthouse

      - name: Record environment
        run: |
          node --version
          lighthouse --version
          google-chrome --version

      - name: Run four controlled audits
        run: |
          mkdir -p .tmp-lighthouse
          lighthouse 'https://marcelonicchio.github.io/pt/biografia/' \
            --only-categories=performance --output=json \
            --output-path=.tmp-lighthouse/fullbio-mobile.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet
          lighthouse 'https://marcelonicchio.github.io/pt/biografia/' \
            --preset=desktop --only-categories=performance --output=json \
            --output-path=.tmp-lighthouse/fullbio-desktop.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet
          lighthouse 'https://marcelonicchio.github.io/pt/internet/' \
            --only-categories=performance --output=json \
            --output-path=.tmp-lighthouse/internet-mobile.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet
          lighthouse 'https://marcelonicchio.github.io/pt/internet/' \
            --preset=desktop --only-categories=performance --output=json \
            --output-path=.tmp-lighthouse/internet-desktop.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' --quiet

      - name: Build baseline document
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cases = [
            ['Full Biography PT', 'mobile', '.tmp-lighthouse/fullbio-mobile.json'],
            ['Full Biography PT', 'desktop', '.tmp-lighthouse/fullbio-desktop.json'],
            ['Internet & Performance PT', 'mobile', '.tmp-lighthouse/internet-mobile.json'],
            ['Internet & Performance PT', 'desktop', '.tmp-lighthouse/internet-desktop.json'],
          ];
          const ms = (v) => v == null ? 'n/a' : `${Math.round(v)} ms`;
          const num = (v, digits=3) => v == null ? 'n/a' : Number(v).toFixed(digits);
          const mib = (v) => v == null ? 'n/a' : `${(v/1048576).toFixed(2)} MiB`;
          const rows = [];
          let environment = null;
          for (const [surface, mode, file] of cases) {
            const lhr = JSON.parse(fs.readFileSync(file, 'utf8'));
            environment ||= {
              lighthouse: lhr.lighthouseVersion,
              userAgent: lhr.userAgent,
              fetchTime: lhr.fetchTime,
            };
            const a = lhr.audits;
            const requests = a['network-requests']?.details?.items || [];
            const transfer = requests.reduce((sum, item) => sum + (item.transferSize || 0), 0);
            rows.push({
              surface, mode,
              score: Math.round((lhr.categories.performance.score || 0) * 100),
              fcp: a['first-contentful-paint']?.numericValue,
              lcp: a['largest-contentful-paint']?.numericValue,
              cls: a['cumulative-layout-shift']?.numericValue,
              tbt: a['total-blocking-time']?.numericValue,
              si: a['speed-index']?.numericValue,
              tti: a['interactive']?.numericValue,
              transfer,
              requests: requests.length,
              dom: a['dom-size']?.numericValue,
            });
          }
          let out = `# Lighthouse baseline — before progressive disclosure\n\n`;
          out += `Reference: 2026-08-29 BRT  \n`;
          out += `Production commit measured: \`4647e3e910d7f690950537807866438c4ad1d4f5\`  \n`;
          out += `Measurement source: Lighthouse CLI in GitHub Actions against the public GitHub Pages deployment.\n\n`;
          out += `This is **lab data**, not CrUX field data. Values can vary between runs; use the same protocol for post-UX comparison and interpret direction/magnitude rather than treating one run as an immutable truth.\n\n`;
          out += `## Environment\n\n- Lighthouse: ${environment.lighthouse}\n- Fetch time: ${environment.fetchTime}\n- User agent: ${environment.userAgent}\n\n`;
          out += `## Results\n\n| Surface | Mode | Score | FCP | LCP | CLS | TBT | Speed Index | TTI | Transfer observed | Requests | DOM elements |\n|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n`;
          for (const r of rows) {
            out += `| ${r.surface} | ${r.mode} | ${r.score} | ${ms(r.fcp)} | ${ms(r.lcp)} | ${num(r.cls)} | ${ms(r.tbt)} | ${ms(r.si)} | ${ms(r.tti)} | ${mib(r.transfer)} | ${r.requests} | ${r.dom == null ? 'n/a' : Math.round(r.dom)} |\n`;
          }
          out += `\n## Interpretation guardrails\n\n`;
          out += `- These numbers measure the current public pages **before** progressive disclosure.\n`;
          out += `- They are browser/lab measurements and are distinct from the repository-side \`full-scroll-max\` inventory.\n`;
          out += `- Lazy-loaded image inventory is not equivalent to initial transfer.\n`;
          out += `- Do not turn any single score or millisecond value into an editorial law.\n`;
          out += `- Repeat the same four-case protocol after the disclosure prototype/production UX is implemented.\n`;
          out += `- If repeated runs vary materially, record multiple runs/median before drawing a performance conclusion.\n\n`;
          out += `## URLs measured\n\n- https://marcelonicchio.github.io/pt/biografia/\n- https://marcelonicchio.github.io/pt/internet/\n`;
          fs.writeFileSync('docs/lighthouse-baseline-2026-08-29.md', out);
          console.log(out);
          NODE

      - name: Commit baseline document
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lighthouse-baseline-2026-08-29.md
          git commit -m 'Record pre-UX Lighthouse baseline'
          git push origin HEAD:work/lighthouse-baseline-2026-08-29
