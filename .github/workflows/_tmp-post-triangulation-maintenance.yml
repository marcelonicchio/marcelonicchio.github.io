name: Temporary post-triangulation maintenance

on:
  push:
    branches: [work/post-triangulation-maintenance]

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/post-triangulation-maintenance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 Pillow

      - name: Apply maintenance content
        run: |
          python - <<'PY'
          from pathlib import Path

          configs = {
              'pt/internet/index.html': 'Durante a imersão, ministrada por <strong>João Dalla</strong>, conheceu outro aluno: <strong>Herik Mourão</strong>.',
              'en/internet/index.html': 'During the immersion course taught by <strong>João Dalla</strong>, he met another student: <strong>Herik Mourão</strong>.',
          }
          for path_s, needle in configs.items():
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              marker = 'goobec-class-2009.webp'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'{path_s}: Goobec figure not found')
              fig_start = text.rfind('<figure class="thread-media thread-media--linked">', 0, pos)
              fig_end = text.find('</figure>', pos)
              if fig_start < 0 or fig_end < 0:
                  raise SystemExit(f'{path_s}: could not isolate Goobec figure')
              fig_end += len('</figure>')
              figure = text[fig_start:fig_end]
              text = text[:fig_start] + text[fig_end:]
              target = text.find(needle)
              if target < 0:
                  raise SystemExit(f'{path_s}: target Goobec paragraph not found')
              para_end = text.find('</p>', target) + len('</p>')
              text = text[:para_end] + figure + text[para_end:]
              sem_start = text.find('<section id="sem"')
              cookieweb_start = text.find('<section id="cookieweb"')
              if not (sem_start < text.find(marker) < cookieweb_start):
                  raise SystemExit(f'{path_s}: Goobec figure did not land in #sem')
              path.write_text(text, encoding='utf-8')
          PY

          git mv 'assets/archive/communication/folhateen/folhateen - 23-04-2000 - Reportagem - Órfãos do Rock Pag 1de2 (1-2) - 300dpi.jpg' 'assets/archive/communication/folhateen/folhateen - 23-04-2001 - Reportagem - Órfãos do Rock Pag 1de2 (1-2) - 300dpi.jpg'
          git mv 'assets/archive/communication/folhateen/folhateen - 23-04-2000 - Reportagem - Órfãos do Rock Pag 1de2 (2-2) - 300dpi.jpg' 'assets/archive/communication/folhateen/folhateen - 23-04-2001 - Reportagem - Órfãos do Rock Pag 1de2 (2-2) - 300dpi.jpg'
          git mv 'assets/archive/communication/folhateen/folhateen - 23-04-2000 - Reportagem - Órfãos do Rock Pag 2de2 - 300dpi.jpg' 'assets/archive/communication/folhateen/folhateen - 23-04-2001 - Reportagem - Órfãos do Rock Pag 2de2 - 300dpi.jpg'

          python tools/editorial_parity.py --accept internet-sem
          python tools/editorial_parity.py --accept internet-cookieweb
          python tools/sync_full_biography.py

          python - <<'PY'
          from pathlib import Path
          pages = {
              'pt/biografia/index.html': ('Biografia completa — Marcelo Nicchio', 'Biografia completa de Marcelo Nicchio: música, comunicação, Internet & Performance, audiovisual e pesquisa independente em Human–AI Interaction.', 'https://marcelonicchio.github.io/pt/biografia/', 'Retrato de Marcelo Nicchio'),
              'en/biography/index.html': ('Complete biography — Marcelo Nicchio', 'Complete biography of Marcelo Nicchio: music, communication, Internet & Performance, audiovisual work and independent Human–AI Interaction research.', 'https://marcelonicchio.github.io/en/biography/', 'Portrait of Marcelo Nicchio'),
          }
          author = '  <meta name="author" content="Marcelo Nicchio">'
          for path_s, (title, description, url, alt) in pages.items():
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              if 'property="og:image"' in text:
                  raise SystemExit(f'{path_s}: og:image already exists')
              block = f'''\n  <meta property="og:type" content="profile">\n  <meta property="og:title" content="{title}">\n  <meta property="og:description" content="{description}">\n  <meta property="og:url" content="{url}">\n  <meta property="og:site_name" content="Marcelo Nicchio — Official Hub">\n  <meta property="og:image" content="https://marcelonicchio.github.io/assets/img/marcelo-home-portrait.png">\n  <meta property="og:image:type" content="image/png">\n  <meta property="og:image:width" content="717">\n  <meta property="og:image:height" content="717">\n  <meta property="og:image:alt" content="{alt}">\n  <meta name="twitter:card" content="summary">\n  <meta name="twitter:title" content="{title}">\n  <meta name="twitter:description" content="{description}">\n  <meta name="twitter:image" content="https://marcelonicchio.github.io/assets/img/marcelo-home-portrait.png">'''
              if text.count(author) != 1:
                  raise SystemExit(f'{path_s}: author marker count != 1')
              path.write_text(text.replace(author, author + block, 1), encoding='utf-8')
          PY

          cat > tools/audit_page_weight.py <<'PY'
          #!/usr/bin/env python3
          """Report page-delivery image weight; warn by default, gate only with --strict."""
          from __future__ import annotations
          import argparse
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from bs4 import BeautifulSoup

          ROOT = Path(__file__).resolve().parents[1]

          def local_file(url: str | None) -> Path | None:
              if not url:
                  return None
              url = url.strip()
              if url.startswith(('http://', 'https://', '//', 'data:')):
                  return None
              rel = unquote(urlsplit(url).path).lstrip('/')
              return ROOT / rel if rel else None

          def srcset_urls(value: str | None) -> list[str]:
              if not value:
                  return []
              return [part.strip().split()[0] for part in value.split(',') if part.strip()]

          def mib(value: int) -> str:
              return f'{value / (1024 * 1024):.2f} MiB'

          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument('--warn-mb', type=float, default=4.0)
              parser.add_argument('--strict', action='store_true')
              args = parser.parse_args()
              threshold = int(args.warn_mb * 1024 * 1024)
              rows = []
              over = []
              missing = []
              for html in sorted(ROOT.rglob('*.html')):
                  if '.git' in html.parts:
                      continue
                  soup = BeautifulSoup(html.read_text(encoding='utf-8'), 'html.parser')
                  images = soup.find_all('img')
                  src_files: set[Path] = set()
                  chosen_max_files: set[Path] = set()
                  for img in images:
                      candidates = []
                      src = local_file(img.get('src'))
                      if src is not None:
                          candidates.append(src)
                          if src.exists():
                              src_files.add(src)
                          else:
                              missing.append((str(html.relative_to(ROOT)), str(src.relative_to(ROOT))))
                      for url in srcset_urls(img.get('srcset')):
                          p = local_file(url)
                          if p is not None:
                              candidates.append(p)
                              if not p.exists():
                                  missing.append((str(html.relative_to(ROOT)), str(p.relative_to(ROOT))))
                      existing = [p for p in candidates if p.exists()]
                      if existing:
                          chosen_max_files.add(max(existing, key=lambda p: p.stat().st_size))
                  src_bytes = sum(p.stat().st_size for p in src_files)
                  estimated = sum(p.stat().st_size for p in chosen_max_files)
                  rel = str(html.relative_to(ROOT))
                  rows.append((estimated, src_bytes, html.stat().st_size, len(images), rel))
                  if estimated > threshold:
                      over.append((rel, estimated))
              rows.sort(reverse=True)
              print(f'Page-weight report — warning threshold: {args.warn_mb:.2f} MiB')
              print('estimated=max local src/srcset candidate per image; linked archival masters are excluded')
              for estimated, src_bytes, html_bytes, count, rel in rows:
                  print(f'{rel}: images={count}, estimated={mib(estimated)}, src-only={mib(src_bytes)}, html={html_bytes / 1024:.1f} KiB')
              for rel, size in over:
                  print(f'::warning file={rel}::Estimated image payload {mib(size)} exceeds {args.warn_mb:.2f} MiB review threshold')
              for rel, asset in sorted(set(missing)):
                  print(f'::warning file={rel}::Referenced local image candidate not found: {asset}')
              return 1 if args.strict and over else 0

          if __name__ == '__main__':
              raise SystemExit(main())
          PY

      - name: Run report and full audit suite
        run: |
          python tools/audit_page_weight.py
          python tools/sync_navigation.py --check
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/audit_galleries.py
          python tools/editorial_parity.py --check
          python tools/sync_full_biography.py --check
          python tools/audit_full_biography.py
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py

      - name: Commit non-workflow maintenance files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/internet/index.html en/internet/index.html pt/biografia/index.html en/biography/index.html data/editorial_parity.json tools/audit_page_weight.py assets/archive/communication/folhateen
          git commit -m "Apply post-triangulation maintenance"
          git push origin HEAD:work/post-triangulation-maintenance
