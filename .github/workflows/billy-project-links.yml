name: Billy Projects authority links

on:
  push:
    branches:
      - billy/projects-authority-links-2026-09-06

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: billy/projects-authority-links-2026-09-06
          fetch-depth: 0
      - name: Align PT/EN project links with live authority pages
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('pt/projetos/index.html'): {
                  '/pt/internet/#mirantte': '/pt/internet/mirantte-news/',
                  '/pt/comunicacao/#meia-noite': '/pt/comunicacao/meia-noite-e-uns/',
                  '/pt/ia-hai/#melissa': '/pt/ia-hai/melissa-1-0/',
              },
              Path('en/projects/index.html'): {
                  '/en/internet/#mirantte': '/en/internet/mirantte-news/',
                  '/en/communication/#meia-noite': '/en/communication/meia-noite-e-uns/',
                  '/en/ai-hai/#melissa': '/en/ai-hai/melissa-1-0/',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'{path}: expected authority-link source not found: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit aligned links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/projetos/index.html en/projects/index.html
          git commit -m "chore: point Projects cards to standalone authority pages"
          git push origin HEAD:billy/projects-authority-links-2026-09-06