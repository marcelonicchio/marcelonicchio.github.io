name: Dave Phase 2 Fix HAI Open

on:
  push:
    branches:
      - dave/phase2-chapter-pages-2026-09-17

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dave/phase2-chapter-pages-2026-09-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 Pillow
      - name: Preserve continuous-reading IA/HAI policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/entries.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          wanted = {'hai-pro1', 'hai-pro2'}
          seen = set()
          for entry in data['entries']:
              if entry.get('id') in wanted:
                  entry['reader_presentation'] = {
                      'state': 'normal',
                      'always_open_paths': [
                          'pt/ia-hai/index.html',
                          'en/ai-hai/index.html'
                      ]
                  }
                  seen.add(entry['id'])
          missing = wanted - seen
          if missing:
              raise SystemExit(f'Missing entries: {sorted(missing)}')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate targeted architecture
        run: |
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
      - name: Commit fix and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dave-phase2-fix-hai-open.yml
          git add data/entries.json
          git commit -m "fix: preserve continuous IA HAI reading for PRO pages"
          git push origin HEAD:dave/phase2-chapter-pages-2026-09-17
