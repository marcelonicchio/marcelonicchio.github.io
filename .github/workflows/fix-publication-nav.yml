name: Fix publication navigation

on:
  push:
    branches: [internet-performance-unification]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internet-performance-unification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore unified vertical link
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [
              (Path('pt/publicacoes/index.html'), '<a href="/pt/comunicacao/">Comunicação</a>', '<a href="/pt/internet/">Internet &amp; Performance</a>'),
              (Path('en/publications/index.html'), '<a href="/en/communication/">Communication</a>', '<a href="/en/internet/">Internet &amp; Performance</a>'),
          ]
          for path, anchor, new_link in targets:
              text = path.read_text(encoding='utf-8')
              if 'href="/pt/internet/"' in text or 'href="/en/internet/"' in text:
                  continue
              text = text.replace(anchor, anchor + new_link, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/publicacoes/index.html en/publications/index.html
          git commit -m "Restore Internet & Performance in publication navigation"
          git push origin HEAD:internet-performance-unification
