name: Billy wave 1 regenerate

on:
  push:
    branches:
      - billy/chapter-promotion-wave1-2026-09-06

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: billy/chapter-promotion-wave1-2026-09-06
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Promote wave 1 registry and launch set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          promoted = {
              "internet-mirantte",
              "internet-cookieweb",
              "communication-folha",
              "audiovisual-meia-noite",
              "hai-melissa",
          }
          launch_paths = [
              "pt/internet/mirantte-news/index.html",
              "en/internet/mirantte-news/index.html",
              "pt/internet/cookieweb/index.html",
              "en/internet/cookieweb/index.html",
              "pt/comunicacao/folhateen-orfaos-do-rock/index.html",
              "en/communication/folhateen-orphans-of-rock/index.html",
              "pt/comunicacao/meia-noite-e-uns/index.html",
              "en/communication/meia-noite-e-uns/index.html",
              "pt/ia-hai/melissa-1-0/index.html",
              "en/ai-hai/melissa-1-0/index.html",
          ]

          entries_path = Path("data/entries.json")
          data = json.loads(entries_path.read_text(encoding="utf-8"))
          found = set()
          for entry in data["entries"]:
              if entry.get("id") in promoted:
                  page = entry.get("chapter_page", {})
                  if page.get("status") != "pilot":
                      raise SystemExit(f"{entry['id']}: expected pilot Chapter Page")
                  page["indexing"] = "index,follow"
                  found.add(entry["id"])
          missing = promoted - found
          if missing:
              raise SystemExit(f"missing promoted entries: {sorted(missing)}")
          entries_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          audit_path = Path("tools/audit_site.py")
          text = audit_path.read_text(encoding="utf-8")
          marker = "}\n\nLEGACY_CANONICAL = {"
          if marker not in text:
              raise SystemExit("LAUNCH_INDEXABLE closing marker not found")
          additions = "".join(f'    "{rel}",\n' for rel in launch_paths if f'    "{rel}",' not in text)
          if additions:
              text = text.replace(marker, additions + marker, 1)
              audit_path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate managed site surfaces
        run: |
          python tools/sync_entries.py
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/build_sitemap.py
      - name: Commit generated promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json tools/audit_site.py pt en sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: promote mature chapter authority pages"
          git push origin HEAD:billy/chapter-promotion-wave1-2026-09-06
