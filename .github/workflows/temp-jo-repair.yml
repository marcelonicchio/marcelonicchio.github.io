name: Repair Jô 8-video surfaces

on:
  push:
    branches: [fix/jo-8-videos]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace every Jô evidence block in source and generated biography
        shell: python
        run: |
          from pathlib import Path
          import re

          videos = [
            ("https://youtu.be/c4VAEll1mM4?si=nKFKGSkl5gwMzboP", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores 1/8", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes 1/8"),
            ("https://youtu.be/h0GPkE5SBxM?si=HGG6GSlFBA1kJsOI", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores 2/8", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes 2/8"),
            ("https://youtu.be/ThxZrYgh1eY?si=SfmwuFaemfmYM5BY", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores 3/8", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes 3/8"),
            ("https://youtu.be/_7zttgW8qV8?si=H1gNfNWjGHKXrtH8", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores 4/8", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes 4/8"),
            ("https://youtu.be/cJYbbmOtRyI?si=8zNN0TjqPQbShaoI", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores 5/8", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes 5/8"),
            ("https://youtu.be/MCjI0bA7CCc?si=k2paUz0x3WFi4rwm", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores - Passagem de Som - “A Enchente”", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes - Soundcheck - “A Enchente”"),
            ("https://youtu.be/zrXzdmsIMjg?si=si9xEgOO_oQGIT-B", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores - Passagem de Som - “Um Anjo do Céu”", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes - Soundcheck - “Um Anjo do Céu”"),
            ("https://youtu.be/Nu8R3TlK8Kc?si=qbhQKx1QmCqfoZf3", "Coitado do Próximo - Programa do Jô - 27/06/2001 · Bastidores - Passagem de Som - “Mulher SP”", "Coitado do Próximo - Programa do Jô - Jun. 27, 2001 · Behind the scenes - Soundcheck - “Mulher SP”"),
          ]
          old_ids = ['4NKHy_C8wsI','cJT24XEmxxE','SIuiOgpGq8g','MCjI0bA7CCc','zrXzdmsIMjg']
          labels_pt = [v[1] for v in videos]
          labels_en = [v[2] for v in videos]
          link_pattern = re.compile(r'<a href="https://youtu\.be/[^\"]+" target="_blank" rel="noopener noreferrer">.*?</a>')
          block_pattern = re.compile(r'<div class="evidence-links inline-links">.*?</div>', re.S)

          for filename, labels in [
            ('pt/musica/index.html', labels_pt),
            ('en/music/index.html', labels_en),
            ('pt/biografia/index.html', labels_pt),
            ('en/biography/index.html', labels_en),
          ]:
            path = Path(filename)
            text = path.read_text(encoding='utf-8')
            changed = 0
            def repl(m):
              nonlocal changed
              block = m.group(0)
              if any(old in block for old in old_ids):
                changed += 1
                links = ''.join(f'<a href="{url}" target="_blank" rel="noopener noreferrer">{label} ↗</a>' for (url, _, _), label in zip(videos, labels))
                return '<div class="evidence-links inline-links">' + links + '</div>'
              return block
            new = block_pattern.sub(repl, text)
            if changed == 0:
              raise SystemExit(f'No Jô evidence block replaced in {filename}')
            path.write_text(new, encoding='utf-8')
            print(f'{filename}: replaced {changed} Jô evidence block(s)')

          expected = ['c4VAEll1mM4','h0GPkE5SBxM','ThxZrYgh1eY','_7zttgW8qV8','cJYbbmOtRyI','MCjI0bA7CCc','zrXzdmsIMjg','Nu8R3TlK8Kc']
          for filename, _ in [('pt/musica/index.html',0),('en/music/index.html',0),('pt/biografia/index.html',0),('en/biography/index.html',0)]:
            t=Path(filename).read_text(encoding='utf-8')
            for u in expected:
              if u not in t: raise SystemExit(f'{u} missing from {filename}')
          print('Final validation: all 8 requested video IDs exist in all four surfaces.')
      - name: Commit and remove all temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html
          git rm .github/workflows/temp-jo-8-videos.yml .github/workflows/temp-jo-finalize.yml .github/workflows/temp-jo-repair.yml
          git commit -m "fix: add all 8 Programa do Jô backstage videos"
          git push
