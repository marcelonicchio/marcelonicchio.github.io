name: Temporary Melissa IA thread preview

on:
  push:
    branches:
      - work/melissa-ia-thread-preview

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/melissa-ia-thread-preview
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit dependencies
        run: python -m pip install beautifulsoup4
      - name: Enable selective IA thread disclosure
        run: |
          python - <<'PY'
          from pathlib import Path

          # Loader: IA/HAI becomes a normal supported surface.
          path = Path('assets/js/reader-disclosure-loader.js')
          text = path.read_text(encoding='utf-8')
          old = """  const defaultSupported = new Set([\n    '/pt/biografia/', '/en/biography/',\n    '/pt/internet/', '/en/internet/'\n  ]);"""
          new = """  const defaultSupported = new Set([\n    '/pt/biografia/', '/en/biography/',\n    '/pt/internet/', '/en/internet/',\n    '/pt/ia-hai/', '/en/ai-hai/'\n  ]);"""
          if text.count(old) != 1:
              raise SystemExit('Reader loader defaultSupported block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Reader core: map IA routes, transform only registered entries there, and hide global controls.
          path = Path('assets/js/reader-disclosure.js')
          text = path.read_text(encoding='utf-8')
          old = """    '/pt/audiovisual/': 'pt/audiovisual/index.html',\n    '/en/audiovisual/': 'en/audiovisual/index.html'\n  };"""
          new = """    '/pt/audiovisual/': 'pt/audiovisual/index.html',\n    '/en/audiovisual/': 'en/audiovisual/index.html',\n    '/pt/ia-hai/': 'pt/ia-hai/index.html',\n    '/en/ai-hai/': 'en/ai-hai/index.html'\n  };"""
          if text.count(old) != 1:
              raise SystemExit('Reader route map insertion point not found exactly once')
          text = text.replace(old, new)

          old = """    const fullBio = pagePath === '/pt/biografia/' || pagePath === '/en/biography/';\n    const selector = fullBio ? 'section.chapter.bio-entry' : 'article.article-body > section.chapter';"""
          new = """    const fullBio = pagePath === '/pt/biografia/' || pagePath === '/en/biography/';\n    const selectivePage = pagePath === '/pt/ia-hai/' || pagePath === '/en/ai-hai/';\n    const selector = fullBio ? 'section.chapter.bio-entry' : 'article.article-body > section.chapter';"""
          if text.count(old) != 1:
              raise SystemExit('Reader selective-page insertion point not found exactly once')
          text = text.replace(old, new)

          old = """      const entry = metadataFor(section);\n      const related = relatedFor(section);"""
          new = """      const entry = metadataFor(section);\n      if (selectivePage && !entry) return;\n      const related = relatedFor(section);"""
          if text.count(old) != 1:
              raise SystemExit('Reader selective-entry gate not found exactly once')
          text = text.replace(old, new)

          old = """    if (fullBio) {\n      const intro = document.querySelector('.bio-chronology-intro');\n      if (intro) intro.insertAdjacentElement('afterend', controls);\n      else chapters[0].insertAdjacentElement('beforebegin', controls);\n    } else {\n      chapters[0].insertAdjacentElement('beforebegin', controls);\n    }\n\n    openAll.addEventListener('click', () => activeDetails.forEach((details) => { details.open = true; }));\n    closeAll.addEventListener('click', () => activeDetails.forEach((details) => { details.open = false; }));"""
          new = """    if (!selectivePage) {\n      if (fullBio) {\n        const intro = document.querySelector('.bio-chronology-intro');\n        if (intro) intro.insertAdjacentElement('afterend', controls);\n        else chapters[0].insertAdjacentElement('beforebegin', controls);\n      } else {\n        chapters[0].insertAdjacentElement('beforebegin', controls);\n      }\n\n      openAll.addEventListener('click', () => activeDetails.forEach((details) => { details.open = true; }));\n      closeAll.addEventListener('click', () => activeDetails.forEach((details) => { details.open = false; }));\n    }"""
          if text.count(old) != 1:
              raise SystemExit('Reader controls block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Loader sync source: IA/HAI is now an intentional target.
          path = Path('tools/sync_reader_disclosure_loader.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"""Install the dormant query-flag disclosure loader on selected Reader Pages."""', '"""Install the disclosure loader on selected Reader Pages."""')
          old = """    \"pt/audiovisual/index.html\",\n    \"en/audiovisual/index.html\",\n]"""
          new = """    \"pt/audiovisual/index.html\",\n    \"en/audiovisual/index.html\",\n    \"pt/ia-hai/index.html\",\n    \"en/ai-hai/index.html\",\n]"""
          if text.count(old) != 1:
              raise SystemExit('Loader sync target block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Browser smoke: Melissa collapses on IA/HAI itself; neighboring sections stay flat/open.
          path = Path('tools/smoke_reader_ux.js')
          text = path.read_text(encoding='utf-8')
          old = """  await melissaBio.locator('details.reader-disclosure > summary').click();\n\n  // Full Biography: deep-link opening + registry-backed metadata without query flag."""
          new = """  await melissaBio.locator('details.reader-disclosure > summary').click();\n\n  // IA/HAI selective pilot: Melissa alone gets the compact/full two-state treatment.\n  await page.goto(`${BASE}/pt/ia-hai/`, {waitUntil: 'networkidle'});\n  assert(await page.locator('details.reader-disclosure').count() === 1, 'IA/HAI should expose exactly one selective disclosure');\n  assert(await page.locator('.reader-disclosure-controls').count() === 0, 'IA/HAI selective pilot should not show global disclosure controls');\n  assert(await page.locator('#pro2 details.reader-disclosure').count() === 0, 'PRO v2 was unexpectedly collapsed');\n  assert(await page.locator('#pro1 details.reader-disclosure').count() === 0, 'PRO v1 was unexpectedly collapsed');\n  const melissaHai = page.locator('#melissa');\n  const melissaHaiPreview = melissaHai.locator('.reader-disclosure__preview');\n  assert(await melissaHaiPreview.isVisible(), 'Melissa IA/HAI collapsed preview is not visible');\n  assert((await melissaHaiPreview.innerText()).includes('63 horas e 518 prompts'), 'Melissa IA/HAI preview lost core case metrics');\n  assert(await melissaHaiPreview.locator('img').getAttribute('src') === '/assets/media/thread/melissa1_0_selfportrait300kb.jpg', 'Melissa IA/HAI preview cover image incorrect');\n  await melissaHai.locator('details.reader-disclosure > summary').click();\n  assert(await melissaHai.locator('details.reader-disclosure').getAttribute('open') !== null, 'Melissa IA/HAI did not expand');\n  assert(await melissaHaiPreview.isHidden(), 'Melissa IA/HAI compact preview remained visible after expansion');\n  assert((await melissaHai.locator('.reader-disclosure__body').innerText()).includes('O que aconteceu depois não foi planejado.'), 'Melissa IA/HAI full body was not preserved');\n\n  // Full Biography: deep-link opening + registry-backed metadata without query flag."""
          if text.count(old) != 1:
              raise SystemExit('Desktop IA smoke insertion point not found exactly once')
          text = text.replace(old, new)

          old = """ * Full Biography and Internet & Performance use disclosure by default. Communication\n * and Audiovisual remain query-flag pilot surfaces while their UX is still under review."""
          new = """ * Full Biography and Internet & Performance use disclosure by default. IA/HAI uses\n * selective disclosure for explicitly registered entries. Communication and Audiovisual\n * remain query-flag pilot surfaces while their UX is still under review."""
          if text.count(old) != 1:
              raise SystemExit('Smoke header comment not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/sync_reader_disclosure_loader.py
      - name: Validate selective IA pilot
        run: |
          python tools/sync_reader_disclosure_loader.py --check
          python tools/audit_entries.py
          node --check assets/js/reader-disclosure-loader.js
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_reader_ux.js
      - name: Commit selective IA pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/reader-disclosure-loader.js assets/js/reader-disclosure.js tools/sync_reader_disclosure_loader.py tools/smoke_reader_ux.js pt/ia-hai/index.html en/ai-hai/index.html
          git commit -m "Apply Melissa collapsed preview to IA thread"
          git push origin HEAD:work/melissa-ia-thread-preview
