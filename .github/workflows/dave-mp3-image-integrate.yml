name: Dave integrate MP3 image
on:
  push:
    branches:
      - dave/music-mp3-image-2026-09-17
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dave/music-mp3-image-2026-09-17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install beautifulsoup4
      - name: Integrate image into PT/EN music threads
        run: |
          python - <<'PY'
          from pathlib import Path

          img = Path('assets/archive/music/coitado-do-proximo/2000-a-era-do-mp3/submarino_mp3_01_editado.jpg')
          data = img.read_bytes()
          if data[:2] != b'\xff\xd8':
              raise SystemExit('Expected JPEG')
          i = 2
          w = h = None
          sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          while i < len(data):
              while i < len(data) and data[i] != 0xFF:
                  i += 1
              while i < len(data) and data[i] == 0xFF:
                  i += 1
              if i >= len(data): break
              marker = data[i]; i += 1
              if marker in {0xD8,0xD9} or 0xD0 <= marker <= 0xD7:
                  continue
              if i + 2 > len(data): break
              seglen = int.from_bytes(data[i:i+2], 'big')
              if marker in sof:
                  if i + 7 > len(data): break
                  h = int.from_bytes(data[i+3:i+5], 'big')
                  w = int.from_bytes(data[i+5:i+7], 'big')
                  break
              i += seglen
          if not w or not h:
              raise SystemExit('Could not read JPEG dimensions')
          print(f'JPEG dimensions: {w}x{h}')

          src = '/assets/archive/music/coitado-do-proximo/2000-a-era-do-mp3/submarino_mp3_01_editado.jpg'
          pt = Path('pt/musica/index.html')
          en = Path('en/music/index.html')
          ptxt = pt.read_text(encoding='utf-8')
          etxt = en.read_text(encoding='utf-8')

          pt_old = '<section class="chapter music-entry" id="music-mp3-era-2000" data-bio-key="music-mp3-era-2000"><div class="phase-year">2000</div><h2>A Era do MP3</h2><p>No mesmo período do lançamento do segundo trabalho, serviços de distribuição gratuita, como o Napster, entraram em plena atividade. Com isso, portais como o Submarino abriram, em parceria com a gravadora Trama, áreas de downloads de artistas brasileiros em formato MP3. Durante um período, uma das músicas de trabalho, “Estava Comigo”, esteve entre as primeiras colocações em número de downloads.</p></section>'
          pt_fig = f'<figure class="thread-media thread-media--linked"><a aria-label="Abrir chart de downloads em MP3 do Submarino/Trama em tamanho maior" href="{src}" rel="noopener noreferrer" target="_blank"><img alt="Chart de downloads em MP3 do portal Submarino/Trama em 22 de maio de 2000." decoding="async" loading="lazy" src="{src}" width="{w}" height="{h}"/></a><figcaption><strong>Submarino/Trama · chart de downloads em MP3 · 22 maio 2000.</strong><span class="thread-media-note">Registro da página de MP3 do portal Submarino/Trama, preservando o ranking de downloads daquele dia.</span><a class="thread-media-open" href="{src}" rel="noopener noreferrer" target="_blank">Abrir imagem em tamanho maior ↗</a></figcaption></figure>'
          pt_new = pt_old[:-10] + pt_fig + '</section>'

          en_old = '<section class="chapter music-entry" id="music-mp3-era-2000" data-bio-key="music-mp3-era-2000"><div class="phase-year">2000</div><h2>The MP3 Era</h2><p>During the same period as the release of the second record, free-distribution services such as Napster entered full operation. In that context, portals such as Submarino opened, in partnership with the Trama record label, download areas for Brazilian artists in MP3 format. For a period, one of the tracks being promoted, “Estava Comigo”, ranked among the leading songs by number of downloads.</p></section>'
          en_fig = f'<figure class="thread-media thread-media--linked"><a aria-label="Open the Submarino/Trama MP3 download chart at full size" href="{src}" rel="noopener noreferrer" target="_blank"><img alt="MP3 download chart from the Submarino/Trama portal on May 22, 2000." decoding="async" loading="lazy" src="{src}" width="{w}" height="{h}"/></a><figcaption><strong>Submarino/Trama · MP3 download chart · May 22, 2000.</strong><span class="thread-media-note">Record of the Submarino/Trama MP3 page preserving the download ranking from that day.</span><a class="thread-media-open" href="{src}" rel="noopener noreferrer" target="_blank">Open image at full size ↗</a></figcaption></figure>'
          en_new = en_old[:-10] + en_fig + '</section>'

          if pt_old not in ptxt: raise SystemExit('PT MP3 section not found exactly')
          if en_old not in etxt: raise SystemExit('EN MP3 section not found exactly')
          pt.write_text(ptxt.replace(pt_old, pt_new, 1), encoding='utf-8')
          en.write_text(etxt.replace(en_old, en_new, 1), encoding='utf-8')
          PY
      - name: Sync generated surfaces
        run: |
          python tools/sync_full_biography.py
          python tools/build_sitemap.py
      - name: Remove obsolete keep file and temporary workflow
        run: |
          rm -f assets/archive/music/coitado-do-proximo/2000-a-era-do-mp3/.gitkeep
          rm -f .github/workflows/dave-mp3-image-integrate.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Submarino MP3 chart to music thread"
          git push origin HEAD:dave/music-mp3-image-2026-09-17
