name: Krist Druida audio insertion

on:
  push:
    branches:
      - feat/music-druida-1993-audio

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/music-druida-1993-audio
          fetch-depth: 0
      - name: Insert PT EN rehearsal audio block
        run: python tools/krist_insert_druida_audio.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "feat: publish 1993 Druida rehearsal audio"
          git push origin HEAD:feat/music-druida-1993-audio
