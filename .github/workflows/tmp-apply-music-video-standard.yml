name: TEMP Apply Music video standard

on:
  push:
    branches:
      - feat/video-media-wave1-music-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Apply conservative Music-only video component migration
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import html as htmllib
          import re

          PT = 'pt'
          EN = 'en'

          def esc(s):
              return htmllib.escape(s, quote=True)

          def library(lang, groups):
              total = sum(len(g['actions']) for g in groups)
              title = 'VÍDEOS & MÍDIA' if lang == PT else 'VIDEOS & MEDIA'
              archive = 'Arquivo audiovisual' if lang == PT else 'Audiovisual archive'
              out = [f'<div class="video-library"><div class="video-library__head"><strong>{title} · {total}</strong><span>{archive}</span></div>']
              for g in groups:
                  out.append('<div class="video-library__group">')
                  out.append(f'<div class="video-library__label"><strong>{esc(g["label"])}</strong></div>')
                  out.append(f'<div class="video-library__description">{esc(g["description"])}</div>')
                  out.append('<div class="video-library__actions">')
                  for action in g['actions']:
                      cls = 'video-pill video-pill--primary' if action.get('primary') else 'video-pill'
                      out.append(f'<a class="{cls}" href="{esc(action["url"])}" target="_blank" rel="noopener noreferrer">{esc(action["text"])}</a>')
                  out.append('</div></div>')
              out.append('</div>')
              return ''.join(out)

          def matching_tag_end(text, start, tag):
              token = re.compile(rf'<{tag}\b|</{tag}>', re.I)
              depth = 0
              for m in token.finditer(text, start):
                  if m.group(0).lower().startswith(f'<{tag}'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return m.end()
              raise RuntimeError(f'unclosed <{tag}> from {start}')

          def replace_evidence(text, href, replacement):
              idx = text.find(href)
              if idx < 0:
                  raise RuntimeError(f'missing target URL: {href}')
              start = text.rfind('<div class="evidence-links inline-links">', 0, idx)
              if start < 0:
                  raise RuntimeError(f'missing evidence-links parent for {href}')
              end = matching_tag_end(text, start, 'div')
              if href not in text[start:end]:
                  raise RuntimeError(f'URL escaped target evidence block: {href}')
              return text[:start] + replacement + text[end:]

          def replace_existing_library_descriptions(text, lang):
              marker = 'https://www.youtube.com/watch?v=VvHPQad2S48'
              idx = text.find(marker)
              if idx < 0:
                  raise RuntimeError('Programa do Jô primary video missing')
              start = text.rfind('<div class="video-library"', 0, idx)
              if start < 0:
                  raise RuntimeError('Programa do Jô video-library missing')
              end = matching_tag_end(text, start, 'div')
              old = text[start:end]
              soup = BeautifulSoup(old, 'html.parser')
              root = soup.find('div', class_='video-library')
              groups = root.find_all('div', class_='video-library__group', recursive=False)
              if len(groups) != 3:
                  raise RuntimeError(f'expected 3 Jô groups, found {len(groups)}')
              descs = (
                  [
                      'Registro principal exibido na Rede Globo: o Coitado do Próximo apresenta “Estava Comigo” no Programa do Jô.',
                      'Cinco partes preservam os bastidores da participação da banda no programa.',
                      'Três registros da passagem de som antes da gravação: “A Enchente”, “Um Anjo do Céu” e “Mulher SP”.',
                  ] if lang == PT else [
                      'Main record aired on Rede Globo: Coitado do Próximo performs “Estava Comigo” on Programa do Jô.',
                      'Five parts preserve the backstage material from the band’s appearance on the program.',
                      'Three soundcheck records before the taping: “A Enchente”, “Um Anjo do Céu” and “Mulher SP”.',
                  ]
              )
              for group, desc in zip(groups, descs):
                  current = group.find('div', class_='video-library__description', recursive=False)
                  if current:
                      current.string = desc
                      continue
                  label = group.find('div', class_='video-library__label', recursive=False)
                  node = soup.new_tag('div')
                  node['class'] = ['video-library__description']
                  node.string = desc
                  label.insert_after(node)
              new = str(root)
              return text[:start] + new + text[end:]

          configs = {
              PT: {
                  'music_path': Path('pt/musica/index.html'),
                  'limonada_path': Path('content/entries/pt/music-limonada-1992.inc'),
                  'single': [
                      ('https://www.youtube.com/watch?v=ZOukRoPC87I', library(PT, [{
                          'label':'MOCIDADE ALEGRE · 4 FEV 1989',
                          'description':'Registro audiovisual do desfile em que Nicchio participou da bateria da Mocidade Alegre na Avenida Tiradentes, em São Paulo.',
                          'actions':[{'text':'Assistir desfile','url':'https://www.youtube.com/watch?v=ZOukRoPC87I'}]
                      }])),
                      ('https://www.youtube.com/watch?v=7yjYTV1L0b0', library(PT, [{
                          'label':'PRIMEIRO SHOW · 5 JUL 1992',
                          'description':'Registro original em vídeo do primeiro show preservado do Coitado do Próximo, na Escola Estadual Barão Homem de Mello.',
                          'actions':[{'text':'Vídeo original','url':'https://www.youtube.com/watch?v=7yjYTV1L0b0'}]
                      }])),
                      ('https://www.youtube.com/watch?v=_LBHqq8xF1c', library(PT, [{
                          'label':'TV CULTURA · DESTEMIDOS LIMONADAS & PUNKECAS',
                          'description':'Apresentação televisiva de “O Posto”, composição de duplo sentido ligada ao posto de Roberto Limonada na Avenida Brás Leme.',
                          'actions':[{'text':'O Posto','url':'https://www.youtube.com/watch?v=_LBHqq8xF1c'}]
                      }])),
                      ('https://www.youtube.com/watch?v=giklH5greAc', library(PT, [{
                          'label':'JÔ SOARES ONZE E MEIA · JUN 1992',
                          'description':'Apresentação ao vivo de “Ela Só Gosta de Pizza”, música que se tornaria o elo mais visível entre os Destemidos e Kid Vinil.',
                          'actions':[{'text':'Ela Só Gosta de Pizza','url':'https://www.youtube.com/watch?v=giklH5greAc'}]
                      }])),
                      ('https://youtu.be/He7KvTtB-lg?si=8EAdyPQRLOETE_y6', library(PT, [{
                          'label':'ESTÚDIO ANONIMATO · 1994',
                          'description':'Filmagem remanescente das sessões da primeira demo-tape. O vídeo publicado traz 1993 no título, mas o registro correto é de 1994.',
                          'actions':[{'text':'Sessões de gravação','url':'https://youtu.be/He7KvTtB-lg?si=8EAdyPQRLOETE_y6'}]
                      }])),
                      ('https://youtu.be/ps1XJkvd4Qo?si=ckbe6fUHM0s4q5Kw', library(PT, [{
                          'label':'ETESP / FATEC · JUN 2000',
                          'description':'Registro da passagem de som realizada à tarde e de duas músicas ao vivo antes da apresentação na Avenida Tiradentes.',
                          'actions':[{'text':'Passagem de som + show','url':'https://youtu.be/ps1XJkvd4Qo?si=ckbe6fUHM0s4q5Kw'}]
                      }])),
                  ],
                  'dest_final': library(PT, [
                      {
                          'label':'ENTREVISTA · JÔ SOARES ONZE E MEIA · 1992',
                          'description':'A entrevista dos Destemidos Limonadas & Punkecas no programa foi preservada em duas partes.',
                          'actions':[
                              {'text':'Parte 1','url':'https://www.youtube.com/watch?v=OUBzN8HYuVA'},
                              {'text':'Parte 2','url':'https://www.youtube.com/watch?v=PyTBtNAU3RE'},
                          ]
                      },
                      {
                          'label':'DESTEMIDOS + KID VINIL',
                          'description':'Registro de “Herói do Brasil” com participação especial de Kid Vinil.',
                          'actions':[{'text':'Herói do Brasil','url':'https://www.youtube.com/watch?v=wzsS-G6ywqc'}]
                      }
                  ]),
                  'olympia': library(PT, [{
                      'label':'OLYMPIA · ABERTURA DOS PARALAMAS · 2000',
                      'description':'Dois registros preservados da apresentação do Coitado do Próximo no Olympia, na abertura de Os Paralamas do Sucesso.',
                      'actions':[
                          {'text':'Estava Comigo','url':'https://www.youtube.com/watch?v=V624sY_rl8I','primary':True},
                          {'text':'Ciúmes','url':'https://youtu.be/0-RXucDYMfk'},
                      ]
                  }]),
              },
              EN: {
                  'music_path': Path('en/music/index.html'),
                  'limonada_path': Path('content/entries/en/music-limonada-1992.inc'),
                  'single': [
                      ('https://www.youtube.com/watch?v=ZOukRoPC87I', library(EN, [{
                          'label':'MOCIDADE ALEGRE · FEB. 4, 1989',
                          'description':'Audiovisual record of the parade in which Nicchio performed in the Mocidade Alegre percussion section on Avenida Tiradentes in São Paulo.',
                          'actions':[{'text':'Watch parade','url':'https://www.youtube.com/watch?v=ZOukRoPC87I'}]
                      }])),
                      ('https://www.youtube.com/watch?v=7yjYTV1L0b0', library(EN, [{
                          'label':'FIRST SHOW · JUL. 5, 1992',
                          'description':'Original video record of Coitado do Próximo’s first preserved show, at Escola Estadual Barão Homem de Mello.',
                          'actions':[{'text':'Original video','url':'https://www.youtube.com/watch?v=7yjYTV1L0b0'}]
                      }])),
                      ('https://www.youtube.com/watch?v=_LBHqq8xF1c', library(EN, [{
                          'label':'TV CULTURA · DESTEMIDOS LIMONADAS & PUNKECAS',
                          'description':'Television performance of “O Posto”, a double-entendre song connected to Roberto Limonada’s gas station on Avenida Brás Leme.',
                          'actions':[{'text':'O Posto','url':'https://www.youtube.com/watch?v=_LBHqq8xF1c'}]
                      }])),
                      ('https://www.youtube.com/watch?v=giklH5greAc', library(EN, [{
                          'label':'JÔ SOARES ONZE E MEIA · JUN. 1992',
                          'description':'Live performance of “Ela Só Gosta de Pizza”, the song that became the most visible link between the Destemidos and Kid Vinil.',
                          'actions':[{'text':'Ela Só Gosta de Pizza','url':'https://www.youtube.com/watch?v=giklH5greAc'}]
                      }])),
                      ('https://youtu.be/He7KvTtB-lg?si=8EAdyPQRLOETE_y6', library(EN, [{
                          'label':'ESTÚDIO ANONIMATO · 1994',
                          'description':'Surviving footage from the first demo-tape sessions. The published video says 1993 in its title, but the correct recording year is 1994.',
                          'actions':[{'text':'Recording sessions','url':'https://youtu.be/He7KvTtB-lg?si=8EAdyPQRLOETE_y6'}]
                      }])),
                      ('https://youtu.be/ps1XJkvd4Qo?si=ckbe6fUHM0s4q5Kw', library(EN, [{
                          'label':'ETESP / FATEC · JUN. 2000',
                          'description':'Record of the afternoon soundcheck and two live songs before the performance on Avenida Tiradentes.',
                          'actions':[{'text':'Soundcheck + show','url':'https://youtu.be/ps1XJkvd4Qo?si=ckbe6fUHM0s4q5Kw'}]
                      }])),
                  ],
                  'dest_final': library(EN, [
                      {
                          'label':'INTERVIEW · JÔ SOARES ONZE E MEIA · 1992',
                          'description':'The Destemidos Limonadas & Punkecas interview on the program survives in two parts.',
                          'actions':[
                              {'text':'Part 1','url':'https://www.youtube.com/watch?v=OUBzN8HYuVA'},
                              {'text':'Part 2','url':'https://www.youtube.com/watch?v=PyTBtNAU3RE'},
                          ]
                      },
                      {
                          'label':'DESTEMIDOS + KID VINIL',
                          'description':'Record of “Herói do Brasil” featuring Kid Vinil as a special guest.',
                          'actions':[{'text':'Herói do Brasil','url':'https://www.youtube.com/watch?v=wzsS-G6ywqc'}]
                      }
                  ]),
                  'olympia': library(EN, [{
                      'label':'OLYMPIA · OPENING FOR OS PARALAMAS · 2000',
                      'description':'Two surviving records from Coitado do Próximo’s performance at Olympia, opening for Os Paralamas do Sucesso.',
                      'actions':[
                          {'text':'Estava Comigo','url':'https://www.youtube.com/watch?v=V624sY_rl8I','primary':True},
                          {'text':'Ciúmes','url':'https://youtu.be/0-RXucDYMfk'},
                      ]
                  }]),
              }
          }

          # CSS: description row only. No structural/layout selectors are touched.
          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          css_rule = '.video-library__description{margin:-3px 0 9px;max-width:72ch;color:var(--muted);font-size:.86rem;line-height:1.5}\n'
          if '.video-library__description{' not in css:
              anchor = '.video-library__actions{display:flex;flex-wrap:wrap;gap:8px}\n'
              if anchor not in css:
                  raise RuntimeError('video-library actions CSS anchor missing')
              css = css.replace(anchor, css_rule + anchor, 1)
              css_path.write_text(css, encoding='utf-8')

          for lang, cfg in configs.items():
              path = cfg['music_path']
              text = path.read_text(encoding='utf-8')
              baseline_phase_count = len(re.findall(r'<section class="phase(?:\s|\")', text))

              for href, component in cfg['single']:
                  text = replace_evidence(text, href, component)

              text = replace_evidence(text, 'https://www.youtube.com/watch?v=OUBzN8HYuVA', cfg['dest_final'])

              if lang == PT:
                  text = replace_evidence(text, 'https://www.youtube.com/watch?v=V624sY_rl8I', cfg['olympia'])
              else:
                  if 'https://www.youtube.com/watch?v=V624sY_rl8I' not in text:
                      marker = 'Olympia'
                      idx = text.find(marker)
                      # Use the later Olympia occurrence inside the phase if the first is outside the long-form body.
                      while idx >= 0:
                          section_start = text.rfind('<section class="phase', 0, idx)
                          if section_start >= 0:
                              section_end = matching_tag_end(text, section_start, 'section')
                              if 'Paralamas' in text[section_start:section_end]:
                                  insertion = section_end - len('</section>')
                                  text = text[:insertion] + cfg['olympia'] + text[insertion:]
                                  break
                          idx = text.find(marker, idx + len(marker))
                      else:
                          raise RuntimeError('could not locate EN Olympia phase')

              text = replace_existing_library_descriptions(text, lang)

              after_phase_count = len(re.findall(r'<section class="phase(?:\s|\")', text))
              if after_phase_count != baseline_phase_count:
                  raise RuntimeError(f'{path}: structural phase count changed')
              path.write_text(text, encoding='utf-8')

              # Keep the canonical Destemidos fragment aligned with the Music surface.
              frag_path = cfg['limonada_path']
              frag = frag_path.read_text(encoding='utf-8')
              dest_single = {href: comp for href, comp in cfg['single'] if href in {
                  'https://www.youtube.com/watch?v=_LBHqq8xF1c',
                  'https://www.youtube.com/watch?v=giklH5greAc'
              }}
              for href, comp in dest_single.items():
                  frag = replace_evidence(frag, href, comp)
              frag = replace_evidence(frag, 'https://www.youtube.com/watch?v=OUBzN8HYuVA', cfg['dest_final'])
              frag_path.write_text(frag, encoding='utf-8')

          print('Music-only video component transformation completed.')
          PY

      - name: Regenerate managed surfaces
        run: |
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/build_sitemap.py

      - name: Guard structure and video components
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re

          for path in [Path('pt/musica/index.html'), Path('en/music/index.html')]:
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              anchors = []
              for a in soup.find_all('a', href=True):
                  href = a.get('href','')
                  if not re.search(r'(youtube\.com|youtu\.be)', href, re.I):
                      continue
                  if a.find_parent(class_='presence-panel') or a.find_parent('header') or a.find_parent('footer'):
                      continue
                  anchors.append(a)
              assert len(anchors) == 20, f'{path}: expected 20 content video links, got {len(anchors)}'
              for a in anchors:
                  assert a.find_parent(class_='video-library') is not None, f'{path}: video outside video-library: {a.get("href")}'
                  assert ' '.join(a.stripped_strings).strip(), f'{path}: blank video-pill: {a.get("href")}'
              libs = soup.find_all('div', class_='video-library')
              assert len(libs) == 9, f'{path}: expected 9 video libraries, got {len(libs)}'
              for lib in libs:
                  assert lib.find('div', class_='video-library__head') is not None
                  groups = lib.find_all('div', class_='video-library__group', recursive=False)
                  assert groups, f'{path}: library without groups'
                  for group in groups:
                      assert group.find('div', class_='video-library__label', recursive=False) is not None
                      desc = group.find('div', class_='video-library__description', recursive=False)
                      assert desc and desc.get_text(' ', strip=True), f'{path}: missing group description'
                      actions = group.find('div', class_='video-library__actions', recursive=False)
                      assert actions and actions.find('a', class_='video-pill'), f'{path}: missing video actions'
              print(path, 'OK: 20 links / 9 libraries / descriptions present')

          # Regression guard for the three promoted Music entries in Full Biography.
          for path in [Path('pt/biografia/index.html'), Path('en/biography/index.html')]:
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              for entry_id in ['bio-music-limonada-1992','bio-music-kid-vinil-1993','bio-music-coitado-1994']:
                  section = soup.find('section', id=entry_id)
                  assert section is not None, f'{path}: missing {entry_id}'
                  classes = set(section.get('class', []))
                  assert 'phase' not in classes and 'music-entry' not in classes, f'{path}: vertical classes leaked into {entry_id}: {classes}'
              print(path, 'OK: no Music vertical layout classes leaked into Biography')

          # Destemidos standalone pages must inherit the same components.
          for path in [Path('pt/musica/destemidos-limonadas-punkecas/index.html'), Path('en/music/destemidos-limonadas-punkecas/index.html')]:
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              vids = [a for a in soup.find_all('a', href=True) if re.search(r'(youtube\.com|youtu\.be)', a.get('href',''), re.I)]
              assert len(vids) == 5, f'{path}: expected 5 Destemidos videos, got {len(vids)}'
              assert all(a.find_parent(class_='video-library') is not None for a in vids), f'{path}: standalone video outside library'
              print(path, 'OK: Destemidos video components synchronized')
          PY

      - name: Remove temporary workflows and commit branch result
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git rm -f .github/workflows/tmp-music-video-inventory.yml .github/workflows/tmp-apply-music-video-standard.yml
          git add styles.css pt/musica/index.html en/music/index.html content/entries/pt/music-limonada-1992.inc content/entries/en/music-limonada-1992.inc pt/biografia/index.html en/biography/index.html pt/musica/destemidos-limonadas-punkecas/index.html en/music/destemidos-limonadas-punkecas/index.html sitemap.xml
          git diff --cached --check
          git commit -m "feat: standardize Music audiovisual controls safely"
          git push origin HEAD:feat/video-media-wave1-music-20260914
