name: Resize Meia-Noite e Uns thread image

on:
  push:
    branches: [meia-noite-thread-size]

permissions:
  contents: write

jobs:
  resize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meia-noite-thread-size
      - name: Add responsive width override
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Meia-Noite e Uns editorial thread image pilot */'
          if marker not in text:
              text += '''\n\n/* Meia-Noite e Uns editorial thread image pilot */\n.thread-media:has(img[src$="/meianoiteeuns-thread.jpg"]){width:58%;margin-left:auto;margin-right:auto}\n@media(max-width:900px){.thread-media:has(img[src$="/meianoiteeuns-thread.jpg"]){width:72%}}\n@media(max-width:580px){.thread-media:has(img[src$="/meianoiteeuns-thread.jpg"]){width:100%}}\n'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit size adjustment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Reduce Meia-Noite e Uns thread image width"
          git push origin HEAD:meia-noite-thread-size
