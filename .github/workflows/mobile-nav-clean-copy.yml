name: Mobile nav clean copy

on:
  push:
    branches: [work/mobile-nav-operational]

permissions:
  contents: write

jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/mobile-nav-discoverability
          fetch-depth: 0
      - name: Copy validated permanent files
        run: |
          git checkout origin/work/mobile-nav-operational -- assets/mobile-nav.css assets/js/mobile-nav.js tools/sync_navigation.py tools/smoke_mobile_nav.js pt en
          python tools/build_sitemap.py
      - name: Commit clean mobile nav state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mobile-nav.css assets/js/mobile-nav.js tools/sync_navigation.py tools/smoke_mobile_nav.js pt en sitemap.xml
          git commit -m 'Replace hidden mobile nav scroll with explicit menu'
          git push origin HEAD:work/mobile-nav-discoverability
