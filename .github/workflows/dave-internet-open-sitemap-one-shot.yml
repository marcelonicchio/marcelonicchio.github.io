name: Dave Internet open sitemap one-shot

on:
  push:
    branches:
      - dave/internet-open-default-2026-09-16

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dave/internet-open-default-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regenerate canonical sitemap
        run: |
          python tools/build_sitemap.py
          python tools/build_sitemap.py --check
      - name: Commit clean result and remove one-shot workflow
        run: |
          rm .github/workflows/dave-internet-open-sitemap-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml .github/workflows/dave-internet-open-sitemap-one-shot.yml
          git commit -m 'chore: refresh sitemap after Reader policy change'
          git push origin HEAD:dave/internet-open-default-2026-09-16
