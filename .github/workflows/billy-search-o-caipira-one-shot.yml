name: Billy Search client-name cleanup one-shot

on:
  push:
    branches:
      - billy/search-remove-o-caipira-name-2026-09-07
    paths:
      - .github/workflows/billy-search-o-caipira-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install parity dependency
        run: python -m pip install beautifulsoup4
      - name: Replace named restaurant with generic description
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('pt/internet/index.html'): (
                  'entre elas o restaurante <strong>O Caipira</strong>, um estúdio de yoga',
                  'entre elas um restaurante típico na Marginal do Tietê, um estúdio de yoga',
              ),
              Path('pt/biografia/index.html'): (
                  'entre elas o restaurante <strong>O Caipira</strong>, um estúdio de yoga',
                  'entre elas um restaurante típico na Marginal do Tietê, um estúdio de yoga',
              ),
              Path('en/internet/index.html'): (
                  'including the <strong>O Caipira</strong> restaurant, a yoga studio',
                  'including a traditional restaurant on Marginal Tietê, a yoga studio',
              ),
              Path('en/biography/index.html'): (
                  'including the <strong>O Caipira</strong> restaurant, a yoga studio',
                  'including a traditional restaurant on Marginal Tietê, a yoga studio',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Accept editorial parity and rebuild sitemap
        run: |
          python tools/editorial_parity.py --accept internet-sem
          python tools/build_sitemap.py
      - name: Validate surgical change
        run: |
          python tools/editorial_parity.py --check
          python tools/build_sitemap.py --check
          python - <<'PY'
          from pathlib import Path
          checks = {
              'pt/internet/index.html': 'um restaurante típico na Marginal do Tietê, um estúdio de yoga',
              'pt/biografia/index.html': 'um restaurante típico na Marginal do Tietê, um estúdio de yoga',
              'en/internet/index.html': 'a traditional restaurant on Marginal Tietê, a yoga studio',
              'en/biography/index.html': 'a traditional restaurant on Marginal Tietê, a yoga studio',
          }
          for raw, expected in checks.items():
              text = Path(raw).read_text(encoding='utf-8')
              if expected not in text:
                  raise SystemExit(f'missing expected replacement in {raw}')
              if 'O Caipira' in text:
                  raise SystemExit(f'legacy restaurant name remains in {raw}')
          PY
      - name: Remove one-shot workflow and commit result
        run: |
          rm .github/workflows/billy-search-o-caipira-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'edit: generalize early Search client reference'
          git push
