name: Publish Minduim reconstruction

on:
  push:
    branches:
      - archive-minduim-v3
    paths:
      - .github/workflows/publish-minduim.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: archive-minduim-v3
          fetch-depth: 0

      - name: Verify reconstructed image
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s assets/archive/minduim-bbs-1993-reconstruction.webp)" -eq 73532
          test "$(git hash-object assets/archive/minduim-bbs-1993-reconstruction.webp)" = "3877abb158f9cc0530242d3d55408c18c7e87863"
          file assets/archive/minduim-bbs-1993-reconstruction.webp | grep -q 'Web/P image'

      - name: Integrate media
        run: python tools/apply_minduim_media.py

      - name: Audit site
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py
          grep -q 'minduim-bbs-1993-reconstruction.webp' pt/internet/index.html
          grep -q 'minduim-bbs-1993-reconstruction.webp' en/internet/index.html
          grep -q 'Minduim BBS — reconstrução visual' pt/arquivo/index.html
          grep -q 'Minduim BBS — visual reconstruction' en/archive/index.html

      - name: Commit integration and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/minduim
          rm tools/apply_minduim_media.py
          rm .github/workflows/publish-minduim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Minduim BBS reconstruction"
          git push origin HEAD:archive-minduim-v3
