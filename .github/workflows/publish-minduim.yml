name: Publish Minduim reconstruction

on:
  push:
    branches:
      - archive-minduim-v3
    paths:
      - .github/workflows/publish-minduim.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: archive-minduim-v3
          fetch-depth: 0

      - name: Verify reconstructed image
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s assets/archive/minduim-bbs-1993-reconstruction.webp)" -eq 73532
          test "$(git hash-object assets/archive/minduim-bbs-1993-reconstruction.webp)" = "3877abb158f9cc0530242d3d55408c18c7e87863"
          file assets/archive/minduim-bbs-1993-reconstruction.webp | grep -q 'Web/P image'

      - name: Integrate Minduim media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          asset = "/assets/archive/minduim-bbs-1993-reconstruction.webp"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one source block in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          pt_old = '<p>Em paralelo, criou a <strong>Minduim BBS</strong>, uma experiência pessoal construída com o software RemoteAccess e duas linhas telefônicas. O projeto era experimental e não comercial. Não restaram prints, fotos ou backups conhecidos; qualquer futura imagem da Minduim será apresentada explicitamente como <em>reconstrução baseada em memória</em>, nunca como captura histórica.</p>'
          pt_new = f'''<p>Em paralelo, criou a <strong>Minduim BBS</strong>, uma experiência pessoal construída com o software RemoteAccess e duas linhas telefônicas. O projeto era experimental e não comercial. Não restaram prints, fotos ou backups originais conhecidos.</p>
<figure class="thread-media thread-media--linked">
  <a href="{asset}" target="_blank" rel="noopener noreferrer" aria-label="Abrir a recriação visual da Minduim BBS em tamanho maior">
    <img src="{asset}" width="1448" height="1086" loading="lazy" decoding="async" alt="Recriação visual de um quarto em 1993 com computador 486, monitor CRT exibindo a interface da Minduim BBS e duas linhas telefônicas.">
  </a>
  <figcaption><strong>Recriação por IA do ambiente e da interface da Minduim BBS, c. 1993.</strong><span class="thread-media-note">Composição construída a partir de elementos factuais da configuração original e memória do ambiente e do período; não é fotografia nem captura de tela original.</span><a class="thread-media-open" href="{asset}" target="_blank" rel="noopener noreferrer">Abrir imagem em tamanho maior ↗</a></figcaption>
</figure>'''
          replace_once("pt/internet/index.html", pt_old, pt_new)

          en_old = '<p>In parallel, he created <strong>Minduim BBS</strong>, a personal experiment built with RemoteAccess software and two telephone lines. The project was experimental and non-commercial. No screenshots, photographs or known backups survive; any future visual representation of Minduim will be explicitly labeled as a <em>memory-based reconstruction</em>, never as a historical capture.</p>'
          en_new = f'''<p>In parallel, he created <strong>Minduim BBS</strong>, a personal experiment built with RemoteAccess software and two telephone lines. The project was experimental and non-commercial. No original screenshots, photographs or known backups survive.</p>
<figure class="thread-media thread-media--linked">
  <a href="{asset}" target="_blank" rel="noopener noreferrer" aria-label="Open the Minduim BBS visual reconstruction at full size">
    <img src="{asset}" width="1448" height="1086" loading="lazy" decoding="async" alt="Visual reconstruction of a bedroom in 1993 with a 486 computer, CRT monitor showing the Minduim BBS interface and two telephone lines.">
  </a>
  <figcaption><strong>AI-assisted reconstruction of the Minduim BBS environment and interface, c. 1993.</strong><span class="thread-media-note">The composition is based on factual elements of the original setup and memory of the room and period; it is not an original photograph or screen capture.</span><a class="thread-media-open" href="{asset}" target="_blank" rel="noopener noreferrer">Open full-size image ↗</a></figcaption>
</figure>'''
          replace_once("en/internet/index.html", en_old, en_new)

          pt_evidence_old = '<div class="evidence"><div class="evidence-top"><strong>Tremonte / Minduim BBS</strong><span class="status">autobiográfico</span></div><p>Sem material visual sobrevivente conhecido. Não será criada falsa evidência.</p></div>'
          pt_evidence_new = f'<div class="evidence"><div class="evidence-top"><strong>Tremonte / Minduim BBS</strong><span class="status">autobiográfico + reconstrução</span></div><p>Não há material visual original sobrevivente conhecido. A imagem publicada é uma reconstrução por IA baseada em elementos factuais e memória, identificada explicitamente como tal.</p><div class="evidence-links"><a href="{asset}" target="_blank" rel="noopener noreferrer">Abrir reconstrução</a></div></div>'
          replace_once("pt/internet/index.html", pt_evidence_old, pt_evidence_new)

          en_evidence_old = '<div class="evidence"><div class="evidence-top"><strong>Tremonte / Minduim BBS</strong><span class="status">autobiographical</span></div><p>No known surviving visual material. No false evidence will be manufactured.</p></div>'
          en_evidence_new = f'<div class="evidence"><div class="evidence-top"><strong>Tremonte / Minduim BBS</strong><span class="status">autobiographical + reconstruction</span></div><p>No original visual material is known to survive. The published image is an AI-assisted reconstruction based on factual elements and memory, explicitly labeled as such.</p><div class="evidence-links"><a href="{asset}" target="_blank" rel="noopener noreferrer">Open reconstruction</a></div></div>'
          replace_once("en/internet/index.html", en_evidence_old, en_evidence_new)

          pt_archive_old = '<p>O site não vai criar falsa precisão para preencher essas lacunas. Uma reconstrução visual, quando existir — como uma futura imagem da Minduim BBS — será marcada como <strong>reconstrução baseada em memória</strong>.</p>'
          pt_archive_new = f'<p>O site não vai criar falsa precisão para preencher essas lacunas. A reconstrução visual da Minduim BBS publicada no HUB é marcada explicitamente como <strong>reconstrução por IA baseada em elementos factuais e memória</strong>, não como documento original.</p><div class="evidence-list"><div class="evidence"><div class="evidence-top"><strong>Minduim BBS — reconstrução visual, c. 1993</strong><span class="status">reconstrução</span></div><p>Recriação fiel do ambiente doméstico e da interface em que a Minduim BBS foi instalada e operada. Não é fotografia nem captura de tela original.</p><div class="evidence-links"><a href="{asset}" target="_blank" rel="noopener noreferrer">Abrir imagem</a><a href="/pt/internet/#bbs">Contexto na página Internet</a></div></div></div>'
          replace_once("pt/arquivo/index.html", pt_archive_old, pt_archive_new)

          en_archive_old = '<p>The site will not manufacture false precision to fill those gaps. Any visual reconstruction — such as a future image of Minduim BBS — will be clearly labeled as a <strong>memory-based reconstruction</strong>.</p>'
          en_archive_new = f'<p>The site will not manufacture false precision to fill those gaps. The Minduim BBS visual reconstruction published in the HUB is explicitly labeled as an <strong>AI-assisted reconstruction based on factual elements and memory</strong>, not as an original document.</p><div class="evidence-list"><div class="evidence"><div class="evidence-top"><strong>Minduim BBS — visual reconstruction, c. 1993</strong><span class="status">reconstruction</span></div><p>A faithful reconstruction of the domestic environment and interface where Minduim BBS was installed and operated. It is not an original photograph or screen capture.</p><div class="evidence-links"><a href="{asset}" target="_blank" rel="noopener noreferrer">Open image</a><a href="/en/internet/#bbs">Context on the Internet page</a></div></div></div>'
          replace_once("en/archive/index.html", en_archive_old, en_archive_new)

          css = Path("styles.css")
          css_text = css.read_text(encoding="utf-8")
          marker = "/* Thread media system */"
          if marker not in css_text:
              css_text += '''\n\n/* Thread media system */\n.thread-media{margin:30px 0 36px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.018)}\n.thread-media>a{display:block;background:#050506}\n.thread-media img{display:block;width:100%;height:auto}\n.thread-media figcaption{padding:14px 16px 16px;color:var(--muted);font-size:.88rem;line-height:1.5}\n.thread-media figcaption strong{display:block;color:var(--soft);font-size:.94rem;margin-bottom:5px}\n.thread-media-note{display:block}\n.thread-media-open{display:inline-flex;margin-top:10px;text-decoration:none;color:#f1c5c1;font-weight:720}\n.thread-media-open:focus-visible{outline:2px solid var(--accent-soft);outline-offset:4px;border-radius:6px}\n@media(max-width:580px){.thread-media{margin:24px 0 30px;border-radius:14px}.thread-media figcaption{padding:12px 13px 14px}}\n'''
              css.write_text(css_text, encoding="utf-8")

          plan = Path("docs/visual-archive-plan.md")
          plan_text = plan.read_text(encoding="utf-8")
          if "## Placement taxonomy" not in plan_text:
              plan_text += '''\n\n## Placement taxonomy\n\nThree editorial placement modes are used for visual material:\n\n1. **Link only** — the page provides a text link or thumbnail to open the image at full size. Best for scans, documents and material whose value is inspection rather than narrative rhythm.\n2. **Link + thread** — the image appears inside the narrative and also opens at full size in a new tab. Best for strong historical photographs, key video frames and major reconstructions.\n3. **Thread only** — the image appears as part of the narrative composition without a separate full-size action. Best for portraits and supporting visual material.\n\nThe same asset may use different placement modes in different contexts. Provenance labels remain independent of placement: original photograph, video frame, scan, reconstruction, etc.\n'''
              plan.write_text(plan_text, encoding="utf-8")
          PY

      - name: Audit site
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py
          grep -q 'minduim-bbs-1993-reconstruction.webp' pt/internet/index.html
          grep -q 'minduim-bbs-1993-reconstruction.webp' en/internet/index.html
          grep -q 'Minduim BBS — reconstrução visual' pt/arquivo/index.html
          grep -q 'Minduim BBS — visual reconstruction' en/archive/index.html

      - name: Commit integration and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/minduim
          rm .github/workflows/publish-minduim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Minduim BBS reconstruction"
          git push origin HEAD:archive-minduim-v3
