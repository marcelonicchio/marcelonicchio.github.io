name: Billy wave 1 smoke sync

on:
  push:
    branches:
      - billy/chapter-promotion-wave1-2026-09-06

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: billy/chapter-promotion-wave1-2026-09-06
          fetch-depth: 0
      - name: Update smoke expectation and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/smoke_reader_ux.js')
          text = path.read_text(encoding='utf-8')
          old_comment = '// Pilot Chapter Pages: browser-readable, noindex, canonical, exact preserved structures.'
          new_comment = '// Chapter Pages: browser-readable, indexing policy, canonical, exact preserved structures.'
          old_assert = "assert(await page.locator('meta[name=\"robots\"]').getAttribute('content') === 'noindex,follow', 'Folha pilot robots incorrect');"
          new_assert = "assert(await page.locator('meta[name=\"robots\"]').getAttribute('content') === 'index,follow', 'Folha Chapter Page robots incorrect');"
          if old_comment not in text or old_assert not in text:
              raise SystemExit('expected historical Folha smoke contract not found')
          text = text.replace(old_comment, new_comment, 1).replace(old_assert, new_assert, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/billy-wave1-smoke-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smoke_reader_ux.js
          git commit -m "test: align Folhateen smoke with promoted indexing"
          git push origin HEAD:billy/chapter-promotion-wave1-2026-09-06
