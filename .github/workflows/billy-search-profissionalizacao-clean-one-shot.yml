name: Billy Search profissionalizacao clean one-shot

on:
  push:
    branches:
      - billy/search-profissionalizacao-louise-2026-09-07
    paths:
      - .github/workflows/billy-search-profissionalizacao-clean-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore untouched generated/source pages from base
        run: |
          git checkout origin/main -- pt/internet/index.html en/internet/index.html pt/biografia/index.html en/biography/index.html sitemap.xml
      - name: Apply surgical text patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          louise_path = '/assets/archive/internet/search_louisemartins_01.jpg'

          specs = {
            Path('pt/internet/index.html'): {
              'old_title': '2008–2009 — das primeiras contas à profissionalização em Search',
              'new_title': '2008–2009 — Profissionalização em Search',
              'info_anchor': 'Pouco depois, Louise seria personagem',
              'figure': '<figure class="thread-media thread-media--linked"><a href="/assets/archive/internet/search_louisemartins_01.jpg" target="_blank" rel="noopener noreferrer" aria-label="Abrir a página da INFO com Louise Martins em tamanho maior"><img src="/assets/archive/internet/search_louisemartins_01.jpg" width="608" height="800" loading="lazy" decoding="async" alt="Página da revista INFO nº 269, de julho de 2008, com Louise Martins na reportagem “Com a grife do Google”."></a><figcaption><strong>INFO nº 269 · jul. 2008 — “Com a grife do Google”.</strong><span class="thread-media-note">Página da reportagem com Louise Martins, registro contemporâneo da comunidade de profissionais Google Advertising Professional — GAP.</span><a class="thread-media-open" href="/assets/archive/internet/search_louisemartins_01.jpg" target="_blank" rel="noopener noreferrer">Abrir imagem em tamanho maior ↗</a></figcaption></figure>',
            },
            Path('en/internet/index.html'): {
              'old_title': '2008–2009 — from first accounts to professionalization in Search',
              'new_title': '2008–2009 — Professionalization in Search',
              'info_anchor': 'Soon afterward, Louise would be featured',
              'figure': '<figure class="thread-media thread-media--linked"><a href="/assets/archive/internet/search_louisemartins_01.jpg" target="_blank" rel="noopener noreferrer" aria-label="Open the INFO page featuring Louise Martins at full size"><img src="/assets/archive/internet/search_louisemartins_01.jpg" width="608" height="800" loading="lazy" decoding="async" alt="Page from INFO magazine no. 269, July 2008, featuring Louise Martins in the article “Com a grife do Google”."></a><figcaption><strong>INFO no. 269 · Jul. 2008 — “Com a grife do Google”.</strong><span class="thread-media-note">Page from the article featuring Louise Martins, a contemporary record of the Google Advertising Professional — GAP community.</span><a class="thread-media-open" href="/assets/archive/internet/search_louisemartins_01.jpg" target="_blank" rel="noopener noreferrer">Open full-size image ↗</a></figcaption></figure>',
            },
          }

          goobec_re = re.compile(r'<figure class="thread-media thread-media--linked"><a href="/assets/archive/internet/goobec/goobec01-tratado-300kb\.png".*?</figure>', re.S)

          for path, cfg in specs.items():
              text = path.read_text(encoding='utf-8')
              sec_re = re.compile(r'(<section id="sem" class="chapter">)(.*?)(</section>)', re.S)
              m = sec_re.search(text)
              if not m:
                  raise SystemExit(f'#sem section not found in {path}')
              body = m.group(2)
              old_h = f'<h2>{cfg["old_title"]}</h2>'
              new_h = f'<h2>{cfg["new_title"]}</h2>'
              if old_h not in body:
                  raise SystemExit(f'old title not found in {path}')
              body = body.replace(old_h, new_h, 1)

              gm = goobec_re.search(body)
              if not gm:
                  raise SystemExit(f'Goobec figure not found in {path}')
              goobec = gm.group(0)
              body = body[:gm.start()] + body[gm.end():]
              body = body.replace(new_h, new_h + goobec, 1)

              p_re = re.compile(r'<p>' + re.escape(cfg['info_anchor']) + r'.*?</p>', re.S)
              pm = p_re.search(body)
              if not pm:
                  raise SystemExit(f'INFO paragraph not found in {path}')
              body = body[:pm.end()] + cfg['figure'] + body[pm.end():]

              patched = text[:m.start()] + m.group(1) + body + m.group(3) + text[m.end():]
              path.write_text(patched, encoding='utf-8')
          PY
      - name: Synchronize managed surfaces
        run: |
          python -m pip install beautifulsoup4
          python tools/sync_full_biography.py
          python tools/build_sitemap.py
      - name: Validate surgical state
        run: |
          python tools/sync_full_biography.py --check
          python tools/build_sitemap.py --check
          python - <<'PY'
          from pathlib import Path
          checks = {
            'pt/internet/index.html': ('2008–2009 — Profissionalização em Search', 'Pouco depois, Louise seria personagem'),
            'en/internet/index.html': ('2008–2009 — Professionalization in Search', 'Soon afterward, Louise would be featured'),
          }
          for filename, (title, anchor) in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              start = text.index('<section id="sem" class="chapter">')
              end = text.index('</section>', start)
              section = text[start:end]
              assert f'<h2>{title}</h2>' in section
              assert section.index('/assets/media/thread/goobec-class-2009.webp') < section.index('Em 2008' if filename.startswith('pt/') else 'In 2008')
              assert anchor in section
              assert '/assets/archive/internet/search_louisemartins_01.jpg' in section
              assert section.index(anchor) < section.index('/assets/archive/internet/search_louisemartins_01.jpg')
          assert Path('assets/archive/internet/search_louisemartins_01.jpg').exists()
          assert not Path('assets/archive/internet/search_louisemartins_01.JPG').exists()
          PY
      - name: Remove one-shot workflow and commit clean patch
        run: |
          rm .github/workflows/billy-search-profissionalizacao-clean-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep Search chapter surgery surgical'
          git push
