name: Chet technical diagnostic

on:
  push:
    branches: [work/chet-post-c8-closeout]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4 requests
      - name: Intrinsic image inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          root=Path('.')
          targets=[Path('pt/biografia/index.html'),Path('en/biography/index.html'),Path('pt/internet/index.html'),Path('en/internet/index.html')]
          for p in targets:
            soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
            print(f'== {p} ==')
            missing=[]
            for img in soup.find_all('img'):
              if img.get('width') and img.get('height'): continue
              src=img.get('src','')
              dims='remote/data'
              if src.startswith('/'):
                asset=root/src.lstrip('/')
                if asset.exists():
                  try:
                    with Image.open(asset) as im: dims=f'{im.width}x{im.height}'
                  except Exception as e: dims=f'error:{e}'
              missing.append((src,dims))
            print('static missing:',len(missing))
            for src,dims in missing: print('  ',dims,src)
          print('== reader preview dimensions ==')
          import json
          data=json.loads(Path('data/entries.json').read_text(encoding='utf-8'))
          seen=set()
          for entry in data['entries']:
            for lang,prev in (entry.get('reader_preview') or {}).items():
              src=prev.get('image') if isinstance(prev,dict) else None
              if not src or src in seen: continue
              seen.add(src)
              asset=root/src.lstrip('/')
              if asset.exists():
                with Image.open(asset) as im: print(entry['id'],src,im.width,im.height)
          PY
      - name: Live deployment audit
        run: |
          python - <<'PY'
          import requests,json
          from bs4 import BeautifulSoup
          base='https://marcelonicchio.github.io'
          checks={
            '/': ['Marcelo','PT / EN'],
            '/pt/': ['Mídia & Cultura','Cultura & Audiovisual'],
            '/en/': ['Media & Culture','Culture & Audiovisual'],
            '/pt/biografia/': ['Biografia','BEST'],
            '/en/biography/': ['Biography','BEST'],
            '/pt/internet/': ['Internet & Performance','BEST'],
            '/en/internet/': ['Internet & Performance','BEST'],
            '/pt/internet/best-kenshoo/': ['BEST','Kenshoo'],
            '/en/internet/best-kenshoo/': ['BEST','Kenshoo'],
            '/pt/comunicacao/': ['Cultura & Audiovisual'],
            '/en/communication/': ['Culture & Audiovisual'],
            '/pt/ia-hai/': ['Melissa'],
            '/en/ai-hai/': ['Melissa'],
            '/robots.txt': [], '/sitemap.xml': [], '/llms.txt': [], '/data/person.json': []
          }
          sess=requests.Session(); sess.headers['User-Agent']='Chet-HUB-Live-Audit/1.0'
          failures=[]
          for path,phrases in checks.items():
            r=sess.get(base+path,timeout=20)
            print(r.status_code, len(r.content), path, r.headers.get('last-modified',''))
            if r.status_code!=200: failures.append(f'{path}: HTTP {r.status_code}'); continue
            for phrase in phrases:
              if phrase not in r.text: failures.append(f'{path}: missing {phrase!r}')
            if path.endswith('/') and path not in ['/']:
              soup=BeautifulSoup(r.text,'html.parser')
              can=soup.find('link',rel='canonical')
              rob=soup.find('meta',attrs={'name':'robots'})
              print('  canonical=', can.get('href') if can else None, 'robots=', rob.get('content') if rob else None)
              for s in soup.find_all('script',attrs={'type':'application/ld+json'}):
                try: json.loads(s.string or s.get_text())
                except Exception as e: failures.append(f'{path}: invalid JSON-LD {e}')
          if failures:
            print('FAILURES:')
            for f in failures: print(' -',f)
            raise SystemExit(1)
          print('Live deployment audit passed.')
          PY
