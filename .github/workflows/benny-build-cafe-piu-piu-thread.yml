name: Benny build Cafe Piu-Piu thread

on:
  push:
    branches:
      - benny/music-divulgacao-festival-thread

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Insert Cafe Piu-Piu flyer in PT and EN
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          rel_img = 'assets/archive/music/coitado-do-proximo/1998-1999-divulgacao-festival/coitadodoproximo_00_cafepiupiu_flyer_300kb.jpg'
          img_path = root / rel_img
          if not img_path.exists():
              raise SystemExit(f'Missing flyer: {rel_img}')
          with Image.open(img_path) as im:
              width, height = im.size

          href = '/' + rel_img
          phase_key = '<div class="phase" data-bio-key="music-festival-1998-1999">'
          next_key = '<div class="phase" data-bio-key="music-album-1999-2000">'

          thread_pt = (
              '<figure class="thread-media thread-media--linked">'
              f'<a aria-label="Abrir flyer de show do Coitado do Próximo no Café Piu-Piu em tamanho maior" href="{href}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Flyer de show do Coitado do Próximo no Café Piu-Piu, com participação especial de Paulão de Carvalho." decoding="async" loading="lazy" src="{href}" width="{width}" height="{height}"/></a>'
              '<figcaption><strong>Café Piu-Piu · flyer de show.</strong>'
              '<span class="thread-media-note">Flyer de apresentação do Coitado do Próximo no Café Piu-Piu, com participação especial de Paulão de Carvalho, vocalista das Velhas Virgens.</span>'
              f'<a class="thread-media-open" href="{href}" rel="noopener noreferrer" target="_blank">Abrir imagem em tamanho maior ↗</a>'
              '</figcaption></figure>'
          )
          thread_en = (
              '<figure class="thread-media thread-media--linked">'
              f'<a aria-label="Open the Coitado do Próximo show flyer from Café Piu-Piu at full size" href="{href}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Coitado do Próximo show flyer from Café Piu-Piu, featuring a special guest appearance by Paulão de Carvalho." decoding="async" loading="lazy" src="{href}" width="{width}" height="{height}"/></a>'
              '<figcaption><strong>Café Piu-Piu · show flyer.</strong>'
              '<span class="thread-media-note">Flyer for a Coitado do Próximo performance at Café Piu-Piu, featuring a special guest appearance by Paulão de Carvalho, vocalist of Velhas Virgens.</span>'
              f'<a class="thread-media-open" href="{href}" rel="noopener noreferrer" target="_blank">Open image at full size ↗</a>'
              '</figcaption></figure>'
          )

          for rel, thread in [('pt/musica/index.html', thread_pt), ('en/music/index.html', thread_en)]:
              path = root / rel
              text = path.read_text(encoding='utf-8')
              if href in text:
                  raise SystemExit(f'{rel}: flyer already inserted')
              start = text.index(phase_key)
              end = text.index(next_key, start)
              segment = text[start:end]
              insert_at = segment.rfind('</div></div>')
              if insert_at < 0:
                  raise SystemExit(f'{rel}: could not locate phase closing')
              segment = segment[:insert_at] + thread + segment[insert_at:]
              path.write_text(text[:start] + segment + text[end:], encoding='utf-8')
          PY
      - name: Synchronize Full Biography and parity
        run: |
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept music-festival-1998-1999
          python tools/build_sitemap.py
      - name: Commit Cafe Piu-Piu thread
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html data/editorial_parity.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add Cafe Piu-Piu flyer to 1998-1999 music thread"
          git push origin HEAD:benny/music-divulgacao-festival-thread
