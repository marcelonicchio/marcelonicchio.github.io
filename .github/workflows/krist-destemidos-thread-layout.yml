name: Krist Destemidos thread layout
on:
  push:
    branches: [fix/destemidos-thread-layout]
    paths: ['.github/workflows/krist-destemidos-thread-layout.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/destemidos-thread-layout
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Move hero thread image and resize later selfie
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('content/entries/pt/music-limonada-1992.inc'),
              Path('content/entries/en/music-limonada-1992.inc'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              # Move Roberto/Jô image to the very start of the neutral fragment,
              # which renders immediately under the entry title in Music.
              pat1 = re.compile(r'<figure class="thread-media thread-media--linked">(?:(?!</figure>).)*destemidoslimonadas_thread01\.jpg(?:(?!</figure>).)*</figure>', re.S)
              m1 = pat1.search(text)
              if not m1:
                  raise SystemExit(f'thread01 figure not found in {path}')
              fig1 = m1.group(0)
              text = text[:m1.start()] + text[m1.end():]
              text = fig1 + text

              # Desktop-only 50% sizing hook for Marcelo + Roberto selfie.
              pat2 = re.compile(r'<figure class="thread-media thread-media--linked">(?=(?:(?!</figure>).)*destemidoslimonadas_thread02\.jpg)')
              text, n = pat2.subn('<figure class="thread-media thread-media--linked thread-media--destemidos-selfie">', text, count=1)
              if n != 1:
                  raise SystemExit(f'thread02 figure not found in {path}')
              path.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* Destemidos Limonadas: desktop selfie sizing — 2026-09-14 */'
          rule = '''\n\n/* Destemidos Limonadas: desktop selfie sizing — 2026-09-14 */\n@media(min-width:901px){\n  .thread-media--destemidos-selfie{width:50%;margin-left:auto;margin-right:auto}\n}\n'''
          if marker not in text:
              css.write_text(text.rstrip() + rule + '\n', encoding='utf-8')
          PY
      - name: Synchronize generated surfaces
        run: |
          python tools/sync_entries.py
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/krist-destemidos-thread-layout.yml
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add -A
          git commit -m "fix: refine Destemidos thread image layout"
          git push origin HEAD:fix/destemidos-thread-layout
