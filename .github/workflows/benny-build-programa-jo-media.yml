name: Benny build Programa do Jo 2001 media

on:
  push:
    branches:
      - benny/programa-jo-2001-media

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Register thread image and Programa do Jo gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          gallery_id = 'programa-do-jo-2001'
          thread_root = 'assets/archive/music/coitado-do-proximo/2001-programa-do-jo'
          source_root = f'{thread_root}/galeria'
          thread_name = 'coitadodoproximo_00_jo01.jpg'
          gallery_sources = [f'coitadodoproximo_00_jo{i:02d}.jpg' for i in range(2, 31)]

          if not (ROOT / thread_root / thread_name).exists():
              raise SystemExit(f'Missing thread image: {thread_name}')
          missing = [name for name in gallery_sources if not (ROOT / source_root / name).exists()]
          if missing:
              raise SystemExit(f'Missing Programa do Jo gallery files: {missing}')

          reg_path = ROOT / 'data/galleries.json'
          data = json.loads(reg_path.read_text(encoding='utf-8'))
          if any(g.get('id') == gallery_id for g in data.get('galleries', [])):
              raise SystemExit(f'Gallery {gallery_id} already exists')

          items = []
          for photo_no, source in enumerate(gallery_sources, 2):
              items.append({
                  'id': f'{photo_no - 1:02d}',
                  'source': source,
                  'caption': {
                      'pt': f'Coitado do Próximo no Programa do Jô, Rede Globo, 21 jun. 2001 — foto {photo_no}.',
                      'en': f'Coitado do Próximo on Programa do Jô, Rede Globo, 21 Jun. 2001 — photo {photo_no}.'
                  }
              })

          data['galleries'].append({
              'id': gallery_id,
              'sourceRoot': source_root,
              'targets': {
                  'pt': ['pt/musica/index.html'],
                  'en': ['en/music/index.html']
              },
              'title': {
                  'pt': 'Fotos',
                  'en': 'Photos'
              },
              'items': items
          })
          data['updated'] = '2026-09-10'
          reg_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          placeholder = '<!-- gallery:programa-do-jo-2001 -->'
          phase_key = '<div class="phase" data-bio-key="music-jo-2001">'
          next_phase_key = '<div class="phase" data-bio-key="music-active-2001-2003">'
          image_path = f'/{thread_root}/{thread_name}'

          thread_pt = (
              '<figure class="thread-media thread-media--linked">'
              f'<a aria-label="Abrir registro do Coitado do Próximo no Programa do Jô em tamanho maior" href="{image_path}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Coitado do Próximo no Programa do Jô, em 21 de junho de 2001." decoding="async" loading="lazy" src="{image_path}" width="1448" height="1086"/></a>'
              '<figcaption><strong>Programa do Jô · 21 jun. 2001.</strong>'
              '<span class="thread-media-note">Registro da participação do Coitado do Próximo no Programa do Jô, em apresentação de “Estava Comigo”.</span>'
              f'<a class="thread-media-open" href="{image_path}" rel="noopener noreferrer" target="_blank">Abrir imagem em tamanho maior ↗</a>'
              '</figcaption></figure>'
          )
          thread_en = (
              '<figure class="thread-media thread-media--linked">'
              f'<a aria-label="Open Coitado do Próximo on Programa do Jô at full size" href="{image_path}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Coitado do Próximo on Programa do Jô on June 21, 2001." decoding="async" loading="lazy" src="{image_path}" width="1448" height="1086"/></a>'
              '<figcaption><strong>Programa do Jô · Jun. 21, 2001.</strong>'
              '<span class="thread-media-note">Record of Coitado do Próximo’s appearance on Programa do Jô, performing “Estava Comigo”.</span>'
              f'<a class="thread-media-open" href="{image_path}" rel="noopener noreferrer" target="_blank">Open image at full size ↗</a>'
              '</figcaption></figure>'
          )

          for rel, thread in (
              ('pt/musica/index.html', thread_pt),
              ('en/music/index.html', thread_en),
          ):
              path = ROOT / rel
              text = path.read_text(encoding='utf-8')
              if placeholder in text or image_path in text:
                  raise SystemExit(f'{rel}: Programa do Jo media already present')
              start = text.index(phase_key)
              end = text.index(next_phase_key, start)
              segment = text[start:end]

              # Place thread and gallery after the narrative, before preserved evidence links when present.
              evidence = '<div class="evidence-links inline-links">'
              insert_at = segment.find(evidence)
              if insert_at < 0:
                  insert_at = segment.rfind('</div></div>')
              if insert_at < 0:
                  raise SystemExit(f'{rel}: could not locate Programa do Jo media insertion point')

              media = thread + '\n' + placeholder + '\n'
              segment = segment[:insert_at] + media + segment[insert_at:]
              path.write_text(text[:start] + segment + text[end:], encoding='utf-8')

          keep = ROOT / source_root / '.gitkeep'
          if keep.exists():
              keep.unlink()
          PY
      - name: Build and synchronize media
        run: |
          python tools/build_gallery_media.py
          python tools/sync_galleries.py
          python tools/sync_full_biography.py
          python tools/editorial_parity.py --accept music-programa-jo
          python tools/build_sitemap.py
      - name: Commit Programa do Jo media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/galleries.json data/editorial_parity.json assets/media/galleries/programa-do-jo-2001 pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html sitemap.xml
          git add -u assets/archive/music/coitado-do-proximo/2001-programa-do-jo/galeria/.gitkeep || true
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "feat: add Programa do Jo 2001 thread and gallery"
          git push origin HEAD:benny/programa-jo-2001-media
