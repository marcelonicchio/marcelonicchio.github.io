name: Chet closeout clean-copy

on:
  push:
    branches: [work/chet-post-c8-closeout]

permissions:
  contents: write

jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/chet-post-c8-closeout-clean
          fetch-depth: 0
      - name: Copy validated permanent files
        run: |
          git fetch origin work/chet-post-c8-closeout
          git checkout origin/work/chet-post-c8-closeout -- \
            assets \
            content \
            data \
            docs \
            en \
            pt \
            sitemap.xml \
            tools/audit_image_dimensions.py \
            tools/build_gallery_media.py \
            tools/smoke_runtime_performance.js \
            tools/sync_reader_disclosure_loader.py
      - name: Commit clean closeout state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Clean branch already contains validated permanent state.'
          else
            git commit -m 'Close post-C8 technical gaps'
            git push origin HEAD:work/chet-post-c8-closeout-clean
          fi
