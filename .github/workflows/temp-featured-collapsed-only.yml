name: Temporary featured collapsed-only highlight

on:
  push:
    branches:
      - work/featured-collapsed-only-highlight

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/featured-collapsed-only-highlight
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: pip install beautifulsoup4
      - name: Apply featured state-only styling
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label, count=1):
              actual = text.count(old)
              assert actual == count, f'{label}: expected {count}, found {actual}'
              return text.replace(old, new, count)

          # Featured highlight belongs exclusively to the collapsed invitation state.
          p = Path('assets/reader-disclosure.css')
          text = p.read_text(encoding='utf-8')
          text = must_replace(
              text,
              'html.reader-disclosure-active .reader-disclosure--featured{border-color:rgba(229,190,91,.72);background:linear-gradient(135deg,rgba(224,181,72,.24),rgba(148,108,31,.14));box-shadow:inset 0 0 0 1px rgba(255,220,130,.08),0 8px 26px rgba(0,0,0,.14)}',
              'html.reader-disclosure-active .reader-disclosure--featured:not([open]){border-color:rgba(229,190,91,.72);background:linear-gradient(135deg,rgba(224,181,72,.24),rgba(148,108,31,.14));box-shadow:inset 0 0 0 1px rgba(255,220,130,.08),0 8px 26px rgba(0,0,0,.14)}',
              'featured closed frame'
          )
          text = must_replace(
              text,
              'html.reader-disclosure-active .reader-disclosure--featured[open]{border-color:rgba(229,190,91,.66);background:linear-gradient(135deg,rgba(224,181,72,.16),rgba(148,108,31,.09));box-shadow:inset 0 0 0 1px rgba(255,220,130,.06)}\n',
              '',
              'remove featured open frame'
          )
          text = must_replace(text, '.reader-disclosure--featured>summary:hover', '.reader-disclosure--featured:not([open])>summary:hover', 'featured closed hover')
          text = must_replace(text, '.reader-disclosure--featured>summary:after', '.reader-disclosure--featured:not([open])>summary:after', 'featured closed marker')
          text = must_replace(text, '.reader-disclosure--featured .reader-disclosure__excerpt', '.reader-disclosure--featured:not([open]) .reader-disclosure__excerpt', 'featured closed excerpt')
          text = must_replace(text, '.reader-disclosure--featured .reader-disclosure__badge', '.reader-disclosure--featured:not([open]) .reader-disclosure__badge', 'featured closed badges')
          text = must_replace(
              text,
              'html.reader-disclosure-active .reader-disclosure--featured .reader-disclosure__body{border-top-color:rgba(239,203,109,.16)}\n',
              '',
              'remove featured open body border'
          )
          p.write_text(text, encoding='utf-8')

          # Browser regression: closed -> dark open -> highlighted again when reclosed.
          p = Path('tools/smoke_reader_ux.js')
          text = p.read_text(encoding='utf-8')
          marker = "  assert((await page.locator('#bio-audiovisual-meia-noite details.reader-disclosure').getAttribute('class')).includes('reader-disclosure--featured'), 'Meia-Noite is not featured in Full Bio');\n"
          assert text.count(marker) == 1, 'featured smoke insertion point changed'
          addition = marker + """

  // Featured visual treatment exists only while collapsed.
  const featuredStateProbe = page.locator('#bio-internet-mirantte details.reader-disclosure');
  const featuredClosedStyle = await featuredStateProbe.evaluate((el) => ({backgroundImage: getComputedStyle(el).backgroundImage, boxShadow: getComputedStyle(el).boxShadow}));
  assert(featuredClosedStyle.backgroundImage !== 'none', 'Featured entry lost collapsed highlight background');
  assert(featuredClosedStyle.boxShadow !== 'none', 'Featured entry lost collapsed highlight shadow');
  await page.locator('#bio-internet-mirantte details.reader-disclosure > summary').click();
  const featuredOpenStyle = await featuredStateProbe.evaluate((el) => ({backgroundImage: getComputedStyle(el).backgroundImage, boxShadow: getComputedStyle(el).boxShadow}));
  assert(featuredOpenStyle.backgroundImage === 'none', `Featured highlight background remained after expansion: ${featuredOpenStyle.backgroundImage}`);
  assert(featuredOpenStyle.boxShadow === 'none', `Featured highlight shadow remained after expansion: ${featuredOpenStyle.boxShadow}`);
  await page.locator('#bio-internet-mirantte details.reader-disclosure > summary').click();
  const featuredReclosedStyle = await featuredStateProbe.evaluate((el) => ({backgroundImage: getComputedStyle(el).backgroundImage, boxShadow: getComputedStyle(el).boxShadow}));
  assert(featuredReclosedStyle.backgroundImage !== 'none', 'Featured highlight did not return after collapse');
  assert(featuredReclosedStyle.boxShadow !== 'none', 'Featured highlight shadow did not return after collapse');
"""
          text = text.replace(marker, addition, 1)
          p.write_text(text, encoding='utf-8')

          # Bust Reader CSS/runtime cache from reader5 to reader6.
          for rel in ['assets/js/reader-disclosure-loader.js', 'tools/sync_reader_disclosure_loader.py']:
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              count = text.count('20260901-reader5')
              assert count >= 1, f'{rel}: reader5 version missing'
              p.write_text(text.replace('20260901-reader5', '20260901-reader6'), encoding='utf-8')

          for rel in [
              'pt/biografia/index.html','en/biography/index.html','pt/internet/index.html','en/internet/index.html',
              'pt/comunicacao/index.html','en/communication/index.html','pt/audiovisual/index.html','en/audiovisual/index.html',
              'pt/ia-hai/index.html','en/ai-hai/index.html']:
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              text = must_replace(text, '20260901-reader5', '20260901-reader6', f'{rel} cache version')
              p.write_text(text, encoding='utf-8')

          # Living docs: resolve open-state color behavior, leave color-tone tuning open.
          p = Path('docs/entry-authoring-workflow.md')
          text = p.read_text(encoding='utf-8')
          old = "Still unresolved and intentionally separate from the summary model:\n\n1. yellow should become a clearer pale yellow rather than beige;\n2. red should become more genuinely red/translucent rather than wine;\n3. colored featured treatment should apply to the collapsed invitation state and revert to the normal dark background after expansion."
          new = "The state behavior is resolved: **featured color applies only while collapsed**. On expansion, the entry returns to the normal dark Reader treatment; if collapsed again, the featured highlight returns.\n\nColor tuning remains intentionally separate from the summary model:\n\n1. yellow should become a clearer pale yellow rather than beige;\n2. red should become more genuinely red/translucent rather than wine."
          text = must_replace(text, old, new, 'authoring featured-state docs')
          p.write_text(text, encoding='utf-8')

          p = Path('docs/CURRENT-HUB-STATE.md')
          text = p.read_text(encoding='utf-8')
          text = must_replace(text, '- `default-open` — entry starts expanded;\n', '- `always-open` — Type 1 entry remains permanently open and scroll-only;\n', 'current-state presentation vocabulary')
          marker = '- `featured` — dense/editorially important entry starts closed but receives stronger visual treatment.\n'
          addition = marker + '\nFeatured visual treatment is state-dependent: it exists only while the entry is collapsed. Opening a featured entry restores the normal dark Reader treatment; collapsing it restores the highlight.\n'
          text = must_replace(text, marker, addition, 'current-state featured behavior')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate targeted behavior
        run: |
          node --check tools/smoke_reader_ux.js
          node --check assets/js/reader-disclosure-loader.js
          python tools/sync_reader_disclosure_loader.py --check
          python tools/audit_entries.py
          python tools/sync_full_biography.py --check
          python tools/editorial_parity.py --check
      - name: Commit change
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add assets/reader-disclosure.css assets/js/reader-disclosure-loader.js tools/smoke_reader_ux.js tools/sync_reader_disclosure_loader.py docs/entry-authoring-workflow.md docs/CURRENT-HUB-STATE.md pt/biografia/index.html en/biography/index.html pt/internet/index.html en/internet/index.html pt/comunicacao/index.html en/communication/index.html pt/audiovisual/index.html en/audiovisual/index.html pt/ia-hai/index.html en/ai-hai/index.html
          git commit -m "Limit featured highlight to collapsed state"
          git push origin HEAD:work/featured-collapsed-only-highlight
