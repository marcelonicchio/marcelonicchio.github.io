name: Benny fix Eu Nao thread and gallery

on:
  push:
    branches:
      - benny/fix-eu-nao-thread-gallery

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Correct Thread image and append gallery image
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          old_asset = '/assets/archive/music/coitado-do-proximo/2000-eu-nao-to-nem-ai/eunaotonemaicapa04.jpg'
          thread_asset = '/assets/archive/music/coitado-do-proximo/2000-eu-nao-to-nem-ai/coitadodoproximo_00_eunaotonemai_2000_01_capa.jpg'
          marker = '<!-- gallery:eu-nao-to-nem-ai-2000:start -->'
          phase_key = '<div class="phase" data-bio-key="music-album-1999-2000">'

          for rel in ('pt/musica/index.html', 'en/music/index.html'):
              p = ROOT / rel
              text = p.read_text(encoding='utf-8')
              start = text.index(phase_key)
              end = text.index(marker, start)
              segment = text[start:end]
              count = segment.count(old_asset)
              if count != 3:
                  raise SystemExit(f'{rel}: expected 3 Thread references to old image, found {count}')
              segment = segment.replace(old_asset, thread_asset)
              if 'width="504" height="500"' not in segment:
                  raise SystemExit(f'{rel}: expected old Thread dimensions not found')
              segment = segment.replace('width="504" height="500"', 'width="1254" height="1254"', 1)
              p.write_text(text[:start] + segment + text[end:], encoding='utf-8')

          reg_path = ROOT / 'data/galleries.json'
          data = json.loads(reg_path.read_text(encoding='utf-8'))
          gallery = next(g for g in data['galleries'] if g['id'] == 'eu-nao-to-nem-ai-2000')
          gallery['items'] = [i for i in gallery['items'] if i.get('source') != 'eunaotonemaicapa04.jpg']
          if len(gallery['items']) != 8:
              raise SystemExit(f'Expected 8 pre-existing gallery items, found {len(gallery["items"])}')
          gallery['items'].append({
              'id': '09',
              'source': 'eunaotonemaicapa04.jpg',
              'caption': {
                  'pt': 'Imagem de capa de Eu Não Tô Nem Aí.',
                  'en': 'Eu Não Tô Nem Aí cover image.'
              }
          })
          data['updated'] = '2026-09-10'
          reg_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Rebuild gallery derivatives and synchronized surfaces
        run: |
          python tools/build_gallery_media.py
          python tools/sync_galleries.py
          python tools/sync_full_biography.py
          python tools/build_sitemap.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/galleries.json assets/media/galleries/eu-nao-to-nem-ai-2000 pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: correct Eu Nao To Nem Ai Thread and gallery image"
          git push origin HEAD:benny/fix-eu-nao-thread-gallery
