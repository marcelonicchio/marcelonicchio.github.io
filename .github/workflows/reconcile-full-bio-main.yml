name: Reconcile Full Biography branch with main

on:
  push:
    branches: [full-biography-parity-stop]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with history
        uses: actions/checkout@v4
        with:
          ref: full-biography-parity-stop
          fetch-depth: 0
      - name: Merge current main, preserving reviewed vertical sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge origin/main --no-ff --no-commit
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts: $conflicts"
            for f in $conflicts; do
              case "$f" in
                pt/musica/index.html|en/music/index.html)
                  git checkout --ours -- "$f"
                  git add "$f"
                  ;;
                *)
                  echo "Unexpected merge conflict: $f"
                  exit 1
                  ;;
              esac
            done
          fi
          git add -A
          git commit -m "Merge current main into Full Biography review branch"
          git push origin HEAD:full-biography-parity-stop
