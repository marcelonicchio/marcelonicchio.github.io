name: Normalize external links

on:
  push:
    branches:
      - ux-external-links
    paths:
      - tools/normalize_external_links.py
      - .github/workflows/normalize-external-links.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-external-links
          fetch-depth: 0

      - name: Normalize external links
        run: python tools/normalize_external_links.py

      - name: Commit normalized HTML
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No HTML changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Normalize external link behavior site-wide"
          git push origin HEAD:ux-external-links
