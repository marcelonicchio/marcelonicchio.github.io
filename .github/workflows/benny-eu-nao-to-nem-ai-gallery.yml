name: Benny one-off Eu Nao To Nem Ai gallery

on:
  push:
    branches:
      - benny/music-eu-nao-to-nem-ai-gallery

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benny/music-eu-nao-to-nem-ai-gallery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build gallery registry, derivatives and Thread cover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image, ImageOps

          ROOT = Path('.')
          gid = 'eu-nao-to-nem-ai-2000'
          source_root_rel = 'assets/archive/music/coitado-do-proximo/2000-eu-nao-to-nem-ai'
          source_root = ROOT / source_root_rel
          output_root_rel = f'assets/media/galleries/{gid}'
          output_root = ROOT / output_root_rel
          output_root.mkdir(parents=True, exist_ok=True)

          specs = [
              ('01', 'coitadodoproximo_00_eunaotonemai_2000_01_capa.jpg', 'Capa do álbum Eu Não Tô Nem Aí.', 'Eu Não Tô Nem Aí album cover.'),
              ('02', 'coitadodoproximo_00_eunaotonemai_2000_01_capa02.jpg', 'Capa de Eu Não Tô Nem Aí — imagem 2.', 'Eu Não Tô Nem Aí cover — image 2.'),
              ('03', 'coitadodoproximo_00_eunaotonemai_2000_02_contracapa.jpg', 'Contracapa do álbum Eu Não Tô Nem Aí.', 'Eu Não Tô Nem Aí album back cover.'),
              ('04', 'coitadodoproximo_00_eunaotonemai_2000_03_letras01.jpg', 'Página do encarte de Eu Não Tô Nem Aí com letras.', 'Eu Não Tô Nem Aí booklet page with lyrics.'),
              ('05', 'coitadodoproximo_00_eunaotonemai_2000_04_letras02.jpg', 'Página do encarte de Eu Não Tô Nem Aí com letras.', 'Eu Não Tô Nem Aí booklet page with lyrics.'),
              ('06', 'coitadodoproximo_00_eunaotonemai_2000_04_letras03.jpg', 'Página do encarte de Eu Não Tô Nem Aí com letras.', 'Eu Não Tô Nem Aí booklet page with lyrics.'),
              ('07', 'coitadodoproximo_00_eunaotonemai_2000_05_letras03.jpg', 'Página do encarte de Eu Não Tô Nem Aí com letras.', 'Eu Não Tô Nem Aí booklet page with lyrics.'),
              ('08', 'coitadodoproximo_00_eunaotonemai_2000_06_encarte.jpg', 'Encarte do álbum Eu Não Tô Nem Aí.', 'Eu Não Tô Nem Aí album booklet.'),
          ]

          items = []
          for iid, filename, cap_pt, cap_en in specs:
              source = source_root / filename
              if not source.exists():
                  raise SystemExit(f'Missing source: {source}')
              with Image.open(source) as opened:
                  image = ImageOps.exif_transpose(opened)
                  source_w, source_h = image.size
                  if image.mode == 'P' and 'transparency' in image.info:
                      image = image.convert('RGBA')
                  working = image.convert('RGB')

              derivatives = {}
              for max_w in (480, 768):
                  target_w = min(source_w, max_w)
                  target_h = max(1, round(source_h * target_w / source_w))
                  out = output_root / f'{gid}-{iid}-{max_w}.webp'
                  resized = working if (target_w, target_h) == (source_w, source_h) else working.resize((target_w, target_h), Image.Resampling.LANCZOS)
                  resized.save(out, 'WEBP', quality=78, method=6, optimize=True)
                  derivatives[str(max_w)] = {
                      'path': out.as_posix(),
                      'width': target_w,
                      'height': target_h,
                  }

              items.append({
                  'id': iid,
                  'source': filename,
                  'caption': {'pt': cap_pt, 'en': cap_en},
                  'width': source_w,
                  'height': source_h,
                  'derivatives': derivatives,
              })

          registry_path = ROOT / 'data/galleries.json'
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          data['updated'] = '2026-09-10'
          gallery = {
              'id': gid,
              'sourceRoot': source_root_rel,
              'targets': {
                  'pt': ['pt/musica/index.html'],
                  'en': ['en/music/index.html'],
              },
              'title': {
                  'pt': 'Fotos e encarte',
                  'en': 'Photos and booklet',
              },
              'items': items,
          }
          galleries = data.setdefault('galleries', [])
          galleries[:] = [g for g in galleries if g.get('id') != gid]
          galleries.append(gallery)
          registry_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          thread_rel = f'{source_root_rel}/eunaotonemaicapa04.jpg'
          thread_source = ROOT / thread_rel
          if not thread_source.exists():
              raise SystemExit(f'Missing Thread cover: {thread_source}')
          with Image.open(thread_source) as opened:
              thread_image = ImageOps.exif_transpose(opened)
              tw, th = thread_image.size

          pt_figure = (
              f'<figure class="thread-media thread-media--linked"><a aria-label="Abrir a capa de Eu Não Tô Nem Aí em tamanho maior" href="/{thread_rel}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Capa de Eu Não Tô Nem Aí, segundo álbum do Coitado do Próximo, lançado em 2000." decoding="async" loading="lazy" src="/{thread_rel}" width="{tw}" height="{th}"/></a>'
              f'<figcaption><strong>Eu Não Tô Nem Aí · 2000.</strong><span class="thread-media-note">Capa do segundo álbum do Coitado do Próximo.</span>'
              f'<a class="thread-media-open" href="/{thread_rel}" rel="noopener noreferrer" target="_blank">Abrir imagem em tamanho maior ↗</a></figcaption></figure>'
          )
          en_figure = (
              f'<figure class="thread-media thread-media--linked"><a aria-label="Open the Eu Não Tô Nem Aí cover at full size" href="/{thread_rel}" rel="noopener noreferrer" target="_blank">'
              f'<img alt="Cover of Eu Não Tô Nem Aí, Coitado do Próximo’s second album, released in 2000." decoding="async" loading="lazy" src="/{thread_rel}" width="{tw}" height="{th}"/></a>'
              f'<figcaption><strong>Eu Não Tô Nem Aí · 2000.</strong><span class="thread-media-note">Cover of Coitado do Próximo’s second album.</span>'
              f'<a class="thread-media-open" href="/{thread_rel}" rel="noopener noreferrer" target="_blank">Open image at full size ↗</a></figcaption></figure>'
          )

          def wire(path_str: str, figure: str):
              path = ROOT / path_str
              text = path.read_text(encoding='utf-8')
              marker = 'data-bio-key="music-album-1999-2000"'
              start = text.index(marker)
              end = text.index('</div></div>', start)
              insertion = figure + f'<!-- gallery:{gid} -->'
              if thread_rel not in text[start:end]:
                  text = text[:end] + insertion + text[end:]
              if '/assets/js/archive-lightbox.js' not in text:
                  mobile = '<script src="/assets/js/mobile-nav.js?v=20260903-mobile1" defer></script>'
                  lightbox = '<script src="/assets/js/archive-lightbox.js?v=20260903-gallery3" defer></script>\n'
                  if mobile not in text:
                      raise SystemExit(f'Mobile-nav marker not found in {path_str}')
                  text = text.replace(mobile, lightbox + mobile, 1)
              path.write_text(text, encoding='utf-8')

          wire('pt/musica/index.html', pt_figure)
          wire('en/music/index.html', en_figure)
          PY
      - name: Synchronize gallery markup
        run: python tools/sync_galleries.py
      - name: Commit generated gallery package
        run: |
          rm .github/workflows/benny-eu-nao-to-nem-ai-gallery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/galleries.json pt/musica/index.html en/music/index.html assets/media/galleries/eu-nao-to-nem-ai-2000 .github/workflows/benny-eu-nao-to-nem-ai-gallery.yml
          git commit -m "feat: add Eu Nao To Nem Ai 2000 gallery and thread cover"
          git push
