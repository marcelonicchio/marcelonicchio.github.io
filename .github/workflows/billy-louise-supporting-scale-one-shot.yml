name: Billy Louise supporting scale one-shot
on:
  push:
    branches:
      - billy/louise-supporting-image-scale-2026-09-07
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: billy/louise-supporting-image-scale-2026-09-07
      - name: Apply supporting-record scale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* supporting record: Louise Martins / INFO 2008 */'
          if marker not in s:
              s += '''\n\n/* supporting record: Louise Martins / INFO 2008 */\n.thread-media--linked > a[href$="/search_louisemartins_01.jpg"] {\n  display: block;\n  width: 45%;\n  max-width: 304px;\n  margin-inline: auto;\n}\n.thread-media--linked > a[href$="/search_louisemartins_01.jpg"] > img {\n  width: 100%;\n}\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate selector scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('styles.css').read_text(encoding='utf-8')
          needle = 'a[href$="/search_louisemartins_01.jpg"]'
          assert css.count(needle) == 2, css.count(needle)
          assert 'width: 45%;' in css
          assert 'max-width: 304px;' in css
          for f in ['pt/internet/index.html','en/internet/index.html','pt/biografia/index.html','en/biography/index.html']:
              text = Path(f).read_text(encoding='utf-8')
              assert '/assets/archive/internet/search_louisemartins_01.jpg' in text, f
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/billy-louise-supporting-scale-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css .github/workflows/billy-louise-supporting-scale-one-shot.yml
          git commit -m "style: reduce Louise Martins supporting image prominence"
          git push origin HEAD:billy/louise-supporting-image-scale-2026-09-07
