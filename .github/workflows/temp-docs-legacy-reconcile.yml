name: Temporary docs legacy reconcile

on:
  push:
    branches:
      - work/docs-legacy-dossier-2026-09-01

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/docs-legacy-dossier-2026-09-01
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install beautifulsoup4
      - name: Reconcile docs and add summary ceiling
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Historical documents remain preserved but must not masquerade as current state.
          replace_once(
              'docs/hub-continuity-guide.md',
              '**Status deste documento:** referência operacional e editorial do projeto  \n**Atualizado em:** 27 de agosto de 2026  ',
              '**Status deste documento:** **histórico/fundacional — snapshot de 27 de agosto de 2026**  \n**Atualizado em:** 27 de agosto de 2026  \n\n> Para o estado atual, leia primeiro `docs/README.md` e `docs/CURRENT-HUB-STATE.md`. Este guia preserva a constituição e o contexto do ciclo anterior; detalhes de implementação que mudaram depois de 27/08 não são autoridade de estado.  '
          )
          replace_once(
              'docs/hub-continuity-addendum-2026-08-29.md',
              'Status: **current addendum to `docs/hub-continuity-guide.md`**  ',
              'Status: **historical transition addendum — superseded for current-state questions by `docs/CURRENT-HUB-STATE.md`**  '
          )
          replace_once(
              'docs/ux-seo-architecture-v1.md',
              'Status: **adopted implementation plan, not yet implemented on the live site**  ',
              'Status: **historical pre-implementation plan — substantially implemented and evolved; see `docs/CURRENT-HUB-STATE.md` and `docs/reader-summary-model.md` for current behavior**  '
          )
          replace_once(
              'docs/entry-architecture-pilot.md',
              'Status: **implementation pilot**  ',
              'Status: **historical implementation record — the core entry/Reader architecture became a production baseline and later evolved; see `docs/CURRENT-HUB-STATE.md`**  '
          )

          # Full Biography workflow remains operational but must acknowledge fragment-backed sources.
          replace_once(
              'docs/full-biography-workflow.md',
              '**Atualizado em:** 28 de agosto de 2026  ',
              '**Atualizado em:** 1 de setembro de 2026  '
          )
          replace_once(
              'docs/full-biography-workflow.md',
              'A fonte autoral de cada episódio é a vertical temática correspondente.\n\nFluxo:',
              'Por padrão, a fonte autoral de cada episódio é a vertical temática correspondente. Entradas deliberadamente promovidas a Chapter Page podem migrar para um fragmento neutro em `content/entries/<lang>/`, que passa a alimentar a vertical; a Full Biography continua sendo sincronizada a partir da unidade temática resultante. Não fazer migração `.inc` em massa.\n\nFluxo padrão:'
          )

          # Enforce the Melissa-calibrated rich-preview ceiling in the permanent entry audit.
          p = Path('tools/audit_entries.py')
          text = p.read_text(encoding='utf-8')
          const_anchor = 'ALLOWED_READER_PRESENTATION = {"normal", "default-open", "featured"}\n'
          if 'MAX_READER_PREVIEW_CHARS' not in text:
              if const_anchor not in text:
                  raise SystemExit('Reader presentation constant anchor missing')
              text = text.replace(const_anchor, const_anchor + 'MAX_READER_PREVIEW_CHARS = 1650\n', 1)

          loop_anchor = '''        for lang in ("pt", "en"):\n            if not entry.get("title", {}).get(lang, "").strip():\n                errors.append(f"{entry_id}: missing {lang} title")\n            if not entry.get("summary", {}).get(lang, "").strip():\n                errors.append(f"{entry_id}: missing {lang} summary")\n\n'''
          preview_check = '''        for lang in ("pt", "en"):\n            if not entry.get("title", {}).get(lang, "").strip():\n                errors.append(f"{entry_id}: missing {lang} title")\n            if not entry.get("summary", {}).get(lang, "").strip():\n                errors.append(f"{entry_id}: missing {lang} summary")\n\n        # Rich collapsed previews are concise autonomous versions of dense entries.\n        # Melissa 1.0 established the accepted upper-density reference; keep future\n        # preview paragraph copy within that mobile-tested ceiling.\n        reader_preview = entry.get("reader_preview", {})\n        if reader_preview is not None and not isinstance(reader_preview, dict):\n            errors.append(f"{entry_id}: reader_preview must be an object when present")\n        elif isinstance(reader_preview, dict):\n            for lang in ("pt", "en"):\n                preview = reader_preview.get(lang)\n                if preview is None:\n                    continue\n                if not isinstance(preview, dict):\n                    errors.append(f"{entry_id}:{lang}: reader_preview must be an object")\n                    continue\n                paragraphs = preview.get("paragraphs", [])\n                if not isinstance(paragraphs, list) or not paragraphs:\n                    errors.append(f"{entry_id}:{lang}: reader_preview requires at least one paragraph")\n                    continue\n                visible_copy = 0\n                for idx, paragraph in enumerate(paragraphs, start=1):\n                    if not isinstance(paragraph, dict) or not isinstance(paragraph.get("text"), str):\n                        errors.append(f"{entry_id}:{lang}: reader_preview paragraph {idx} requires text")\n                        continue\n                    visible_copy += len(paragraph["text"])\n                if visible_copy > MAX_READER_PREVIEW_CHARS:\n                    errors.append(\n                        f"{entry_id}:{lang}: reader_preview copy has {visible_copy} characters; "\n                        f"maximum is {MAX_READER_PREVIEW_CHARS}"\n                    )\n\n'''
          if 'Rich collapsed previews are concise autonomous versions' not in text:
              if loop_anchor not in text:
                  raise SystemExit('Entry language-validation anchor missing')
              text = text.replace(loop_anchor, preview_check, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile tools/audit_entries.py
          python tools/audit_entries.py
          python tools/sync_full_biography.py --check
          python tools/editorial_parity.py --check
      - name: Commit reconciliation
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add docs/hub-continuity-guide.md docs/hub-continuity-addendum-2026-08-29.md docs/ux-seo-architecture-v1.md docs/entry-architecture-pilot.md docs/full-biography-workflow.md tools/audit_entries.py
          git commit -m "Reconcile historical docs and enforce preview density"
          git push origin work/docs-legacy-dossier-2026-09-01
