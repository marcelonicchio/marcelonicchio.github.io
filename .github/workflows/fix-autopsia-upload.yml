name: Normalize Autopsia upload

on:
  push:
    branches:
      - autopsia-public-deck
    paths:
      - '.github/workflows/fix-autopsia-upload.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopsia-public-deck
          fetch-depth: 0

      - name: Normalize PDF filename and audit
        shell: bash
        run: |
          set -euo pipefail
          test -f 'assets/archive/autopsia-apresentacao(1).pdf'
          test -f 'assets/archive/autopsia-thumb.webp'
          mv 'assets/archive/autopsia-apresentacao(1).pdf' 'assets/archive/autopsia-apresentacao.pdf'

          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py
          git diff --check

          rm .github/workflows/fix-autopsia-upload.yml

          git config user.name "Marcelo Nicchio Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/archive/autopsia-apresentacao.pdf assets/archive/autopsia-thumb.webp .github/workflows/fix-autopsia-upload.yml
          git add -u assets/archive
          git commit -m "Normalize Autopsia deck filename and verify publication [skip ci]"
          git push origin HEAD:autopsia-public-deck
