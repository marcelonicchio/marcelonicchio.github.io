name: Krist cleanup Limonada patch files

on:
  push:
    branches: [feat/music-cdp-hierarchy-limonada]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/music-cdp-hierarchy-limonada
          fetch-depth: 0
      - name: Remove temporary files
        run: |
          git rm -f tools/_krist_close_limonada_kid_texts.py
          git rm -f .github/workflows/krist-close-limonada-kid-texts.yml
          git rm -f .github/workflows/krist-cleanup-limonada.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary Limonada patch files"
          git push origin HEAD:feat/music-cdp-hierarchy-limonada
