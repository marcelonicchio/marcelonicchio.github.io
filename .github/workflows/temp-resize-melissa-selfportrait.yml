name: Temporary resize Melissa self-portrait

on:
  push:
    branches:
      - work/melissa-selfportrait-responsive-size

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/melissa-selfportrait-responsive-size
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Resize Melissa self-portrait responsively
        shell: python
        run: |
          from pathlib import Path

          for filename in ("pt/ia-hai/index.html", "en/ai-hai/index.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = '<figure class="thread-media" style="width:50%;margin-left:auto;margin-right:auto"><a href="/assets/media/thread/melissa1_0_selfportrait300kb.jpg"'
              new = '<figure class="thread-media melissa-selfportrait"><a href="/assets/media/thread/melissa1_0_selfportrait300kb.jpg"'
              if old not in text:
                  raise SystemExit(f"Expected Melissa self-portrait markup not found in {filename}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          css = Path("styles.css")
          text = css.read_text(encoding="utf-8")
          marker = "/* Melissa self-portrait responsive sizing */"
          if marker not in text:
              text += "\n\n" + marker + "\n.melissa-selfportrait{width:65%;margin-left:auto;margin-right:auto}\n@media(max-width:580px){.melissa-selfportrait{width:100%}}\n"
              css.write_text(text, encoding="utf-8")
      - name: Accept reviewed PT EN checkpoint
        run: python tools/editorial_parity.py --accept hai-melissa
      - name: Generate Full Biography
        run: python tools/sync_full_biography.py
      - name: Commit synchronized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Melissa self-portrait already resized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/ia-hai/index.html en/ai-hai/index.html styles.css data/editorial_parity.json pt/biografia/index.html en/biography/index.html
          git commit -m "Resize Melissa self-portrait responsively"
          git push origin HEAD:work/melissa-selfportrait-responsive-size
