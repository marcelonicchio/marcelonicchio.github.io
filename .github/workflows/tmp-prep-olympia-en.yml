name: TEMP Prepare Olympia EN media parity

on:
  push:
    branches:
      - feat/video-media-wave1-music-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add missing Olympia video component to EN only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('en/music/index.html')
          text = path.read_text(encoding='utf-8')
          if 'https://www.youtube.com/watch?v=V624sY_rl8I' in text:
              print('Olympia EN media component already present.')
          else:
              marker = '<!-- gallery:olympia-2000:end -->'
              if text.count(marker) != 1:
                  raise RuntimeError(f'Expected exactly one Olympia gallery end marker, found {text.count(marker)}')
              component = '''<div class="video-library"><div class="video-library__head"><strong>VIDEOS &amp; MEDIA · 2</strong><span>Audiovisual archive</span></div><div class="video-library__group"><div class="video-library__label"><strong>OLYMPIA · OPENING FOR OS PARALAMAS · 2000</strong></div><div class="video-library__description">Two surviving records from Coitado do Próximo’s performance at Olympia, opening for Os Paralamas do Sucesso.</div><div class="video-library__actions"><a class="video-pill video-pill--primary" href="https://www.youtube.com/watch?v=V624sY_rl8I" target="_blank" rel="noopener noreferrer">Estava Comigo</a><a class="video-pill" href="https://youtu.be/0-RXucDYMfk" target="_blank" rel="noopener noreferrer">Ciúmes</a></div></div></div>'''
              text = text.replace(marker, marker + '\n' + component, 1)
              path.write_text(text, encoding='utf-8')
              print('Inserted Olympia EN video component after the existing gallery.')
          PY
      - name: Validate insertion and commit helper result
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('en/music/index.html').read_text(encoding='utf-8')
          assert text.count('https://www.youtube.com/watch?v=V624sY_rl8I') == 1
          assert text.count('https://youtu.be/0-RXucDYMfk') == 1
          assert 'OLYMPIA · OPENING FOR OS PARALAMAS · 2000' in text
          print('Olympia EN parity precondition OK.')
          PY
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git rm -f .github/workflows/tmp-prep-olympia-en.yml
          git add en/music/index.html
          if git diff --cached --quiet; then
            echo "No helper changes to commit."
          else
            git diff --cached --check
            git commit -m "fix: align Olympia audiovisual evidence in EN Music"
            git push origin HEAD:feat/video-media-wave1-music-20260914
          fi
