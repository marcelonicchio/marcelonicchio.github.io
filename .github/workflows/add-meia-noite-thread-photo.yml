name: Add Meia-Noite e Uns thread photo

on:
  push:
    branches: [meia-noite-thread-photo]

permissions:
  contents: write

jobs:
  place-photo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meia-noite-thread-photo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert editorial thread image
        run: |
          python - <<'PY'
          from pathlib import Path

          image = '/assets/archive/audiovisual/meia-noite-e-uns/meianoiteeuns-thread.jpg'

          changes = [
              (
                  Path('pt/audiovisual/index.html'),
                  '<p><strong>Meia-Noite e Uns</strong> foi um programa de televisão sobre literatura com linguagem pop, exibido pela RedeTV! e apresentado por Soninha Francine. Marcelo Nicchio assinou a <strong>Direção Artística</strong> e a <strong>Produção Executiva</strong> ao lado de <strong>Cristiano Gonçalves</strong>, pela <strong>Dreamsnetwork.tv</strong>.</p>',
                  f'''<p><strong>Meia-Noite e Uns</strong> foi um programa de televisão sobre literatura com linguagem pop, exibido pela RedeTV! e apresentado por Soninha Francine. Marcelo Nicchio assinou a <strong>Direção Artística</strong> e a <strong>Produção Executiva</strong> ao lado de <strong>Cristiano Gonçalves</strong>, pela <strong>Dreamsnetwork.tv</strong>.</p><figure class="thread-media thread-media--linked"><a href="{image}" target="_blank" rel="noopener noreferrer" aria-label="Abrir a colagem visual de Meia-Noite e Uns em tamanho maior"><img src="{image}" loading="lazy" decoding="async" alt="Colagem de fotografias e ilustrações do programa Meia-Noite e Uns, exibido pela RedeTV! em 2006."></a><figcaption><strong>Meia-Noite e Uns · 2006.</strong><span class="thread-media-note">Colagem visual reunindo fotografias e ilustrações do programa.</span><a class="thread-media-open" href="{image}" target="_blank" rel="noopener noreferrer">Abrir imagem em tamanho maior ↗</a></figcaption></figure>'''
              ),
              (
                  Path('en/audiovisual/index.html'),
                  '<p><strong>Meia-Noite e Uns</strong> was a pop-literature television program broadcast by RedeTV! and hosted by Soninha Francine. Marcelo Nicchio served as <strong>Artistic Director</strong> and <strong>Executive Producer</strong> alongside <strong>Cristiano Gonçalves</strong>, through <strong>Dreamsnetwork.tv</strong>.</p>',
                  f'''<p><strong>Meia-Noite e Uns</strong> was a pop-literature television program broadcast by RedeTV! and hosted by Soninha Francine. Marcelo Nicchio served as <strong>Artistic Director</strong> and <strong>Executive Producer</strong> alongside <strong>Cristiano Gonçalves</strong>, through <strong>Dreamsnetwork.tv</strong>.</p><figure class="thread-media thread-media--linked"><a href="{image}" target="_blank" rel="noopener noreferrer" aria-label="Open the Meia-Noite e Uns visual collage at full size"><img src="{image}" loading="lazy" decoding="async" alt="Collage of photographs and illustrations from the television program Meia-Noite e Uns, broadcast by RedeTV! in 2006."></a><figcaption><strong>Meia-Noite e Uns · 2006.</strong><span class="thread-media-note">Visual collage combining photographs and illustrations from the program.</span><a class="thread-media-open" href="{image}" target="_blank" rel="noopener noreferrer">Open full-size image ↗</a></figcaption></figure>'''
              ),
          ]

          for path, old, new in changes:
              text = path.read_text(encoding='utf-8')
              if image in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Insertion anchor not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit placement
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/audiovisual/index.html en/audiovisual/index.html
          git commit -m "Place Meia-Noite e Uns collage in audiovisual thread"
          git push origin HEAD:meia-noite-thread-photo
