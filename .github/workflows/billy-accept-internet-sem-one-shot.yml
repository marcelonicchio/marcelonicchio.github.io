name: Billy accept internet-sem parity one-shot

on:
  push:
    branches:
      - billy/search-profissionalizacao-louise-2026-09-07
    paths:
      - .github/workflows/billy-accept-internet-sem-one-shot.yml

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependency
        run: python -m pip install beautifulsoup4
      - name: Accept reviewed PT EN checkpoint
        run: |
          python tools/editorial_parity.py --accept internet-sem
          python tools/editorial_parity.py --check
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/billy-accept-internet-sem-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: accept Search professionalization PT EN parity'
          git push
