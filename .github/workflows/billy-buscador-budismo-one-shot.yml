name: Billy Buscador Budismo one-shot

on:
  push:
    branches:
      - billy/buscador-budismo-2026-09-06
    paths:
      - .github/workflows/billy-buscador-budismo-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install sync dependencies
        run: python -m pip install beautifulsoup4
      - name: Normalize Buddhismo to Budismo in Portuguese Seeker sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          fragment = Path('content/full-biography/pt/spirituality-seeker.inc')
          text = fragment.read_text(encoding='utf-8')
          before = text.count('Buddhismo')
          if before == 0:
              raise SystemExit('Expected Buddhismo occurrences not found in PT spirituality source')
          text = text.replace('Buddhismo', 'Budismo')
          fragment.write_text(text, encoding='utf-8')

          path = Path('data/entries.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entry = next((e for e in data['entries'] if e.get('id') == 'spirituality-seeker'), None)
          if entry is None:
              raise SystemExit('spirituality-seeker entry not found')

          entry['summary']['pt'] = entry['summary']['pt'].replace('Buddhismo', 'Budismo')
          entry['chapter_page']['description']['pt'] = entry['chapter_page']['description']['pt'].replace('Buddhismo', 'Budismo')
          entry['topic_ids'] = [tid for tid in entry['topic_ids'] if tid != 'buddhismo']

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Synchronize generated biography surfaces
        run: |
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
          python tools/editorial_parity.py --accept spirituality-seeker
          python tools/build_sitemap.py
      - name: Validate surgical scope
        run: |
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/editorial_parity.py --check
          python tools/build_sitemap.py --check
          python - <<'PY'
          from pathlib import Path
          import json

          pt_paths = [
              Path('content/full-biography/pt/spirituality-seeker.inc'),
              Path('pt/biografia/index.html'),
              Path('pt/biografia/espiritualidade-o-buscador/index.html'),
          ]
          for path in pt_paths:
              text = path.read_text(encoding='utf-8')
              if 'Buddhismo' in text:
                  raise SystemExit(f'Buddhismo still present in {path}')
              if 'Budismo' not in text:
                  raise SystemExit(f'Budismo missing from {path}')

          data = json.loads(Path('data/entries.json').read_text(encoding='utf-8'))
          entry = next(e for e in data['entries'] if e.get('id') == 'spirituality-seeker')
          if 'buddhismo' in entry['topic_ids']:
              raise SystemExit('Redundant buddhismo topic still present')
          if 'buddhism' not in entry['topic_ids']:
              raise SystemExit('Canonical Buddhism topic unexpectedly removed')
          if 'Buddhismo' in entry['summary']['pt'] or 'Buddhismo' in entry['chapter_page']['description']['pt']:
              raise SystemExit('Buddhismo remains in Portuguese entry metadata')

          en = Path('content/full-biography/en/spirituality-seeker.inc').read_text(encoding='utf-8')
          if 'Theravada Buddhism' not in en:
              raise SystemExit('English source changed unexpectedly')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/billy-buscador-budismo-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize Budismo spelling in O Buscador'
          git push
