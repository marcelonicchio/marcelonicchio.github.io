name: Editorial inline archive

on:
  push:
    branches: [editorial-inline-archive]
    paths:
      - '.editorial-inline-archive'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-inline-archive
          fetch-depth: 0

      - name: Build public archive derivatives and move records inline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p /tmp/mn-archive assets/archive

          base='https://raw.githubusercontent.com/marcelonicchio/marcelonicchio.github.io/38fbeaa3848a2429318022f520b98ff2e32d2315/assets/img'
          curl -fsSL "$base/cartao_livraria_cultura02.jpg" -o /tmp/mn-archive/livraria.jpg
          curl -fsSL "$base/cartao_addialeto03.JPG" -o /tmp/mn-archive/dialetto.jpg
          curl -fsSL "$base/cartao_dreamsnetwork06.jpg" -o /tmp/mn-archive/dreams.jpg
          curl -fsSL "$base/cartao_nicchio_asssociados02.jpg" -o /tmp/mn-archive/nicchio.jpg
          curl -fsSL "$base/cartao_miranttenews02.jpg" -o /tmp/mn-archive/mirantte.jpg
          curl -fsSL "$base/ScreenShot010.jpg" -o /tmp/mn-archive/clickland-card.jpg
          curl -fsSL "$base/nonameclicklandsite.jpg" -o /tmp/mn-archive/clickland-home.jpg

          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          out = Path('assets/archive')
          out.mkdir(parents=True, exist_ok=True)

          def save(im, name, quality=88):
              im = im.convert('RGB')
              im.save(out / name, 'WEBP', quality=quality, method=6)

          # Livraria Cultura: preserve logo, name and company identity; omit contact details.
          im = Image.open('/tmp/mn-archive/livraria.jpg').convert('RGB')
          im = im.crop((20, 70, min(1000, im.width), min(300, im.height)))
          d = ImageDraw.Draw(im)
          d.rectangle((450, 82, im.width, 126), fill=(242, 241, 236))
          save(im, 'livraria-cultura-card-2000.webp')

          # Ad.Dialetto: retain brand, name and historical site; omit direct contact/address data.
          im = Image.open('/tmp/mn-archive/dialetto.jpg').convert('RGB')
          im = im.crop((0, 18, im.width, min(345, im.height)))
          d = ImageDraw.Draw(im)
          d.rectangle((505, 165, im.width, 202), fill=(31, 31, 29))
          d.rectangle((505, 225, im.width, 265), fill=(31, 31, 29))
          save(im, 'ad-dialetto-card-2015.webp')

          # DreamsNetwork: retain name/title and brand; omit personal/company contact block.
          im = Image.open('/tmp/mn-archive/dreams.jpg').convert('RGB')
          im = im.crop((0, 35, im.width, min(350, im.height)))
          d = ImageDraw.Draw(im)
          d.rectangle((430, 145, im.width, 295), fill=(226, 224, 218))
          save(im, 'dreamsnetwork-card-2006.webp')

          # Nicchio & Associados: upper portion already contains name/title and brand without contacts.
          im = Image.open('/tmp/mn-archive/nicchio.jpg').convert('RGB')
          im = im.crop((0, 8, im.width, min(325, im.height)))
          save(im, 'nicchio-associados-card.webp')

          # Mirantte News: crop before personal contact lines begin.
          im = Image.open('/tmp/mn-archive/mirantte.jpg').convert('RGB')
          im = im.crop((0, 0, im.width, min(325, im.height)))
          save(im, 'mirantte-news-card.webp')

          # Clickland card: retain brand/name/site/badges, omit personal email/mobile/Skype.
          im = Image.open('/tmp/mn-archive/clickland-card.jpg').convert('RGB')
          d = ImageDraw.Draw(im)
          d.rectangle((345, 195, im.width, 315), fill=(3, 3, 3))
          save(im, 'clickland-card.webp')

          # Clickland historical homepage: remove the top contact strip and keep the actual page composition.
          im = Image.open('/tmp/mn-archive/clickland-home.jpg').convert('RGB')
          im = im.crop((0, min(120, im.height-1), im.width, im.height))
          if im.width > 1280:
              h = round(im.height * 1280 / im.width)
              im = im.resize((1280, h), Image.Resampling.LANCZOS)
          save(im, 'clickland-home-historical.webp', 86)
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, s):
              Path(path).write_text(s, encoding='utf-8')

          def remove_first_note(path):
              s = read(path)
              s2, n = re.subn(r'\n?<div class="note">.*?</div>\n?', '\n', s, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'Expected one note in {path}, removed {n}')
              write(path, s2)

          def neutralize_bio_note(path, pt=True):
              s = read(path)
              repl = ('<div class="note"><strong>Arquivo vivo.</strong> Esta biografia é atualizada à medida que novos registros, imagens, áudios e vídeos são digitalizados e incorporados.</div>' if pt else
                      '<div class="note"><strong>Living archive.</strong> This biography is updated as new records, images, audio and video are digitized and incorporated.</div>')
              s2, n = re.subn(r'<div class="note"><strong>(?:Arquivo vivo\.|Living archive\.)</strong>.*?</div>', repl, s, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'Expected biography note in {path}, changed {n}')
              write(path, s2)

          def remove_section(path, section_id):
              s = read(path)
              pattern = rf'\n?<section id="{re.escape(section_id)}" class="chapter">.*?</section>\n?'
              s2, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'Expected section #{section_id} in {path}, removed {n}')
              write(path, s2)

          def remove_aside_link(path, section_id):
              s = read(path)
              s2, n = re.subn(rf'<a href="#{re.escape(section_id)}">.*?</a>', '', s, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'Expected aside link #{section_id} in {path}, removed {n}')
              write(path, s2)

          def remove_aside_note(path):
              s = read(path)
              s2, n = re.subn(r'<p class="aside-note">.*?</p>', '', s, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'Expected aside note in {path}, removed {n}')
              write(path, s2)

          def insert_after_paragraph(path, needle, snippet):
              s = read(path)
              i = s.find(needle)
              if i < 0:
                  raise RuntimeError(f'Needle not found in {path}: {needle}')
              j = s.find('</p>', i)
              if j < 0:
                  raise RuntimeError(f'Paragraph end not found after needle in {path}: {needle}')
              j += 4
              if snippet.strip() in s:
                  return
              write(path, s[:j] + snippet + s[j:])

          def replace_once(path, old, new):
              s = read(path)
              if s.count(old) != 1:
                  raise RuntimeError(f'Expected one occurrence in {path}, found {s.count(old)}: {old[:100]}')
              write(path, s.replace(old, new, 1))

          def strip_source_section(path, section_id):
              remove_section(path, section_id)
              remove_aside_link(path, section_id)

          def img_record(src, alt, title, label):
              return f'''\n<div class="inline-records"><a class="inline-record" href="{src}" target="_blank" rel="noopener noreferrer"><img src="{src}" loading="lazy" decoding="async" alt="{alt}"><span><strong>{title}</strong><small>{label} ↗</small></span></a></div>'''

          def img_pair(items):
              cards = []
              for src, alt, title, label in items:
                  cards.append(f'<a class="inline-record" href="{src}" target="_blank" rel="noopener noreferrer"><img src="{src}" loading="lazy" decoding="async" alt="{alt}"><span><strong>{title}</strong><small>{label} ↗</small></span></a>')
              return '\n<div class="inline-records inline-records--two">' + ''.join(cards) + '</div>'

          def links(items):
              return '\n<div class="evidence-links inline-links">' + ''.join(f'<a href="{url}" target="_blank" rel="noopener noreferrer">{label}</a>' for url, label in items) + '</div>'

          # Shared styling: documentary material appears where the story happens, not in an evidence basement.
          css = read('styles.css')
          marker = '.page-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}'
          add = '''\n.inline-records{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:18px 0 6px}\n.inline-records--two{grid-template-columns:repeat(2,minmax(0,1fr))}\n.inline-record{display:block;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.018);text-decoration:none;color:var(--text)}\n.inline-record:hover{opacity:1;border-color:#4a4a4f}\n.inline-record img{display:block;width:100%;height:auto;max-height:330px;object-fit:contain;background:#e7e4de}\n.inline-record span{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px}\n.inline-record strong{font-size:.9rem}\n.inline-record small{font-size:.72rem;color:var(--accent-soft);white-space:nowrap}\n.inline-links{margin:14px 0 5px}\n@media(max-width:580px){.inline-records--two{grid-template-columns:1fr}.inline-record span{align-items:flex-start;flex-direction:column;gap:3px}}\n'''
          if '.inline-records{' not in css:
              if marker not in css:
                  raise RuntimeError('CSS insertion marker not found')
              css = css.replace(marker, marker + add, 1)
              write('styles.css', css)

