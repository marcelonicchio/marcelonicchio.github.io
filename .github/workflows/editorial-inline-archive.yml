          insert_after_paragraph('en/biography/index.html', 'MapLink', img_record('/assets/archive/mirantte-news-card.webp', 'Mirantte News professional card with brand, tagline and the name Marcelo Nicchio; contact details omitted from the public version.', 'Mirantte News · professional card', 'Open record'))

          insert_after_paragraph('pt/biografia/index.html', 'um cartão profissional preservado o identifica como <strong>Produtor Cultural</strong>', img_record('/assets/archive/nicchio-associados-card.webp', 'Cartão da Nicchio e Associados identificando Marcelo Henrique Nicchio como Produtor Cultural; dados de contato fora do recorte público.', 'Nicchio & Associados · Produtor Cultural', 'Abrir registro'))
