          insert_after_paragraph('pt/biografia/index.html', 'Dreamsnetwork.tv como realizadora', img_pair([
              ('/assets/archive/dreamsnetwork-card-2006.webp', 'Cartão DreamsNetwork identificando Marcelo Nicchio como Produtor Executivo; contatos omitidos.', 'DreamsNetwork · Produtor Executivo', 'Abrir cartão'),
