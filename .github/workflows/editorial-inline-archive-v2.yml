              ('https://www1.folha.uol.com.br/fsp/folhatee/inde23042001.htm','Issue index ↗')]))
          for p,sid in [('pt/comunicacao/index.html','registros'),('en/communication/index.html','records')]:
              remove_section(p,sid); remove_aside_link(p,sid)

          # Music: public Olympia and Jô records accompany the corresponding chronological moments.
          for p in ['pt/musica/index.html','en/music/index.html']:
              remove_first_note(p); remove_aside_note(p)
          replace_text('pt/musica/index.html','<div class="phase-year">jul. 2000</div><div><h3>Olympia</h3><p>Apresentação no Olympia, em São Paulo, na abertura de Os Paralamas do Sucesso. Dois registros audiovisuais sobrevivem publicamente.</p></div></div>', '<div class="phase-year">jul. 2000</div><div><h3>Olympia</h3><p>Apresentação no Olympia, em São Paulo, na abertura de Os Paralamas do Sucesso.</p>' + links([('https://www.youtube.com/watch?v=V624sY_rl8I','Estava Comigo ↗'),('https://youtu.be/0-RXucDYMfk','Ciúmes ↗')]) + '</div></div>')
          replace_text('en/music/index.html','<div class="phase-year">Jul. 2000</div><div><h3>Olympia</h3><p>Performance at Olympia in São Paulo, opening for Os Paralamas do Sucesso. Two audiovisual records survive publicly.</p></div></div>', '<div class="phase-year">Jul. 2000</div><div><h3>Olympia</h3><p>Performance at Olympia in São Paulo, opening for Os Paralamas do Sucesso.</p>' + links([('https://www.youtube.com/watch?v=V624sY_rl8I','Estava Comigo ↗'),('https://youtu.be/0-RXucDYMfk','Ciúmes ↗')]) + '</div></div>')
          replace_text('pt/musica/index.html','<div class="phase-year">21 jun. 2001</div><div><h3>Programa do Jô</h3><p>Entrevista e apresentação na Rede Globo. O Coitado do Próximo tocou <em>Estava Comigo</em>, composição de Marcelo Nicchio.</p></div></div>', '<div class="phase-year">21 jun. 2001</div><div><h3>Programa do Jô</h3><p>Entrevista e apresentação na Rede Globo. O Coitado do Próximo tocou <em>Estava Comigo</em>, composição de Marcelo Nicchio.</p>' + links([('https://www.youtube.com/watch?v=4NKHy_C8wsI&t=8s','Programa do Jô — Estava Comigo ↗')]) + '</div></div>')
          replace_text('en/music/index.html','<div class="phase-year">Jun. 21, 2001</div><div><h3>Programa do Jô</h3><p>Interview and performance on Rede Globo. Coitado do Próximo performed <em>Estava Comigo</em>, a composition by Marcelo Nicchio.</p></div></div>', '<div class="phase-year">Jun. 21, 2001</div><div><h3>Programa do Jô</h3><p>Interview and performance on Rede Globo. Coitado do Próximo performed <em>Estava Comigo</em>, a composition by Marcelo Nicchio.</p>' + links([('https://www.youtube.com/watch?v=4NKHy_C8wsI&t=8s','Programa do Jô — Estava Comigo ↗')]) + '</div></div>')
