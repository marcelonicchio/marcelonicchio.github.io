name: Temporary Reader CTA badge test

on:
  push:
    branches:
      - work/reader-cta-badge-test

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reader-cta-badge-test
          fetch-depth: 0
      - name: Install audit dependency
        run: pip install beautifulsoup4
      - name: Apply CTA badge-style trial
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{label}: expected 1, found {count}'
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          css = 'assets/reader-disclosure.css'
          replace_once(css,
            'html.reader-disclosure-active .reader-disclosure__toggle{display:inline-flex;align-items:center;margin-top:16px;min-height:36px;padding:7px 12px;border:1px solid rgba(224,99,92,.78);border-radius:999px;background:rgba(107,38,38,.72);color:#fff;font-size:.86rem;font-weight:500;letter-spacing:.01em;box-shadow:0 5px 16px rgba(155,47,47,.18)}',
            'html.reader-disclosure-active .reader-disclosure__toggle{display:inline-flex;align-items:center;margin-top:14px;min-height:30px;padding:5px 9px;border:1px solid rgba(211,164,160,.45);border-radius:999px;background:rgba(155,47,47,.16);color:#f0c2be;font-size:.76rem;font-weight:500;letter-spacing:.01em;box-shadow:none}',
            'top CTA style')
          replace_once(css,
            'html.reader-disclosure-active .reader-disclosure>summary:hover .reader-disclosure__toggle{background:rgba(124,45,45,.82);border-color:#ef7a73}',
            'html.reader-disclosure-active .reader-disclosure>summary:hover .reader-disclosure__toggle{background:rgba(155,47,47,.24);border-color:rgba(224,120,113,.62);color:#f7d4d0}',
            'top CTA hover')
          replace_once(css,
            'html.reader-disclosure-active .reader-disclosure__collapse-button{appearance:none;display:inline-flex;align-items:center;min-height:38px;padding:8px 13px;border:1px solid rgba(224,99,92,.72);border-radius:999px;background:rgba(107,38,38,.72);color:#fff;font:inherit;font-size:.84rem;font-weight:500;cursor:pointer}',
            'html.reader-disclosure-active .reader-disclosure__collapse-button{appearance:none;display:inline-flex;align-items:center;min-height:31px;padding:5px 10px;border:1px solid rgba(211,164,160,.45);border-radius:999px;background:rgba(155,47,47,.16);color:#f0c2be;font:inherit;font-size:.76rem;font-weight:500;cursor:pointer}',
            'bottom collapse style')
          replace_once(css,
            'html.reader-disclosure-active .reader-disclosure__collapse-button:hover{background:rgba(124,45,45,.82);border-color:#ef7a73}',
            'html.reader-disclosure-active .reader-disclosure__collapse-button:hover{background:rgba(155,47,47,.24);border-color:rgba(224,120,113,.62);color:#f7d4d0}',
            'bottom collapse hover')
          replace_once(css,
            '@media(max-width:580px){html.reader-disclosure-active .reader-disclosure>summary{padding:17px 46px 17px 16px}html.reader-disclosure-active .reader-disclosure>summary:after{top:17px;right:14px}html.reader-disclosure-active .reader-disclosure__body{padding:2px 16px 20px}html.reader-disclosure-active .reader-disclosure-controls__label{flex:1 0 100%;margin-bottom:2px}html.reader-disclosure-active .reader-disclosure__toggle{min-height:38px;padding:8px 13px;font-size:.88rem}html.reader-disclosure-active .reader-disclosure__collapse-row{justify-content:stretch}html.reader-disclosure-active .reader-disclosure__collapse-button{width:100%;justify-content:center}}',
            '@media(max-width:580px){html.reader-disclosure-active .reader-disclosure>summary{padding:17px 46px 17px 16px}html.reader-disclosure-active .reader-disclosure>summary:after{top:17px;right:14px}html.reader-disclosure-active .reader-disclosure__body{padding:2px 16px 20px}html.reader-disclosure-active .reader-disclosure-controls__label{flex:1 0 100%;margin-bottom:2px}html.reader-disclosure-active .reader-disclosure__toggle{min-height:32px;padding:6px 10px;font-size:.78rem}html.reader-disclosure-active .reader-disclosure__collapse-row{justify-content:flex-end}html.reader-disclosure-active .reader-disclosure__collapse-button{width:auto;justify-content:center;min-height:32px;padding:6px 10px;font-size:.78rem}}',
            'mobile CTA sizing')

          for rel in ['assets/js/reader-disclosure-loader.js', 'tools/sync_reader_disclosure_loader.py']:
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              count = text.count('20260901-reader7')
              assert count >= 1, f'{rel}: reader7 missing'
              p.write_text(text.replace('20260901-reader7', '20260901-reader8'), encoding='utf-8')

          for rel in ['pt/biografia/index.html','en/biography/index.html','pt/internet/index.html','en/internet/index.html','pt/comunicacao/index.html','en/communication/index.html','pt/audiovisual/index.html','en/audiovisual/index.html','pt/ia-hai/index.html','en/ai-hai/index.html']:
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              count = text.count('20260901-reader7')
              assert count == 1, f'{rel}: expected one reader7, found {count}'
              p.write_text(text.replace('20260901-reader7', '20260901-reader8'), encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check assets/js/reader-disclosure-loader.js
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_reader_ux.js
          python tools/sync_reader_disclosure_loader.py --check
          python tools/audit_entries.py
          python tools/sync_full_biography.py --check
      - name: Commit final diff
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          rm .github/workflows/temp-reader-cta-badge-test.yml
          git add -A
          git commit -m "Test smaller badge-style Reader CTA"
          git push origin HEAD:work/reader-cta-badge-test
