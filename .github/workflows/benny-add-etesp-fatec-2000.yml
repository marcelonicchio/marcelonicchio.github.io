name: Benny add ETESP FATEC 2000

on:
  push:
    branches:
      - benny/music-etesp-fatec-2000

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Prepare ETESP FATEC entry and gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json, shutil

          root = Path('assets/archive/music/coitado-do-proximo/2000-etesp-fatec')
          gallery_dir = root / 'galeria'
          thread_src = root / '2000_etesp_fatec_thread.jpg'
          gallery_sources = [
              gallery_dir / ('2000_etesp_fatec_%02d_AI.jpg' % i if i <= 2 else '2000_etesp_fatec_%02d.jpg' % i)
              for i in range(1, 17)
          ]
          missing = [str(p) for p in [thread_src, *gallery_sources] if not p.exists()]
          if missing:
              raise SystemExit('Missing uploaded files: ' + ', '.join(missing))
          extras = sorted(p.name for p in gallery_dir.iterdir() if p.is_file() and p not in gallery_sources)
          if extras:
              raise SystemExit('Unexpected gallery files: ' + ', '.join(extras))

          def save_under_limit(src: Path, dst: Path, limit=300_000):
              if src.stat().st_size <= limit:
                  shutil.copy2(src, dst)
                  with Image.open(dst) as im:
                      return ImageOps.exif_transpose(im).size
              img = ImageOps.exif_transpose(Image.open(src)).convert('RGB')
              work = img
              while True:
                  for quality in range(92, 34, -3):
                      work.save(dst, 'JPEG', quality=quality, optimize=True, progressive=True)
                      if dst.stat().st_size <= limit:
                          return work.size
                  nw = max(640, int(work.width * 0.92))
                  nh = max(480, int(work.height * 0.92))
                  if (nw, nh) == work.size:
                      raise SystemExit(f'Could not compress {src} below {limit} bytes')
                  work = work.resize((nw, nh), Image.Resampling.LANCZOS)

          thread_dst = root / '2000_etesp_fatec_thread_300kb.jpg'
          tw, th = save_under_limit(thread_src, thread_dst)
          print(f'Thread derivative: {tw}x{th}, {thread_dst.stat().st_size} bytes')

          gid = 'etesp-fatec-2000'
          registry_path = Path('data/galleries.json')
          reg = json.loads(registry_path.read_text(encoding='utf-8'))
          if any(g.get('id') == gid for g in reg['galleries']):
              raise SystemExit(f'Gallery already exists: {gid}')
          gallery = {
              'id': gid,
              'sourceRoot': str(gallery_dir).replace('\\', '/'),
              'targets': {
                  'pt': ['pt/musica/index.html'],
                  'en': ['en/music/index.html']
              },
              'title': {
                  'pt': 'Registros de junho de 2000',
                  'en': 'June 2000 records'
              },
              'items': []
          }
          for idx, path in enumerate(gallery_sources, 1):
              with Image.open(path) as im:
                  w, h = ImageOps.exif_transpose(im).size
              if idx <= 2:
                  pt_cap = f'ETESP/FATEC · junho de 2000 — reconstituição por IA {idx}, feita a partir de imagem do vídeo original de baixa qualidade.'
                  en_cap = f'ETESP/FATEC · June 2000 — AI reconstruction {idx}, made from the low-quality original video footage.'
              else:
                  pt_cap = f'ETESP/FATEC · junho de 2000 — print original da filmagem {idx - 2}, preservado em baixa qualidade.'
                  en_cap = f'ETESP/FATEC · June 2000 — original video frame capture {idx - 2}, preserved in low quality.'
              gallery['items'].append({
                  'id': f'{idx:02d}',
                  'source': path.name,
                  'caption': {'pt': pt_cap, 'en': en_cap},
                  'width': w,
                  'height': h
              })
          olympia_i = next((i for i,g in enumerate(reg['galleries']) if g.get('id') == 'olympia-2000'), len(reg['galleries']))
          reg['galleries'].insert(olympia_i, gallery)
          reg['updated'] = '2026-09-10'
          registry_path.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          img = '/assets/archive/music/coitado-do-proximo/2000-etesp-fatec/2000_etesp_fatec_thread_300kb.jpg'
          video = 'https://youtu.be/ps1XJkvd4Qo?si=ckbe6fUHM0s4q5Kw'
          pt_phase = f'''<div class="phase" data-bio-key="music-etesp-fatec-2000"><div class="phase-year">Junho / 28 out. 2000</div><div><h3>ETESP / FATEC — Av. Tiradentes</h3><p>Em junho de 2000, o <strong>Coitado do Próximo</strong> se apresentou na <strong>ETESP/FATEC</strong>, na Avenida Tiradentes, em São Paulo. Em <strong>28 de outubro de 2000</strong>, a banda voltou ao local para tocar na <strong>Festa de Halloween</strong>. Há estimativa de público de cerca de <strong>1.000 pessoas</strong> associada a essas apresentações.</p><p>Do show de junho sobreviveram em vídeo registros da passagem de som, realizada à tarde, e de duas músicas executadas ao vivo à noite.</p><figure class="thread-media thread-media--linked"><a aria-label="Abrir foto da passagem de som do Coitado do Próximo na ETESP/FATEC em tamanho maior" href="{img}" rel="noopener noreferrer" target="_blank"><img alt="Passagem de som do Coitado do Próximo na ETESP/FATEC, na Avenida Tiradentes, em junho de 2000." decoding="async" loading="lazy" src="{img}" width="{tw}" height="{th}"/></a><figcaption><strong>ETESP/FATEC · passagem de som · junho de 2000.</strong><span class="thread-media-note">Registro da passagem de som realizada à tarde, antes da apresentação do Coitado do Próximo na Avenida Tiradentes, em São Paulo.</span><a class="thread-media-open" href="{img}" rel="noopener noreferrer" target="_blank">Abrir imagem em tamanho maior ↗</a></figcaption></figure><!-- gallery:{gid}:start -->\n<!-- gallery:{gid}:end -->\n<div class="evidence-links inline-links"><a href="{video}" target="_blank" rel="noopener noreferrer">Passagem de som e duas músicas ao vivo · junho de 2000 ↗</a></div></div></div>'''
          en_phase = f'''<div class="phase" data-bio-key="music-etesp-fatec-2000"><div class="phase-year">June / Oct. 28, 2000</div><div><h3>ETESP / FATEC — Avenida Tiradentes</h3><p>In June 2000, <strong>Coitado do Próximo</strong> performed at <strong>ETESP/FATEC</strong> on Avenida Tiradentes in São Paulo. On <strong>October 28, 2000</strong>, the band returned to the venue for its <strong>Halloween Party</strong>. An estimated audience of around <strong>1,000 people</strong> is associated with these appearances.</p><p>Surviving video from the June show includes the afternoon soundcheck and two songs performed live that night.</p><figure class="thread-media thread-media--linked"><a aria-label="Open the Coitado do Próximo soundcheck photo at ETESP/FATEC at full size" href="{img}" rel="noopener noreferrer" target="_blank"><img alt="Coitado do Próximo soundcheck at ETESP/FATEC on Avenida Tiradentes in June 2000." decoding="async" loading="lazy" src="{img}" width="{tw}" height="{th}"/></a><figcaption><strong>ETESP/FATEC · soundcheck · June 2000.</strong><span class="thread-media-note">Record of the afternoon soundcheck before Coitado do Próximo’s performance on Avenida Tiradentes in São Paulo.</span><a class="thread-media-open" href="{img}" rel="noopener noreferrer" target="_blank">Open image at full size ↗</a></figcaption></figure><!-- gallery:{gid}:start -->\n<!-- gallery:{gid}:end -->\n<div class="evidence-links inline-links"><a href="{video}" target="_blank" rel="noopener noreferrer">Soundcheck and two live songs · June 2000 ↗</a></div></div></div>'''

          for path, phase in [(Path('pt/musica/index.html'), pt_phase), (Path('en/music/index.html'), en_phase)]:
              text = path.read_text(encoding='utf-8')
              anchor = '<div class="phase" data-bio-key="music-olympia-2000">'
              if text.count(anchor) != 1:
                  raise SystemExit(f'Olympia anchor count in {path}: {text.count(anchor)}')
              text = text.replace(anchor, phase + '\n' + anchor, 1)
              path.write_text(text, encoding='utf-8')

          manifest_path = Path('data/full_biography.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          eid = 'music-etesp-fatec-2000'
          if any(e.get('id') == eid for e in manifest['entries']):
              raise SystemExit(f'Biography entry already exists: {eid}')
          entry = {
              'id': eid,
              'era': 'cruzamentos-1992-2000',
              'date': 'jun. / 28 out. 2000',
              'domain': 'music',
              'source': {
                  'pt': {'path': 'pt/musica/index.html', 'kind': 'phase', 'selector': "[data-bio-key='music-etesp-fatec-2000']", 'parent_selector': '#palcos'},
                  'en': {'path': 'en/music/index.html', 'kind': 'phase', 'selector': "[data-bio-key='music-etesp-fatec-2000']", 'parent_selector': '#stages'}
              },
              'date_en': 'Jun. / Oct. 28, 2000'
          }
          olympia_i = next(i for i,e in enumerate(manifest['entries']) if e.get('id') == 'music-olympia')
          manifest['entries'].insert(olympia_i, entry)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Build gallery media and render gallery
        run: |
          python tools/build_gallery_media.py
          python tools/sync_galleries.py
      - name: Register editorial parity checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tools.editorial_parity as ep
          eid = 'music-etesp-fatec-2000'
          manifest = ep.load_manifest()
          entry = next(e for e in ep.all_entries(manifest) if e['id'] == eid)
          hashes = ep.current_hashes(entry)
          path = Path('data/editorial_parity.json')
          reg = json.loads(path.read_text(encoding='utf-8'))
          if eid in reg['entries']:
              raise SystemExit(f'Parity entry already exists: {eid}')
          reg['entries'][eid] = {
              'revision': 1,
              'pt_hash': hashes['pt'],
              'en_hash': hashes['en'],
              'accepted_on': '2026-09-10',
              'changed_languages': ['pt', 'en']
          }
          path.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Synchronize Full Biography and sitemap
        run: |
          python tools/sync_full_biography.py
          python tools/build_sitemap.py
      - name: Verify integration
        run: |
          python tools/audit_galleries.py
          python tools/editorial_parity.py --check
          python tools/audit_full_biography.py
          grep -q 'Junho / 28 out. 2000' pt/musica/index.html
          grep -q 'June / Oct. 28, 2000' en/music/index.html
          grep -q 'Registros de junho de 2000 · 16' pt/musica/index.html
          grep -q 'music-etesp-fatec-2000' pt/biografia/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/archive/music/coitado-do-proximo/2000-etesp-fatec/2000_etesp_fatec_thread_300kb.jpg')
          assert p.stat().st_size <= 300_000, p.stat().st_size
          print('Thread size OK:', p.stat().st_size)
          PY
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/archive/music/coitado-do-proximo/2000-etesp-fatec/2000_etesp_fatec_thread_300kb.jpg assets/media/galleries/etesp-fatec-2000 data/galleries.json data/full_biography.json data/editorial_parity.json pt/musica/index.html en/music/index.html pt/biografia/index.html en/biography/index.html sitemap.xml
          git commit -m "feat: add ETESP FATEC 2000 entry and media"
          git push origin HEAD:benny/music-etesp-fatec-2000
