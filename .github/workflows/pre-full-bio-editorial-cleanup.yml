name: Pre Full Bio editorial cleanup

on:
  push:
    branches: [pre-full-bio-editorial-cleanup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pre-full-bio-editorial-cleanup
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Apply editorial cleanup
        run: python tools/_apply_pre_full_bio_cleanup.py
      - name: Audit synchronized navigation
        run: python tools/sync_navigation.py --check
      - name: Audit gallery derivatives
        run: python tools/build_gallery_media.py --check
      - name: Audit synchronized galleries
        run: python tools/sync_galleries.py --check
      - name: Audit gallery registry and rendering
        run: python tools/audit_galleries.py
      - name: Audit HTML, JSON and sitemap
        run: python tools/audit_site.py
      - name: Audit presence
        run: python tools/audit_presence.py
      - name: Audit analytics
        run: python tools/audit_analytics.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean HAI editorial tone and clarify music chronology"
          git push origin HEAD:pre-full-bio-editorial-cleanup
