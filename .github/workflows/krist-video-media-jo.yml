name: Krist Jô media component
on:
  push:
    branches: [feat/video-media-component-jo]
    paths:
      - tools/_krist_video_media_jo.py
      - .github/workflows/krist-video-media-jo.yml
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-media-component-jo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Apply video media component
        run: python tools/_krist_video_media_jo.py
      - name: Sync Full Biography
        run: python tools/sync_full_biography.py
      - name: Remove temporary migration files and commit
        run: |
          rm tools/_krist_video_media_jo.py
          rm .github/workflows/krist-video-media-jo.yml
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add -A
          git commit -m "feat: redesign Jô video media controls"
          git push origin HEAD:feat/video-media-component-jo
