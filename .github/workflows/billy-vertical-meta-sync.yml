name: Billy vertical metadata sync

on:
  push:
    branches:
      - billy/vertical-semantic-readiness-2026-09-06

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: billy/vertical-semantic-readiness-2026-09-06
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Synchronize vertical metadata
        run: python tools/sync_vertical_authority_metadata.py
      - name: Commit generated vertical metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/comunicacao/index.html en/communication/index.html pt/internet/index.html en/internet/index.html
          git commit -m "feat: add semantic metadata to authority verticals"
          git push origin HEAD:billy/vertical-semantic-readiness-2026-09-06
