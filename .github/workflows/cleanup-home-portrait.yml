name: Cleanup home portrait source

on:
  push:
    branches: [home-portrait-asset]
    paths:
      - '.portrait-cleanup'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-portrait-asset
          fetch-depth: 0
      - name: Normalize source formatting and re-audit
        shell: bash
        run: |
          if [ ! -f .portrait-cleanup ]; then
            echo "No cleanup request present."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import json, re

          # Keep the localized Home source readable after JSON-LD enrichment.
          for p in [Path('pt/index.html'), Path('en/index.html')]:
              s = p.read_text(encoding='utf-8')
              for needle in [
                  '<meta property="og:image"',
                  '<meta property="og:image:type"',
                  '<meta property="og:image:width"',
                  '<meta property="og:image:height"',
                  '<meta property="og:image:alt"',
                  '<meta name="twitter:image"',
              ]:
                  s = s.replace(needle, '\n  ' + needle, 1)

              pattern = re.compile(r'(<script type="application/ld\+json">\s*)(.*?)(\s*</script>)', re.S)
              def pretty(m):
                  obj = json.loads(m.group(2))
                  return m.group(1) + json.dumps(obj, ensure_ascii=False, indent=2) + m.group(3)
              s, count = pattern.subn(pretty, s)
              if count != 1:
                  raise RuntimeError(f'Expected one JSON-LD block in {p}, found {count}')
              p.write_text(s, encoding='utf-8')

          root = Path('index.html')
          s = root.read_text(encoding='utf-8')
          old = 'width="717" height="717" decoding="async">'
          new = 'width="717" height="717" decoding="async" fetchpriority="high">'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise RuntimeError('Root portrait image tag not found')
          root.write_text(s, encoding='utf-8')
          PY

          rm -f .portrait-cleanup
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Home portrait metadata source"
          git push origin home-portrait-asset
