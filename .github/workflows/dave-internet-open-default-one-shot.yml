name: Dave Internet open default one-shot

on:
  push:
    branches:
      - dave/internet-open-default-2026-09-16

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dave/internet-open-default-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Make Internet disclosures open by default
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'assets/js/reader-disclosure.js',
              "    const fullBio = pagePath === '/pt/biografia/' || pagePath === '/en/biography/';\n    const selectivePage = pagePath === '/pt/ia-hai/' || pagePath === '/en/ai-hai/';",
              "    const fullBio = pagePath === '/pt/biografia/' || pagePath === '/en/biography/';\n    const internetOpenByDefault = pagePath === '/pt/internet/' || pagePath === '/en/internet/';\n    const selectivePage = pagePath === '/pt/ia-hai/' || pagePath === '/en/ai-hai/';"
          )
          replace_one(
              'assets/js/reader-disclosure.js',
              "      details.append(summary, body);\n      section.appendChild(details);",
              "      details.append(summary, body);\n      if (internetOpenByDefault) details.open = true;\n      section.appendChild(details);"
          )

          replace_one(
              'assets/js/reader-disclosure-loader.js',
              "script.src = '/assets/js/reader-disclosure.js?v=20260903-reader12';",
              "script.src = '/assets/js/reader-disclosure.js?v=20260916-reader13';"
          )
          replace_one(
              'tools/sync_reader_disclosure_loader.py',
              "SCRIPT = '<script src=\"/assets/js/reader-disclosure-loader.js?v=20260903-reader12\" defer></script>'",
              "SCRIPT = '<script src=\"/assets/js/reader-disclosure-loader.js?v=20260916-reader13\" defer></script>'"
          )

          replace_one(
              'tools/smoke_reader_ux.js',
              " * Full Biography and Internet & Performance use disclosure by default. IA/HAI uses\n * selective disclosure for explicitly registered entries. Culture & Audiovisual remains",
              " * Full Biography uses compact disclosure by default. Internet & Performance keeps\n * disclosure controls but starts every disclosure open. IA/HAI uses selective disclosure\n * for explicitly registered entries. Culture & Audiovisual remains"
          )
          replace_one(
              'tools/smoke_reader_ux.js',
              "  assert(await page.locator('details.reader-disclosure').count() >= 9, 'Internet normal URL produced too few disclosures');",
              "  const internetDisclosureCount = await page.locator('details.reader-disclosure').count();\n  assert(internetDisclosureCount >= 9, 'Internet normal URL produced too few disclosures');\n  assert(await page.locator('details.reader-disclosure[open]').count() === internetDisclosureCount, 'Internet disclosures must start open by default');"
          )
          replace_one(
              'tools/smoke_reader_ux.js',
              "  assert(await best.locator('.reader-disclosure__preview').count() === 0, 'BEST rich preview leaked from Full Bio into Internet');\n  await best.locator('summary').click();\n  assert(await best.locator('.reader-disclosure__page-link a').getAttribute('href') === '/pt/internet/best-kenshoo/', 'BEST Chapter Page link incorrect');",
              "  assert(await best.locator('.reader-disclosure__preview').count() === 0, 'BEST rich preview leaked from Full Bio into Internet');\n  assert(await best.locator('details.reader-disclosure').getAttribute('open') !== null, 'BEST must start open in Internet');\n  assert(await best.locator('.reader-disclosure__page-link a').getAttribute('href') === '/pt/internet/best-kenshoo/', 'BEST Chapter Page link incorrect');"
          )
          replace_one(
              'tools/smoke_reader_ux.js',
              "  // Culture & Audiovisual is intentionally continuous reading: normal and legacy query-flag URLs remain fully open.\n  await page.goto(`${BASE}/pt/comunicacao/`, {waitUntil: 'networkidle'});",
              "  // English Internet follows the same open-by-default rule.\n  await page.goto(`${BASE}/en/internet/`, {waitUntil: 'networkidle'});\n  const internetDisclosureCountEn = await page.locator('details.reader-disclosure').count();\n  assert(internetDisclosureCountEn >= 9, 'English Internet normal URL produced too few disclosures');\n  assert(await page.locator('details.reader-disclosure[open]').count() === internetDisclosureCountEn, 'English Internet disclosures must start open by default');\n\n  // Culture & Audiovisual is intentionally continuous reading: normal and legacy query-flag URLs remain fully open.\n  await page.goto(`${BASE}/pt/comunicacao/`, {waitUntil: 'networkidle'});"
          )
          PY
      - name: Refresh loader tags and validate syntax
        run: |
          python tools/sync_reader_disclosure_loader.py
          python tools/sync_reader_disclosure_loader.py --check
          node --check assets/js/reader-disclosure-loader.js
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_reader_ux.js
          git diff --check
      - name: Commit clean result and remove one-shot workflow
        run: |
          rm .github/workflows/dave-internet-open-default-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/reader-disclosure.js assets/js/reader-disclosure-loader.js tools/sync_reader_disclosure_loader.py tools/smoke_reader_ux.js pt/biografia/index.html en/biography/index.html pt/internet/index.html en/internet/index.html pt/ia-hai/index.html en/ai-hai/index.html .github/workflows/dave-internet-open-default-one-shot.yml
          git commit -m 'feat: open Internet and Performance entries by default'
          git push origin HEAD:dave/internet-open-default-2026-09-16
