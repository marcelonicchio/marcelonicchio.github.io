name: Chet C7 one-shot runtime smoke

on:
  push:
    branches: [work/chet-c7-runtime-performance]

permissions:
  contents: read

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chet-c7-runtime-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p /tmp/reader-ux-smoke
          npm install --prefix /tmp/reader-ux-smoke --no-save playwright-core
      - name: Run runtime probe
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/reader-ux-smoke/node_modules/playwright-core
        run: |
          node --check tools/smoke_runtime_performance.js
          node tools/smoke_runtime_performance.js
# one-shot trigger
