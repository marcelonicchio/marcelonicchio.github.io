name: Krist Destemidos media integration

on:
  push:
    branches: [feat/music-cdp-hierarchy-limonada]
    paths:
      - '.github/workflows/krist-destemidos-media.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/music-cdp-hierarchy-limonada
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Patch bilingual narrative and register gallery
        run: python tools/_krist_destemidos_media.py
      - name: Build responsive gallery media
        run: python tools/build_gallery_media.py
      - name: Synchronize gallery markup
        run: python tools/sync_galleries.py
      - name: Accept bilingual editorial checkpoint
        run: python tools/editorial_parity.py --accept music-limonada-1992
      - name: Synchronize Full Biography
        run: python tools/sync_full_biography.py
      - name: Refresh sitemap
        run: python tools/build_sitemap.py
      - name: Validate media and synchronization
        run: |
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/audit_galleries.py
          python tools/audit_image_dimensions.py
          python tools/editorial_parity.py --check
          python tools/sync_full_biography.py --check
      - name: Remove temporary integration files
        run: rm -f tools/_krist_destemidos_media.py .github/workflows/krist-destemidos-media.yml
      - name: Commit integrated post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: enrich Destemidos Limonadas archive"
            git push
          fi
