name: Krist apply global video standard
on:
  push:
    branches: [feat/global-video-media-standard]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 Pillow
      - name: Repair Olympia EN audiovisual parity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('en/music/index.html')
          text=p.read_text(encoding='utf-8')
          start='<div class="phase" data-bio-key="music-olympia-2000">'
          end='<div class="phase" data-bio-key="music-jo-2001">'
          i=text.index(start)
          j=text.index(end, i)
          chunk=text[i:j]
          url='https://www.youtube.com/watch?v=V624sY_rl8I'
          if url not in chunk:
              links='<div class="evidence-links inline-links"><a href="https://www.youtube.com/watch?v=V624sY_rl8I" target="_blank" rel="noopener noreferrer">Estava Comigo ↗</a><a href="https://youtu.be/0-RXucDYMfk" target="_blank" rel="noopener noreferrer">Ciúmes ↗</a></div>'
              head, tail=chunk.rsplit('</div></div>',1)
              chunk=head+links+'</div></div>'+tail
              text=text[:i]+chunk+text[j:]
              p.write_text(text,encoding='utf-8')
              print('Added the two Olympia public audiovisual records to EN, matching PT evidence.')
          else:
              print('Olympia EN audiovisual evidence already present.')
          PY
      - name: Apply global video component
        run: python tools/_krist_global_video_standard.py
      - name: Rebuild synchronized surfaces
        run: |
          python tools/sync_entries.py
          python tools/sync_full_biography.py
          python tools/build_chapter_pages.py
      - name: Preflight and accept reviewed PT/EN media drift
        run: |
          python - <<'PY'
          import tools.editorial_parity as ep
          manifest = ep.load_manifest()
          registry = ep.load_registry()
          drifts=[]
          asymmetric=[]
          for entry in ep.all_entries(manifest):
              eid=entry['id']
              if eid not in registry.get('entries',{}):
                  continue
              current=ep.current_hashes(entry)
              state=registry['entries'][eid]
              changed=[lang for lang in ('pt','en') if current[lang] != state.get(f'{lang}_hash')]
              if not changed:
                  continue
              drifts.append((eid,changed))
              if set(changed) != {'pt','en'}:
                  asymmetric.append((eid,changed))
          if asymmetric:
              print('Asymmetric editorial drift after global video migration:')
              for eid,changed in asymmetric:
                  print(f' - {eid}: {changed}')
              raise SystemExit(1)
          accepted=[]
          for eid,changed in drifts:
              ep.accept(manifest, registry, eid)
              accepted.append(eid)
          print('Accepted reviewed symmetric media checkpoints:', ', '.join(accepted) if accepted else '(none)')
          PY
      - name: Verify migration and generators
        run: |
          python tools/_krist_global_video_standard.py --check
          python tools/editorial_parity.py --check
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
      - name: Commit clean migration result
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          rm -f tools/_krist_global_video_standard.py
          rm -f .github/workflows/krist-scan-video-links.yml
          rm -f .github/workflows/krist-apply-global-video-standard.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: standardize video media controls across HUB"
            git push origin HEAD:feat/global-video-media-standard
          fi
