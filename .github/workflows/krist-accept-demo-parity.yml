name: Krist accept demo parity

on:
  push:
    branches:
      - feat/music-demo-1994-audio

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/music-demo-1994-audio
          fetch-depth: 0
      - run: python tools/editorial_parity.py --accept music-demo-tape-1994
      - name: Commit parity checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No parity change produced"
            exit 1
          fi
          git commit -m "chore: accept 1994 demo PT EN parity"
          git push origin HEAD:feat/music-demo-1994-audio
