name: Apply first-show 1992 update

on:
  push:
    branches: [first-show-1992-and-handoff]
    paths:
      - tools/_apply_first_show_1992.py
      - .github/workflows/apply-first-show-1992.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: first-show-1992-and-handoff
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Apply exact first-show date and source
        run: python tools/_apply_first_show_1992.py
      - name: Audit synchronized navigation
        run: python tools/sync_navigation.py --check
      - name: Audit gallery derivatives
        run: python tools/build_gallery_media.py --check
      - name: Audit synchronized galleries
        run: python tools/sync_galleries.py --check
      - name: Audit gallery registry and rendering
        run: python tools/audit_galleries.py
      - name: Audit HTML, JSON and sitemap
        run: python tools/audit_site.py
      - name: Audit presence
        run: python tools/audit_presence.py
      - name: Audit analytics
        run: python tools/audit_analytics.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Confirm Coitado do Próximo first show on July 5, 1992"
          git push origin HEAD:first-show-1992-and-handoff
