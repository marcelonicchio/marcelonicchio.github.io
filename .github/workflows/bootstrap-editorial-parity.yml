name: Bootstrap editorial parity

on:
  push:
    branches: [full-biography-parity-stop]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: full-biography-parity-stop
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Bootstrap parity registry
        run: python tools/editorial_parity.py --bootstrap
      - name: Verify parity registry
        run: python tools/editorial_parity.py --check
      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial_parity.json
          git commit -m "Bootstrap PT EN editorial parity registry"
          git push origin HEAD:full-biography-parity-stop
