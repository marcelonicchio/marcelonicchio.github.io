name: Temporary accept media parity checkpoints

on:
  push:
    branches:
      - work/media-gallery-batch-20260901

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parity dependency
        run: python -m pip install beautifulsoup4
      - name: Accept reviewed PT EN checkpoints
        run: |
          python tools/editorial_parity.py --accept communication-folha
          python tools/editorial_parity.py --accept communication-sinal-verde
          python tools/editorial_parity.py --accept internet-best
          python tools/editorial_parity.py --accept internet-petlove
          python tools/editorial_parity.py --accept internet-psinet
          python tools/editorial_parity.py --check
      - name: Remove temporary workflow
        run: rm -f .github/workflows/temp-accept-media-parity.yml
      - name: Commit checkpoint updates
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add -A
          git commit -m "Accept media batch editorial parity checkpoints"
          git push
