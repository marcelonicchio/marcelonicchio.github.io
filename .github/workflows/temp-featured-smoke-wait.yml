name: Temporary featured smoke settle

on:
  push:
    branches:
      - work/featured-collapsed-only-highlight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/featured-collapsed-only-highlight
          fetch-depth: 0
      - name: Patch transition-aware regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/smoke_reader_ux.js')
          text = p.read_text(encoding='utf-8')
          old = "  await page.locator('#bio-internet-mirantte details.reader-disclosure > summary').click();\n  const featuredOpenStyle = await featuredStateProbe.evaluate"
          new = "  await page.locator('#bio-internet-mirantte details.reader-disclosure > summary').click();\n  await page.waitForTimeout(250);\n  const featuredOpenStyle = await featuredStateProbe.evaluate"
          assert text.count(old) == 1, f'open settle insertion point: {text.count(old)}'
          text = text.replace(old, new, 1)
          old = "  await page.locator('#bio-internet-mirantte details.reader-disclosure > summary').click();\n  const featuredReclosedStyle = await featuredStateProbe.evaluate"
          new = "  await page.locator('#bio-internet-mirantte details.reader-disclosure > summary').click();\n  await page.waitForTimeout(250);\n  const featuredReclosedStyle = await featuredStateProbe.evaluate"
          assert text.count(old) == 1, f'reclose settle insertion point: {text.count(old)}'
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add tools/smoke_reader_ux.js
          git rm .github/workflows/temp-featured-smoke-wait.yml
          git commit -m "Make featured state smoke transition-aware"
          git push origin HEAD:work/featured-collapsed-only-highlight
