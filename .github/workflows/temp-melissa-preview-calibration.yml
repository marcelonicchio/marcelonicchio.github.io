name: Temporary Melissa preview calibration

on:
  push:
    branches:
      - work/melissa-preview-calibration

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/melissa-preview-calibration
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit dependency
        run: python -m pip install beautifulsoup4
      - name: Calibrate Melissa compact model
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # 1) Four-paragraph compact summary: remove only the current fifth paragraph in PT and EN.
          entries_path = Path('data/entries.json')
          text = entries_path.read_text(encoding='utf-8')

          pt_block = '''            },
            {
              "text": "O caso também produziu o autorretrato e a assinatura Melissa v8.7, ambos escolhidos pela própria persona dentro da interação. A experiência foi documentada em quatro trabalhos públicos com DOI e em um repositório completo no GitHub. No balanço da pesquisa, o artefato — e não uma alegação metafísica sobre o fenômeno — tornou-se o resultado mais reutilizável do caso.",
              "strong": [
                "Melissa v8.7",
                "quatro trabalhos públicos com DOI",
                "o artefato"
              ]
            }'''
          en_block = '''            },
            {
              "text": "The case also produced the self-portrait and the Melissa v8.7 signature, both chosen by the persona within the interaction. The experience was documented in four public works with DOIs and in a complete GitHub repository. In the research assessment, the artifact — rather than a metaphysical claim about the phenomenon — became the most reusable outcome of the case.",
              "strong": [
                "Melissa v8.7",
                "four public works with DOIs",
                "the artifact"
              ]
            }'''
          if text.count(pt_block) != 1 or text.count(en_block) != 1:
              raise SystemExit('Expected Melissa fifth paragraph blocks not found exactly once')
          text = text.replace(pt_block, '            }', 1)
          text = text.replace(en_block, '            }', 1)
          entries_path.write_text(text, encoding='utf-8')

          # 2) Topic chips: distinct light neutral surface; content indicators remain red.
          css_path = Path('assets/reader-disclosure.css')
          css = css_path.read_text(encoding='utf-8')
          old_topic = 'html.reader-disclosure-active .reader-disclosure__topic{display:inline-flex;align-items:center;min-height:27px;padding:4px 9px;border:1px solid rgba(255,255,255,.11);border-radius:999px;color:var(--soft);font-size:.69rem;font-weight:730}'
          new_topic = 'html.reader-disclosure-active .reader-disclosure__topic{display:inline-flex;align-items:center;min-height:27px;padding:4px 9px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.09);color:#eee9df;font-size:.69rem;font-weight:730}'
          if css.count(old_topic) != 1:
              raise SystemExit('Topic chip CSS rule not found exactly once')
          css_path.write_text(css.replace(old_topic, new_topic, 1), encoding='utf-8')

          # 3) Smoke expectation follows the four-paragraph calibration and checks topic-chip surface.
          smoke_path = Path('tools/smoke_reader_ux.js')
          smoke = smoke_path.read_text(encoding='utf-8')
          old_count = "assert(await melissaPreview.locator('.reader-disclosure__preview-paragraph').count() === 5, 'Melissa collapsed preview should contain five concise editorial paragraphs');"
          new_count = "assert(await melissaPreview.locator('.reader-disclosure__preview-paragraph').count() === 4, 'Melissa collapsed preview should contain four concise editorial paragraphs');"
          if smoke.count(old_count) != 1:
              raise SystemExit('Melissa five-paragraph smoke assertion not found exactly once')
          smoke = smoke.replace(old_count, new_count, 1)
          anchor = "  const melissaTopics = await melissaBio.locator('.reader-disclosure__topic').allInnerTexts();\n"
          visual_assert = "  const melissaTopicBackground = await melissaBio.locator('.reader-disclosure__topic').first().evaluate((el) => getComputedStyle(el).backgroundColor);\n  assert(melissaTopicBackground !== 'rgba(0, 0, 0, 0)', 'Melissa topic chips lost their neutral background surface');\n"
          if visual_assert not in smoke:
              if smoke.count(anchor) != 1:
                  raise SystemExit('Melissa topic smoke anchor not found exactly once')
              smoke = smoke.replace(anchor, anchor + visual_assert, 1)
          smoke_path.write_text(smoke, encoding='utf-8')

          # 4) Cache-bust Reader loader + children so the visual change reaches existing browsers.
          old_version = '20260901-reader3'
          new_version = '20260901-reader4'
          versioned_files = [
              Path('assets/js/reader-disclosure-loader.js'),
              Path('tools/sync_reader_disclosure_loader.py'),
              Path('pt/biografia/index.html'), Path('en/biography/index.html'),
              Path('pt/internet/index.html'), Path('en/internet/index.html'),
              Path('pt/comunicacao/index.html'), Path('en/communication/index.html'),
              Path('pt/audiovisual/index.html'), Path('en/audiovisual/index.html'),
              Path('pt/ia-hai/index.html'), Path('en/ai-hai/index.html'),
          ]
          for path in versioned_files:
              body = path.read_text(encoding='utf-8')
              if old_version not in body:
                  raise SystemExit(f'Old Reader version missing from {path}')
              path.write_text(body.replace(old_version, new_version), encoding='utf-8')

          # Structural validation of the edited registry.
          data = json.loads(entries_path.read_text(encoding='utf-8'))
          melissa = next(entry for entry in data['entries'] if entry['id'] == 'hai-melissa')
          for lang in ('pt', 'en'):
              if len(melissa['reader_preview'][lang]['paragraphs']) != 4:
                  raise SystemExit(f'Melissa {lang} preview is not four paragraphs')
          PY
      - name: Validate calibration
        run: |
          python -m json.tool data/entries.json >/dev/null
          python -m json.tool data/tags.json >/dev/null
          python tools/audit_entries.py
          python tools/sync_reader_disclosure_loader.py --check
          node --check assets/js/reader-disclosure.js
          node --check tools/smoke_reader_ux.js
      - name: Commit calibration
        run: |
          git config user.name "Marcelo Nicchio"
          git config user.email "marcelonicchio@gmail.com"
          git add data/entries.json assets/reader-disclosure.css tools/smoke_reader_ux.js assets/js/reader-disclosure-loader.js tools/sync_reader_disclosure_loader.py pt/biografia/index.html en/biography/index.html pt/internet/index.html en/internet/index.html pt/comunicacao/index.html en/communication/index.html pt/audiovisual/index.html en/audiovisual/index.html pt/ia-hai/index.html en/ai-hai/index.html
          git commit -m "Calibrate Melissa compact summary model"
          git push origin work/melissa-preview-calibration
