name: Editorial inline archive v3

on:
  push:
    branches: [editorial-inline-archive]
    paths:
      - '.editorial-inline-archive-v3'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-inline-archive
          fetch-depth: 0
      - name: Run corrected migration body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/editorial-inline-archive-v2.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Reorganize documentary material into narrative flow'
          i = src.index(marker)
          while i < len(src) and src[i].strip() != 'run: |':
              i += 1
          i += 1
          body = []
          while i < len(src):
              line = src[i]
              if line.startswith('      - ') and not line.startswith('          '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
              i += 1
          script = '\n'.join(body) + '\n'
          bad = 'rm -f .editorial-inline-archive-v2'
          good = "Path('.editorial-inline-archive-v3').unlink(missing_ok=True)"
          if bad not in script:
              raise RuntimeError('Known retry patch point not found')
          script = script.replace(bad, good, 1)
          Path('/tmp/inline-migration.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/inline-migration.sh
