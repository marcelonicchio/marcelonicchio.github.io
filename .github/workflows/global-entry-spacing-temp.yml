name: Global entry spacing patch

on:
  push:
    branches: [global-entry-spacing]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-entry-spacing
      - name: Apply global chapter spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Global long-form entry spacing */'
          if marker not in s:
              s += '''\n\n/* Global long-form entry spacing */\n.article-body > .chapter{padding-bottom:58px;margin-bottom:18px}\n.article-body > .callout + .chapter{margin-top:48px}\n@media(max-width:580px){\n  .article-body > .chapter{padding-bottom:42px;margin-bottom:10px}\n  .article-body > .callout + .chapter{margin-top:36px}\n}\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit spacing refinement
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Add consistent breathing between long-form entries"
          git push origin HEAD:global-entry-spacing
