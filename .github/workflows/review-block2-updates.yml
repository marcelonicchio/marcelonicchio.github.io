name: Apply reviewed Full Biography block 2 updates

on:
  push:
    branches: [full-biography-parity-stop]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: full-biography-parity-stop
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Apply reviewed PT and EN edits
        run: |
          python - <<'PY'
          from pathlib import Path

          reps = {
            'pt/musica/index.html': [
              (
                '<div class="phase" data-bio-key="music-album-1997"><div class="phase-year">1997</div><div><h3>Meu Querido Diário</h3><p>Primeiro álbum autoral, gravado no Estúdio Asas, em São Paulo, com produção de Edson X. Nicchio participou da idealização, composições e bateria.</p></div></div>',
                '<div class="phase" data-bio-key="music-album-1997"><div class="phase-year">1997–1998</div><div><h3>Meu Querido Diário</h3><p>Primeiro álbum autoral, gravado no <strong>Estúdio Asas</strong>, em São Paulo, com produção de <strong>Edson X</strong>. Marcelo Nicchio participou da idealização, das composições e gravou bateria.</p><p>O disco teve participações especiais de <strong>Paulão de Carvalho</strong> (Velhas Virgens), voz; <strong>Finho</strong> (banda 365), voz; e <strong>Grupo Emosamba</strong>, na vinheta de introdução. Há diversos vídeos preservados das sessões de gravação.</p><p>O trabalho foi lançado de forma independente em CD em <strong>1998</strong>.</p></div></div>'
              ),
              (
                '<div class="phase" data-bio-key="music-album-1999-2000"><div class="phase-year">1999–2000</div><div><h3>Eu Não Tô Nem Aí</h3><p>Segundo álbum do ciclo autoral, com produção de Fábio “Badi” Crepaldi e Marcelo Nicchio. O repertório foi composto por Nicchio, que também gravou bateria.</p></div></div>',
                '<div class="phase" data-bio-key="music-album-1999-2000"><div class="phase-year">1999–2000</div><div><h3>Eu Não Tô Nem Aí</h3><p>Segundo álbum do ciclo autoral, com produção de <strong>Fábio “Badi” Crepaldi</strong> e Marcelo Nicchio, que também gravou bateria.</p><p>A gravação revisitou músicas emblemáticas da banda sob a estética daquele período, introduziu novas composições de Nicchio e incluiu uma versão ska/punk/reggae de <em>Ciúmes</em>, do <strong>Ultraje a Rigor</strong>.</p><p>Lançado em CD em <strong>2000</strong>, o trabalho abriu novas oportunidades de mídia e apresentações para a banda.</p></div></div>'
              ),
              (
                '<div class="phase" data-bio-key="music-olympia-2000"><div class="phase-year">jul. 2000</div><div><h3>Olympia</h3><p>Apresentação no Olympia, em São Paulo, na abertura de Os Paralamas do Sucesso.</p>',
                '<div class="phase" data-bio-key="music-olympia-2000"><div class="phase-year">25 jun. 2000</div><div><h3>Olympia</h3><p>Apresentação no <strong>Olympia</strong>, em São Paulo, na abertura de <strong>Os Paralamas do Sucesso</strong>, com a casa esgotada e público estimado em cerca de <strong>6.000 pessoas</strong>.</p>'
              ),
              (
                '<div class="phase" data-bio-key="music-jo-2001"><div class="phase-year">21 jun. 2001</div><div><h3>Programa do Jô</h3><p>Entrevista e apresentação na Rede Globo. O Coitado do Próximo tocou <em>Estava Comigo</em>, composição de Marcelo Nicchio.</p>',
                '<div class="phase" data-bio-key="music-jo-2001"><div class="phase-year">21 jun. 2001</div><div><h3>Programa do Jô</h3><p>Apresentação no <strong>Programa do Jô</strong>, gravada e exibida no mesmo dia, <strong>21 de junho de 2001</strong>, pela Rede Globo, com transmissão pela <strong>Rede Globo Internacional</strong>. O Coitado do Próximo tocou <em>Estava Comigo</em>, composição de Marcelo Nicchio.</p><p>Durante a entrevista, <strong>Jô Soares</strong> brincou com o nome da banda, fingindo tratar “Coitado do Próximo” como o título do trabalho. A piada estava prevista no roteiro e rendeu risos no estúdio.</p>'
              )
            ],
            'en/music/index.html': [
              (
                '<div class="phase" data-bio-key="music-album-1997"><div class="phase-year">1997</div><div><h3>Meu Querido Diário</h3><p>First original album, recorded at Estúdio Asas in São Paulo and produced by Edson X. Nicchio contributed concept, songwriting and drums.</p></div></div>',
                '<div class="phase" data-bio-key="music-album-1997"><div class="phase-year">1997–1998</div><div><h3>Meu Querido Diário</h3><p>First original album, recorded at <strong>Estúdio Asas</strong> in São Paulo and produced by <strong>Edson X</strong>. Marcelo Nicchio contributed to the concept and songwriting and recorded drums.</p><p>The album featured guest appearances by <strong>Paulão de Carvalho</strong> (Velhas Virgens), vocals; <strong>Finho</strong> (band 365), vocals; and <strong>Grupo Emosamba</strong> on the introductory vignette. Several videos from the recording sessions have been preserved.</p><p>The work was independently released on CD in <strong>1998</strong>.</p></div></div>'
              ),
              (
                '<div class="phase" data-bio-key="music-album-1999-2000"><div class="phase-year">1999–2000</div><div><h3>Eu Não Tô Nem Aí</h3><p>Second album in the original cycle, produced by Fábio “Badi” Crepaldi and Marcelo Nicchio. Nicchio wrote the repertoire and also recorded drums.</p></div></div>',
                '<div class="phase" data-bio-key="music-album-1999-2000"><div class="phase-year">1999–2000</div><div><h3>Eu Não Tô Nem Aí</h3><p>Second album in the original cycle, produced by <strong>Fábio “Badi” Crepaldi</strong> and Marcelo Nicchio, who also recorded drums.</p><p>The recording revisited emblematic songs from the band through the aesthetics of that period, introduced new compositions by Nicchio and included a ska/punk/reggae version of <em>Ciúmes</em>, by <strong>Ultraje a Rigor</strong>.</p><p>Released on CD in <strong>2000</strong>, the work opened new opportunities for media appearances and live performances.</p></div></div>'
              ),
              (
                '<div class="phase" data-bio-key="music-olympia-2000"><div class="phase-year">Jul. 2000</div><div><h3>Olympia</h3><p>Performance at the Olympia in São Paulo as the opening act for Os Paralamas do Sucesso. Two audiovisual records survive publicly.</p>',
                '<div class="phase" data-bio-key="music-olympia-2000"><div class="phase-year">Jun. 25, 2000</div><div><h3>Olympia</h3><p>Performance at the <strong>Olympia</strong> in São Paulo as the opening act for <strong>Os Paralamas do Sucesso</strong>, at a sold-out show with an estimated audience of about <strong>6,000 people</strong>. Two audiovisual records survive publicly.</p>'
              ),
              (
                '<div class="phase" data-bio-key="music-jo-2001"><div class="phase-year">Jun. 21, 2001</div><div><h3>Programa do Jô</h3><p>Interview and performance on Rede Globo. Coitado do Próximo played <em>Estava Comigo</em>, written by Marcelo Nicchio.</p>',
                '<div class="phase" data-bio-key="music-jo-2001"><div class="phase-year">Jun. 21, 2001</div><div><h3>Programa do Jô</h3><p>Appearance on <strong>Programa do Jô</strong>, recorded and broadcast on the same day, <strong>June 21, 2001</strong>, by Rede Globo, with transmission through <strong>Rede Globo Internacional</strong>. Coitado do Próximo performed <em>Estava Comigo</em>, written by Marcelo Nicchio.</p><p>During the interview, <strong>Jô Soares</strong> joked about the band’s name by pretending that “Coitado do Próximo” was the title of the work rather than the band’s name. The joke was scripted and drew laughter in the studio.</p>'
              )
            ],
            'pt/comunicacao/index.html': [
              (
                '<section id="folha" class="chapter"><h2>Folha de S.Paulo — “Órfãos do Rock”</h2><p>Em 23 de abril de 2001, Marcelo Nicchio participou da matéria de capa do <strong>Folhateen</strong>, suplemento da <em>Folha de S.Paulo</em>, publicada após a morte de Joey Ramone. A chamada impressa foi <strong>“Órfãos do Rock”</strong>; a matéria interna, preservada no arquivo digital oficial da Folha, recebeu o título <strong>“Onde estão os ídolos?”</strong>.</p><p>O arquivo pessoal preserva scans da capa e das páginas internas. A matéria identifica Nicchio nominalmente e registra suas falas sobre Joey Ramone, cultura punk, o princípio do “faça você mesmo”, mercado underground brasileiro e permanência do rock.</p>',
                '<section id="folha" class="chapter"><h2>Folha de S.Paulo — “Órfãos do Rock”</h2><p>Em 23 de abril de 2001, Marcelo Nicchio participou da <strong>matéria de capa do Folhateen</strong>, suplemento da <em>Folha de S.Paulo</em>, publicada após a morte de Joey Ramone. A chamada impressa foi <strong>“Órfãos do Rock”</strong>; a matéria interna, preservada no arquivo digital oficial da Folha, recebeu o título <strong>“Onde estão os ídolos?”</strong>.</p><p>A matéria registra suas falas sobre Joey Ramone, cultura punk, o princípio do “faça você mesmo”, mercado underground brasileiro e permanência do rock.</p>'
              ),
              (
                '<section id="sinal-verde" class="chapter"><h2>Prateleira Cultural — Revista Sinal Verde</h2><p>Entre 2003 e 2006, Nicchio assinou regularmente a coluna <strong>Prateleira Cultural</strong> na revista <em>Sinal Verde</em>. O conjunto preservado reúne aproximadamente vinte peças editoriais únicas, incluindo textos em outras seções.</p><p>Os scans cobrem Ramones, Kurt Cobain, Seu Jorge, banda 365, cinema brasileiro, televisão, literatura, rádio e espaços culturais, além de temas digitais como <strong>Skype e VoIP, Google Earth, RSS/XML, rádio via internet e Orkut</strong>.</p><p>Esse corpus conecta crítica cultural e cultura digital e mostra como tecnologia já era assunto editorial antes da especialização profissional em Search.</p></section>',
                '<section id="sinal-verde" class="chapter"><h2>Prateleira Cultural — Revista Sinal Verde</h2><p>Entre 2003 e 2006, Nicchio assinou regularmente a coluna <strong>Prateleira Cultural</strong> na revista <em>Sinal Verde</em>, além de publicar textos em outras seções. Ao todo, há aproximadamente vinte peças editoriais únicas desse período.</p><p>A curadoria e os textos cobriram Ramones, Kurt Cobain, Seu Jorge, banda 365, cinema brasileiro, televisão, literatura, rádio e espaços culturais, além de temas digitais como <strong>Skype e VoIP, Google Earth, RSS/XML, rádio via internet e Orkut</strong>.</p><p>A combinação de crítica cultural e cultura digital mostra como a tecnologia já fazia parte de sua pauta editorial antes da especialização profissional em Search.</p></section>'
              )
            ],
            'en/communication/index.html': [
              (
                '<section id="folha" class="chapter"><h2>Folha de S.Paulo — “Órfãos do Rock”</h2><p>On April 23, 2001, Marcelo Nicchio appeared in the cover story of <strong>Folhateen</strong>, the youth supplement of <em>Folha de S.Paulo</em>, published after Joey Ramone\'s death. The printed cover line was <strong>“Órfãos do Rock”</strong> (“Orphans of Rock”); the inside article preserved in Folha\'s official digital archive was titled <strong>“Onde estão os ídolos?”</strong> (“Where are the idols?”).</p><p>The personal archive preserves scans of the cover and inside pages. The article identifies Nicchio by name and records his comments on Joey Ramone, punk culture, the do-it-yourself principle, the Brazilian underground market and the persistence of rock.</p><div class="callout"><strong>External source + physical archive</strong><p>Folha\'s official website preserves the text and identification; the personal scans preserve the cover, layout and visual context of the printed edition.</p></div>',
                '<section id="folha" class="chapter"><h2>Folha de S.Paulo — “Órfãos do Rock”</h2><p>On April 23, 2001, Marcelo Nicchio appeared in the <strong>cover story of Folhateen</strong>, the youth supplement of <em>Folha de S.Paulo</em>, published after Joey Ramone\'s death. The printed cover line was <strong>“Órfãos do Rock”</strong> (“Orphans of Rock”); the inside article preserved in Folha\'s official digital archive was titled <strong>“Onde estão os ídolos?”</strong> (“Where are the idols?”).</p><p>The article records his comments on Joey Ramone, punk culture, the do-it-yourself principle, the Brazilian underground market and the persistence of rock.</p>'
              ),
              (
                '<section id="sinal-verde" class="chapter"><h2>Prateleira Cultural — Sinal Verde magazine</h2><p>Between 2003 and 2006, Nicchio regularly wrote the <strong>Prateleira Cultural</strong> column for <em>Sinal Verde</em> magazine. The surviving set contains roughly twenty unique editorial pieces, including work published in other sections.</p><p>The scans cover the Ramones, Kurt Cobain, Seu Jorge, the band 365, Brazilian cinema, television, literature, radio and cultural spaces, as well as digital subjects including <strong>Skype and VoIP, Google Earth, RSS/XML, internet radio and Orkut</strong>.</p><p>This corpus is one of the clearest documentary bridges between cultural criticism and digital culture: contemporary material shows technology already functioning as an editorial subject before the later professional specialization in Search.</p></section>',
                '<section id="sinal-verde" class="chapter"><h2>Prateleira Cultural — Sinal Verde magazine</h2><p>Between 2003 and 2006, Nicchio regularly wrote the <strong>Prateleira Cultural</strong> column for <em>Sinal Verde</em> magazine, while also publishing pieces in other sections. Altogether, the period comprises roughly twenty unique editorial pieces.</p><p>His curation and writing covered the Ramones, Kurt Cobain, Seu Jorge, the band 365, Brazilian cinema, television, literature, radio and cultural spaces, as well as digital subjects including <strong>Skype and VoIP, Google Earth, RSS/XML, internet radio and Orkut</strong>.</p><p>The combination of cultural criticism and digital culture shows that technology was already part of his editorial agenda before his later professional specialization in Search.</p></section>'
              )
            ],
            'pt/internet/index.html': [
              (
                '<section id="mirantte" class="chapter"><h2>2004–2008 — Mirantte News: produto digital e aquisição</h2><p>O <strong>Mirantte News</strong> foi criado e operado por Marcelo Nicchio, com Luiz Kechichian como sócio investidor. O portal reunia cerca de vinte categorias de serviços e combinava conteúdo editorial, páginas comerciais e recursos de localização.</p><p>Uma matéria da época identifica <strong>Marcelo Nicchio como diretor do site</strong> e descreve os hot-sites comerciais, as categorias e a integração com <strong>MapLink</strong> para mapas e rotas. A necessidade prática de gerar tráfego para o portal aproximou Nicchio de profissionais de Search e abriu a passagem do produto digital para aquisição e performance.</p>',
                '<section id="mirantte" class="chapter"><h2>2004–2008 — Mirantte News: produto digital e aquisição</h2><p>O <strong>Mirantte News</strong> foi criado e operado por Marcelo Nicchio, com Luiz Kechichian como sócio investidor. O portal reunia cerca de vinte categorias de serviços e combinava conteúdo editorial, páginas comerciais e recursos de localização.</p><p>Na fase inicial do projeto, antes do lançamento do Google Maps, o portal já oferecia <strong>hot-sites para empresas com mapas de geolocalização e rotas de deslocamento</strong>, em parceria com a <strong>MapLink/UOL</strong>. As páginas comerciais podiam reunir material fotográfico profissional, matéria produzida pela jornalista <strong>Tatiana Cavalcanti</strong> e indexação nas categorias do site.</p><p>Uma matéria da época identifica <strong>Marcelo Nicchio como diretor do site</strong> e descreve os hot-sites comerciais, as categorias e a integração com MapLink para mapas e rotas. A necessidade prática de gerar tráfego para o portal aproximou Nicchio de profissionais de Search e abriu a passagem do produto digital para aquisição e performance.</p>'
              )
            ],
            'en/internet/index.html': [
              (
                '<section id="mirantte" class="chapter"><h2>2004–2008 — Mirantte News: digital product and acquisition</h2><p><strong>Mirantte News</strong> was created and operated by Marcelo Nicchio, with Luiz Kechichian as investor-partner. The portal brought together roughly twenty service categories, combining editorial content, commercial pages and location tools.</p><p>A contemporary article identifies <strong>Marcelo Nicchio as site director</strong> and describes its commercial hot-sites, categories and <strong>MapLink</strong> map/routing integration. The practical need to generate traffic for the portal brought Nicchio into contact with Search professionals and connected digital-product work to acquisition and performance.</p>',
                '<section id="mirantte" class="chapter"><h2>2004–2008 — Mirantte News: digital product and acquisition</h2><p><strong>Mirantte News</strong> was created and operated by Marcelo Nicchio, with Luiz Kechichian as investor-partner. The portal brought together roughly twenty service categories, combining editorial content, commercial pages and location tools.</p><p>In the project\'s early phase, before Google Maps launched, the portal already offered <strong>company hot-sites with geolocation maps and route planning</strong> through a partnership with <strong>MapLink/UOL</strong>. Commercial pages could combine professional photography, editorial copy produced by journalist <strong>Tatiana Cavalcanti</strong> and indexing within the site\'s categories.</p><p>A contemporary article identifies <strong>Marcelo Nicchio as site director</strong> and describes its commercial hot-sites, categories and MapLink map/routing integration. The practical need to generate traffic for the portal brought Nicchio into contact with Search professionals and connected digital-product work to acquisition and performance.</p>'
              )
            ]
          }

          for filename, pairs in reps.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected source text not found: {filename}: {old[:100]}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # Chronology display metadata.
          p = Path('data/full_biography.json')
          text = p.read_text(encoding='utf-8')
          text = text.replace('"id": "music-album-1997",\n      "era": "cruzamentos-1992-2000",\n      "date": "1997",', '"id": "music-album-1997",\n      "era": "cruzamentos-1992-2000",\n      "date": "1997–1998",', 1)
          text = text.replace('"id": "music-olympia",\n      "era": "cruzamentos-1992-2000",\n      "date": "jul. 2000",', '"id": "music-olympia",\n      "era": "cruzamentos-1992-2000",\n      "date": "25 jun. 2000",', 1)
          text = text.replace('"date_en": "Jul. 2000"', '"date_en": "Jun. 25, 2000"', 1)
          p.write_text(text, encoding='utf-8')

          # Structured timeline follows the reviewed chronology facts.
          p = Path('data/timeline.json')
          text = p.read_text(encoding='utf-8')
          text = text.replace('{"date":"1997","domain":"music","event":"Recorded the first Coitado do Próximo album, Meu Querido Diário, at Estúdio Asas, produced by Edson X.","evidence":"preserved primary archive"}', '{"date":"1997-1998","domain":"music","event":"Recorded the first Coitado do Próximo album, Meu Querido Diário, at Estúdio Asas, produced by Edson X; the work was independently released on CD in 1998.","evidence":"preserved primary archive"}', 1)
          text = text.replace('{"date":"2000-07","domain":"music","event":"Coitado do Próximo opened for Os Paralamas do Sucesso at Olympia in São Paulo.","evidence":"public video","url":"https://www.youtube.com/watch?v=V624sY_rl8I"}', '{"date":"2000-06-25","domain":"music","event":"Coitado do Próximo opened for Os Paralamas do Sucesso at Olympia in São Paulo, at a sold-out show with an estimated audience of about 6,000 people.","evidence":"public video plus autobiographical audience estimate","url":"https://www.youtube.com/watch?v=V624sY_rl8I"}', 1)
          text = text.replace('{"date":"2001-06-21","domain":"music and television","event":"Coitado do Próximo appeared on Programa do Jô on Rede Globo and performed Estava Comigo, composed by Marcelo Nicchio.","evidence":"public video","url":"https://www.youtube.com/watch?v=4NKHy_C8wsI&t=8s"}', '{"date":"2001-06-21","domain":"music and television","event":"Coitado do Próximo appeared on Programa do Jô; the program was recorded and broadcast the same day, with transmission through Rede Globo Internacional, and the band performed Estava Comigo, composed by Marcelo Nicchio.","evidence":"public video plus autobiographical broadcast details","url":"https://www.youtube.com/watch?v=4NKHy_C8wsI&t=8s"}', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Prove parity detects reviewed edits
        run: |
          if python tools/editorial_parity.py --check; then
            echo "Parity unexpectedly passed after reviewed source edits"
            exit 1
          else
            echo "Parity correctly detected updated source units"
          fi
      - name: Accept reviewed source revisions
        run: |
          python tools/editorial_parity.py --accept music-album-1997
          python tools/editorial_parity.py --accept music-album-1999-2000
          python tools/editorial_parity.py --accept music-olympia
          python tools/editorial_parity.py --accept music-programa-jo
          python tools/editorial_parity.py --accept communication-folha
          python tools/editorial_parity.py --accept communication-sinal-verde
          python tools/editorial_parity.py --accept internet-mirantte
      - name: Regenerate Full Biography
        run: python tools/sync_full_biography.py
      - name: Run complete audits
        run: |
          python tools/editorial_parity.py --check
          python tools/audit_full_biography.py
          python tools/sync_navigation.py --check
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/audit_galleries.py
          python tools/audit_site.py
          python tools/audit_presence.py
          python tools/audit_analytics.py
      - name: Commit reviewed block 2 and remove temporary workflow
        run: |
          rm .github/workflows/review-block2-updates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/musica/index.html en/music/index.html pt/comunicacao/index.html en/communication/index.html pt/internet/index.html en/internet/index.html pt/biografia/index.html en/biography/index.html data/full_biography.json data/editorial_parity.json data/timeline.json .github/workflows/review-block2-updates.yml
          git commit -m "Apply reviewed biography block 2 details"
          git push origin HEAD:full-biography-parity-stop
