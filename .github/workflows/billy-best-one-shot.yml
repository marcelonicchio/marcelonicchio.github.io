name: Billy BEST one-shot

on:
  push:
    branches: [billy/best-kenshoo-workshops-2026-09-06]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow beautifulsoup4
      - name: Apply BEST/Kenshoo source update
        run: python tools/_billy_apply_best_workshops.py
      - name: Synchronize gallery markup
        run: python tools/sync_galleries.py
      - name: Synchronize fragment-backed entries
        run: python tools/sync_entries.py
      - name: Synchronize Full Biography
        run: python tools/sync_full_biography.py
      - name: Generate Chapter Pages
        run: python tools/build_chapter_pages.py
      - name: Refresh sitemap
        run: python tools/build_sitemap.py
      - name: Validate generated state
        run: |
          python tools/build_gallery_media.py --check
          python tools/sync_galleries.py --check
          python tools/sync_entries.py --check
          python tools/sync_full_biography.py --check
          python tools/build_chapter_pages.py --check
          python tools/audit_entries.py
      - name: Remove one-shot machinery and commit generated result
        run: |
          rm tools/_billy_apply_best_workshops.py
          rm .github/workflows/billy-best-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enrich BEST Kenshoo chapter with recovered 2014 archive"
          git push origin HEAD:${GITHUB_REF_NAME}
