name: Temporary disclosure browser smoke test

on:
  push:
    branches: [work/disclosure-ux-prototype]
    paths:
      - '.github/workflows/_tmp-disclosure-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/disclosure-ux-prototype

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/archive-lightbox.js
          node --check assets/js/progressive-disclosure-prototype.js

      - name: Start local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/hub-server.log 2>&1 &
          echo $! > /tmp/hub-server.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/pt/biografia/ > /dev/null

      - name: Render prototype and normal pages in Chrome
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/pt/biografia/?ux=disclosure' > /tmp/fullbio-prototype.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/pt/biografia/' > /tmp/fullbio-normal.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/pt/internet/?ux=disclosure' > /tmp/internet-prototype.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/pt/biografia/?ux=disclosure#bio-internet-cookieweb' > /tmp/fullbio-deeplink.html

      - name: Validate transformed DOM invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          def soup(path):
              return BeautifulSoup(Path(path).read_text(encoding='utf-8'), 'html.parser')

          proto = soup('/tmp/fullbio-prototype.html')
          normal = soup('/tmp/fullbio-normal.html')
          internet = soup('/tmp/internet-prototype.html')
          deep = soup('/tmp/fullbio-deeplink.html')

          proto_details = proto.select('section.chapter.bio-entry details.ux-disclosure')
          if len(proto_details) < 20:
              raise SystemExit(f'Full Bio prototype produced too few disclosures: {len(proto_details)}')

          if normal.select('details.ux-disclosure'):
              raise SystemExit('Normal Full Bio URL was transformed without query flag')
          if 'ux-disclosure-prototype' in (normal.html.get('class') or []):
              raise SystemExit('Normal Full Bio URL received prototype root class')

          internet_details = internet.select('article.article-body > section.chapter details.ux-disclosure')
          if len(internet_details) < 8:
              raise SystemExit(f'Internet prototype produced too few disclosures: {len(internet_details)}')

          target = deep.find(id='bio-internet-cookieweb')
          if target is None:
              raise SystemExit('Deep-link target missing')
          target_details = target.find('details', class_='ux-disclosure', recursive=False)
          if target_details is None or not target_details.has_attr('open'):
              raise SystemExit('Deep-link target disclosure was not opened')

          phrase = 'qualidade de vida havia se tornado um limite inegociável'
          if phrase not in proto.get_text(' ', strip=True):
              raise SystemExit('Known autobiographical text disappeared from transformed Full Bio DOM')

          print(f'Full Bio disclosures: {len(proto_details)}')
          print(f'Internet disclosures: {len(internet_details)}')
          print('Normal URL unchanged: yes')
          print('Deep-link auto-open: yes')
          print('Known text preserved: yes')
          PY

      - name: Stop local server
        if: always()
        run: kill $(cat /tmp/hub-server.pid) || true
