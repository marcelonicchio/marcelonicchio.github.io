name: Record gallery v2 patch

on:
  push:
    branches: [record-gallery-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-gallery-v2
      - name: Apply v2 gallery refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles.css')
          s=p.read_text(encoding='utf-8')
          marker='/* Record gallery v2 refinements */'
          if marker not in s:
              s += '''\n\n/* Record gallery v2 refinements */\n.record-gallery{border-top:0;padding-top:0}\n.record-gallery__head{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);margin-bottom:14px}\n.record-gallery__head strong{font-size:.9rem;letter-spacing:.1em}\n.record-gallery__head::after{font-size:.86rem;color:var(--soft);font-weight:700}\nhtml[lang^="pt"] .record-gallery__head::after{content:"Navegue pelas fotos"}\nhtml[lang^="en"] .record-gallery__head::after{content:"Browse the photos"}\n.record-gallery__arrow{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:800}\n.record-gallery__arrow:hover:not(:disabled){background:#fff;color:#080809;border-color:#fff}\n.archive-lightbox__nav{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:800}\n.archive-lightbox__nav:hover:not(:disabled){background:#fff;color:#080809;border-color:#fff}\n@media(max-width:580px){\n  .record-gallery__head{align-items:flex-start;flex-direction:column;gap:2px;padding:13px 14px}\n  .record-gallery__head strong{font-size:.92rem}\n  .record-gallery__head::after{font-size:.88rem;color:var(--muted)}\n  html[lang^="pt"] .record-gallery__head::after{content:"Deslize para ver mais"}\n  html[lang^="en"] .record-gallery__head::after{content:"Swipe to see more"}\n  .record-gallery__strip{gap:12px;padding-right:18vw;scroll-snap-type:x mandatory}\n  .record-gallery__item{flex:0 0 72vw;max-width:330px;aspect-ratio:4/3}\n  .archive-lightbox{padding:0}\n  .archive-lightbox__panel{width:100vw;max-height:100dvh;padding:44px 8px 14px;border-radius:0}\n  .archive-lightbox__image{max-width:100%;max-height:calc(100dvh - 135px)}\n  .archive-lightbox__nav{width:34px;height:34px;font-size:1.3rem;background:rgba(243,239,231,.94);color:#0a0a0b;border-color:rgba(243,239,231,.94)}\n  .archive-lightbox__nav--prev{left:6px}\n  .archive-lightbox__nav--next{right:6px}\n  .archive-lightbox__meta{padding:0 6px;gap:12px}\n  .archive-lightbox__caption{font-size:.92rem;line-height:1.45;color:var(--soft)}\n  .archive-lightbox__counter{font-size:.76rem}\n}\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v2 refinements
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Refine record gallery discoverability and mobile sizing"
          git push origin HEAD:record-gallery-v2
